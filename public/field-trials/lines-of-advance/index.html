<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local operational board game with hotseat play and a shallow game-specific engine.">
  <title>LINES OF ADVANCE</title>
  <style>
/* LINES OF ADVANCE: v1 visual chassis.
   Austere chess-program register; the board remains code-drawn in every theme. */

:root {
  --bg: #f4f1ea;
  --panel: #ffffff;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --grid: #d6d2c8;
  --grid-strong: #c4c0b5;
  --north: #b83c3c;
  --south: #2c2c2c;
  --selected: #d95d39;
  --hover: rgba(217, 93, 57, 0.15);
  --accent: #d95d39;
  --shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  --focus: #176b8f;
  --radius: 4px;
  --square-light: #f7f5ef;
  --square-dark: #ede9df;
  --card: #fffefa;
  --button-hover: #eae7df;
  --button-active: #dfdcd3;
  --select-hover: #efebe3;
  --primary-hover: #333333;
  --mountain-fill: #b8b4aa;
  --mountain-hatch: #8c887e;
  --north-stroke: #7a2626;
  --south-stroke: #0f0f0f;
  --piece-mark: var(--bg);
}

:root[data-board-theme="paper"] {
  --bg: #e9e2d2;
  --panel: #f8f4ea;
  --ink: #191510;
  --muted: #6f6558;
  --grid: #c9bda9;
  --grid-strong: #ad9d84;
  --north: #aa3434;
  --south: #292723;
  --selected: #b34b2e;
  --hover: rgba(179, 75, 46, 0.18);
  --accent: #b34b2e;
  --focus: #23647a;
  --square-light: #f3ecde;
  --square-dark: #d8cbb5;
  --card: #fbf6eb;
  --button-hover: #ded4c3;
  --button-active: #d2c5b0;
  --select-hover: #e5dac8;
  --primary-hover: #3b342c;
  --mountain-fill: #b7aa95;
  --mountain-hatch: #827562;
}

:root[data-board-theme="slate"] {
  --bg: #d7dde0;
  --panel: #eef1f2;
  --ink: #182126;
  --muted: #59676e;
  --grid: #aebbc0;
  --grid-strong: #8f9ea4;
  --north: #a73d45;
  --south: #25353d;
  --selected: #c5523f;
  --hover: rgba(197, 82, 63, 0.17);
  --accent: #c5523f;
  --focus: #176b8f;
  --square-light: #dce3e5;
  --square-dark: #bdc9cd;
  --card: #f3f5f5;
  --button-hover: #cbd4d7;
  --button-active: #bec9cd;
  --select-hover: #d5dddf;
  --primary-hover: #314149;
  --mountain-fill: #9eabad;
  --mountain-hatch: #68777b;
}

:root[data-board-theme="night"] {
  color-scheme: dark;
  --bg: #171b1d;
  --panel: #202629;
  --ink: #e4e7e5;
  --muted: #9ba5a4;
  --grid: #394346;
  --grid-strong: #556164;
  --north: #d46565;
  --south: #111516;
  --selected: #ef7654;
  --hover: rgba(239, 118, 84, 0.2);
  --accent: #ef7654;
  --shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
  --focus: #6db6d1;
  --square-light: #4b5557;
  --square-dark: #343c3f;
  --card: #252c2f;
  --button-hover: #30383b;
  --button-active: #394245;
  --select-hover: #30383b;
  --primary-hover: #0b0e0f;
  --mountain-fill: #596264;
  --mountain-hatch: #899295;
  --north-stroke: #8f3636;
  --south-stroke: #c4ccca;
  --piece-mark: #f1f3ef;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.35;
  overflow: hidden;
}

#app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 292px;
  grid-template-rows: 52px minmax(0, 1fr);
  grid-template-areas:
    "header header"
    "board  panel";
  height: 100vh;
  height: 100dvh;
  width: 100vw;
}

#app > header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--grid);
  box-shadow: var(--shadow);
  z-index: 2;
}

#app > header h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

#app > header .header-pills {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-help {
  min-width: 48px;
  background: var(--panel);
}
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-right: 2px;
}
.zoom-controls button {
  min-width: 28px;
  height: 28px;
  padding: 3px 7px;
}
.zoom-controls .zoom-fit {
  min-width: 36px;
}
.header-coverage {
  min-width: 82px;
  background: var(--panel);
}
.header-coverage[data-mode="my"] {
  color: #23645f;
  border-color: rgba(35, 100, 95, 0.45);
  background: rgba(47, 127, 120, 0.08);
}
.header-coverage[data-mode="enemy"] {
  color: #8e4e23;
  border-color: rgba(142, 78, 35, 0.45);
  background: rgba(180, 106, 53, 0.08);
}
.zoom-level {
  min-width: 38px;
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 10px;
  text-align: center;
}
#app > header .rules-pill {
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--grid);
  padding: 4px 8px;
  border-radius: var(--radius);
}
#app > header .sandbox-pill {
  display: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--selected);
  border: 1px solid var(--selected);
  padding: 4px 8px;
  border-radius: var(--radius);
}
#app > header .turn-pill {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--ink);
  border: 1px solid var(--ink);
  padding: 4px 8px;
  border-radius: var(--radius);
}

.board-wrap {
  grid-area: board;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 10px;
  overflow: auto;
  min-width: 0;
  min-height: 0;
}

.board-container {
  position: relative;
  width: 100%;
  height: 100%;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid var(--grid-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.board-svg {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;
  user-select: none;
  touch-action: none;
  outline: none;
}

.board-svg:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -3px;
}

.square {
  cursor: pointer;
}

.square.light { fill: var(--square-light); }
.square.dark { fill: var(--square-dark); }
.square:hover { fill: var(--hover); }

.supply-coverage-square {
  pointer-events: none;
  stroke-width: 0.75;
}
.supply-coverage-my {
  fill: #2f7f78;
  fill-opacity: 0.16;
  stroke: #23645f;
  stroke-opacity: 0.2;
}
.supply-coverage-enemy {
  fill: #b46a35;
  fill-opacity: 0.15;
  stroke: #8e4e23;
  stroke-opacity: 0.22;
}

.coord-label {
  font-size: 8px;
  fill: var(--muted);
  pointer-events: none;
}

.piece {
  cursor: grab;
  transition: transform 0.08s ease;
  pointer-events: none;
}
.piece *, .piece {
  pointer-events: none;
}
.piece:active { cursor: grabbing; }

.piece-body {
  stroke-width: 1.5;
}

.piece-north .piece-body { fill: var(--north); stroke: var(--north-stroke); }
.piece-south .piece-body { fill: var(--south); stroke: var(--south-stroke); }

.piece-symbol {
  font-size: 11px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
  fill: var(--piece-mark);
  pointer-events: none;
}

.nato-mark {
  fill: none;
  stroke: var(--piece-mark);
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nato-mark circle:not(.nato-mobility) {
  fill: var(--piece-mark);
  stroke: none;
}
.nato-mark .nato-mobility {
  fill: var(--piece-mark);
  stroke: none;
}
.chess-mark {
  fill: var(--piece-mark);
  stroke: none;
}
.chess-mark .chess-mounted {
  fill: var(--piece-mark);
}
.arsenal-inset {
  fill: var(--piece-mark);
  stroke: var(--piece-mark);
  stroke-width: 1.4;
}

.selection-ring {
  fill: none;
  stroke: var(--selected);
  stroke-width: 3;
  pointer-events: none;
}

.legal-dot {
  fill: var(--accent);
  opacity: 0.7;
  pointer-events: none;
}

.last-move-dot {
  fill: var(--accent);
  opacity: 0.5;
  pointer-events: none;
}

.retreat-dot {
  fill: var(--selected);
  opacity: 0.85;
  pointer-events: none;
}

.attack-target {
  fill: none;
  stroke: var(--selected);
  stroke-width: 2.5;
  pointer-events: none;
}

.preview-target {
  fill: none;
  stroke: var(--selected);
  stroke-width: 3;
  opacity: 0.6;
  pointer-events: none;
}

.preview-attacker {
  fill: var(--accent);
  opacity: 0.8;
  pointer-events: none;
}

aside.panel {
  grid-area: panel;
  background: var(--panel);
  border-left: 1px solid var(--grid);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow-y: auto;
  z-index: 2;
}

.panel-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 0 14px;
  margin: 0 0 14px;
  border-bottom: 1px solid var(--grid);
}

.panel-section:last-of-type {
  margin-bottom: 0;
  border-bottom: 0;
}

.panel h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.card {
  border: 1px solid var(--grid);
  border-radius: var(--radius);
  padding: 10px;
  background: var(--card);
}

.card.empty {
  color: var(--muted);
  font-style: italic;
}

.card .row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}
.card .row:last-child { margin-bottom: 0; }

.card .label { color: var(--muted); }

.card .value { font-weight: 600; }

.button-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.button-row.single {
  grid-template-columns: 1fr;
}

button {
  appearance: none;
  border: 1px solid var(--grid-strong);
  background: var(--bg);
  color: var(--ink);
  padding: 8px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  font-weight: 600;
  min-height: 34px;
  cursor: pointer;
  transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease;
}

button:hover {
  background: var(--button-hover);
  border-color: var(--grid-strong);
}

button:active {
  background: var(--button-active);
}

button:disabled {
  cursor: default;
  opacity: 0.42;
}

button:disabled:hover {
  background: var(--bg);
}

button:focus-visible,
select:focus-visible,
.toggle input:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.select-control {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}
.select-control select {
  min-width: 0;
  border: 1px solid var(--grid-strong);
  border-radius: var(--radius);
  padding: 7px 24px 7px 8px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  min-height: 34px;
  width: 100%;
}
.select-control select:hover {
  border-color: var(--ink);
  background: var(--select-hover);
}

.engine-card {
  padding: 10px 12px;
}
.eval-labels,
.engine-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.eval-score {
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-weight: 700;
}
.eval-track {
  position: relative;
  height: 10px;
  margin: 7px 0 9px;
  overflow: hidden;
  background: var(--south);
  border: 1px solid var(--grid-strong);
  border-radius: 2px;
}
.eval-track::after {
  content: '';
  position: absolute;
  inset: -1px auto -1px 50%;
  width: 1px;
  background: rgba(255, 255, 255, 0.72);
  pointer-events: none;
}
.eval-fill {
  height: 100%;
  background: var(--north);
  border-right: 1px solid var(--bg);
  transition: width 0.15s ease;
}
.engine-status,
.engine-pv {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}
.engine-pv {
  margin-top: 7px;
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

/* First-launch walkthrough: no scrim and no interaction lock. */
.walkthrough-card {
  position: fixed;
  z-index: 20;
  width: min(280px, calc(100vw - 24px));
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--grid-strong);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
}

/* Help remains inside the single-file package. */
.help-dialog {
  width: min(860px, calc(100vw - 28px));
  max-height: min(760px, calc(100dvh - 28px));
  padding: 0;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--grid-strong);
  border-radius: var(--radius);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
}
.help-dialog::backdrop {
  background: rgba(20, 20, 20, 0.4);
}
.help-shell {
  display: flex;
  flex-direction: column;
  max-height: min(760px, calc(100dvh - 28px));
}
.help-header {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 64px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--grid);
  box-shadow: none;
}
.help-header h2 {
  margin: 1px 0 0;
  font-size: 20px;
  letter-spacing: 0.02em;
}
.help-eyebrow,
.help-citation {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.help-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 22px;
  padding: 4px 16px 12px;
  overflow-y: auto;
}
.help-section {
  padding: 14px 0;
  border-bottom: 1px solid var(--grid);
}
.help-section h3 {
  margin: 0 0 6px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.help-section p {
  margin: 0;
  font-size: 12px;
  line-height: 1.48;
}
.help-section .help-citation {
  margin-top: 7px;
  line-height: 1.35;
}
.help-footer {
  padding: 10px 16px;
  color: var(--muted);
  border-top: 1px solid var(--grid);
  font-size: 10px;
}
.walkthrough-card p {
  margin: 8px 0 12px;
  font-size: 12px;
  line-height: 1.45;
}
.walkthrough-meta {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.walkthrough-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}
.walkthrough-actions .walkthrough-skip {
  margin-right: auto;
  color: var(--muted);
  background: transparent;
  border-color: transparent;
}
.walkthrough-anchor:not(.piece) {
  filter: drop-shadow(0 0 4px var(--selected));
}
.piece.walkthrough-anchor .piece-body {
  stroke: var(--selected);
  stroke-width: 3;
}
[data-walkthrough-target].walkthrough-anchor {
  outline: 2px solid var(--selected);
  outline-offset: 3px;
}

button.primary {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

button.primary:hover {
  background: var(--primary-hover);
}

.file-input {
  display: none;
}

.hint {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}

.session-status {
  min-height: 18px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

/* Terrain layer */
.terrain-mountain .mountain-fill {
  fill: var(--mountain-fill);
  stroke: none;
}
.terrain-mountain .mountain-hatch {
  stroke: var(--mountain-hatch);
  stroke-width: 1.5;
  pointer-events: none;
}
.terrain-arsenal {
  stroke: var(--bg);
  stroke-width: 1.5;
  pointer-events: none;
}
.terrain-fort {
  stroke-width: 2;
  pointer-events: none;
}
.terrain-pass {
  fill: var(--grid-strong);
  stroke: none;
  pointer-events: none;
}

/* Communications lines */
.comms-line {
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  pointer-events: none;
}
.active-route {
  stroke: #3a7ca5;
  stroke-width: 2.5;
}
.cut-route {
  stroke: var(--selected);
  stroke-width: 3.5;
  stroke-dasharray: 4 3;
}
.cut-marker {
  fill: var(--selected);
  stroke: var(--bg);
  stroke-width: 1.5;
  pointer-events: none;
}
.global-route {
  stroke: #3a7ca5;
  stroke-width: 0.75;
  opacity: 0.35;
}

/* Disabled / isolated pieces */
.piece-isolated .piece-body {
  opacity: 0.45;
}
.piece-isolated .piece-symbol {
  opacity: 0.6;
}
.piece-isolated .nato-mark,
.piece-isolated .chess-mark {
  opacity: 0.6;
}
.piece-image {
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  pointer-events: none;
}
.piece-north .piece-image {
  filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.82));
}
.piece-south .piece-image {
  filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.82));
}
:root[data-board-theme="night"] .piece-north .piece-image {
  filter: drop-shadow(0 0 1px rgba(241, 243, 239, 0.82));
}
.piece-isolated .piece-image {
  opacity: 0.48;
}
.offline-marker {
  fill: var(--selected);
  stroke: var(--bg);
  stroke-width: 1;
  pointer-events: none;
}
.offline-strike {
  stroke: var(--selected);
  stroke-width: 2;
  stroke-linecap: round;
  opacity: 0.8;
  pointer-events: none;
}

/* Panel audit and toggles */
.audit-detail {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.35;
}
.audit-detail.cut {
  color: var(--selected);
  font-weight: 600;
}

.log-card {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 11px;
  line-height: 1.45;
  white-space: pre-wrap;
}

.log-entry {
  padding: 6px 0;
  border-bottom: 1px solid var(--grid);
}
.log-entry:last-child {
  border-bottom: none;
}

.value.in-comm {
  color: #3a7ca5;
}
.value.isolated {
  color: var(--selected);
}

.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  cursor: pointer;
  margin-bottom: 6px;
}
.toggle input {
  appearance: none;
  width: 16px;
  height: 16px;
  border: 1px solid var(--grid-strong);
  border-radius: 3px;
  background: var(--bg);
  display: grid;
  place-items: center;
}
.toggle:hover .toggle-label {
  color: var(--ink);
}
.toggle input:checked {
  background: var(--ink);
  border-color: var(--ink);
}
.toggle input:checked::after {
  content: '';
  width: 5px;
  height: 8px;
  border: solid var(--bg);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}

@media (max-width: 900px) {
  #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 52px minmax(320px, 1fr) minmax(240px, 38vh);
    grid-template-areas:
      "header"
      "board"
      "panel";
  }
  aside.panel {
    border-left: none;
    border-top: 1px solid var(--grid);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 0 16px;
    max-height: none;
  }
  #app > header .rules-pill {
    display: none;
  }
}

@media (max-width: 719px) {
  #app {
    grid-template-rows: auto minmax(320px, 1fr) minmax(240px, 38vh);
  }
  #app > header {
    flex-wrap: wrap;
    gap: 4px 0;
    padding-top: 6px;
    padding-bottom: 6px;
  }
  #app > header h1 {
    flex: 1 0 100%;
    font-size: 13px;
    letter-spacing: 0.07em;
    text-align: center;
  }
  #app > header .header-pills {
    flex: 1 1 100%;
    min-width: 0;
    justify-content: space-between;
    gap: 4px;
  }
  .zoom-level {
    display: none;
  }
  aside.panel,
  .help-grid {
    grid-template-columns: 1fr;
  }
}

@media (hover: none) {
  .square.light:hover { fill: var(--square-light); }
  .square.dark:hover { fill: var(--square-dark); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

  </style>
</head>

        x: x * SQUARE_SIZE,
        y: (BOARD_ROWS - 1 - y) * SQUARE_SIZE,
        width: SQUARE_SIZE,
        height: SQUARE_SIZE,
        class: `square ${(x + y) % 2 === 0 ? 'light' : 'dark'}`,
        'data-x': x,
        'data-y': y,
        'data-coord': coordFromXY(x, y)
      });
      boardGroup.appendChild(rect);
    }
  }

  // Coordinate labels along edges.
  for (let x = 0; x < BOARD_COLS; x += 1) {
    boardGroup.appendChild(createSVGElement('text', {
      x: x * SQUARE_SIZE + SQUARE_SIZE / 2,
      y: height + MARGIN - 6,
      class: 'coord-label',
      'text-anchor': 'middle',
      textContent: String.fromCharCode(97 + x)
    }));
  }
  for (let y = 0; y < BOARD_ROWS; y += 1) {
    boardGroup.appendChild(createSVGElement('text', {
      x: 6,
      y: (BOARD_ROWS - 1 - y) * SQUARE_SIZE + SQUARE_SIZE / 2 + 3,
      class: 'coord-label',
      textContent: String(y + 1)
    }));
  }
}

function renderTerrain(terrainGroup, state) {
  terrainGroup.innerHTML = '';
  const pieceStyle = normalizePieceStyle(state.settings?.pieceStyle);
  for (let y = 0; y < BOARD_ROWS; y += 1) {
    for (let x = 0; x < BOARD_COLS; x += 1) {
      const px = x * SQUARE_SIZE;
      const py = (BOARD_ROWS - 1 - y) * SQUARE_SIZE;
      const cx = px + SQUARE_SIZE / 2;
      const cy = py + SQUARE_SIZE / 2;

      if (isMountain(x, y)) {
        const g = createSVGElement('g', { class: 'terrain-mountain' });
        g.appendChild(createSVGElement('rect', {
          x: px + 1, y: py + 1, width: SQUARE_SIZE - 2, height: SQUARE_SIZE - 2,
          class: 'mountain-fill'
        }));
        g.appendChild(createSVGElement('line', {
          x1: px + 4, y1: py + SQUARE_SIZE - 4,
          x2: px + SQUARE_SIZE / 2, y2: py + 4,
          class: 'mountain-hatch'
        }));
        g.appendChild(createSVGElement('line', {
          x1: px + SQUARE_SIZE / 2, y1: py + 4,
          x2: px + SQUARE_SIZE - 4, y2: py + SQUARE_SIZE - 4,
          class: 'mountain-hatch'
        }));
        terrainGroup.appendChild(g);
        continue;
      }

      if (isArsenal(x, y)) {
        const side = arsenalSide(x, y);
        const occupant = pieceAt(state, x, y);
        const owner = occupant ? occupant.side : side;
        const colorVar = owner === 'North' ? 'var(--north)' : 'var(--south)';
        if (pieceStyle === 'nato') {
          const arsenal = createSVGElement('g', { class: 'terrain-arsenal nato-arsenal' });
          arsenal.appendChild(createSVGElement('rect', {
            x: cx - 9, y: cy - 8, width: 18, height: 16, rx: 1, fill: colorVar
          }));
          arsenal.appendChild(createSVGElement('circle', {
            cx, cy, r: 4, class: 'arsenal-inset'
          }));
          arsenal.appendChild(createSVGElement('line', {
            x1: cx - 7, y1: cy, x2: cx + 7, y2: cy, class: 'arsenal-inset'
          }));
          terrainGroup.appendChild(arsenal);
        } else if (pieceStyle === 'chess') {
          const arsenal = createSVGElement('g', { class: 'terrain-arsenal chess-arsenal', fill: colorVar });
          arsenal.appendChild(createSVGElement('path', {
            d: `M${cx - 8},${cy + 8}h16v-3h-2v-9h-3v3h-3v-3h-4v3h-3v-3h-3v9h-2z`
          }));
          terrainGroup.appendChild(arsenal);
        } else {
          terrainGroup.appendChild(createSVGElement('polygon', {
            points: `${cx},${cy - 8} ${cx + 8},${cy} ${cx},${cy + 8} ${cx - 8},${cy}`,
            class: 'terrain-arsenal',
            fill: colorVar
          }));
        }
        continue;
      }

      if (isFort(x, y)) {
        const occupant = pieceAt(state, x, y);
        const side = occupant ? occupant.side : fortSide(x, y);
        const stroke = side === 'North' ? 'var(--north)' : 'var(--south)';
        terrainGroup.appendChild(createSVGElement('rect', {
          x: px + 5, y: py + 5, width: SQUARE_SIZE - 10, height: SQUARE_SIZE - 10,
          class: 'terrain-fort',
          stroke,
          fill: 'none'
        }));
        continue;
      }

      if (isPass(x, y)) {
        const cx = px + SQUARE_SIZE / 2;
        const cy = py + SQUARE_SIZE / 2;
        terrainGroup.appendChild(createSVGElement('polygon', {
          points: `${cx},${cy - 6} ${cx + 6},${cy} ${cx},${cy + 6} ${cx - 6},${cy}`,
          class: 'terrain-pass'
        }));
      }
    }
  }
}

function appendNatoSymbol(g, piece, cx, cy) {
  g.appendChild(createSVGElement('rect', {
    x: 4, y: 5, width: 20, height: 18, rx: 1,
    class: 'piece-body nato-counter'
  }));
  const mark = createSVGElement('g', { class: 'nato-mark' });
  if (piece.cls === 'Infantry') {
    mark.appendChild(createSVGElement('line', { x1: 7, y1: 8, x2: 21, y2: 20 }));
    mark.appendChild(createSVGElement('line', { x1: 21, y1: 8, x2: 7, y2: 20 }));
  } else if (piece.cls === 'Cavalry') {
    mark.appendChild(createSVGElement('line', { x1: 7, y1: 20, x2: 21, y2: 8 }));
  } else if (piece.cls.includes('Artillery')) {
    mark.appendChild(createSVGElement('circle', { cx, cy: cy - 1, r: 4 }));
  } else {
    mark.appendChild(createSVGElement('line', { x1: cx, y1: 20, x2: cx, y2: 9 }));
    mark.appendChild(createSVGElement('path', { d: 'M10 13 Q14 9 18 13' }));
    mark.appendChild(createSVGElement('path', { d: 'M8 10 Q14 4 20 10' }));
  }
  if (piece.cls.startsWith('Mounted')) {
    mark.appendChild(createSVGElement('circle', { cx: 10, cy: 20, r: 1.2, class: 'nato-mobility' }));
    mark.appendChild(createSVGElement('circle', { cx: 18, cy: 20, r: 1.2, class: 'nato-mobility' }));
  }
  g.appendChild(mark);
}

function appendChessSymbol(g, piece, cx, cy) {
  g.appendChild(createSVGElement('circle', {
    cx, cy, r: 10, class: 'piece-body chess-disc'
  }));
  const mark = createSVGElement('g', { class: 'chess-mark' });
  if (piece.cls === 'Infantry') {
    mark.appendChild(createSVGElement('circle', { cx, cy: 9, r: 3.2 }));
    mark.appendChild(createSVGElement('path', { d: 'M11 19 Q14 13 17 19 Z M9 20 H19 V22 H9 Z' }));
  } else if (piece.cls === 'Cavalry') {
    mark.appendChild(createSVGElement('path', {
      d: 'M9 21 H20 L18 18 Q19 12 14 8 L15 12 L11 10 L8 16 L12 15 Q14 17 12 20 Z'
    }));
  } else if (piece.cls.includes('Artillery')) {
    mark.appendChild(createSVGElement('path', {
      d: 'M8 20 H20 V22 H8 Z M10 19 V14 H18 V19 Z M9 13 H19 V10 H17 V12 H15 V10 H13 V12 H11 V10 H9 Z'
    }));
  } else {
    mark.appendChild(createSVGElement('path', {
      d: 'M9 21 H19 V19 H17 L16 13 H12 L11 19 H9 Z M14 6 V12 M11 9 H17'
    }));
  }
  if (piece.cls.startsWith('Mounted')) {
    mark.appendChild(createSVGElement('path', { d: 'M12 5 L14 3 L16 5 L14 7 Z', class: 'chess-mounted' }));
  }
  g.appendChild(mark);
}

function appendBackterriaPiece(g, piece, pieceSet) {
  const chessPiece = chessPieceForUnit(pieceSet, piece.cls);
  const href = pieceImageHref(pieceSet, piece.side, chessPiece);
  g.appendChild(createSVGElement('image', {
    x: 6,
    y: -2,
    width: 16,
    height: 32,
    href,
    class: 'piece-image',
    preserveAspectRatio: 'xMidYMid meet',
    'data-chess-piece': chessPiece
  }));
}

function renderPiece(piece, selectionId, comms, style = 'default') {
  const pieceStyle = normalizePieceStyle(style);
  const g = createSVGElement('g', {
    class: `piece piece-${piece.side.toLowerCase()} piece-style-${pieceStyle}`,
    'data-id': piece.id,
    'data-unit-class': piece.cls,
    'data-piece-set': pieceStyle,
    transform: `translate(${piece.x * SQUARE_SIZE}, ${(BOARD_ROWS - 1 - piece.y) * SQUARE_SIZE})`
  });

  const cx = SQUARE_SIZE / 2;
  const cy = SQUARE_SIZE / 2;

  const audit = comms ? comms.status.get(piece.id) : null;
  if (audit && audit.status === 'isolated') {
    g.classList.add('piece-isolated');
  }

  if (piece.id === selectionId) {
    g.appendChild(createSVGElement('rect', {
      x: 2, y: 2, width: SQUARE_SIZE - 4, height: SQUARE_SIZE - 4,
      class: 'selection-ring',
      rx: 3
    }));
  }

  if (isBackterriaPieceSet(pieceStyle)) {
    appendBackterriaPiece(g, piece, pieceStyle);
  } else if (pieceStyle === 'nato') {
    appendNatoSymbol(g, piece, cx, cy);
  } else if (pieceStyle === 'chess') {
    appendChessSymbol(g, piece, cx, cy);
  } else {
    // The original default renderer stays unchanged.
    let body;
    if (isRelay(piece.cls)) {
      body = createSVGElement('polygon', {
        points: `${cx},${cy - 9} ${cx + 9},${cy} ${cx},${cy + 9} ${cx - 9},${cy}`,
        class: 'piece-body'
      });
    } else if (piece.cls === 'Cavalry') {
      body = createSVGElement('polygon', {
        points: `${cx},${cy - 9} ${cx + 9},${cy + 6} ${cx - 9},${cy + 6}`,
        class: 'piece-body'
      });
    } else {
      body = createSVGElement('circle', {
        cx, cy, r: 9,
        class: 'piece-body'
      });
    }
    g.appendChild(body);
    g.appendChild(createSVGElement('text', {
      x: cx,
      y: cy + 1,
      class: 'piece-symbol',
      textContent: classSymbol(piece.cls)
    }));
  }

  if (audit && audit.status === 'isolated') {
    g.appendChild(createSVGElement('line', {
      x1: 6, y1: 6, x2: SQUARE_SIZE - 6, y2: SQUARE_SIZE - 6,
      class: 'offline-strike'
    }));
    g.appendChild(createSVGElement('circle', {
      cx: SQUARE_SIZE - 5, cy: 5, r: 4,
      class: 'offline-marker'
    }));
  }

  return g;
}

function renderPieces(piecesGroup, state, comms) {
  const style = normalizePieceStyle(state.settings?.pieceStyle);
  for (const piece of state.pieces) {
    piecesGroup.appendChild(renderPiece(piece, state.selectedId, comms, style));
  }
}

function renderSupplyCoverage(coverageGroup, comms, mode, turn) {
  coverageGroup.innerHTML = '';
  const side = supplyCoverageSide(mode, turn);
  const supplied = side ? comms?.sideSupplied?.[side] : null;
  if (!supplied) return;

  for (const coord of supplied.keys()) {
    const square = xyFromCoord(coord);
    if (!square) continue;
    coverageGroup.appendChild(createSVGElement('rect', {
      x: square.x * SQUARE_SIZE + 1,
      y: (BOARD_ROWS - 1 - square.y) * SQUARE_SIZE + 1,
      width: SQUARE_SIZE - 2,
      height: SQUARE_SIZE - 2,
      rx: 2,
      class: `supply-coverage-square supply-coverage-${mode}`,
      'data-coverage-coord': coord,
      'data-coverage-side': side
    }));
  }
}

function renderLegalDots(overlayGroup, legalMoves, cls = 'legal-dot') {
  for (const mv of legalMoves) {
    const cx = mv.x * SQUARE_SIZE + SQUARE_SIZE / 2;
    const cy = (BOARD_ROWS - 1 - mv.y) * SQUARE_SIZE + SQUARE_SIZE / 2;
    overlayGroup.appendChild(createSVGElement('circle', {
      cx, cy, r: 4,
      class: cls
    }));
  }
}

function renderRetreatDots(overlayGroup, state) {
  const retreat = currentPendingRetreat(state);
  if (!retreat) return;
  const p = state.pieces.find(piece => piece.id === retreat.id);
  if (!p) return;
  renderLegalDots(overlayGroup, adjacentUnoccupiedSquares(state, p), 'retreat-dot');
}

function renderLastMove(overlayGroup, state) {
  const entry = state.log && state.log[state.log.length - 1];
  if (!entry || !entry.moves || entry.moves.length === 0) return;
  const last = entry.moves[entry.moves.length - 1];
  const to = xyFromCoord(last.to);
  if (!to) return;
  const cx = to.x * SQUARE_SIZE + SQUARE_SIZE / 2;
  const cy = (BOARD_ROWS - 1 - to.y) * SQUARE_SIZE + SQUARE_SIZE / 2;
  overlayGroup.appendChild(createSVGElement('circle', {
    cx, cy, r: 6,
    class: 'last-move-dot'
  }));
}

function renderAttackTargets(overlayGroup, state, comms) {
  if (state.hasAttacked || isInRetreatPhase(state) || !state.selectedId) return;
  const selected = state.pieces.find(p => p.id === state.selectedId);
  if (!selected || selected.side !== state.turn || !selected.stats.attack) return;
  for (const p of state.pieces) {
    if (p.side === state.turn) continue;
    if (canDeclareAttack(state, p.id, { comms })) {
      const cx = p.x * SQUARE_SIZE + SQUARE_SIZE / 2;
      const cy = (BOARD_ROWS - 1 - p.y) * SQUARE_SIZE + SQUARE_SIZE / 2;
      overlayGroup.appendChild(createSVGElement('circle', {
        cx, cy, r: 5,
        class: 'attack-target'
      }));
    }
  }
}

function renderCombatPreview(overlayGroup, state, comms) {
  if (!state.combatPreview || state.combatPreview.error) return;
  const preview = state.combatPreview;
  const target = state.pieces.find(p => p.id === preview.targetId);
  if (!target) return;

  // Highlight target square.
  const tpx = target.x * SQUARE_SIZE;
  const tpy = (BOARD_ROWS - 1 - target.y) * SQUARE_SIZE;
  overlayGroup.appendChild(createSVGElement('rect', {
    x: tpx + 2, y: tpy + 2, width: SQUARE_SIZE - 4, height: SQUARE_SIZE - 4,
    class: 'preview-target',
    rx: 3
  }));

  // Highlight attackers.
  for (const a of preview.attackBreakdown) {
    if (a.value === 0) continue;
    const ap = state.pieces.find(p => p.id === a.id);
    if (!ap) continue;
    const cx = ap.x * SQUARE_SIZE + SQUARE_SIZE / 2;
    const cy = (BOARD_ROWS - 1 - ap.y) * SQUARE_SIZE + SQUARE_SIZE / 2;
    overlayGroup.appendChild(createSVGElement('circle', {
      cx, cy, r: 5,
      class: 'preview-attacker'
    }));
  }
}

function renderCommsLines(linesGroup, cutLinesGroup, state, comms, selectedId) {
  linesGroup.innerHTML = '';
  cutLinesGroup.innerHTML = '';
  if (!comms) return;

  const selected = state.pieces.find(p => p.id === selectedId);

  function drawRoute(group, route, cls) {
    if (!route || route.length < 2) return;
    const pts = route.map(coord => {
      const { x, y } = (() => {
        const file = coord.charCodeAt(0) - 97;
        const rank = Number(coord.slice(1)) - 1;
        return { x: file, y: rank };
      })();
      const p = svgPoint(x, y);
      return `${p.x},${p.y}`;
    }).join(' ');
    group.appendChild(createSVGElement('polyline', {
      points: pts,
      class: cls,
      fill: 'none'
    }));
  }

  function cutMarkerAt(coord) {
    const file = coord.charCodeAt(0) - 97;
    const rank = Number(coord.slice(1)) - 1;
    const p = svgPoint(file, rank);
    cutLinesGroup.appendChild(createSVGElement('circle', {
      cx: p.x, cy: p.y, r: 4,
      class: 'cut-marker'
    }));
  }

  if (selected) {
    const audit = comms.status.get(selected.id);
    if (audit) {
      if (audit.status === 'in-communication') {
        drawRoute(linesGroup, audit.route, 'comms-line active-route');
      } else if (audit.cut) {
        // Draw the full broken route from source arsenal to the selected unit,
        // or from the cut square to the unit if the source is not directly aligned.
        let route;
        if (audit.sourceArsenal) {
          const arsenalXY = xyFromCoord(audit.sourceArsenal);
          if (arsenalXY && isAligned(arsenalXY, selected)) {
            route = [audit.sourceArsenal, ...lineSquaresExclusive(arsenalXY, selected).map(sq => sq.coord)];
          } else {
            route = [audit.cut, coordFromXY(selected.x, selected.y)].filter(Boolean);
          }
        } else {
          route = [audit.cut, coordFromXY(selected.x, selected.y)].filter(Boolean);
        }
        drawRoute(cutLinesGroup, route, 'comms-line cut-route');
        cutMarkerAt(audit.cut);
      }
    }
  }

  if (state.showAllComms) {
    for (const piece of state.pieces) {
      const audit = comms.status.get(piece.id);
      if (audit && audit.status === 'in-communication' && audit.route && audit.route.length > 1) {
        drawRoute(linesGroup, audit.route, 'comms-line global-route');
      }
    }
  }
}

function makeBoard(container) {
  const width = BOARD_COLS * SQUARE_SIZE;
  const height = BOARD_ROWS * SQUARE_SIZE;
  const totalWidth = width + MARGIN;
  const totalHeight = height + MARGIN;

  const wrapper = document.createElement('div');
  wrapper.className = 'board-container';

  const svg = createSVGElement('svg', {
    class: 'board-svg',
    viewBox: `0 0 ${totalWidth} ${totalHeight}`,
    width: '100%',
    height: '100%',
    preserveAspectRatio: 'xMidYMid meet',
    tabindex: '0',
    role: 'application',
    'aria-label': 'Lines of Advance board. Select a unit, then choose a marked legal square.'
  });

  const boardGroup = createSVGElement('g');
  const terrainGroup = createSVGElement('g', { class: 'terrain-layer' });
  const coverageGroup = createSVGElement('g', { class: 'supply-coverage-layer' });
  const linesGroup = createSVGElement('g', { class: 'comms-lines-layer' });
  const overlayGroup = createSVGElement('g', { class: 'overlay-layer' });
  const piecesGroup = createSVGElement('g', { class: 'pieces-layer' });
  const cutLinesGroup = createSVGElement('g', { class: 'cut-lines-layer' });

  renderGrid(boardGroup);
  svg.appendChild(boardGroup);
  svg.appendChild(terrainGroup);
  svg.appendChild(coverageGroup);
  svg.appendChild(linesGroup);
  svg.appendChild(overlayGroup);
  svg.appendChild(piecesGroup);
  svg.appendChild(cutLinesGroup);
  wrapper.appendChild(svg);
  container.appendChild(wrapper);

  let zoom = MIN_ZOOM;
  const zoomListeners = new Set();
  const touchPoints = new Map();
  const pinchPointers = new Set();
  let pinchStart = null;
  let suppressClicksUntil = 0;

  function setZoom(value, anchor = null) {
    const next = normalizeZoom(value);
    if (next === zoom) return zoom;

    const previous = zoom;
    const viewportRect = container.getBoundingClientRect();
    const anchorX = anchor ? anchor.clientX - viewportRect.left : container.clientWidth / 2;
    const anchorY = anchor ? anchor.clientY - viewportRect.top : container.clientHeight / 2;
    const contentX = container.scrollLeft + anchorX;
    const contentY = container.scrollTop + anchorY;

    zoom = next;
    wrapper.style.width = `${zoom * 100}%`;
    wrapper.style.height = `${zoom * 100}%`;

    const ratio = zoom / previous;
    container.scrollLeft = contentX * ratio - anchorX;
    container.scrollTop = contentY * ratio - anchorY;
    for (const listener of zoomListeners) listener(zoom);
    return zoom;
  }

  function fit() {
    container.scrollLeft = 0;
    container.scrollTop = 0;
    return setZoom(MIN_ZOOM);
  }

  function onWheel(evt) {
    const next = zoomFromWheel(zoom, evt.deltaY);
    if (next === zoom) return;
    evt.preventDefault();
    setZoom(next, evt);
  }

  function distanceAndCenter() {
    const [a, b] = [...touchPoints.values()];
    if (!a || !b) return null;
    return {
      distance: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY),
      clientX: (a.clientX + b.clientX) / 2,
      clientY: (a.clientY + b.clientY) / 2
    };
  }

  function onTouchPointerDown(evt) {
    if (evt.pointerType !== 'touch') return;
    touchPoints.set(evt.pointerId, { clientX: evt.clientX, clientY: evt.clientY });
    if (touchPoints.size !== 2) return;
    const gesture = distanceAndCenter();
    if (!gesture) return;
    pinchStart = { zoom, distance: gesture.distance };
    for (const id of touchPoints.keys()) pinchPointers.add(id);
    evt.preventDefault();
    evt.stopPropagation();
  }

  function onTouchPointerMove(evt) {
    if (!touchPoints.has(evt.pointerId)) return;
    touchPoints.set(evt.pointerId, { clientX: evt.clientX, clientY: evt.clientY });
    if (!pinchStart || touchPoints.size < 2) return;
    const gesture = distanceAndCenter();
    if (!gesture) return;
    evt.preventDefault();
    evt.stopPropagation();
    setZoom(zoomFromPinch(pinchStart.zoom, pinchStart.distance, gesture.distance), gesture);
  }

  function onTouchPointerEnd(evt) {
    if (!touchPoints.has(evt.pointerId)) return;
    const wasPinching = pinchPointers.has(evt.pointerId);
    touchPoints.delete(evt.pointerId);
    if (wasPinching) {
      evt.preventDefault();
      evt.stopPropagation();
      suppressClicksUntil = Date.now() + 500;
    }
    if (touchPoints.size < 2) pinchStart = null;
    if (touchPoints.size === 0) pinchPointers.clear();
  }

  function onClickCapture(evt) {
    if (Date.now() > suppressClicksUntil) return;
    evt.preventDefault();
    evt.stopPropagation();
  }

  container.addEventListener('wheel', onWheel, { passive: false });
  container.addEventListener('pointerdown', onTouchPointerDown, true);
  container.addEventListener('pointermove', onTouchPointerMove, true);
  container.addEventListener('pointerup', onTouchPointerEnd, true);
  container.addEventListener('pointercancel', onTouchPointerEnd, true);
  container.addEventListener('click', onClickCapture, true);

  function update(state, comms, view = {}) {
    const selectedId = state.selectedId;
    let legalMoves = [];
    const active = !state.gameOver;
    if (active && isInRetreatPhase(state)) {
      const retreat = currentPendingRetreat(state);
      if (retreat && retreat.id === selectedId) {
        const p = state.pieces.find(piece => piece.id === retreat.id);
        if (p) legalMoves = adjacentUnoccupiedSquares(state, p);
      }
    } else if (active && !state.sandbox && selectedId) {
      legalMoves = getLegalMoves(state, selectedId, { comms });
    }

    renderTerrain(terrainGroup, state);
    renderSupplyCoverage(coverageGroup, comms, view.supplyCoverageMode, state.turn);
    overlayGroup.innerHTML = '';
    if (active && isInRetreatPhase(state)) {
      renderRetreatDots(overlayGroup, state);
    } else if (active) {
      renderLegalDots(overlayGroup, legalMoves);
      renderAttackTargets(overlayGroup, state, comms);
    }
    renderLastMove(overlayGroup, state);
    renderCombatPreview(overlayGroup, state, comms);
    renderCommsLines(linesGroup, cutLinesGroup, state, comms, selectedId);

    piecesGroup.innerHTML = '';
    renderPieces(piecesGroup, state, comms);
  }

  function destroy() {
    container.removeEventListener('wheel', onWheel);
    container.removeEventListener('pointerdown', onTouchPointerDown, true);
    container.removeEventListener('pointermove', onTouchPointerMove, true);
    container.removeEventListener('pointerup', onTouchPointerEnd, true);
    container.removeEventListener('pointercancel', onTouchPointerEnd, true);
    container.removeEventListener('click', onClickCapture, true);
    wrapper.remove();
  }

  return {
    svg,
    wrapper,
    update,
    destroy,
    fit,
    setZoom,
    getZoom: () => zoom,

    createElement('span', { className: 'value', textContent: state.hasAttacked ? 'declared' : 'available' })
  ]));
  card.appendChild(createElement('div', { className: 'row' }, [
    createElement('span', { className: 'label', textContent: 'Preset' }),
    createElement('span', { className: 'value', textContent: presetLabel(state.preset) })
  ]));
}

function renderLog(card, state) {
  if (!state.log || state.log.length === 0) {
    card.className = 'card log-card empty';
    card.textContent = 'Move log empty.';
    return;
  }
  card.className = 'card log-card';
  card.innerHTML = '';
  for (const entry of state.log.slice(-12)) {
    const lines = [];
    if (entry.moves && entry.moves.length) {
      const moveText = entry.moves.map(m => `${CLASS_TO_CODE[m.cls]} ${m.from}-${m.to}`).join(', ');
      lines.push(`${entry.turn}.${entry.side === 'North' ? 'N' : 'S'}: ${moveText}`);
    }
    if (entry.attack) {
      if (entry.attack.type === 'arsenal-capture') {
        lines.push(`  capture ${entry.attack.coord}`);
      } else {
        lines.push(`  attack ${entry.attack.targetCoord} ${entry.attack.result} (${entry.attack.totalAttack} vs ${entry.attack.totalDefense})`);
      }
    }
    if (entry.events) {
      for (const ev of entry.events) {
        if (ev.type === 'destroyed') lines.push(`  destroyed ${ev.coord}`);
        if (ev.type === 'retreat-pending') lines.push(`  retreat pending ${ev.coord}`);
        if (ev.type === 'retreat') lines.push(`  retreated to ${ev.to}`);
        if (ev.type === 'retreat-failed') lines.push(`  retreat failed, destroyed`);
        if (ev.type === 'arsenal-captured') lines.push(`  arsenal captured ${ev.coord}`);
      }
    }
    if (lines.length === 0) lines.push(`${entry.turn}.${entry.side === 'North' ? 'N' : 'S'}: no action`);
    const block = createElement('div', { className: 'log-entry', textContent: lines.join('\n') });
    card.appendChild(block);
  }
}

function renderEngineCard(card, state, analysis, thinking) {
  const evaluation = evaluatePosition(state);
  const northShare = Math.max(5, Math.min(95,
    50 + Math.tanh(evaluation.score / 800) * 45));
  const signed = evaluation.score === 0
    ? '0.00'
    : `${evaluation.score > 0 ? '+' : '−'}${(Math.abs(evaluation.score) / 100).toFixed(2)}`;
  card.innerHTML = '';
  card.appendChild(createElement('div', { className: 'eval-labels' }, [
    createElement('span', { textContent: 'South' }),
    createElement('span', { className: 'eval-score', textContent: `${signed} N` }),
    createElement('span', { textContent: 'North' })
  ]));
  const track = createElement('div', {
    className: 'eval-track',
    role: 'meter',
    'aria-label': 'Position evaluation, positive favors North',
    'aria-valuemin': '-100000',
    'aria-valuemax': '100000',
    'aria-valuenow': String(evaluation.score)
  });
  const fill = createElement('div', { className: 'eval-fill' });
  fill.style.width = `${northShare}%`;
  track.appendChild(fill);
  card.appendChild(track);

  if (thinking) {
    card.appendChild(createElement('div', { className: 'engine-status', textContent: 'Searching…' }));
    return;
  }
  if (!analysis) {
    card.appendChild(createElement('div', {
      className: 'engine-status',
      textContent: `Ready · ${ENGINE_TIME_BUDGET_MS} ms work budget`
    }));
    return;
  }
  card.appendChild(createElement('div', { className: 'engine-stats' }, [
    createElement('span', { textContent: `depth ${analysis.depth}` }),
    createElement('span', { textContent: `${analysis.nodes} nodes` }),
    createElement('span', { textContent: `${Math.round(analysis.elapsedMs)} ms` })
  ]));
  card.appendChild(createElement('div', {
    className: 'engine-pv',
    textContent: analysis.pvText || 'No line.'
  }));
}

function readPreferences(storage) {
  try {
    const raw = storage.getItem(SETTINGS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {};
  }
}

function writePreferences(storage, settings) {
  try {
    storage.setItem(SETTINGS_KEY, JSON.stringify({
      pieceStyle: settings.pieceStyle,
      boardTheme: settings.boardTheme,
      engineSide: settings.engineSide
    }));
  } catch {
    // file:// storage can be unavailable; the live selection still applies.
  }
}

function memoryStorage() {
  const values = new Map();
  return {
    getItem(key) { return values.has(key) ? values.get(key) : null; },
    setItem(key, value) { values.set(key, String(value)); },
    removeItem(key) { values.delete(key); }
  };
}

function resolveStorage(scope) {
  try {
    const storage = scope.localStorage;
    const probe = '__loa_storage_probe__';
    storage.setItem(probe, '1');
    storage.removeItem(probe);
    return { storage, persistent: true };
  } catch {
    return { storage: memoryStorage(), persistent: false };
  }
}

function phaseLabel(state) {
  if (state.gameOver) return 'game-over';
  if (isInRetreatPhase(state)) return 'retreat';
  return state.hasAttacked ? 'post-attack' : 'movement';
}

function compactAction(action, state) {
  if (!action) return null;
  if (action.type === 'move' || action.type === 'retreat') {
    const piece = findPiece(state, action.pieceId);
    return {
      kind: action.type,
      pieceId: action.pieceId,
      from: piece ? coordFromXY(piece.x, piece.y) : null,
      to: coordFromXY(action.x, action.y)
    };
  }
  if (action.type === 'attack') {
    const target = findPiece(state, action.targetId);
    return {
      kind: 'attack',
      targetId: action.targetId,
      to: target ? coordFromXY(target.x, target.y) : null
    };
  }
  if (action.type === 'arsenal') {
    return { kind: 'arsenal-capture', to: coordFromXY(action.x, action.y) };
  }
  return { kind: 'end-turn' };
}

function compactCombat(result) {
  if (!result) return null;
  return {
    attackerIds: (result.attackBreakdown || []).map(item => item.id),
    defenderId: result.targetId,
    supportingDefenderIds: (result.defenseBreakdown || []).slice(1).map(item => item.id),
    odds: `${result.totalAttack}:${result.totalDefense}`,
    attackStrength: result.totalAttack,
    defenseStrength: result.totalDefense,
    margin: result.margin,
    resultApplied: result.result
  };
}

function pieceLayoutKey(state) {
  return state.pieces.map(piece => `${piece.id}:${piece.x},${piece.y}`).sort().join('|');
}

function communicationStates(state, comms = computeCommunications(state)) {
  const result = new Map();
  for (const piece of state.pieces) result.set(piece.id, comms.status.get(piece.id)?.status || 'unknown');
  return result;
}

function init() {
  validateReleaseHooks();
  const root = document.getElementById('app');
  root.innerHTML = '';

  const {
    header,
    sandboxPill,
    turnPill,
    zoomOutBtn,
    zoomLevel,
    zoomInBtn,
    fitBtn,
    coverageBtn,
    helpBtn
  } = buildHeader();
  const boardWrap = createElement('div', { className: 'board-wrap' });
  root.appendChild(header);
  root.appendChild(boardWrap);

  let state = initTurnState(resetToTestPreset(createState()));
  const storageAccess = resolveStorage(window);
  const storage = storageAccess.storage;
  const preferences = readPreferences(storage);
  if (PIECE_STYLES.includes(preferences.pieceStyle)) state.settings.pieceStyle = preferences.pieceStyle;
  if (BOARD_THEMES.includes(preferences.boardTheme)) state.settings.boardTheme = preferences.boardTheme;
  if (ENGINE_SIDES.includes(preferences.engineSide)) state.settings.engineSide = preferences.engineSide;
  const storageMode = storageAccess.persistent
    ? 'localStorage'
    : (window.location?.protocol === 'file:' ? 'file-memory-fallback' : 'memory-fallback');
  const debugLog = createDebugLog({
    version: APP_VERSION,
    buildStamp: BUILD_STAMP,
    userAgent: window.navigator?.userAgent || '',
    storageMode,
    storage: storageAccess.persistent ? storage : null,
    scope: window
  });
  debugLog.record('session-start', {
    version: APP_VERSION,
    buildStamp: BUILD_STAMP,
    userAgent: window.navigator?.userAgent || '',
    storageMode,
    variant: state.rulesetId,
    scenario: state.preset,
    pieceStyle: state.settings.pieceStyle,
    boardTheme: state.settings.boardTheme,
    opponent: state.settings.engineSide
  });
  const audio = new AudioEngine();
  let walkthrough = null;
  let engineAnalysis = null;
  let engineThinking = false;
  let engineTimer = null;
  let supplyCoverageMode = 'off';
  let derivedState = null;
  let derivedComms = null;
  let observedState = state;
  let observedLayout = pieceLayoutKey(state);
  let observedComms;

  function communicationsFor(current) {
    if (derivedState !== current) {
      derivedState = current;
      derivedComms = computeCommunications(current);
    }
    return derivedComms;
  }

  try {
    observedComms = communicationStates(state, communicationsFor(state));
  } catch (error) {
    observedComms = new Map();
    debugLog.recordError(error, { seam: 'communication-observer', phase: 'initial' });
  }

  function observeStateChange(next, comms) {
    try {
      const fromPhase = phaseLabel(observedState);
      const toPhase = phaseLabel(next);
      if (observedState.turn !== next.turn || observedState.turnNumber !== next.turnNumber
          || fromPhase !== toPhase) {
        debugLog.record('transition', {
          from: { turn: observedState.turn, number: observedState.turnNumber, phase: fromPhase },
          to: { turn: next.turn, number: next.turnNumber, phase: toPhase }
        });
      }
      if (!observedState.gameOver && next.gameOver) {
        debugLog.record('victory', {
          winner: next.gameOver.winner,
          reason: next.gameOver.reason
        });
      }
      const nextLayout = pieceLayoutKey(next);
      if (nextLayout !== observedLayout) {
        const nextComms = communicationStates(next, comms);
        for (const piece of next.pieces) {
          const before = observedComms.get(piece.id);
          const after = nextComms.get(piece.id);
          if (before === after || !before) continue;
          if (after === 'isolated' || before === 'isolated') {
            debugLog.record('communication', {
              pieceId: piece.id,
              change: after === 'isolated' ? 'entered-isolation' : 'left-isolation'
            });
          }
        }
        observedLayout = nextLayout;
        observedComms = nextComms;
      }
      observedState = next;
    } catch (error) {
      debugLog.recordError(error, { seam: 'communication-observer', phase: 'update' });
      observedState = next;
    }
  }

  function commit() {
    const comms = communicationsFor(state);
    document.documentElement.dataset.boardTheme = BOARD_THEMES.includes(state.settings.boardTheme)
      ? state.settings.boardTheme : 'field';
    observeStateChange(state, comms);
    sandboxPill.style.display = state.sandbox ? 'inline-block' : 'none';
    turnPill.textContent = state.gameOver
      ? (state.gameOver.winner ? `${state.gameOver.winner} wins` : 'Draw')
      : `${state.turnNumber} · ${state.turn} to move`;
    const coverageLabel = supplyCoverageMode === 'my'
      ? 'Mine'
      : (supplyCoverageMode === 'enemy' ? 'Enemy' : 'Off');
    coverageBtn.textContent = `Supply: ${coverageLabel}`;
    coverageBtn.dataset.mode = supplyCoverageMode;
    coverageBtn.setAttribute('aria-label', `Supply coverage: ${coverageLabel}. Press C to cycle.`);
    boardApi.update(state, comms, { supplyCoverageMode });
    renderSelectedCard(selectedCard, state, comms);
    renderCombatCard(combatCard, state);
    renderAuditCard(auditCard, state, comms);
    renderMoveCount(moveCount, state);
    renderLog(logCard, state);
    renderEngineCard(engineCard, state, engineAnalysis, engineThinking);
    controls.hintBtn.disabled = isEngineTurn() || engineThinking || Boolean(state.gameOver);
    controls.concedeBtn.disabled = isEngineTurn() || Boolean(state.gameOver);
    controls.drawBtn.disabled = state.settings.engineSide !== 'None' || Boolean(state.gameOver);
    controls.engineSelect.querySelector('select').value = state.settings.engineSide;
    controls.pieceStyleSelect.querySelector('select').value = state.settings.pieceStyle;
    controls.boardThemeSelect.querySelector('select').value = BOARD_THEMES.includes(state.settings.boardTheme)
      ? state.settings.boardTheme : 'field';
    scheduleEngine();
  }

  function isEngineTurn() {
    return !state.sandbox && !state.gameOver && state.settings.engineSide === state.turn;
  }

  function scheduleEngine() {
    if (!isEngineTurn() || engineThinking || engineTimer !== null) return;
    engineThinking = true;
    renderEngineCard(engineCard, state, engineAnalysis, true);
    const expectedKey = positionKey(state);
    engineTimer = setTimeout(() => {
      // try/finally: a throw anywhere in here must never strand engineThinking,
      // or the engine goes permanently silent with no visible error (file://).
      try {
        engineTimer = null;
        if (!isEngineTurn() || positionKey(state) !== expectedKey) {
          return;
        }
        const searchState = state;
        const result = debugLog.guard('engine-entry', { purpose: 'turn', side: state.turn },
          () => searchBestAction(state, {
            seed: ENGINE_SEED,
            timeBudgetMs: ENGINE_TIME_BUDGET_MS,
            turnAware: true,
            maxActionsPerTurn: Infinity,
            searchTurnMoveLimit: 1
          }));
        debugLog.record('engine-turn', {
          purpose: 'turn',
          side: searchState.turn,
          turn: searchState.turnNumber,
          depth: result.depth,
          nodes: result.nodes,
          elapsedMs: Math.round(result.elapsedMs),
          score: result.score,
          chosenMove: compactAction(result.action, searchState)
        });
        if (!isEngineTurn() || positionKey(state) !== expectedKey || !result.action) {
          return;
        }
        result.pvText = formatPrincipalVariation(state, result.pv);
        engineAnalysis = result;
        const actionType = result.action.type;
        state = clearSelection(debugLog.guard('turn-resolution', {
          kind: actionType,
          source: 'engine'
        }, () => applyAction(state, result.action, {
          recordHistory: true,
          onCombat(combat) {
            debugLog.record('combat', compactCombat(combat));
          }
        })));
        if (actionType === 'move' || actionType === 'retreat') audio.playMove();
        if (actionType === 'attack' || actionType === 'arsenal') audio.playCapture();
      } finally {
        engineThinking = false;
        commit();
      }
    }, 60);
  }

  const api = {
    reset() {
      state = initTurnState(resetToTestPreset(state));
      debugLog.record('restart', { scenario: state.preset, source: 'scenario-control' });
      setSessionStatus('Opening loaded.');
      commit();
    },
    resetCommsDrill() {
      state = initTurnState(resetToCommsDrill(state));
      debugLog.record('restart', { scenario: state.preset, source: 'scenario-control' });
      setSessionStatus('Comms Audit loaded.');
      commit();
    },
    resetCommCut() {
      state = initTurnState(resetToCommCut(state));
      debugLog.record('restart', { scenario: state.preset, source: 'scenario-control' });
      setSessionStatus('Cut Demo loaded.');
      commit();
    },
    saveToFile() {
      const blob = new Blob([serializeState(state)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `loa-v1-${presetLabel(state.preset)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      debugLog.record('save', { kind: 'file', scenario: state.preset, outcome: 'prepared' });
      setSessionStatus('Save file prepared.');
    },
    loadFromFile(file) {
      if (!file) return Promise.resolve({ ok: false, reason: 'no-file' });
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            state = parseState(e.target.result);
            syncSettingsFromState();
            debugLog.record('load', { kind: 'file', scenario: state.preset, outcome: 'loaded' });
            setSessionStatus('Save file loaded.');
            commit();
            resolve({ ok: true });
          } catch (err) {
            debugLog.recordError(err, { seam: 'load-file' });
            debugLog.record('load', { kind: 'file', outcome: 'failed' });
            setSessionStatus(`Load failed: ${err.message}`);
            resolve({ ok: false, error: err });
          }
        };
        reader.onerror = () => {
          const error = reader.error || new Error('File read failed');
          debugLog.recordError(error, { seam: 'load-file-read' });
          debugLog.record('load', { kind: 'file', outcome: 'failed' });
          setSessionStatus('Load failed: file could not be read.');
          resolve({ ok: false, error });
        };
        reader.readAsText(file);
      });
    },
    saveLocal() {
      try {
        storage.setItem(SAVE_KEY, serializeState(state));
        debugLog.record('save', {
          kind: 'local',
          storageMode,
          scenario: state.preset,
          outcome: 'stored'
        });
        setSessionStatus(storageAccess.persistent
          ? 'Local save stored.'
          : 'Save held until this page closes.');
      } catch (error) {
        debugLog.recordError(error, { seam: 'save-local' });
        debugLog.record('save', { kind: 'local', storageMode, outcome: 'failed' });
        setSessionStatus('Local storage is unavailable.');
      }
    },
    loadLocal() {
      try {
        const raw = storage.getItem(SAVE_KEY);
        if (!raw) {
          debugLog.record('load', { kind: 'local', storageMode, outcome: 'missing' });
          setSessionStatus('No local save found.');
          return;
        }
        state = parseState(raw);
        syncSettingsFromState();
        debugLog.record('load', {
          kind: 'local',
          storageMode,
          scenario: state.preset,
          outcome: 'loaded'
        });
        setSessionStatus('Local save recalled.');
        commit();
      } catch (err) {
        debugLog.recordError(err, { seam: 'load-local' });
        debugLog.record('load', { kind: 'local', storageMode, outcome: 'failed' });
        setSessionStatus(`Recall failed: ${err.message}`);
      }
    },
    setSandbox(value) {
      state = { ...state, sandbox: value };
      commit();
    },
    setShowAllComms(value) {
      state = { ...state, showAllComms: value };
      commit();
    },
    cycleSupplyCoverage() {
      supplyCoverageMode = nextSupplyCoverageMode(supplyCoverageMode);
      setSessionStatus(supplyCoverageMode === 'off'
        ? 'Supply coverage hidden.'
        : `${supplyCoverageMode === 'my' ? 'My' : 'Enemy'} supply coverage shown.`);
      commit();
    },
    endTurn() {
      if (state.gameOver || isEngineTurn()) return;
      state = debugLog.guard('turn-resolution', { kind: 'end-turn', source: 'player' },
        () => endTurn(state));
      commit();
    },
    undo() {
      const before = state;
      state = debugLog.guard('turn-resolution', { kind: 'undo', source: 'player' },
        () => undo(state));
      debugLog.record('undo', { applied: state !== before });
      commit();
    },
    restart() {
      state = debugLog.guard('turn-resolution', { kind: 'restart', source: 'player' },
        () => restart(state, 'North'));
      debugLog.record('restart', { scenario: state.preset, source: 'restart-control' });
      commit();
    },
    concede() {
      if (state.gameOver || isEngineTurn()) return;
      const side = state.turn;
      state = concede(state, side);
      debugLog.record('concede', { side, winner: state.gameOver.winner });
      setSessionStatus(`${side} conceded.`);
      commit();
    },
    agreeDraw() {
      if (state.gameOver || state.settings.engineSide !== 'None') return;
      state = agreeDraw(state);
      debugLog.record('draw', { reason: state.gameOver.reason });
      setSessionStatus('Draw agreed.');
      commit();
    },
    startWalkthrough() {
      if (walkthrough) walkthrough.start(true);
    },
    setEngineSide(value) {
      if (!ENGINE_SIDES.includes(value)) return;
      state = { ...state, settings: { ...state.settings, engineSide: value } };
      debugLog.record('session-selection', { name: 'opponent', value });
      engineAnalysis = null;
      writePreferences(storage, state.settings);
      commit();
    },
    setPieceStyle(value) {
      if (!PIECE_STYLES.includes(value)) return;
      state = { ...state, settings: { ...state.settings, pieceStyle: value } };
      debugLog.record('session-selection', { name: 'piece-style', value });
      writePreferences(storage, state.settings);
      commit();
    },
    setBoardTheme(value) {
      if (!BOARD_THEMES.includes(value)) return;
      state = { ...state, settings: { ...state.settings, boardTheme: value } };
      debugLog.record('session-selection', { name: 'board-theme', value });
      writePreferences(storage, state.settings);
      commit();
    },
    hint() {
      if (engineThinking || isEngineTurn() || state.gameOver) return;
      engineThinking = true;
      renderEngineCard(engineCard, state, engineAnalysis, true);
      const expectedKey = positionKey(state);
      setTimeout(() => {
        // try/finally mirrors scheduleEngine: engineThinking must never strand.
        try {
          const searchState = state;
          const result = debugLog.guard('engine-entry', { purpose: 'hint', side: state.turn },
            () => searchBestAction(state, {
              seed: ENGINE_SEED,
              timeBudgetMs: HINT_TIME_BUDGET_MS,
              turnAware: true,
              maxActionsPerTurn: Infinity,
              searchTurnMoveLimit: 1
            }));
          debugLog.record('engine-turn', {
            purpose: 'hint',
            side: searchState.turn,
            turn: searchState.turnNumber,
            depth: result.depth,
            nodes: result.nodes,
            elapsedMs: Math.round(result.elapsedMs),
            score: result.score,
            chosenMove: compactAction(result.action, searchState)
          });
          if (positionKey(state) === expectedKey && result.action) {
            result.pvText = formatPrincipalVariation(state, result.pv);
            engineAnalysis = result;
          }
        } finally {
          engineThinking = false;
          commit();
        }
      }, 30);
    },
    async copyDebugLog() {
      const outcome = await copyOrDownloadDebugLog(debugLog, window);
      if (outcome === 'copied') setSessionStatus('Debug log copied.');
      else if (outcome === 'downloaded') setSessionStatus('Debug log downloaded.');
      else setSessionStatus('Debug log is unavailable.');
    }
  };

  const boardApi = makeBoard(boardWrap);
  zoomOutBtn.addEventListener('click', () => boardApi.setZoom(boardApi.getZoom() - 0.25));
  zoomInBtn.addEventListener('click', () => boardApi.setZoom(boardApi.getZoom() + 0.25));
  fitBtn.addEventListener('click', () => boardApi.fit());
  coverageBtn.addEventListener('click', () => api.cycleSupplyCoverage());
  boardApi.onZoomChange((zoom) => {
    zoomLevel.textContent = `${Math.round(zoom * 100)}%`;
    zoomOutBtn.disabled = zoom <= 1;
    zoomInBtn.disabled = zoom >= 2.5;
  });
  const { panel, selectedCard, combatCard, moveCount, auditCard, logCard, engineCard, sessionStatus, controls } = buildPanel(api, audio, () => state);
  root.appendChild(panel);
  const help = makeHelp();
  helpBtn.addEventListener('click', () => {
    debugLog.record('help-open', {});
    help.open();
  });
  document.addEventListener('keydown', (evt) => {
    if (evt.defaultPrevented || evt.repeat || evt.ctrlKey || evt.metaKey || evt.altKey) return;
    if (evt.key.toLowerCase() !== 'c' || help.dialog.open) return;
    if (evt.target instanceof Element
        && evt.target.closest('input, select, textarea, [contenteditable="true"]')) return;
    evt.preventDefault();
    api.cycleSupplyCoverage();
  });

  function setSessionStatus(message) {
    sessionStatus.textContent = message;
  }

  function syncSettingsFromState() {
    audio.setSfx(state.settings.sfx);
    audio.setReducedEffects(state.settings.reducedEffects);
    controls.sandboxToggle.querySelector('input').checked = state.sandbox;
    controls.commsToggle.querySelector('input').checked = state.showAllComms;
    controls.sfxToggle.querySelector('input').checked = state.settings.sfx;
    controls.reducedToggle.querySelector('input').checked = state.settings.reducedEffects;
    controls.engineSelect.querySelector('select').value = ENGINE_SIDES.includes(state.settings.engineSide)
      ? state.settings.engineSide : 'None';
    controls.pieceStyleSelect.querySelector('select').value = PIECE_STYLES.includes(state.settings.pieceStyle)
      ? state.settings.pieceStyle : 'default';
    controls.boardThemeSelect.querySelector('select').value = BOARD_THEMES.includes(state.settings.boardTheme)
      ? state.settings.boardTheme : 'field';
    controls.hintBtn.disabled = isEngineTurn() || engineThinking || Boolean(state.gameOver);
    controls.concedeBtn.disabled = isEngineTurn() || Boolean(state.gameOver);
    controls.drawBtn.disabled = state.settings.engineSide !== 'None' || Boolean(state.gameOver);
  }

  // Combat preview: when the selected friendly unit changes or an enemy is hovered,
  // compute and store a preview for the first attackable enemy under the cursor.
  // The actual attack is committed by clicking the enemy unit (handled in input.js).
  boardApi.svg.addEventListener('pointermove', (evt) => {
    if (state.gameOver || state.hasAttacked || isInRetreatPhase(state) || !state.selectedId) return;
    const target = evt.target.closest('[data-coord]');
    if (!target) {
      if (state.combatPreview) {
        state = { ...state, combatPreview: null };
        commit();
      }
      return;
    }
    const coord = target.getAttribute('data-coord');
    const sq = xyFromCoord(coord);
    if (!sq) return;
    const enemy = state.pieces.find(p => p.x === sq.x && p.y === sq.y && p.side !== state.turn);
    if (!enemy) {
      if (state.combatPreview) {
        state = { ...state, combatPreview: null };
        commit();
      }
      return;
    }
    const preview = computeCombatPreview(state, enemy.id);
    if (!preview || preview.error) {
      if (state.combatPreview) {
        state = { ...state, combatPreview: null };

      return;

    state = { ...state, combatPreview: preview };

  const input = makeInputHandlers(boardApi, () => state, (next) => {
    state = next;
    commit();
  }, audio, {
    guard: debugLog.guard,
    order(data) {
      debugLog.record('player-order', data);
    },
    combat(result) {
      debugLog.record('combat', compactCombat(result));
    }
  });

  function selectWalkthroughPiece(predicate) {
    const piece = state.pieces.find(predicate);
    if (!piece || state.selectedId === piece.id) return piece;
    state = selectPiece(state, piece.id);
    commit();
    return piece;
  }

  walkthrough = makeWalkthrough({
    storage,
    onStep(step, index) {
      debugLog.record('walkthrough-step', { id: step.id, number: index + 1 });
    },
    onEnter(step) {
      if (step.id === 'pieces') {
        selectWalkthroughPiece(p => p.side === state.turn && isFighter(p.cls));
      } else if (step.id === 'communication') {
        selectWalkthroughPiece(p => p.side === state.turn && isRelay(p.cls));
      } else if (state.selectedId) {
        state = clearSelection(state);
        commit();
      }
    },
    resolveAnchor(step) {
      if (step.id === 'pieces') {
        const piece = state.pieces.find(p => p.side === state.turn && isFighter(p.cls));
        return piece ? boardApi.svg.querySelector(`[data-id="${piece.id}"]`) : boardApi.svg;
      }
      if (step.id === 'communication') {
        const relay = state.pieces.find(p => p.side === state.turn && isRelay(p.cls));
        return relay ? boardApi.svg.querySelector(`[data-id="${relay.id}"]`) : boardApi.svg;
      }
      if (step.id === 'turn') return document.querySelector('[data-walkthrough-target="turn"]');
      if (step.id === 'victory') {
        const enemySide = state.turn === 'North' ? 'South' : 'North';
        const arsenal = activeArsenalsForSide(enemySide)[0];
        const coord = coordFromXY(arsenal.x, arsenal.y);
        return boardApi.svg.querySelector(`[data-coord="${coord}"]`);
      }
      return boardApi.svg;
    },
    onExit() {
      if (!state.selectedId) return;
      state = clearSelection(state);
      commit();
    }
  });

  syncSettingsFromState();
  commit();
  walkthrough.start();
}

return { init,
  readPreferences,
  writePreferences,
  resolveStorage,
  renderSelectedCard,
  renderLog,
  PIECE_STYLES,
  BOARD_THEMES,
  ENGINE_SIDES };
