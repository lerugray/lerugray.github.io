  <script>
// ==== src/engine/geometry.js ====
// SHOELEATHER — geometry helpers (logical-resolution space).
//
// Coordinates are in the fixed logical resolution of the world raster. The browser
// layer maps device pixels back to this space before hit-testing, so hotspot bounds
// are art-space and survive any integer upscale factor.

function rect(x, y, w, h) {
  if (![x, y, w, h].every(Number.isFinite)) {
    throw new TypeError(`rect needs finite numbers, got ${x},${y},${w},${h}`);
  }
  if (w < 0 || h < 0) throw new RangeError('rect w/h must be non-negative');
  return { x, y, w, h };
}

function contains(r, px, py) {
  return px >= r.x && py >= r.y && px < r.x + r.w && py < r.y + r.h;
}

function center(r) {
  return { x: r.x + r.w / 2, y: r.y + r.h / 2 };
}

function area(r) {
  return r.w * r.h;
}

// Squared distance from a point to the nearest edge/interior of a rect (0 if inside).
function dist2ToRect(r, px, py) {
  const dx = px < r.x ? r.x - px : px > r.x + r.w ? px - (r.x + r.w) : 0;
  const dy = py < r.y ? r.y - py : py > r.y + r.h ? py - (r.y + r.h) : 0;
  return dx * dx + dy * dy;
}


// ==== src/engine/focus.js ====
// SHOELEATHER — input focus (the keyboard-path law, CLAUDE.md rule 8).
//
// DESIGN-SEED INPUT LAW: "full keyboard path (hotspot cycling + select) beside the
// mouse; no real-time pressure anywhere". This FocusRing unifies both inputs into a
// single FOCUS concept: whether the player reached a hotspot by hovering the mouse or
// by cycling with the keyboard, the same hotspot is "focused" and the same cursor
// state / verb label shows. Selection then acts on whatever is focused.
//
// Cycling order is stable READING ORDER (top-to-bottom, then left-to-right) so
// keyboard traversal is predictable and complete — never a hunt.
//
// Pure and node-testable. The browser layer feeds it key and pointer events; there
// are no timers here (the no-real-time-pressure law).


// Default logical bindings. The browser layer translates KeyboardEvent.key/.code to
// these action names; the engine reacts to actions, not raw keys.
const DEFAULT_KEYMAP = Object.freeze({
  ArrowRight: 'focus-next',
  ArrowDown: 'focus-next',
  Tab: 'focus-next',
  ArrowLeft: 'focus-prev',
  ArrowUp: 'focus-prev',
  Enter: 'select',
  ' ': 'select',
  Escape: 'back',
  n: 'notebook',
});

// Group hotspots into rows within a vertical tolerance, then left-to-right per row.
function readingOrder(hotspots, rowTol = 8) {
  return hotspots
    .map((h) => ({ h, c: center(h.bounds) }))
    .sort((a, b) => {
      const rowA = Math.round(a.c.y / rowTol);
      const rowB = Math.round(b.c.y / rowTol);
      if (rowA !== rowB) return rowA - rowB;
      if (a.c.x !== b.c.x) return a.c.x - b.c.x;
      return a.h.id < b.h.id ? -1 : a.h.id > b.h.id ? 1 : 0;
    })
    .map((e) => e.h);
}

class FocusRing {
  constructor(scene, { rowTol = 8 } = {}) {
    this.scene = scene;
    this.order = readingOrder(scene.hotspots, rowTol);
    this._index = -1; // -1 = nothing focused
  }

  get index() { return this._index; }

  focused() {
    return this._index >= 0 && this._index < this.order.length ? this.order[this._index] : null;
  }

  // Cursor state for the renderer: the focused verb, or 'default' when nothing focused.
  cursorKind() {
    const h = this.focused();
    return h ? h.kind : 'default';
  }

  clear() { this._index = -1; return null; }

  // Keyboard: advance to next hotspot (wraps). From nothing, lands on the first.
  next() {
    if (this.order.length === 0) return null;
    this._index = this._index < 0 ? 0 : (this._index + 1) % this.order.length;
    return this.focused();
  }

  prev() {
    if (this.order.length === 0) return null;
    this._index = this._index < 0
      ? this.order.length - 1
      : (this._index - 1 + this.order.length) % this.order.length;
    return this.focused();
  }

  focusById(id) {
    const i = this.order.findIndex((h) => h.id === String(id));
    this._index = i;
    return this.focused();
  }

  // Mouse: focus the topmost hotspot under a logical-space point, or clear.
  focusAt(px, py) {
    const hit = this.scene.hotspotAt(px, py);
    if (!hit) return this.clear();
    this._index = this.order.indexOf(hit);
    return hit;
  }
}


// ==== src/engine/sweep.js ====
// SHOELEATHER — sweep affordance (the no-pixel-hunting law).
//
// DESIGN-SEED difficulty law: "NO pixel-hunting: every hotspot discoverable by
// systematic sweep; the M0 engine ships the sweep affordance (cursor state on hover
// + a scene 'swept' sense)". The hard part is what an observation MEANS, never
// finding it.
//
// The SweepTracker records which hotspots the player has BRUSHED (hovered by mouse or
// landed on by keyboard cycling). A scene reads "swept" once every hotspot has been
// brushed at least once. This is coverage feedback ONLY — it is NOT a progress meter
// toward the solution (which the seed forbids). Finding the thing is free; the case
// is in the meaning.

class SweepTracker {
  constructor() {
    // sceneId -> Set of brushed hotspot ids
    this._brushed = new Map();
  }

  _set(sceneId) {
    const key = String(sceneId);
    let s = this._brushed.get(key);
    if (!s) { s = new Set(); this._brushed.set(key, s); }
    return s;
  }

  // Record that a hotspot has been brushed. Returns true the FIRST time (so the
  // engine can play a discovery tick), false on repeats.
  brush(sceneId, hotspotId) {
    const s = this._set(sceneId);
    const key = String(hotspotId);
    if (s.has(key)) return false;
    s.add(key);
    return true;
  }

  isBrushed(sceneId, hotspotId) {
    const s = this._brushed.get(String(sceneId));
    return s ? s.has(String(hotspotId)) : false;
  }

  brushedCount(sceneId) {
    const s = this._brushed.get(String(sceneId));
    return s ? s.size : 0;
  }

  // Coverage for a scene: { found, total, swept }.
  coverage(scene) {
    const total = scene.hotspots.length;
    let found = 0;
    for (const h of scene.hotspots) if (this.isBrushed(scene.id, h.id)) found++;
    return { found, total, swept: total > 0 && found === total };
  }

  isSwept(scene) {
    return this.coverage(scene).swept;
  }

  // Hotspots in a scene not yet brushed (engine can nudge the sweep, never point).
  unbrushed(scene) {
    return scene.hotspots.filter((h) => !this.isBrushed(scene.id, h.id));
  }

  // Serialization for checkpoint save/load.
  toJSON() {
    const out = {};
    for (const [scene, set] of this._brushed) out[scene] = [...set];
    return out;
  }

  static fromJSON(obj) {
    const t = new SweepTracker();
    if (obj && typeof obj === 'object') {
      for (const [scene, ids] of Object.entries(obj)) {
        const set = t._set(scene);
        for (const id of ids) set.add(String(id));
      }
    }
    return t;
  }
}


// ==== src/case/fact.js ====
// SHOELEATHER — typed facts and statements (the evidence spine, day one).
//
// DESIGN-SEED "Facts are TYPED DATA": facts/statements carry structured fields
// (subject, claim-type, value, time, place, source, acquisition-paths, chain-role |
// red-herring tag) so CONTRADICTION is a real predicate and the solver / accusation
// board validate mechanically. Prose is presentation only.
//
// A FACT is something OBSERVED in the world (never a conclusion). A STATEMENT is a
// suspect's assertion, logged verbatim but ALSO carrying a typed claim so a fact can
// mechanically contradict it. Both reduce to a CLAIM: (subject, claimType, value,
// [time], [place]).

// Claim types the contradiction predicate understands. A claim asserts a value for a
// (subject, claimType) coordinate, optionally pinned to a time and/or place.
const CLAIM_TYPES = Object.freeze([
  'location',    // subject was at value(place) [at time]
  'time',        // an event's time
  'identity',    // subject IS value
  'possession',  // subject had/owned value
  'action',      // subject did value [at time/place]
  'property',    // subject has property value (state of a thing)
  'relationship',// subject relates to value
]);

const ROLES = Object.freeze(['chain', 'red-herring']);

function requireField(obj, field, ctx) {
  if (obj[field] === undefined || obj[field] === null || obj[field] === '') {
    throw new TypeError(`${ctx}: missing required field "${field}"`);
  }
}

// A typed claim. Equality of the (subject, claimType[, time][, place]) COORDINATE with
// a DIFFERENT value is what makes a contradiction.
class Claim {
  constructor({ subject, claimType, value, time = null, place = null }) {
    requireField({ subject }, 'subject', 'Claim');
    requireField({ claimType }, 'claimType', 'Claim');
    if (!CLAIM_TYPES.includes(claimType)) throw new RangeError(`unknown claimType "${claimType}"`);
    requireField({ value }, 'value', 'Claim');
    this.subject = String(subject);
    this.claimType = claimType;
    this.value = value;
    this.time = time;   // comparable scalar (e.g. "Thu-1740") or null
    this.place = place; // string or null
  }

  // Two claims share a COORDINATE if they pin the same subject+claimType at a
  // compatible time and place (null on either side = unpinned, so compatible).
  sameCoordinate(other) {
    if (this.subject !== other.subject) return false;
    if (this.claimType !== other.claimType) return false;
    if (this.time !== null && other.time !== null && this.time !== other.time) return false;
    if (this.place !== null && other.place !== null && this.place !== other.place) return false;
    return true;
  }

  valueEquals(other) {
    return JSON.stringify(this.value) === JSON.stringify(other.value);
  }

  // A contradicts B when they address the same coordinate but assert different values.
  contradicts(other) {
    return this.sameCoordinate(other) && !this.valueEquals(other);
  }

  key() {
    return `${this.subject}|${this.claimType}|${this.time ?? '*'}|${this.place ?? '*'}|${JSON.stringify(this.value)}`;
  }
}

class Fact {
  constructor(spec) {
    requireField(spec, 'id', 'Fact');
    this.id = String(spec.id);
    this.claim = spec.claim instanceof Claim ? spec.claim : new Claim(spec);
    // Where this fact can be OBSERVED. ALWAYS-SOLVABLE LAW: every chain-required fact
    // needs >= 2 independent acquisition paths; the solver enforces it per case.
    this.acquisitionPaths = [...(spec.acquisitionPaths || [])].map(String);
    this.role = spec.role || 'chain';
    if (!ROLES.includes(this.role)) throw new RangeError(`unknown role "${this.role}" for fact ${this.id}`);
    this.prose = spec.prose ? String(spec.prose) : ''; // presentation only
    this.prologueKeyed = !!spec.prologueKeyed;         // needs the prologue to READ correctly
    // Call 1: an accusation-chain fact has one explicit load-bearing job. The board
    // deliberately offers every pinned fact in every fact slot, but validation and
    // the solver use this identity-bearing tag to prove the expanded chain unique.
    this.chainSlot = spec.chainSlot ? String(spec.chainSlot) : null;
    this.tags = [...(spec.tags || [])].map(String);
  }

  isRedHerring() { return this.role === 'red-herring'; }
  contradicts(claimOrFact) {
    const other = claimOrFact instanceof Fact ? claimOrFact.claim : claimOrFact;
    return this.claim.contradicts(other);
  }
}

class Statement {
  constructor(spec) {
    requireField(spec, 'id', 'Statement');
    requireField(spec, 'speaker', 'Statement');
    requireField(spec, 'text', 'Statement');
    this.id = String(spec.id);
    this.speaker = String(spec.speaker);
    this.text = String(spec.text); // logged VERBATIM
    // The typed claim the prose encodes, so a fact can contradict it mechanically.
    this.claim = spec.claim instanceof Claim ? spec.claim : new Claim(spec);
    this.tags = [...(spec.tags || [])].map(String);
  }

  // Is this statement refuted by a given fact? (fact's claim contradicts the statement)
  refutedBy(fact) {
    const factClaim = fact instanceof Fact ? fact.claim : fact;
    return factClaim.contradicts(this.claim);
  }
}


// ==== src/case/notebook.js ====
// SHOELEATHER — the Notebook (the core instrument, DESIGN-SEED 3).
//
// Facts OBSERVED auto-log (never conclusions). Suspect statements log VERBATIM. The
// player pins, groups, cross-references, and searches/filters by person, scene, and
// type. A case ends around 200+ facts and must stay navigable, so search/filter is
// day-one IA, not a later nicety. Nothing here marks what MATTERS — no solution leak.
//
// Pure and node-testable. The browser renders it on the crisp text layer; the engine
// calls logFact/logStatement when the player observes evidence or hears a statement.


class Entry {
  constructor(kind, ref, scene) {
    this.kind = kind;         // 'fact' | 'statement'
    this.ref = ref;           // Fact | Statement
    this.id = ref.id;
    this.scene = scene || null;
    this.pinned = false;
    this.groups = new Set();
  }

  person() { return this.kind === 'fact' ? this.ref.claim.subject : this.ref.speaker; }
  type() { return this.kind === 'fact' ? this.ref.claim.claimType : 'statement'; }
  text() { return this.kind === 'fact' ? (this.ref.prose || '') : this.ref.text; }

  // Lowercased haystack for search: prose/text, person, type, value, id.
  haystack() {
    const parts = [this.text(), this.person(), this.type(), this.id];
    if (this.kind === 'fact') parts.push(String(this.ref.claim.value));
    return parts.join('  ').toLowerCase();
  }
}

class Notebook {
  constructor() {
    this._entries = new Map();   // id -> Entry, in observation order
    this._crossrefs = new Map(); // id -> Set of linked ids
    this._groups = new Map();    // name -> Set of ids
  }

  // --- logging (auto, on observation) -------------------------------------
  logFact(fact, meta = {}) {
    if (!(fact instanceof Fact)) throw new TypeError('logFact needs a Fact');
    if (this._entries.has(fact.id)) return this._entries.get(fact.id); // idempotent
    const e = new Entry('fact', fact, meta.scene);
    this._entries.set(fact.id, e);
    return e;
  }

  logStatement(statement, meta = {}) {
    if (!(statement instanceof Statement)) throw new TypeError('logStatement needs a Statement');
    if (this._entries.has(statement.id)) return this._entries.get(statement.id);
    const e = new Entry('statement', statement, meta.scene);
    this._entries.set(statement.id, e);
    return e;
  }

  has(id) { return this._entries.has(String(id)); }
  get(id) { return this._entries.get(String(id)) || null; }
  get size() { return this._entries.size; }
  entries() { return [...this._entries.values()]; }

  // --- pinning ------------------------------------------------------------
  pin(id) { const e = this.get(id); if (e) e.pinned = true; return !!e; }
  unpin(id) { const e = this.get(id); if (e) e.pinned = false; return !!e; }
  isPinned(id) { const e = this.get(id); return !!e && e.pinned; }
  pinned() { return this.entries().filter((e) => e.pinned); }

  // --- grouping (user-defined folders) ------------------------------------
  addToGroup(name, id) {
    if (!this.has(id)) return false;
    const g = String(name);
    if (!this._groups.has(g)) this._groups.set(g, new Set());
    this._groups.get(g).add(String(id));
    this.get(id).groups.add(g);
    return true;
  }
  removeFromGroup(name, id) {
    const set = this._groups.get(String(name));
    if (set) set.delete(String(id));
    const e = this.get(id); if (e) e.groups.delete(String(name));
  }
  groups() { return [...this._groups.keys()].sort(); }
  entriesInGroup(name) {
    const set = this._groups.get(String(name));
    return set ? [...set].map((id) => this.get(id)).filter(Boolean) : [];
  }

  // --- cross-reference (mutual links) -------------------------------------
  crossRef(a, b) {
    if (!this.has(a) || !this.has(b) || String(a) === String(b)) return false;
    this._link(a, b); this._link(b, a);
    return true;
  }
  _link(a, b) {
    const k = String(a);
    if (!this._crossrefs.has(k)) this._crossrefs.set(k, new Set());
    this._crossrefs.get(k).add(String(b));
  }
  crossRefsOf(id) {
    const set = this._crossrefs.get(String(id));
    return set ? [...set].map((x) => this.get(x)).filter(Boolean) : [];
  }

  // --- search / filter (the navigability IA) ------------------------------
  search(query) {
    const q = String(query).trim().toLowerCase();
    if (!q) return this.entries();
    const terms = q.split(/\s+/);
    return this.entries().filter((e) => { const h = e.haystack(); return terms.every((t) => h.includes(t)); });
  }

  filter({ person = null, scene = null, type = null, kind = null, pinned = null } = {}) {
    return this.entries().filter((e) => {
      if (person !== null && e.person() !== person) return false;
      if (scene !== null && e.scene !== scene) return false;
      if (type !== null && e.type() !== type) return false;
      if (kind !== null && e.kind !== kind) return false;
      if (pinned !== null && e.pinned !== pinned) return false;
      return true;
    });
  }

  // Distinct facet values, for building filter menus.
  facets() {
    const people = new Set(), scenes = new Set(), types = new Set();
    for (const e of this.entries()) {
      people.add(e.person());
      if (e.scene) scenes.add(e.scene);
      types.add(e.type());
    }
    return { people: [...people].sort(), scenes: [...scenes].sort(), types: [...types].sort() };
  }

  // Case-review restates KNOWN FACTS ONLY (never statements-as-facts, never
  // conclusions). Returns logged fact entries in observation order.
  reviewKnownFacts() { return this.entries().filter((e) => e.kind === 'fact'); }

  // --- persistence --------------------------------------------------------
  toJSON() {
    return {
      logged: this.entries().map((e) => ({ id: e.id, kind: e.kind, scene: e.scene, pinned: e.pinned, groups: [...e.groups] })),
      crossrefs: [...this._crossrefs.entries()].map(([a, set]) => [a, [...set]]),
    };
  }

  // Rehydrate against a case (looks facts/statements up by id).
  static fromJSON(json, caseObj) {
    const nb = new Notebook();
    if (!json) return nb;
    for (const rec of json.logged || []) {
      const ref = rec.kind === 'fact' ? caseObj.fact(rec.id) : caseObj.statement(rec.id);
      if (!ref) continue; // stale save entry; skip rather than crash
      const e = rec.kind === 'fact' ? nb.logFact(ref, { scene: rec.scene }) : nb.logStatement(ref, { scene: rec.scene });
      e.pinned = !!rec.pinned;
      for (const g of rec.groups || []) nb.addToGroup(g, rec.id);
    }
    for (const [a, list] of json.crossrefs || []) for (const b of list) nb.crossRef(a, b);
    return nb;
  }
}


// ==== src/people/suspect-state.js ====
// SHOELEATHER — per-suspect state (persists across visits).
//
// DESIGN-SEED M2: dialogue has PERSISTENT visit state; tolerance and statement logs
// persist across visits; suspects RELAX after time spent elsewhere (a visit-count
// timer). Suspect state is DIEGETIC (portrait posture stages, never numbers) — this
// object holds the numbers; the renderer maps posture() to a portrait tell.
//
// Tolerance counts DOWN from maxTolerance as the suspect HARDENS on wrong challenges.
// Relaxation restores some tolerance once the player has spent enough turns elsewhere.

const POSTURES = Object.freeze(['open', 'guarded', 'defensive', 'hostile']);

class SuspectState {
  constructor({ maxTolerance = 3 } = {}) {
    this.maxTolerance = maxTolerance;
    this.tolerance = maxTolerance;     // hardening drains this toward 0
    this.visitCount = 0;
    this.seenNodes = new Set();        // dialogue nodes visited (across all visits)
    this.challenged = new Set();       // statement ids already challenged (any outcome)
    this.refuted = new Set();          // statement ids successfully broken by evidence
    this.leftAtTick = null;            // world tick when the player last left this suspect
    this.hardenedThisVisit = 0;        // wrong challenges landed this visit
    this.afterthoughtArmed = false;    // set on re-entering a relaxed suspect (per visit)
  }

  beginVisit() { this.visitCount++; this.hardenedThisVisit = 0; return this.visitCount; }

  // The afterthought question: armed when the player re-enters a suspect who has
  // relaxed while they were away. It "hits harder" — an afterthought-guarded dialogue
  // line opens that the suspect would otherwise resist. Cleared when the visit ends.
  armAfterthought() { this.afterthoughtArmed = true; }
  disarmAfterthought() { this.afterthoughtArmed = false; }
  leave(tick) { this.leftAtTick = tick; }

  markSeen(nodeId) { this.seenNodes.add(String(nodeId)); }
  isSeen(nodeId) { return this.seenNodes.has(String(nodeId)); }

  // A wrong challenge hardens the suspect: tolerance drops, posture stiffens.
  harden() {
    this.tolerance = Math.max(0, this.tolerance - 1);
    this.hardenedThisVisit++;
    return this.tolerance;
  }
  get hardened() { return this.tolerance <= 0; }

  // The suspect relaxes if enough turns have passed since the player left. Returns the
  // amount recovered (0 if not due). The afterthought-question mechanic fires when a
  // relaxed suspect is re-entered.
  relaxIfDue(currentTick, threshold = 3, recover = 1) {
    if (this.leftAtTick === null) return 0;
    if (currentTick - this.leftAtTick < threshold) return 0;
    const before = this.tolerance;
    this.tolerance = Math.min(this.maxTolerance, this.tolerance + recover);
    this.leftAtTick = null;
    return this.tolerance - before;
  }

  // Diegetic posture stage from the tolerance ratio (renderer picks a portrait tell).
  posture() {
    const r = this.maxTolerance === 0 ? 0 : this.tolerance / this.maxTolerance;
    if (r >= 0.99) return 'open';
    if (r > 0.5) return 'guarded';
    if (r > 0) return 'defensive';
    return 'hostile';
  }

  markChallenged(statementId) { this.challenged.add(String(statementId)); }
  hasChallenged(statementId) { return this.challenged.has(String(statementId)); }
  markRefuted(statementId) { this.refuted.add(String(statementId)); }
  isRefuted(statementId) { return this.refuted.has(String(statementId)); }

  toJSON() {
    return {
      maxTolerance: this.maxTolerance, tolerance: this.tolerance, visitCount: this.visitCount,
      seenNodes: [...this.seenNodes], challenged: [...this.challenged], refuted: [...this.refuted],
      leftAtTick: this.leftAtTick,
    };
  }

  static fromJSON(obj) {
    const s = new SuspectState({ maxTolerance: obj?.maxTolerance ?? 3 });
    if (obj) {
      s.tolerance = obj.tolerance ?? s.maxTolerance;
      s.visitCount = obj.visitCount ?? 0;
      s.seenNodes = new Set(obj.seenNodes || []);
      s.challenged = new Set(obj.challenged || []);
      s.refuted = new Set(obj.refuted || []);
      s.leftAtTick = obj.leftAtTick ?? null;
    }
    return s;
  }
}


// ==== src/people/case-clock.js ====
// SHOELEATHER — the case clock + counter-moves (DESIGN-SEED 5).
//
// A wrong challenge or a wrong accusation ADVANCES THE CASE CLOCK: the murderer
// counter-moves and remaining paths get harder. Counter-moves are an ordered list per
// case; each advance applies the next one, which typically CLOSES one acquisition path
// of a fact. ALWAYS-SOLVABLE LAW: a counter-move may never close a fact's LAST open
// path — it routes to a harder substitute, never to deletion of the last path. This
// object enforces that invariant against the case so a wrong move can never soft-lock.

class CaseClock {
  // counterMoves: ordered [{ id, closesPath, describe }]. closesPath is an acquisition
  // path label the murderer removes; describe is in-register prose for the event log.
  constructor({ counterMoves = [] } = {}) {
    this.counterMoves = counterMoves.map((c) => ({ id: String(c.id), closesPath: c.closesPath || null, describe: c.describe || '' }));
    this.count = 0;
    this.closedPaths = new Set();
  }

  // Advance the clock by one counter-move. `caseObj` (optional) enforces the always-
  // solvable invariant: refuse to close a path that is a fact's last open one.
  advance(caseObj = null) {
    this.count++;
    const cm = this.counterMoves[this.count - 1] || null;
    if (cm && cm.closesPath) {
      if (caseObj && this._wouldStrand(caseObj, cm.closesPath)) {
        throw new Error(`counter-move "${cm.id}" would close the last path to a fact (always-solvable law)`);
      }
      this.closedPaths.add(cm.closesPath);
    }
    return cm;
  }

  isPathClosed(path) { return this.closedPaths.has(String(path)); }

  // Open acquisition paths remaining for a fact (its paths minus the closed ones).
  openPaths(fact) { return fact.acquisitionPaths.filter((p) => !this.closedPaths.has(p)); }

  // A fact is still acquirable if at least one of its paths is open.
  isFactAcquirable(fact) { return this.openPaths(fact).length >= 1; }

  _wouldStrand(caseObj, path) {
    for (const f of caseObj.facts) {
      if (!f.acquisitionPaths.includes(path)) continue;
      const openAfter = f.acquisitionPaths.filter((p) => p !== path && !this.closedPaths.has(p));
      if (openAfter.length === 0) return true; // this path is the fact's last one
    }
    return false;
  }

  toJSON() { return { count: this.count, closedPaths: [...this.closedPaths] }; }

  static fromJSON(obj, counterMoves = []) {
    const c = new CaseClock({ counterMoves });
    if (obj) { c.count = obj.count || 0; c.closedPaths = new Set(obj.closedPaths || []); }
    return c;
  }
}


// ==== src/people/dialogue.js ====
// SHOELEATHER — dialogue engine (M2 people).
//
// Dialogue is a STRUCTURED graph, not free text: nodes with guarded options and typed
// effects, so (a) it persists visit state and (b) the SOLVER can walk it — "full
// reachability walk from every real prior-state combo; no orphan nodes, no dead ends"
// (SOLVER LAW). Guards and effects are DATA, never arbitrary closures, so the walk is
// decidable.
//
// Guards (all must hold — AND):
//   { type:'factKnown',   fact:<id> }     the notebook holds this fact
//   { type:'nodeSeen',    node:<id> }     this dialogue node has been visited
//   { type:'visitAtLeast', n:<int> }      the suspect has been visited >= n times
//   { type:'notHardened' }                the suspect is not yet hardened
// Effects (applied when an option is chosen):
//   { type:'revealStatement', statement:<id> }   log the suspect's statement verbatim

const GUARD_TYPES = Object.freeze(['factKnown', 'nodeSeen', 'visitAtLeast', 'notHardened', 'afterthought']);
const EFFECT_TYPES = Object.freeze(['revealStatement']);

function evalGuard(guard, ctx) {
  switch (guard.type) {
    case 'factKnown': return ctx.notebook.has(guard.fact);
    case 'nodeSeen': return ctx.state.isSeen(guard.node);
    case 'visitAtLeast': return ctx.state.visitCount >= guard.n;
    case 'notHardened': return !ctx.state.hardened;
    case 'afterthought': return !!ctx.state.afterthoughtArmed;
    default: throw new RangeError(`unknown guard type "${guard.type}"`);
  }
}

function guardsPass(guards, ctx) {
  return (guards || []).every((g) => evalGuard(g, ctx));
}

class DialogueNode {
  constructor({ id, speaker, text, options = [] }) {
    if (!id) throw new TypeError('dialogue node needs an id');
    this.id = String(id);
    this.speaker = speaker ? String(speaker) : null;
    this.text = String(text || '');
    this.options = options.map((o) => ({
      id: String(o.id),
      text: String(o.text),
      to: o.to === null || o.to === undefined ? null : String(o.to),
      guards: o.guards || [],
      effects: o.effects || [],
    }));
  }
}

class DialogueTree {
  constructor({ id, root, nodes }) {
    this.id = String(id);
    this._nodes = new Map();
    for (const n of nodes || []) this.add(n instanceof DialogueNode ? n : new DialogueNode(n));
    this.root = String(root);
    if (!this._nodes.has(this.root)) throw new Error(`dialogue "${id}" root "${root}" is not a node`);
  }

  add(node) {
    const n = node instanceof DialogueNode ? node : new DialogueNode(node);
    if (this._nodes.has(n.id)) throw new Error(`duplicate dialogue node "${n.id}"`);
    this._nodes.set(n.id, n);
    return n;
  }

  node(id) { return this._nodes.get(String(id)) || null; }
  has(id) { return this._nodes.has(String(id)); }
  nodes() { return [...this._nodes.values()]; }

  // Nodes reachable from the root by walking option targets (BFS). Optimistic: a
  // guarded edge is assumed traversable under SOME state, since every fact is
  // eventually acquirable and visits/seen-nodes accumulate — the SOLVER walks "every
  // real prior-state combo", and the reachable envelope is the union over all of them.
  reachableFromRoot() {
    const seen = new Set([this.root]);
    const queue = [this.root];
    while (queue.length) {
      const n = this.node(queue.shift());
      if (!n) continue;
      for (const o of n.options) {
        if (o.to !== null && this._nodes.has(o.to) && !seen.has(o.to)) { seen.add(o.to); queue.push(o.to); }
      }
    }
    return seen;
  }

  // Static + reachability integrity (the SOLVER LAW's dialogue check):
  //  - every option target exists (or is null = end); guard/effect types are known
  //  - NO DEAD ENDS: every node offers at least one option (the player can always act)
  //  - NO ORPHANS: every node is reachable from the root
  validate() {
    const problems = [];
    for (const n of this.nodes()) {
      if (n.options.length === 0) problems.push(`dead-end dialogue node "${n.id}" (no options; player is stuck)`);
      for (const o of n.options) {
        if (o.to !== null && !this._nodes.has(o.to)) problems.push(`node ${n.id} option ${o.id} -> missing node "${o.to}"`);
        for (const g of o.guards) if (!GUARD_TYPES.includes(g.type)) problems.push(`node ${n.id} option ${o.id}: unknown guard "${g.type}"`);
        for (const e of o.effects) if (!EFFECT_TYPES.includes(e.type)) problems.push(`node ${n.id} option ${o.id}: unknown effect "${e.type}"`);
      }
    }
    const reachable = this.reachableFromRoot();
    for (const n of this.nodes()) {
      if (!reachable.has(n.id)) problems.push(`orphan dialogue node "${n.id}" (unreachable from root)`);
    }
    return problems;
  }
}

// Drives one interrogation session over a DialogueTree, with a suspect's persistent
// state and the shared notebook. No timers (the no-real-time-pressure law).
class DialogueRunner {
  constructor(tree, state, { notebook, caseData = null, onEvent = null } = {}) {
    if (!notebook) throw new TypeError('dialogue runner needs a notebook');
    this.tree = tree;
    this.state = state;
    this.notebook = notebook;
    this.caseData = caseData;
    this.onEvent = onEvent || (() => {});
    this.currentId = null;
  }

  _ctx() { return { state: this.state, notebook: this.notebook, caseData: this.caseData }; }

  // Begin a visit at the root (counts a visit; marks the node seen).
  enter() {
    this.state.beginVisit();
    return this._goto(this.tree.root);
  }

  _goto(nodeId) {
    if (nodeId === null) { this.currentId = null; return null; }
    const node = this.tree.node(nodeId);
    if (!node) throw new Error(`dialogue "${this.tree.id}" has no node "${nodeId}"`);
    this.currentId = node.id;
    this.state.markSeen(node.id);
    this.onEvent({ type: 'node', node });
    return node;
  }

  current() { return this.currentId ? this.tree.node(this.currentId) : null; }

  // Options whose guards currently pass (what the player may say now).
  options() {
    const node = this.current();
    if (!node) return [];
    return node.options.filter((o) => guardsPass(o.guards, this._ctx()));
  }

  // Choose an available option: apply its effects, then transition. Returns the new
  // node (or null at a conversation end). Rejects options whose guards do not pass.
  choose(optionId) {
    const node = this.current();
    if (!node) throw new Error('no current dialogue node');
    const opt = node.options.find((o) => o.id === String(optionId));
    if (!opt) throw new Error(`node ${node.id} has no option "${optionId}"`);
    if (!guardsPass(opt.guards, this._ctx())) throw new Error(`option "${optionId}" is not available`);
    for (const e of opt.effects) this._applyEffect(e);
    return this._goto(opt.to);
  }

  _applyEffect(effect) {
    if (effect.type === 'revealStatement') {
      if (!this.caseData) return;
      const st = this.caseData.statement(effect.statement);
      if (st) { this.notebook.logStatement(st, { scene: 'interview' }); this.onEvent({ type: 'statement', statement: st }); }
      return;
    }
    throw new RangeError(`unknown effect type "${effect.type}"`);
  }
}


// ==== src/people/interrogation.js ====
// SHOELEATHER — interrogation challenges (statement x evidence; DESIGN-SEED 4).
//
// A suspect statement can be CHALLENGED with a statement x evidence pairing. A correct
// challenge (the fact CONTRADICTS the suspect's own statement) LANDS: the statement is
// broken. A WRONG challenge COSTS: the suspect visibly HARDENS (finite tolerance) and
// the murderer COUNTER-MOVES (the case clock advances, a path closes). No closeness
// gradient, no hints — landed or not.
//
// Interrogations are ATOMIC SCENES elsewhere (no mid-scene save); this controller is
// the pure mechanic. Tolerance/refuted/challenged persist in SuspectState across
// visits; the clock persists per case.

class Interrogation {
  constructor({ suspectId, statements, suspectState, notebook, clock, caseData = null, onEvent = null }) {
    if (!suspectState) throw new TypeError('interrogation needs a SuspectState');
    if (!notebook) throw new TypeError('interrogation needs a notebook');
    if (!clock) throw new TypeError('interrogation needs a CaseClock');
    this.suspectId = suspectId ? String(suspectId) : null;
    this.statements = statements; // array of Statement (this suspect's)
    this.state = suspectState;
    this.notebook = notebook;
    this.clock = clock;
    this.caseData = caseData;
    this.onEvent = onEvent || (() => {});
  }

  // Statements the player can currently challenge: this suspect's, logged (heard), and
  // not already refuted.
  challengeable() {
    return this.statements.filter((s) =>
      (this.suspectId === null || s.speaker === this.suspectId) &&
      this.notebook.has(s.id) && !this.state.isRefuted(s.id));
  }

  // Facts the player has to challenge with (logged fact entries).
  availableEvidence() {
    return this.notebook.entries().filter((e) => e.kind === 'fact').map((e) => e.ref);
  }

  // Challenge a statement with a fact. Returns a result descriptor. LANDED when the
  // fact contradicts the statement; otherwise the suspect hardens and counter-moves.
  challenge(statementId, factId) {
    const stmt = this.statements.find((s) => s.id === String(statementId));
    if (!stmt) return this._refuse('no such statement', { statementId });
    if (this.suspectId !== null && stmt.speaker !== this.suspectId) return this._refuse('not this suspect\'s statement', { statementId });
    if (!this.notebook.has(stmt.id)) return this._refuse('you have not heard that statement yet', { statementId });
    if (this.state.isRefuted(stmt.id)) return this._refuse('already broken', { statementId });

    const factEntry = this.notebook.get(factId);
    if (!factEntry || factEntry.kind !== 'fact') return this._refuse('you have no such evidence in hand', { factId });
    const fact = factEntry.ref;

    // A hostile (fully hardened) suspect will not engage until relaxed (afterthought).
    if (this.state.hardened) {
      this.onEvent({ type: 'shut-down', suspect: this.suspectId });
      return { type: 'refused', reason: 'the suspect has shut down; come back later', posture: this.state.posture() };
    }

    this.state.markChallenged(stmt.id);

    if (stmt.refutedBy(fact)) {
      this.state.markRefuted(stmt.id);
      this.onEvent({ type: 'landed', statement: stmt, fact, posture: this.state.posture() });
      return { type: 'landed', statement: stmt, fact, posture: this.state.posture() };
    }

    // Wrong: harden + counter-move (case clock advances).
    this.state.harden();
    let counterMove = null;
    try { counterMove = this.clock.advance(this.caseData); }
    catch (err) { this.onEvent({ type: 'error', message: err.message }); }
    this.onEvent({ type: 'failed', statement: stmt, fact, posture: this.state.posture(), counterMove });
    if (counterMove) this.onEvent({ type: 'counter-move', counterMove });
    return { type: 'failed', posture: this.state.posture(), counterMove, hardened: this.state.hardened };
  }

  _refuse(reason, data) {
    this.onEvent({ type: 'invalid', reason, ...data });
    return { type: 'invalid', reason };
  }
}


// ==== src/case/case.js ====
// SHOELEATHER — the case model + accusation-chain validation.
//
// A Case bundles the typed facts, suspect statements, documents, the ONE winning
// accusation chain, and a curated near-miss set. The GOTCHA board (DESIGN-SEED 5) is
// a SLOTTED ASSERTION:
//
//   [SUSPECT] killed [VICTIM] by [MEANS] at [TIME], in [PLACE];
//   [ALIBI MECHANISM] fails because [PROLOGUE FACT] contradicts [STATEMENT],
//   corroborated by [DOCUMENT/WITNESS], with [PHYSICAL CONTRADICTION].
//
// Chains validate on FACT IDENTITY and SUSPECT BINDING (the alibi must be the
// suspect's OWN statement; the proving evidence must bind the suspect to the act).
// This predicate is what the solver enumerates over to prove reachability + a UNIQUE
// winning chain, and what a wrong submission fails against (one uniform deflection).


class Case {
  constructor(spec) {
    if (!spec || !spec.id) throw new TypeError('Case needs an id');
    this.id = String(spec.id);
    this.title = spec.title ? String(spec.title) : this.id;
    this.victim = String(spec.victim);
    this.suspects = (spec.suspects || []).map((s) => ({
      id: String(s.id), name: String(s.name || s.id), accusable: s.accusable !== false,
    }));
    this.endingWitnesses = (spec.endingWitnesses || []).map(String);
    this._facts = new Map();
    this._statements = new Map();
    for (const f of spec.facts || []) this.addFact(f instanceof Fact ? f : new Fact(f));
    for (const s of spec.statements || []) this.addStatement(s instanceof Statement ? s : new Statement(s));
    this.documents = spec.documents || {};
    this.winningChain = spec.winningChain || null;
    this.nearMisses = spec.nearMisses || [];
    // M2: ordered counter-moves (murderer's responses to wrong moves) and dialogue
    // trees per suspect. Both feed the solver's challenge-order + dialogue checks.
    this.counterMoves = spec.counterMoves || [];
    this.dialogues = spec.dialogues || {};
    this.prologue = spec.prologue || null; // M3: play-as-the-murderer tutorial + key
  }

  addFact(f) {
    const fact = f instanceof Fact ? f : new Fact(f);
    if (this._facts.has(fact.id)) throw new Error(`duplicate fact id "${fact.id}"`);
    this._facts.set(fact.id, fact);
    return fact;
  }

  addStatement(s) {
    const st = s instanceof Statement ? s : new Statement(s);
    if (this._statements.has(st.id)) throw new Error(`duplicate statement id "${st.id}"`);
    this._statements.set(st.id, st);
    return st;
  }

  fact(id) { return this._facts.get(String(id)) || null; }
  statement(id) { return this._statements.get(String(id)) || null; }
  suspect(id) { return this.suspects.find((s) => s.id === String(id)) || null; }
  accusableSuspects() { return this.suspects.filter((s) => s.accusable); }

  get facts() { return [...this._facts.values()]; }
  get statements() { return [...this._statements.values()]; }
  chainFacts() { return this.facts.filter((f) => f.role === 'chain'); }
  factsForChainSlot(slot) { return this.chainFacts().filter((f) => f.chainSlot === String(slot)); }
  redHerrings() { return this.facts.filter((f) => f.isRedHerring()); }
}

// A filled accusation. Slot values reference case ids (facts/statements/suspects) plus
// the victim value, so every slot is fact-identity checkable.
const CHAIN_FACT_SLOTS = Object.freeze([
  'means', 'time', 'place', 'alibiMechanism', 'prologueFact', 'corroboration', 'physicalContradiction',
]);

function accusation({ suspect, victim, means, time, place, alibiMechanism, prologueFact, contradictedStatement, corroboration, physicalContradiction }) {
  return { suspect, victim, means, time, place, alibiMechanism, prologueFact, contradictedStatement, corroboration, physicalContradiction };
}

// Validate a filled chain against a case. Returns { valid, reasons }. `known`
// optionally gates on reachability (only facts/statements the player could have
// acquired); omit to validate against the full case (used for uniqueness enumeration).
function validateChain(caseObj, chain, known = null) {
  const reasons = [];
  const knownFact = (id) => !known || known.factIds.has(String(id));
  const knownStmt = (id) => !known || known.statementIds.has(String(id));

  const suspect = caseObj.accusableSuspects().find((s) => s.id === String(chain.suspect)) || null;
  if (!suspect) reasons.push(`suspect "${chain.suspect}" is not in this case`);
  if (String(chain.victim) !== caseObj.victim) reasons.push(`victim "${chain.victim}" is not the victim`);

  const stmt = caseObj.statement(chain.contradictedStatement);
  if (!stmt) reasons.push(`statement "${chain.contradictedStatement}" does not exist`);
  else {
    if (!knownStmt(stmt.id)) reasons.push(`statement "${stmt.id}" not yet acquired`);
    if (stmt.speaker !== chain.suspect) reasons.push(`statement "${stmt.id}" is not the suspect's own alibi (suspect binding)`);
  }

  const alibi = caseObj.fact(chain.prologueFact);
  if (!alibi) reasons.push(`prologue-keyed fact "${chain.prologueFact}" does not exist`);
  else {
    if (!knownFact(alibi.id)) reasons.push(`fact "${alibi.id}" not yet acquired`);
    if (!alibi.prologueKeyed) reasons.push(`fact "${alibi.id}" is not prologue-keyed`);
    if (!stmt || !alibi.contradicts(stmt.claim)) {
      reasons.push(`fact "${chain.prologueFact}" does not contradict statement "${chain.contradictedStatement}"`);
    }
  }

  for (const slot of CHAIN_FACT_SLOTS) {
    const id = chain[slot];
    const f = caseObj.fact(id);
    if (!f) { reasons.push(`${slot} fact "${id}" does not exist`); continue; }
    if (!knownFact(f.id)) reasons.push(`${slot} fact "${f.id}" not yet acquired`);
    if (f.role !== 'chain') reasons.push(`${slot} fact "${f.id}" is a red herring, not load-bearing`);
    if (f.chainSlot !== slot) reasons.push(`${slot} fact "${f.id}" is not tagged for that load-bearing slot`);
  }

  for (const slot of ['means', 'time', 'place']) {
    const f = caseObj.fact(chain[slot]);
    if (f && f.claim.subject !== caseObj.victim) reasons.push(`${slot} fact "${f.id}" is not bound to the victim`);
  }
  for (const slot of ['alibiMechanism', 'prologueFact', 'physicalContradiction']) {
    const f = caseObj.fact(chain[slot]);
    if (f && f.claim.subject !== chain.suspect) reasons.push(`${slot} fact "${f.id}" does not bind the suspect`);
  }
  const corroboration = caseObj.fact(chain.corroboration);
  if (corroboration && !corroboration.tags.some((t) => t === 'document' || t === 'witness')) {
    reasons.push(`corroboration fact "${corroboration.id}" is not sourced to a document or witness`);
  }

  // Every load-bearing fact slot must be a DISTINCT fact.
  const factSlots = CHAIN_FACT_SLOTS.map((slot) => chain[slot]).map(String);
  if (new Set(factSlots).size !== factSlots.length) reasons.push('a single fact fills more than one slot');

  return { valid: reasons.length === 0, reasons };
}


// ==== src/case/board.js ====
// SHOELEATHER — the accusation board (THE GOTCHA, DESIGN-SEED 5).
//
// A SLOTTED ASSERTION filled from PINNED notebook facts:
//   [SUSPECT] killed [VICTIM] by [MEANS] at [TIME/PLACE];
//   the alibi fails because [FACT] contradicts [STATEMENT]; proven by [EVIDENCE].
//
// Chains validate on fact identity AND suspect binding (validateChain). A wrong
// submission gets ONE UNIFORM in-register deflection line (NO closeness gradient,
// ever) and advances the case clock: the murderer counter-moves and remaining paths
// get harder. No attempt cap. The case closes only on the exact chain.
//
// The board is an ATOMIC scene (no saving inside it) — the engine enforces that.


// The single deflection. Same line every time — no hint about how close you were.
const DEFLECTION = 'That is a theory, Lieutenant. It is not a case. We are finished here.';

const BOARD_SLOTS = Object.freeze(['suspect', 'means', 'time', 'place', 'alibiMechanism', 'prologueFact', 'contradictedStatement', 'corroboration', 'physicalContradiction']);
const FACT_SLOTS = new Set(CHAIN_FACT_SLOTS);

class AccusationBoard {
  constructor({ caseData, notebook, clock, onEvent = null }) {
    if (!caseData) throw new TypeError('board needs case data');
    if (!notebook) throw new TypeError('board needs a notebook');
    if (!clock) throw new TypeError('board needs a case clock');
    this.caseData = caseData;
    this.notebook = notebook;
    this.clock = clock;
    this.onEvent = onEvent || (() => {});
    this.victim = caseData.victim;
    this.slots = Object.fromEntries(BOARD_SLOTS.map((slot) => [slot, null]));
    this.attempts = 0;
    this.solved = false;
  }

  // Candidates offered for a slot. Fact/statement slots draw ONLY from PINNED notebook
  // entries (you must decide something matters before you can assert it). The suspect
  // slot draws from the case's named suspects.
  candidatesFor(slot) {
    if (slot === 'suspect') return this.caseData.accusableSuspects().map((s) => ({ id: s.id, label: s.name }));
    if (slot === 'contradictedStatement') {
      return this.notebook.pinned().filter((e) => e.kind === 'statement').map((e) => ({ id: e.id, label: '"' + e.text() + '"' }));
    }
    if (FACT_SLOTS.has(slot)) {
      return this.notebook.pinned().filter((e) => e.kind === 'fact').map((e) => ({ id: e.id, label: e.text() || e.id }));
    }
    throw new RangeError(`unknown board slot "${slot}"`);
  }

  set(slot, id) {
    if (!(slot in this.slots)) throw new RangeError(`unknown board slot "${slot}"`);
    this.slots[slot] = id === null ? null : String(id);
    this.onEvent({ type: 'slot', slot, id: this.slots[slot] });
    return this.slots[slot];
  }

  clear(slot) { return this.set(slot, null); }

  isComplete() { return BOARD_SLOTS.every((s) => this.slots[s] !== null); }

  victimName() {
    const victim = this.caseData.suspect(this.victim);
    if (!victim) throw new Error(`victim "${this.victim}" has no display-name fixture`);
    return victim.name;
  }

  chain() {
    return accusation({ ...this.slots, victim: this.victim });
  }

  // Submit the assembled chain. Exact chain -> solved. Otherwise ONE uniform
  // deflection and the clock advances (a counter-move). No closeness gradient.
  //
  // `trap` requests the TRAP ending (DESIGN-SEED 6): the assembled chain PLUS staging
  // an in-fiction demonstration that forces the confession. The chain must still be
  // exact; the trap only changes the ENDING (a superior one), never the validity bar.
  submit(trap = false) {
    if (!this.isComplete()) {
      const missing = BOARD_SLOTS.filter((s) => this.slots[s] === null);
      const reason = 'The board is not finished. Every slot must be filled from your PINNED notes.';
      this.onEvent({ type: 'incomplete', missing, reason });
      return { type: 'incomplete', missing, reason };
    }
    const unpinned = [];
    for (const slot of [...CHAIN_FACT_SLOTS, 'contradictedStatement']) {
      if (!this.notebook.isPinned(this.slots[slot])) unpinned.push(slot);
    }
    if (unpinned.length > 0) {
      const reason = `The board cannot be submitted. Pin these slots from your notebook first: ${unpinned.join(', ')}.`;
      this.onEvent({ type: 'invalid', unpinned, reason });
      return { type: 'invalid', unpinned, reason };
    }
    this.attempts++;
    const result = validateChain(this.caseData, this.chain());
    if (result.valid) {
      this.solved = true;
      const variant = (trap && this.caseData.trap) ? 'trap' : 'staged';
      this.onEvent({ type: 'solved', chain: this.chain(), variant });
      return { type: 'solved', chain: this.chain(), variant };
    }
    let counterMove = null;
    try { counterMove = this.clock.advance(this.caseData); }
    catch (err) { this.onEvent({ type: 'error', message: err.message }); }
    this.onEvent({ type: 'deflected', line: DEFLECTION, counterMove });
    return { type: 'deflected', line: DEFLECTION, counterMove };
  }
}


// ==== src/case/prologue.js ====
// SHOELEATHER — the prologue (play AS THE MURDERER; DESIGN-SEED 1).
//
// A short, interactive, FORCED-LINEAR sequence where the player performs the murder
// and cover-up. It is also the TUTORIAL: it exercises every core verb once and
// includes one STAKES-FREE challenge rep (challenge the cover-up's own witness).
//
// PROLOGUE-KEY LAW: each case's winning chain requires at least one PROLOGUE-KEYED
// reading — a clue whose correct interpretation depends on something only witnessed
// here. The prologue is the knowledge asymmetry, not a mood cutscene. A beat may be
// flagged prologueKey; the solver checks the winning chain uses a prologue-keyed fact.

// The core verbs a prologue must exercise (tutorial completeness).
const CORE_VERBS = Object.freeze(['look', 'take', 'move', 'use', 'talk', 'challenge']);

class PrologueBeat {
  constructor({ id, prose, verb, action, prologueKey = false, stakesFree = false, killBeat = false }) {
    if (!id) throw new TypeError('prologue beat needs an id');
    if (!CORE_VERBS.includes(verb)) throw new RangeError(`beat ${id}: unknown verb "${verb}"`);
    this.id = String(id);
    this.prose = String(prose || '');
    this.verb = verb;
    this.action = String(action || 'Continue');
    this.prologueKey = !!prologueKey;   // this beat plants the asymmetric knowledge
    this.stakesFree = !!stakesFree;     // a rehearsal (e.g. the challenge rep) that cannot fail
    this.killBeat = !!killBeat;         // presentation-only emphasis; authored prose is untouched
  }
}

class Prologue {
  constructor({ id, beats = [], card = null }) {
    this.id = String(id);
    this.card = card ? Object.freeze({
      act: String(card.act || ''), timestamp: String(card.timestamp || ''), line: String(card.line || ''),
    }) : null;
    this.beats = beats.map((b) => (b instanceof PrologueBeat ? b : new PrologueBeat(b)));
    if (this.beats.length === 0) throw new Error(`prologue "${id}" has no beats`);
  }

  // Tutorial-completeness + shape checks (a solver-style linter for the prologue).
  validate() {
    const problems = [];
    const verbs = new Set(this.beats.map((b) => b.verb));
    for (const v of CORE_VERBS) if (!verbs.has(v)) problems.push(`prologue "${this.id}" never exercises the "${v}" verb`);
    if (!this.beats.some((b) => b.verb === 'challenge' && b.stakesFree)) {
      problems.push(`prologue "${this.id}" lacks a stakes-free challenge rep`);
    }
    if (!this.beats.some((b) => b.prologueKey)) {
      problems.push(`prologue "${this.id}" plants no prologue-key beat`);
    }
    return problems;
  }

  hasPrologueKey() { return this.beats.some((b) => b.prologueKey); }
}

// Walks the prologue beat by beat (forced-linear). No choices, no failure (except the
// stakes-free challenge, which teaches the verb without cost).
class PrologueRunner {
  constructor(prologue, { onEvent = null } = {}) {
    this.prologue = prologue;
    this.index = 0;
    this.done = false;
    this.onEvent = onEvent || (() => {});
  }

  current() { return this.done ? null : this.prologue.beats[this.index]; }

  // Perform the current beat's action and advance. Returns the next beat, or null at
  // the end (prologue complete).
  advance() {
    if (this.done) return null;
    const beat = this.prologue.beats[this.index];
    this.onEvent({ type: 'beat-done', beat });
    this.index++;
    if (this.index >= this.prologue.beats.length) {
      this.done = true;
      this.onEvent({ type: 'complete' });
      return null;
    }
    const next = this.prologue.beats[this.index];
    this.onEvent({ type: 'beat', beat: next });
    return next;
  }

  progress() { return { at: Math.min(this.index, this.prologue.beats.length), total: this.prologue.beats.length }; }
}


// ==== src/engine/engine.js ====
// SHOELEATHER — headless game core.
//
// This is the engine loop with NO canvas and NO DOM: it wires the scene graph, sweep
// tracker, focus ring, save manager and debug log into one observable object. The
// browser layer (main.js) drives it with input events and renders off its state and
// emitted events; `node --test` drives it directly. Keeping the core headless is what
// lets the whole engine be tested and, later, lets the SOLVER walk real case data.
//
// Laws embodied here:
//  - INPUT LAW: focus moves by keyboard (next/prev) or mouse (at), never a timer.
//  - SWEEP LAW: moving focus onto a hotspot brushes it (discovery), emitting 'sweep'.
//  - SAVE LAW: auto-checkpoint on every scene boundary; the atomic-scene gate refuses
//    saves during interrogations / the board (mode 'atomic'); restart always offered.
//  - LOUD-FAILURE LAW: a bad transition logs an error, emits 'error', and refuses to
//    move — never a silent "nothing happens".


// Turns a suspect must spend un-visited before they relax (the visit-count timer).
const RELAX_THRESHOLD = 3;

const MODES = Object.freeze({ EXPLORE: 'explore', ATOMIC: 'atomic' });
const AUTOSAVE_SLOT = 'auto';

class Engine {
  constructor({ graph, log, save, sweep = null, startScene = null, notebook = null, caseData = null }) {
    if (!graph) throw new TypeError('engine needs a scene graph');
    if (!log) throw new TypeError('engine needs a debug log');
    if (!save) throw new TypeError('engine needs a save manager');
    this.graph = graph;
    this.log = log;
    this.save = save;
    this.sweep = sweep || new SweepTracker();
    this.startScene = startScene;
    // M1 evidence spine: a case's typed facts/statements, and the notebook they log
    // into. Optional so the M0 engine-harness world (no case data) still runs.
    this.caseData = caseData;
    this.notebook = notebook || new Notebook();
    // M2 people: per-suspect persistent state, the shared counter-move clock, and the
    // active interrogation session (null unless mid-interview, an ATOMIC scene).
    this.suspects = new Map();
    this.clock = new CaseClock({ counterMoves: caseData ? caseData.counterMoves : [] });
    this.interrogation = null;
    this.board = null;        // active accusation board (an atomic scene)
    this.solved = false;      // set when the exact chain closes the case
    this.prologueRunner = null; // active play-as-murderer prologue
    this.mode = MODES.EXPLORE;
    this.tick = 0;
    this.sceneId = null;
    this.focus = null;
    this._listeners = new Map();
  }

  // Get or lazily create a suspect's persistent state.
  suspectState(id) {
    const key = String(id);
    let s = this.suspects.get(key);
    if (!s) {
      const def = this.caseData && this.caseData.suspect(key);
      s = new SuspectState({ maxTolerance: (def && def.maxTolerance) || 3 });
      this.suspects.set(key, s);
    }
    return s;
  }

  // --- events -------------------------------------------------------------
  on(event, fn) {
    let set = this._listeners.get(event);
    if (!set) { set = new Set(); this._listeners.set(event, set); }
    set.add(fn);
    return () => set.delete(fn);
  }

  emit(event, payload) {
    const set = this._listeners.get(event);
    if (!set) return;
    for (const fn of set) {
      try { fn(payload); }
      catch (err) { this.log.capture('engine.listener', err, { event }); }
    }
  }

  // --- lifecycle ----------------------------------------------------------
  start(sceneId = this.startScene) {
    if (!sceneId) throw new TypeError('start needs a scene id');
    if (!this.graph.has(sceneId)) throw new Error(`start scene "${sceneId}" does not exist`);
    this.startScene = sceneId;
    this._transition(sceneId, { checkpoint: true, reason: 'start' });
    return this;
  }

  get scene() { return this.sceneId ? this.graph.get(this.sceneId) : null; }

  // --- prologue (play as the murderer; forced-linear, atomic) -------------
  startPrologue() {
    if (!this.caseData || !this.caseData.prologue) return false;
    this.setMode(MODES.ATOMIC);
    this.prologueRunner = new PrologueRunner(this.caseData.prologue, { onEvent: (e) => this.emit('prologue', e) });
    this.log.info('engine.prologue', 'prologue begin', { id: this.caseData.prologue.id });
    this.emit('prologue-begin', { beat: this.prologueRunner.current() });
    return true;
  }

  prologueAdvance() {
    if (!this.prologueRunner) return null;
    const next = this.prologueRunner.advance();
    if (next === null) this.endPrologue();
    return next;
  }

  endPrologue() {
    this.prologueRunner = null;
    this.setMode(MODES.EXPLORE);
    this.emit('prologue-end', {});
    this.start(); // now enter the investigation start scene (+ checkpoint)
  }

  // Enter a scene through normal play (scene boundary → auto-checkpoint in explore).
  // Returns true on success; on a missing target it stays put and fails LOUDLY.
  enter(sceneId) {
    if (!this.graph.has(sceneId)) {
      this.log.error('engine.enter', `no such scene "${sceneId}"`, { from: this.sceneId });
      this.emit('error', { where: 'enter', message: `no such scene "${sceneId}"` });
      return false;
    }
    this._transition(sceneId, { checkpoint: this.mode === MODES.EXPLORE, reason: 'enter' });
    return true;
  }

  _transition(sceneId, { checkpoint, reason }) {
    this.sceneId = String(sceneId);
    this.focus = new FocusRing(this.scene);
    this.tick++;
    this.log.info('engine.scene', `enter ${this.sceneId}`, { reason, tick: this.tick });
    this.emit('enter', { scene: this.scene, reason });
    if (checkpoint) this.checkpoint();
  }

  // --- focus + sweep ------------------------------------------------------
  _land(hotspot) {
    if (hotspot && this.sweep.brush(this.sceneId, hotspot.id)) {
      this.log.trace('engine.sweep', `brushed ${hotspot.id}`, { scene: this.sceneId });
      this.emit('sweep', { hotspot, coverage: this.sweep.coverage(this.scene) });
    }
    this.emit('focus', { hotspot, cursorKind: this.focus.cursorKind() });
    return hotspot;
  }

  focusNext() { return this._land(this.focus.next()); }
  focusPrev() { return this._land(this.focus.prev()); }
  focusAt(x, y) { return this._land(this.focus.focusAt(x, y)); }

  cursorKind() { return this.focus ? this.focus.cursorKind() : 'default'; }

  // Act on the focused hotspot. Exits transition; other verbs emit 'interact' for
  // higher layers (facts/dialogue arrive in M1/M2). Returns a small result descriptor.
  select() {
    const h = this.focus ? this.focus.focused() : null;
    if (!h) return { type: 'none' };
    const exitTo = this.scene.exitVia(h.id);
    if (exitTo) {
      const ok = this.enter(exitTo);
      return { type: 'exit', to: exitTo, ok };
    }
    // A hotspot bound to a suspect opens an interrogation (an atomic scene).
    if (h.meta && h.meta.suspect && this.caseData && this.caseData.dialogues[h.meta.suspect]) {
      const ok = this.talkTo(h.meta.suspect);
      return { type: 'interrogation', suspect: h.meta.suspect, ok };
    }
    // A hotspot bound to the board opens the GOTCHA (an atomic scene).
    if (h.meta && h.meta.board) {
      const ok = this.openBoard();
      return { type: 'board', ok };
    }
    // Evidence acquisition: a hotspot bound to a fact/statement logs it on interact.
    // This is the VISIBLE moment of fact acquisition (action-legibility law).
    const acquired = this._acquire(h);
    this.log.info('engine.interact', `${h.kind} ${h.id}`, { scene: this.sceneId });
    this.emit('interact', { hotspot: h, kind: h.kind, acquired });
    return { type: 'interact', hotspot: h, kind: h.kind, acquired };
  }

  // Log any fact/statement a hotspot reveals. Returns a descriptor of what was newly
  // acquired (null if nothing, or already known).
  _acquire(h) {
    if (!h.meta || !this.caseData) return null;
    const factIds = h.meta.facts || (h.meta.fact ? [h.meta.fact] : []);
    const acquiredFacts = [];
    for (const factId of factIds) {
      const fact = this.caseData.fact(factId);
      if (!fact) { this.log.error('engine.acquire', `hotspot ${h.id} names unknown fact "${factId}"`); continue; }
      const isNew = !this.notebook.has(fact.id);
      this.notebook.logFact(fact, { scene: this.sceneId });
      if (isNew) { this.emit('fact-logged', { fact, scene: this.sceneId }); acquiredFacts.push(fact.id); }
    }
    if (acquiredFacts.length) return { kind: 'fact', id: acquiredFacts[0], ids: acquiredFacts };
    if (h.meta.statement) {
      const st = this.caseData.statement(h.meta.statement);
      if (!st) { this.log.error('engine.acquire', `hotspot ${h.id} names unknown statement "${h.meta.statement}"`); return null; }
      const isNew = !this.notebook.has(st.id);
      this.notebook.logStatement(st, { scene: this.sceneId });
      if (isNew) { this.emit('statement-logged', { statement: st, scene: this.sceneId }); return { kind: 'statement', id: st.id }; }
    }
    return null;
  }

  // --- interrogation (atomic scene) ---------------------------------------
  // Begin an interview: relax the suspect if due (arming the afterthought), start a
  // visit, enter ATOMIC mode (no mid-scene save), and open the dialogue + challenge
  // controllers. Returns false if the suspect has no dialogue.
  talkTo(suspectId) {
    const tree = this.caseData && this.caseData.dialogues[suspectId];
    if (!tree) { this.log.error('engine.talkTo', `no dialogue for "${suspectId}"`); return false; }
    const state = this.suspectState(suspectId);
    const recovered = state.relaxIfDue(this.tick, RELAX_THRESHOLD);
    if (recovered > 0) { state.armAfterthought(); this.emit('afterthought', { suspect: suspectId }); }

    this.setMode(MODES.ATOMIC);
    const runner = new DialogueRunner(tree, state, {
      notebook: this.notebook, caseData: this.caseData,
      onEvent: (e) => {
        if (e.type === 'statement') this.emit('statement-logged', { statement: e.statement, scene: 'interview' });
        this.emit('dialogue', e);
      },
    });
    const interro = new Interrogation({
      suspectId, statements: this.caseData.statements,
      suspectState: state, notebook: this.notebook, clock: this.clock, caseData: this.caseData,
      onEvent: (e) => this.emit('challenge', e),
    });
    this.interrogation = { suspectId, runner, interro, state };
    runner.enter();
    this.log.info('engine.talkTo', `interview ${suspectId}`, { visit: state.visitCount, afterthought: state.afterthoughtArmed });
    this.emit('interrogation-begin', { suspect: suspectId, node: runner.current(), posture: state.posture() });
    return true;
  }

  dialogueChoose(optionId) {
    if (!this.interrogation) return null;
    const node = this.interrogation.runner.choose(optionId);
    if (node === null) this.endInterrogation();
    return node;
  }

  challenge(statementId, factId) {
    if (!this.interrogation) return { type: 'invalid', reason: 'not in an interview' };
    return this.interrogation.interro.challenge(statementId, factId);
  }

  // Leave the interview: start the relaxation timer, disarm the afterthought, return to
  // EXPLORE, and auto-checkpoint (a scene boundary).
  endInterrogation() {
    if (!this.interrogation) return;
    const { suspectId, state } = this.interrogation;
    state.leave(this.tick);
    state.disarmAfterthought();
    this.interrogation = null;
    this.setMode(MODES.EXPLORE);
    this.emit('interrogation-end', { suspect: suspectId });
    this.checkpoint();
  }

  // --- accusation board (atomic scene) ------------------------------------
  // Open the GOTCHA. Requires case data. Enters ATOMIC mode (no mid-board save).
  openBoard() {
    if (!this.caseData) { this.log.error('engine.openBoard', 'no case data'); return false; }
    this.setMode(MODES.ATOMIC);
    this.board = new AccusationBoard({
      caseData: this.caseData, notebook: this.notebook, clock: this.clock,
      onEvent: (e) => this.emit('board', e),
    });
    this.emit('board-open', {});
    return true;
  }

  boardSet(slot, id) { return this.board ? this.board.set(slot, id) : null; }

  // Submit the board. On solve, the case closes and we emit case-solved (the ending is
  // always a scene). On deflection, the clock has advanced; the player stays at the board.
  boardSubmit(trap = false) {
    if (!this.board) return { type: 'invalid', reason: 'no board open' };
    const res = this.board.submit(trap);
    if (res.type === 'solved') {
      this.solved = true;
      this.log.info('engine.board', 'case solved', { chain: res.chain, variant: res.variant });
      this.emit('case-solved', { chain: res.chain, variant: res.variant });
    }
    return res;
  }

  // Leave the board without solving (return to exploring; auto-checkpoint).
  closeBoard() {
    if (!this.board) return;
    this.board = null;
    this.setMode(MODES.EXPLORE);
    this.emit('board-close', {});
    if (!this.solved) this.checkpoint();
  }

  // --- mode gate ----------------------------------------------------------
  setMode(mode) {
    if (mode !== MODES.EXPLORE && mode !== MODES.ATOMIC) {
      throw new RangeError(`unknown engine mode "${mode}"`);
    }
    this.mode = mode;
    this.emit('mode', { mode });
    return this;
  }

  canCheckpoint() { return this.mode === MODES.EXPLORE; }

  // --- persistence --------------------------------------------------------
  snapshot() {
    const suspects = {};
    for (const [id, s] of this.suspects) suspects[id] = s.toJSON();
    return {
      version: 1, scene: this.sceneId, tick: this.tick,
      sweep: this.sweep.toJSON(),
      notebook: this.notebook ? this.notebook.toJSON() : null,
      suspects, clock: this.clock.toJSON(),
    };
  }

  restore(snap) {
    if (!snap || !this.graph.has(snap.scene)) {
      this.log.error('engine.restore', 'snapshot references unknown scene', { snap });
      this.emit('error', { where: 'restore', message: 'snapshot references unknown scene' });
      return false;
    }
    this.sweep = SweepTracker.fromJSON(snap.sweep);
    if (snap.notebook && this.caseData) this.notebook = Notebook.fromJSON(snap.notebook, this.caseData);
    this.suspects = new Map();
    for (const [id, obj] of Object.entries(snap.suspects || {})) this.suspects.set(id, SuspectState.fromJSON(obj));
    this.clock = CaseClock.fromJSON(snap.clock, this.caseData ? this.caseData.counterMoves : []);
    this.tick = Number.isInteger(snap.tick) ? snap.tick : this.tick;
    this._transition(snap.scene, { checkpoint: false, reason: 'restore' });
    return true;
  }

  // Auto-checkpoint into the autosave slot. Refused (loud) inside an atomic scene.
  checkpoint(slot = AUTOSAVE_SLOT) {
    if (!this.canCheckpoint()) {
      this.log.warn('engine.checkpoint', 'refused: atomic scene has no mid-scene save', { slot });
      return false;
    }
    const stamp = `${this.scene ? this.scene.name : '?'} @${this.tick}`;
    this.save.save(slot, this.snapshot(), stamp);
    this.emit('checkpoint', { slot, stamp });
    return true;
  }

  // Named-slot save from the menu — also gated by the atomic rule.
  saveTo(slot) {
    if (!this.canCheckpoint()) {
      this.log.warn('engine.saveTo', 'refused: no saving inside an atomic scene', { slot });
      this.emit('error', { where: 'save', message: 'Cannot save during this scene.' });
      return false;
    }
    return this.checkpoint(slot);
  }

  loadFrom(slot) {
    let rec;
    try { rec = this.save.load(slot); }
    catch (err) {
      this.log.capture('engine.load', err, { slot });
      this.emit('error', { where: 'load', message: err.message });
      return false;
    }
    if (!rec) {
      this.log.warn('engine.load', `empty slot "${slot}"`);
      return false;
    }
    return this.restore(rec.data);
  }

  // Case restart is always offered (seed law).
  restart() {
    this.sweep = new SweepTracker();
    this.notebook = new Notebook();
    this.suspects = new Map();
    this.clock = new CaseClock({ counterMoves: this.caseData ? this.caseData.counterMoves : [] });
    this.interrogation = null;
    this.board = null;
    this.solved = false;
    this.prologueRunner = null;
    this.tick = 0;
    this.setMode(MODES.EXPLORE);
    this.log.info('engine.restart', 'case restarted');
    this.emit('restart', {});
    this._transition(this.startScene, { checkpoint: true, reason: 'restart' });
    return this;
  }
}


// ==== src/engine/save.js ====
// SHOELEATHER — checkpoint save/load.
//
// DESIGN-SEED save law: auto-checkpoint at scene boundaries; NO saving inside
// interrogations or the accusation board; case restart always offered; named access
// points for save/review ship in M0/M1, not implied.
//
// This module is the persistence layer only: it wraps a snapshot (an opaque JSON-able
// object the engine produces) with a schema version and slot metadata, and round-
// trips it through an injectable string store. The atomic-scene guard lives with the
// engine (it decides WHEN a checkpoint is legal); this decides HOW it is stored.
//
// Loud-failure law (rule 9): a corrupt payload or version mismatch THROWS a typed
// error so the engine logs it visibly rather than silently loading a blank game.

const SAVE_VERSION = 1;

class SaveError extends Error {
  constructor(message, { slot, cause } = {}) {
    super(message);
    this.name = 'SaveError';
    this.slot = slot;
    if (cause) this.cause = cause;
  }
}

// Reference in-memory store for tests and headless runs. The browser adapter over
// localStorage implements the same shape (get/set/remove/keys).
class MemoryStore {
  constructor() { this._m = new Map(); }
  get(key) { return this._m.has(key) ? this._m.get(key) : null; }
  set(key, value) { this._m.set(key, String(value)); }
  remove(key) { this._m.delete(key); }
  keys() { return [...this._m.keys()]; }
}

class SaveManager {
  constructor(store, { prefix = 'shoeleather:save:', version = SAVE_VERSION } = {}) {
    if (!store || typeof store.get !== 'function') {
      throw new TypeError('SaveManager needs a store with get/set/remove/keys');
    }
    this.store = store;
    this.prefix = prefix;
    this.version = version;
  }

  _key(slot) {
    if (!slot) throw new TypeError('save slot name required');
    return this.prefix + String(slot);
  }

  // Persist a snapshot under a named slot. `stamp` is an optional caller-supplied
  // marker (e.g. scene name + tick) — the core takes no wall-clock itself.
  save(slot, snapshot, stamp = null) {
    const record = { version: this.version, slot: String(slot), stamp, data: snapshot };
    let json;
    try {
      json = JSON.stringify(record);
    } catch (err) {
      throw new SaveError(`snapshot for slot "${slot}" is not serializable`, { slot, cause: err });
    }
    this.store.set(this._key(slot), json);
    return record;
  }

  has(slot) {
    return this.store.get(this._key(slot)) !== null;
  }

  // Load a slot. Returns null if absent; THROWS SaveError on corrupt JSON or a
  // version mismatch (loud, never a silent blank).
  load(slot) {
    const raw = this.store.get(this._key(slot));
    if (raw === null) return null;
    let record;
    try {
      record = JSON.parse(raw);
    } catch (err) {
      throw new SaveError(`save slot "${slot}" is corrupt (bad JSON)`, { slot, cause: err });
    }
    if (!record || typeof record !== 'object' || record.version === undefined) {
      throw new SaveError(`save slot "${slot}" is corrupt (missing version)`, { slot });
    }
    if (record.version !== this.version) {
      throw new SaveError(
        `save slot "${slot}" version ${record.version} != engine ${this.version}`, { slot });
    }
    return { data: record.data, stamp: record.stamp ?? null };
  }

  delete(slot) {
    this.store.remove(this._key(slot));
  }

  // Named access points currently present (for a save/review menu).
  list() {
    return this.store.keys()
      .filter((k) => k.startsWith(this.prefix))
      .map((k) => k.slice(this.prefix.length))
      .sort();
  }
}


// ==== src/engine/settings.js ====
// SHOELEATHER — settings / accessibility (M7 QoL gate; art-independent).
//
// DESIGN-SEED M7 + colorblind/photosensitivity floors: text size, dyslexia-font
// alternate, reduced motion, photosensitivity toggle, text speed. These are
// ARCHITECTURE, not decoration (rule 8: text is architectural) — so the model is pure,
// validated, persisted, and node-testable; the browser applies it to the crisp text
// layer and gates any motion/film effects behind the flags.

const FONTS = Object.freeze({ period: '"Courier New", monospace', dyslexic: '"Comic Sans MS", "Verdana", sans-serif' });

const DEFAULT_SETTINGS = Object.freeze({
  textScale: 1.0,          // 0.8 .. 2.0 multiplier on the crisp UI text
  dyslexiaFont: false,     // swap the UI font family
  reducedMotion: false,    // suppress the checkpoint flash + any future motion
  photosensitivitySafe: true, // gate any period film effect (no flashing > 3Hz, ever)
  textSpeedCps: 40,        // characters/sec for any typed reveal (0 = instant)
});

const CLAMPS = {
  textScale: { min: 0.8, max: 2.0 },
  textSpeedCps: { min: 0, max: 200 },
};

class Settings {
  constructor(store = null, { key = 'shoeleather:settings' } = {}) {
    this.store = store;
    this.key = key;
    this.values = { ...DEFAULT_SETTINGS };
  }

  get(k) {
    if (!(k in DEFAULT_SETTINGS)) throw new RangeError(`unknown setting "${k}"`);
    return this.values[k];
  }

  set(k, v) {
    if (!(k in DEFAULT_SETTINGS)) throw new RangeError(`unknown setting "${k}"`);
    if (typeof DEFAULT_SETTINGS[k] === 'boolean') v = !!v;
    else v = clampNum(v, CLAMPS[k]);
    this.values[k] = v;
    return v;
  }

  reset() { this.values = { ...DEFAULT_SETTINGS }; return this; }

  // Font family + a rounded percentage the browser sets on the UI root font-size.
  toCss() {
    return {
      fontFamily: this.values.dyslexiaFont ? FONTS.dyslexic : FONTS.period,
      fontScalePct: Math.round(this.values.textScale * 100),
    };
  }

  load() {
    if (!this.store) return this;
    const raw = this.store.get(this.key);
    if (!raw) return this;
    try {
      const obj = JSON.parse(raw);
      for (const k of Object.keys(DEFAULT_SETTINGS)) if (k in obj) this.set(k, obj[k]);
    } catch (_) { /* corrupt settings fall back to defaults, never a crash */ }
    return this;
  }

  save() {
    if (this.store) this.store.set(this.key, JSON.stringify(this.values));
    return this;
  }
}

function clampNum(v, c) {
  v = Number(v);
  if (!Number.isFinite(v)) return c.min;
  if (!c) return v;
  return Math.min(c.max, Math.max(c.min, v));
}


// ==== src/engine/debug-log.js ====
// SHOELEATHER — debug log (the loud-failure spine).
//
// CLAUDE.md rule 9: FAILURES MUST BE LOUD. Runtime errors surface visibly in-game
// AND land in the exportable debug log. "Nothing happens" is a banned failure mode.
//
// This is the pure, node-testable core. The browser layer attaches a visible sink
// (an on-screen error banner) and a global error/rejection handler; both route here
// so the same record drives the in-game surface and the exported text.

const LEVELS = Object.freeze({ trace: 0, info: 1, warn: 2, error: 3 });

class DebugLog {
  // clock: injectable time source (ms). Defaults to a monotonic counter so the core
  // stays deterministic and testable without wall-clock.
  constructor({ capacity = 1000, clock = null } = {}) {
    if (!Number.isInteger(capacity) || capacity < 1) {
      throw new RangeError(`DebugLog capacity must be a positive integer, got ${capacity}`);
    }
    this.capacity = capacity;
    this._tick = 0;
    this.clock = clock || (() => this._tick++);
    this.entries = [];
    this._seq = 0;
    this._sinks = new Set();
    this._errorCount = 0;
  }

  log(level, tag, message, data) {
    if (!(level in LEVELS)) throw new RangeError(`unknown log level: ${level}`);
    const entry = Object.freeze({
      seq: this._seq++,
      t: this.clock(),
      level,
      tag: String(tag),
      message: String(message),
      data: data === undefined ? undefined : data,
    });
    if (level === 'error') this._errorCount++;
    this.entries.push(entry);
    if (this.entries.length > this.capacity) {
      const dropped = this.entries.shift();
      if (dropped.level === 'error') this._errorCount--;
    }
    // Sinks must never break logging (least of all the error path).
    for (const sink of this._sinks) {
      try { sink(entry); } catch (_) { /* a broken sink cannot silence the log */ }
    }
    return entry;
  }

  trace(tag, message, data) { return this.log('trace', tag, message, data); }
  info(tag, message, data) { return this.log('info', tag, message, data); }
  warn(tag, message, data) { return this.log('warn', tag, message, data); }
  error(tag, message, data) { return this.log('error', tag, message, data); }

  // Capture a thrown value (Error or otherwise) as a loud error entry.
  capture(tag, err, data) {
    const message = err && err.message ? err.message : String(err);
    const payload = { ...(data || {}) };
    if (err && err.stack) payload.stack = err.stack;
    return this.log('error', tag, message, Object.keys(payload).length ? payload : undefined);
  }

  addSink(fn) {
    if (typeof fn !== 'function') throw new TypeError('sink must be a function');
    this._sinks.add(fn);
    return () => this._sinks.delete(fn);
  }

  hasErrors() { return this._errorCount > 0; }
  errorCount() { return this._errorCount; }

  filter(level) {
    const min = LEVELS[level];
    if (min === undefined) throw new RangeError(`unknown log level: ${level}`);
    return this.entries.filter((e) => LEVELS[e.level] >= min);
  }

  // Exportable plain text — the operator-facing artifact of the loud-failure law.
  export() {
    return this.entries.map(formatEntry).join('\n');
  }

  clear() {
    this.entries = [];
    this._errorCount = 0;
  }
}

function formatEntry(e) {
  const ts = String(e.t).padStart(8, ' ');
  const base = `[${ts}] ${e.level.toUpperCase().padEnd(5)} ${e.tag}: ${e.message}`;
  if (e.data === undefined) return base;
  let dataStr;
  try { dataStr = JSON.stringify(e.data); } catch (_) { dataStr = '[unserializable]'; }
  return `${base} ${dataStr}`;
}


// ==== src/render/framebuffer.js ====
// SHOELEATHER — native-res software framebuffer (the rasterizer boot).
//
// DESIGN-SEED stack law: native-res software rasterizer for WORLD ART at a fixed
// logical resolution, integer/nearest upscale. This is the engine-boot core: an
// RGBA byte buffer with clipped primitives and a nearest-neighbour integer upscale.
// It is pure (no canvas), so it runs under `node --test`. The browser layer copies
// the upscaled buffer into an ImageData and blits it to the canvas.
//
// The VACUUM SEALED technique stack (light-rig compositing, dither/fbm material,
// single-picture composition — CLAUDE.md rule 6) lands in M4 on top of this.

function rgba(r, g, b, a = 255) {
  return [clampByte(r), clampByte(g), clampByte(b), clampByte(a)];
}

function clampByte(v) {
  v = Math.round(v);
  if (v < 0) return 0;
  if (v > 255) return 255;
  return v;
}

class Framebuffer {
  constructor(width, height) {
    if (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1) {
      throw new RangeError(`framebuffer dims must be positive integers, got ${width}x${height}`);
    }
    this.width = width;
    this.height = height;
    this.data = new Uint8ClampedArray(width * height * 4);
  }

  inBounds(x, y) {
    return x >= 0 && y >= 0 && x < this.width && y < this.height;
  }

  index(x, y) {
    return (y * this.width + x) * 4;
  }

  clear(color) {
    const [r, g, b, a] = color;
    const d = this.data;
    for (let i = 0; i < d.length; i += 4) {
