 *  - thinkMs: high skill thinks (acts) more often.

 *    a random legal swap or does nothing.

/* src/title.js */
/* ALKAHEST -- title: the composed title scene (M0 deliverable).
 *
 * The candlelit alchemist's bench at night, composed as ONE picture (not sprite
 * scatter): a dark stone room graded top-to-bottom, fbm stone grain, a slate
 * bench, three lit glass phials holding reagent liquor, a burner flame with a
 * warm additive light rig, a beveled brass title plate carrying the engraved
 * wordmark, the alchemical motto in ink, a blinking prompt, and a vignette to
 * seal the frame. No placeholder art -- this must not look cheap.
 *
 * drawTitle(fb, opts): opts = { act, t (seconds, for flicker/blink), showPrompt }.

  }

  /* a lit glass phial standing on the bench */
  function phial(fb, x, benchTop, w, h, liquid, pal) {
    var y = benchTop - h;
    // glass body: cool gradient, slightly translucent look
    R.gradientV(fb, x, y, w, h, pal.glass, [
      pal.glass[0] * 0.5, pal.glass[1] * 0.5, pal.glass[2] * 0.5
    ]);
    // reagent liquor in the lower ~55%
    var lh = Math.round(h * 0.55);
    R.gradientV(fb, x + 1, benchTop - lh, w - 2, lh - 1, [
      liquid[0] * 0.7, liquid[1] * 0.7, liquid[2] * 0.7
    ], liquid);
    // meniscus highlight
    fb.hline(x + 1, benchTop - lh, w - 2, liquid[0], liquid[1], liquid[2], 0.9);
    // left rim specular + right shade
    fb.vline(x, y + 1, h - 2, 235, 240, 245, 0.5);
    fb.vline(x + w - 1, y + 1, h - 2, 0, 0, 0, 0.35);
    // a small specular dot near the shoulder
    fb.rect(x + 1, y + 2, 1, 2, 255, 255, 255, 0.6);
    // cork stopper
    fb.rect(x + 1, y - 3, w - 2, 3, pal.brass[0], pal.brass[1], pal.brass[2], 1);
    fb.hline(x + 1, y - 3, w - 2, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 1);

    R.textureFill(fb, 0, benchTop, W, H - benchTop, pal.stoneLight, STONE_N, { amp: 0.2, scale: 0.06 });
    R.gradientV(fb, 0, benchTop, W, H - benchTop, [
      pal.stoneLight[0], pal.stoneLight[1], pal.stoneLight[2]
    ], pal.stoneDark);
    // bench front lip: bright brass edge, dark shadow beneath
    fb.hline(0, benchTop, W, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 0.9);
    fb.hline(0, benchTop + 1, W, pal.brass[0], pal.brass[1], pal.brass[2], 0.7);
    fb.hline(0, benchTop + 2, W, 0, 0, 0, 0.4);

    /* 5. phials standing on the bench (reagent liquor seeds the register) */
    phial(fb, Math.round(W * 0.20), benchTop, 12, 30, AL.REAGENTS[2].color, pal); // mercury
    phial(fb, Math.round(W * 0.72), benchTop, 10, 24, AL.REAGENTS[3].color, pal); // vitriol
    phial(fb, Math.round(W * 0.80), benchTop, 13, 34, AL.REAGENTS[1].color, pal); // sulfur

    /* 6. burner + flame at bench center-left, with warm light rig */
    var lampX = Math.round(W * 0.44), lampBase = benchTop - 1;
    // brass burner base
    slab(fb, lampX - 5, lampBase - 4, 10, 5, pal.brass[0], pal.brass[1], pal.brass[2], 1);
    fb.hline(lampX - 5, lampBase - 4, 10, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 1);
    var flick = t * 9;
    var flVar = 0.85 + 0.15 * Math.sin(t * 11.0) * Math.cos(t * 5.3);
    flame(fb, lampX, lampBase - 4, 1.6, flick, pal);

    /* 7. LIGHT RIG composited over the albedo (warm flame + cool fill) */
    R.lightRig(fb, [
      { x: lampX, y: lampBase - 8, radius: 120, color: [pal.flame[0], pal.flame[1] * 0.8, pal.flame[2] * 0.5], intensity: 0.5 * flVar },
      { x: lampX, y: lampBase - 8, radius: 40, color: pal.flameCore, intensity: 0.55 * flVar },
      { x: Math.round(W * 0.82), y: Math.round(H * 0.30), radius: 90, color: pal.accent, intensity: 0.16 }
    ]);

    /* 8. the brass title plate, beveled, upper third */
    var pw = 190, ph = 46, px = Math.round((W - pw) / 2), py = 34;
    // drop shadow
    fb.rect(px + 3, py + 4, pw, ph, 0, 0, 0, 0.45);
    // plate body textured brass
    R.textureFill(fb, px, py, pw, ph, pal.brass, STONE_N, { amp: 0.12, scale: 0.08 });
    // bevel: light top/left, dark bottom/right
    fb.hline(px, py, pw, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 1);
    fb.vline(px, py, ph, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 1);
    fb.hline(px, py + ph - 1, pw, 0, 0, 0, 0.5);
    fb.vline(px + pw - 1, py, ph, 0, 0, 0, 0.5);
    // inner engraved channel
    fb.frame(px + 4, py + 4, pw - 8, ph - 8, pal.stoneDark[0], pal.stoneDark[1], pal.stoneDark[2], 0.7);

    /* 9. the wordmark, engraved into the plate */
    AL.drawTextEngravedCentered(fb, "ALKAHEST", py + 14,
      pal.flameCore, pal.stoneDark, { scale: 2, spacing: 2 });

    /* 10. the alchemical motto in ink, beneath the plate */
    AL.drawTextCentered(fb, "SOLVE ET COAGULA", py + ph + 8, pal.ink, { scale: 1, spacing: 1, alpha: 0.85 });

    /* 11. player-facing key/help listing + blinking prompt near the base */
    if (opts.menu && opts.menu.items && opts.menu.items.length) {
      var items = opts.menu.items, sel = opts.menu.sel || 0;
      var lineH = 9, n = items.length;
      var y0 = H - 22 - n * lineH;
      for (var mi = 0; mi < n; mi++) {
        var label = items[mi].label || items[mi];
        var col = mi === sel ? pal.brassLight : pal.ink;
        AL.drawTextCentered(fb, (mi === sel ? "> " : "  ") + label, y0 + mi * lineH, col, {
          scale: 1, alpha: mi === sel ? 0.95 : 0.7
        });
      }
      AL.drawTextCentered(fb, controls("ARROWS MOVE -- ENTER SELECT", "D-PAD / STICK MOVE -- PRIMARY SELECT"), H - 16, pal.ink, { scale: 1, alpha: 0.7 });
    } else {
      AL.drawTextCentered(fb, controls(
        "ARROWS WASD MOVE -- SPACE J SWAP -- SHIFT K RAISE",
        "D-PAD / STICK MOVE -- PRIMARY SWAP -- SECONDARY RAISE"
      ), H - 42, pal.ink, { scale: 1, alpha: 0.7 });
      AL.drawTextCentered(fb, controls(
        "ENTER CONFIRM -- ESC PAUSE -- 1-4 BREW -- L EXPORT LOG",
        "PRIMARY CONFIRM -- START PAUSE -- L1 R1 L2 R2 BREW"
      ), H - 32, pal.ink, { scale: 1, alpha: 0.7 });

        var on = (Math.floor(t * 1.5) % 2) === 0 || opts.t === undefined;
        if (AL.VISUALS && AL.VISUALS.reducedMotion) on = true;
        if (on) {
          AL.drawTextCentered(fb, controls("PRESS ENTER TO BEGIN", "PRESS PRIMARY TO BEGIN"), H - 18, pal.brassLight, { scale: 1, spacing: 1, alpha: 0.95 });
        }
      }
    }

    /* 12. seal the picture */
    R.vignette(fb, 0.55);
    return fb;
  };
});

<script>
/* src/well.js */
/* ALKAHEST -- well: render the live machine as a lit alchemist's vat.
 *
 * Composes the play scene as one picture (graphics bar): a candlelit bench with
 * a recessed brass-framed well holding the 6-wide stack. Every game-critical
 * action has a VISIBLE representation the moment its mechanic works (rule 4):
 * the rising stack, the 1x2 cursor, dissolving clears (reagent dissolve state),
 * chain/combo blooms + a distinct readout, near-death danger, and the ruined-run
 * state. Reads machine + cursor; never mutates them.
 */
;(function (root, factory) {
  var AL = root.AL || (root.AL = {});
  factory(AL);
  if (typeof module !== "undefined" && module.exports) module.exports = AL;
})(typeof self !== "undefined" ? self : globalThis, function (AL) {
  var CELL = 16;
  var VISROWS = 12;
  var R = AL.render;
  var STONE_N = AL.noise2(1717);

  function layoutAt(cols, wellX, wellY) {
    var wellW = cols * CELL, wellH = VISROWS * CELL;
    return { cols: cols, wellW: wellW, wellH: wellH, wellX: wellX, wellY: wellY, floorY: wellY + wellH };
  }
  function layout(machine) {
    var cols = machine.grid.cols;
    var wellW = cols * CELL;
    return layoutAt(cols, Math.round((AL.W - wellW) / 2), 14);
  }
  AL.WELL = { CELL: CELL, VISROWS: VISROWS, layout: layout, layoutAt: layoutAt };

  /* screen y of the top edge of grid row y, including the smooth rise offset */
  function cellTop(L, machine, y) {
    return L.floorY - (y + 1) * CELL - Math.round(machine.riseOffset * CELL);
  }

  /* draw the bench room background (once per scene) */
  function drawBench(fb, pal, act, t) {
    if (AL.drawBenchRoom) return AL.drawBenchRoom(fb, pal, { act: act, time: t });
    R.gradientV(fb, 0, 0, AL.W, AL.H, pal.stoneDark, [pal.stoneMid[0] * 0.9, pal.stoneMid[1] * 0.85, pal.stoneMid[2] * 0.8]);
    return R.textureFill(fb, 0, 0, AL.W, AL.H, pal.stoneMid, STONE_N, { amp: 0.12, scale: 0.05, alpha: 0.3 });
  }

  /* draw ONE well's contents into a given layout: recess, the live stack, the
   * overflow mask, an optional cursor, the chain/combo bloom, the brass frame,
   * and the near-death danger frame. Scene-global light/vignette are the
   * caller's job so multiple wells can share one composed picture. */
  function drawWellPanel(fb, machine, L, pal, t, opts) {
    opts = opts || {};
    var g = machine.grid;
    var flashScale = AL.flashScale ? AL.flashScale(opts) : 0.65;

    /* well recess (dark interior) */
    R.textureFill(fb, L.wellX, L.wellY, L.wellW, L.wellH, [pal.stoneDark[0] * 0.7, pal.stoneDark[1] * 0.7, pal.stoneDark[2] * 0.8], STONE_N, { amp: 0.25, scale: 0.12 });
    for (var c = 1; c < L.cols; c++) fb.vline(L.wellX + c * CELL, L.wellY, L.wellH, 0, 0, 0, 0.18);

    /* panels, clipped to the well interior */
    var clearing = machine.clearing;
    var flash = clearing ? AL.clamp(clearing.timer / machine.cfg.clearDuration, 0, 1) : 1;
    for (var y = 0; y <= VISROWS + 1; y++) {
      var sy = cellTop(L, machine, y);
      if (sy + CELL <= L.wellY || sy >= L.floorY) continue;
      for (var x = 0; x < L.cols; x++) {
        var cell = g.cells[y] && g.cells[y][x];
        if (!cell || cell.dross) {
          if (cell && cell.dross) drawDross(fb, L.wellX + x * CELL, sy, pal);
          continue;
        }
        var st = cell.st === "clearing" ? { state: "clearing", flash: flash, light: 0.05, flashIntensity: flashScale } : { light: 0.05 };
        AL.drawReagent(fb, L.wellX + x * CELL, sy, CELL, cell.t, st);
      }
    }

    /* mask overflow above the well opening */
    R.gradientV(fb, L.wellX - 4, 0, L.wellW + 8, L.wellY, pal.stoneDark, pal.stoneMid);
    R.textureFill(fb, L.wellX - 4, 0, L.wellW + 8, L.wellY, pal.stoneMid, STONE_N, { amp: 0.12, scale: 0.06, alpha: 0.4 });

    if (opts.cursor && machine.state !== "lost") drawCursor(fb, L, machine, opts.cursor, t, pal);

    /* chain/combo fire bloom (light as compositing, bounded) */
    if (machine.lastEvent && opts.allowChainBloom !== false) {
      var age = t - machine.lastEvent.t;
      if (age >= 0 && age < 0.5) {
        var k = 1 - age / 0.5;
        var big = machine.lastEvent.chain >= 2 || machine.lastEvent.combo >= 4;
        var ecx = L.wellX + L.wellW / 2, ecy = L.floorY - L.wellH * 0.4;
        R.glow(fb, ecx, ecy, 52 + machine.lastEvent.combo * 3,
          pal.flame, (big ? 0.42 : 0.22) * k * flashScale);
        R.glow(fb, ecx, ecy, 20, pal.flameCore, 0.34 * k * flashScale);
        if (machine.lastEvent.combo >= 4) {
          var rr = 12 + age * 54;
          R.ring(fb, ecx, ecy, rr, pal.accent, (0.18 + 0.42 * flashScale) * k, 1);
        }
        if (machine.lastEvent.chain >= 2) {
          var sparks = Math.min(7, machine.lastEvent.chain + 2);
          for (var sp = 0; sp < sparks; sp++) {
            var sx = Math.round(ecx + (sp - sparks / 2) * 7 + Math.sin(sp * 4.1) * 3);
            var sy = Math.round(ecy + 12 - age * (32 + sp * 3));
            fb.rect(sx, sy, 2, 2, pal.flameCore[0], pal.flameCore[1], pal.flameCore[2], (0.3 + 0.6 * flashScale) * k);
          }
        }
      }
    }

    drawDrossVfx(fb, L, machine, pal, t, flashScale);
    drawFormulaVfx(fb, L, machine, pal, t, flashScale);

    drawBrassFrame(fb, L, pal, machine, t);
    if (machine.danger && machine.state !== "lost") drawDanger(fb, L, machine, pal, t);

  AL.drawWellPanel = drawWellPanel;

  /* action-legibility for the run-layer mechanics (rule 4): a sublimated panel
   * sparks where it vanished, a burned dross row flashes an ember line, and an
   * active cast pulses the well. All bounded, no full-screen strobe. */
  function drawFormulaVfx(fb, L, machine, pal, t, flashScale) {
    var s = machine.lastSublimate;
    if (s && t - s.t < 0.4) {
      var p = s.key.split(","), sx = L.wellX + (+p[0]) * CELL + CELL / 2, sy = cellTop(L, machine, +p[1]) + CELL / 2;
      if (sy > L.wellY && sy < L.floorY) {
        var ks = 1 - (t - s.t) / 0.4;
        R.glow(fb, sx, sy, 14, pal.flameCore, 0.5 * ks * flashScale);
      }
    }
    var b = machine.lastBurn;
    if (b && t - b.t < 0.5) {
      var kb = 1 - (t - b.t) / 0.5;
      // ember line low in the well where dross burned away
      fb.hline(L.wellX, L.floorY - CELL, L.wellW, pal.accent[0], pal.accent[1], pal.accent[2], 0.6 * kb);
      R.glow(fb, L.wellX + L.wellW / 2, L.floorY - CELL, 40, pal.flame, 0.28 * kb * flashScale);
    }
    var c = machine.lastCast;
    if (c && t - c.t < 0.4) {
      var kc = 1 - (t - c.t) / 0.4;
      R.glow(fb, L.wellX + L.wellW / 2, L.floorY - L.wellH * 0.5, 70, pal.glass, 0.3 * kc * flashScale);
    }
  }

  /* Dross has three distinct verbs: queued chips hover above the opening;
   * crush throws dust downward; transmute runs a bright seam under the slab. */
  function drawDrossVfx(fb, L, machine, pal, t, flashScale) {
    var c = machine.lastCrush;
    if (c && t - c.t >= 0 && t - c.t < 0.6) {
      var age = (t - c.t) / 0.6, x0 = L.wellX + c.x0 * CELL, w = c.width * CELL;
      for (var i = 0; i < Math.min(12, c.width * 3); i++) {
        var dx = (i * 17) % Math.max(1, w), dy = Math.round(L.wellY + age * (28 + (i % 4) * 9));
        var a = (1 - age) * (0.28 + flashScale * 0.35);
        fb.rect(x0 + dx, dy, i % 3 === 0 ? 2 : 1, 2, pal.stoneLight[0], pal.stoneLight[1], pal.stoneLight[2], a);
      }
      fb.hline(x0, L.wellY + Math.round(age * 18), w, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], (1 - age) * 0.35);
    }
    var tr = machine.lastTransmute;
    if (tr && t - tr.t >= 0 && t - tr.t < 0.65) {
      var kt = 1 - (t - tr.t) / 0.65, seamW = Math.min(L.wellW, Math.max(CELL, tr.count * CELL));
      var seamX = L.wellX + Math.round((L.wellW - seamW) / 2), seamY = L.floorY - CELL;
      fb.hline(seamX, seamY, seamW, pal.flameCore[0], pal.flameCore[1], pal.flameCore[2], 0.45 + 0.35 * flashScale * kt);
      for (var s = 0; s < tr.count; s++) fb.rect(seamX + s * CELL + 7, seamY - Math.round(kt * 8), 2, 3,
        pal.glass[0], pal.glass[1], pal.glass[2], 0.35 + 0.35 * flashScale);
    }
  }

  AL.drawWell = function (fb, machine, opts) {
    opts = opts || {};
    var pal = AL.palette(opts.act || "nigredo");
    var t = opts.time || 0;
    var L = layout(machine);

    drawBench(fb, pal, opts.act || "nigredo", t);
    drawWellPanel(fb, machine, L, pal, t, { cursor: opts.cursor, flashIntensity: opts.flashIntensity });
    drawHud(fb, L, machine, pal, t);
    if (machine.state === "lost") drawRuined(fb, pal, t);

    /* warm key light + seal */
    R.glow(fb, L.wellX + L.wellW / 2, L.floorY + 6, 150, [pal.flame[0], pal.flame[1] * 0.8, pal.flame[2] * 0.5], 0.14);
    R.vignette(fb, 0.5);
    return fb;
  };

  function drawDross(fb, x, y, pal) {
    // dull matte slag, heavy: dark textured block, no emblem
    R.textureFill(fb, x, y, CELL, CELL, [pal.stoneLight[0] * 0.6, pal.stoneLight[1] * 0.55, pal.stoneLight[2] * 0.5], STONE_N, { amp: 0.28, scale: 0.3 });
    fb.frame(x, y, CELL, CELL, 0, 0, 0, 0.5);
    fb.hline(x, y, CELL, pal.brass[0] * 0.6, pal.brass[1] * 0.6, pal.brass[2] * 0.6, 0.4);
    // irregular cooled-slag facets keep it matte and materially distinct.
    fb.hline(x + 3, y + 5, 6, 0, 0, 0, 0.28);
    fb.vline(x + 9, y + 5, 5, 0, 0, 0, 0.24);
    fb.hline(x + 8, y + 10, 5, pal.stoneLight[0], pal.stoneLight[1], pal.stoneLight[2], 0.16);
  }

  /* cursor breath: mid +/- amp, so the visible floor is mid - amp */
  AL.CURSOR_PULSE_MID = 0.78;
  AL.CURSOR_PULSE_AMP = 0.22;
  AL.CURSOR_PULSE_FLOOR = AL.CURSOR_PULSE_MID - AL.CURSOR_PULSE_AMP;

  function drawCursor(fb, L, machine, cur, t, pal) {
    var sy = cellTop(L, machine, cur.y);
    var sx = L.wellX + cur.x * CELL;
    // The cursor is the only representation of the game's only verb, so its
    // breathing must never dip toward invisible (CLAUDE.md rule 4). The floor is
    // a legibility floor, not a taste knob: measured on a full well, the old
    // 0.6 +/- 0.4 curve dropped the bracket's contrast against the board to 25%
    // of its peak once every 0.79s. Keep the breath, raise the trough.
    var pulse = AL.CURSOR_PULSE_MID + AL.CURSOR_PULSE_AMP * Math.sin(t * 8);
    var col = pal.brassLight;
    // blocked-input answer: a brief hot flash on the bracket (seed M6 floor)
    var refuseAge = machine.lastRefuse ? (machine.time - machine.lastRefuse.t) : 99;
    if (refuseAge >= 0 && refuseAge < 0.28) {
      col = pal.flameCore || pal.accent;
      pulse = 1;
    }
    // 1x2 bracket: corners + edges
    var w = CELL * 2, h = CELL;
    fb.frame(sx - 1, sy - 1, w + 2, h + 2, col[0], col[1], col[2], pulse);
    fb.frame(sx, sy, w, h, col[0], col[1], col[2], pulse * 0.5);
    // corner ticks
    [[sx - 1, sy - 1], [sx + w, sy - 1], [sx - 1, sy + h], [sx + w, sy + h]].forEach(function (p) {
      fb.rect(p[0] - 1, p[1] - 1, 3, 3, col[0], col[1], col[2], pulse);
    });
  }

  function drawBrassFrame(fb, L, pal, machine, t) {
    var x = L.wellX - 4, y = L.wellY - 4, w = L.wellW + 8, h = L.wellH + 8;
    // engraved brass rails
    for (var i = 0; i < 4; i++) {
      var a = i === 0 ? 1 : 0.6 - i * 0.1;
      fb.frame(x - i, y - i, w + i * 2, h + i * 2, pal.brass[0], pal.brass[1], pal.brass[2], a);
    }
    fb.hline(x, y, w, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 0.9); // top bevel
    fb.hline(x, y + h - 1, w, 0, 0, 0, 0.5);
    // rivets and patina: small enough not to steal playfield contrast.
    [[x + 3, y + 3], [x + w - 4, y + 3], [x + 3, y + h - 4], [x + w - 4, y + h - 4]].forEach(function (p) {
      fb.rect(p[0], p[1], 2, 2, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 0.65);
    });
    // danger-line marker near the top of the well
    var dl = L.floorY - (machine.cfg.warnRow) * CELL;
    fb.hline(L.wellX, dl, L.wellW, pal.accent[0], pal.accent[1], pal.accent[2], 0.35 + 0.2 * Math.sin(t * 4));
  }

  function drawHud(fb, L, machine, pal, t) {
    // left rail: height + rows risen
    var h = machine.grid.stackHeight();
    AL.drawText(fb, "STACK", 8, 20, pal.ink, { scale: 1, alpha: 0.7 });
    // HUD numerals stay pixel — cleaner against brass chrome (play-feedback judgment)
    AL.drawText(fb, String(h).padStart(2, "0"), 8, 30, pal.brassLight, { scale: 2, face: "pixel" });
    AL.drawText(fb, "ROWS", 8, 52, pal.ink, { scale: 1, alpha: 0.7 });
    AL.drawText(fb, String(machine.stats.rowsRisen), 8, 62, pal.ink, { scale: 1, face: "pixel" });

    // right rail: the chain/combo readout, distinct vocabularies (rule: chain !=
    // combo). Chain = warm gold, "CHAIN xN". Combo = cool accent, "COMBO N".
    var ev = machine.lastEvent;
    if (ev && t - ev.t < 1.1) {
      var k = AL.clamp(1 - (t - ev.t) / 1.1, 0, 1);
      var rx = AL.W - 74;
      if (ev.chain >= 2) {
        AL.drawTextEngraved(fb, "CHAIN", rx, 40, pal.flameCore, pal.stoneDark, { scale: 1 });
        AL.drawTextEngraved(fb, "x" + ev.chain, rx, 50, pal.flame, pal.stoneDark, { scale: 2, face: "pixel" });
      }
      if (ev.combo >= 4) {
        AL.drawTextEngraved(fb, "COMBO", rx, 72, pal.accent, pal.stoneDark, { scale: 1 });
        AL.drawTextEngraved(fb, String(ev.combo), rx, 82, pal.glass, pal.stoneDark, { scale: 2, face: "pixel" });
      }
      // fade marker
      fb.rect(rx, 38, 2, 2, pal.flameCore[0], pal.flameCore[1], pal.flameCore[2], k);
    }
    AL.drawText(fb, "CLEARS", AL.W - 74, 20, pal.ink, { scale: 1, alpha: 0.7 });
    AL.drawText(fb, String(machine.stats.clears), AL.W - 74, 30, pal.ink, { scale: 1, face: "pixel" });
  }

  function drawDanger(fb, L, machine, pal, t) {
    var pulse = AL.motionPulse ? AL.motionPulse(t, 12, 0.4, 0.75) : 0.4 + 0.35 * Math.sin(t * 12);
    // pulsing red rails, not a full-screen strobe (photosensitivity)
    fb.frame(L.wellX - 5, L.wellY - 5, L.wellW + 10, L.wellH + 10, 220, 60, 40, pulse);
    // DYING-COLUMN FLAG (STUDY-machine §9): mark the exact columns cresting the
    // warning height so the player sees WHICH column is about to top out.
    var warn = machine.cfg.warnRow;
    for (var x = 0; x < L.cols; x++) {
      if (machine.grid.columnHeight(x) >= warn) {
        var mx = L.wellX + x * CELL;
        fb.rect(mx + 1, L.wellY - 4, CELL - 2, 3, 240, 70, 50, pulse);      // crest bar
        // a small downward chevron warning over the dying column
        for (var d = 0; d < 3; d++) fb.rect(mx + CELL / 2 - 2 + d, L.wellY - 8 + d, 4 - 2 * d + 1, 1, 255, 200, 120, pulse);
      }
    }
    if (machine.state === "grace") {
      AL.drawTextEngravedCentered(fb, "TOP OUT", L.wellY + 4, [255, 200, 160], [80, 10, 10], { scale: 2, spacing: 2 });
    }
  }

  function drawRuined(fb, pal, t, title, prompt) {
    title = title || "THE WORK IS RUINED";
    prompt = prompt || (AL.controlLegend ? AL.controlLegend("PRESS ENTER TO BEGIN ANEW", "PRESS PRIMARY TO BEGIN ANEW") : "PRESS ENTER TO BEGIN ANEW");
    fb.rect(0, 0, AL.W, AL.H, 30, 4, 6, 0.62);
    AL.drawTextEngravedCentered(fb, title, AL.H / 2 - 12, [230, 120, 90], [40, 4, 4], { scale: 2, spacing: 2 });
    var on = Math.floor(t * 1.5) % 2 === 0;
    if (on) AL.drawTextCentered(fb, prompt, AL.H / 2 + 8, [200, 170, 150], { scale: 1 });
  }

  /* text centered horizontally on an arbitrary x (not the whole screen) */
  function textAtCenter(fb, str, cx, y, color, opts) {
    opts = opts || {};
    var w = AL.textWidth(String(str), opts.scale || 1, opts.spacing === undefined ? 1 : opts.spacing);
    AL.drawText(fb, str, Math.round(cx - w / 2), y, color, opts);
  }

  /* incoming-dross telegraph in the top strip over the receiving well: the word
   * plus a row of slag chips scaled to volume (action-legibility: dross arrival
   * is visible before it lands). */
  function drawIncoming(fb, L, machine, pal, t) {
    var q = machine.drossQueue;
    if (!q || !q.length) return;
    var cells = 0;
    for (var i = 0; i < q.length; i++) cells += q[i].width * q[i].height;
    var pulse = AL.motionPulse ? AL.motionPulse(t, 9, 0.5, 0.85) : 0.5 + 0.35 * Math.sin(t * 9);
    var cx = L.wellX + L.wellW / 2;
    textAtCenter(fb, "INCOMING", cx, 1, pal.accent, { scale: 1 });
    var n = Math.min(6, Math.max(1, Math.round(cells / 2)));
    var chipW = 6, tot = n * (chipW + 1), x0 = Math.round(cx - tot / 2);
    for (var k = 0; k < n; k++) {
      var cxk = x0 + k * (chipW + 1);
      fb.rect(cxk, 8, chipW, 4, pal.stoneLight[0] * 0.7, pal.stoneLight[1] * 0.6, pal.stoneLight[2] * 0.55, pulse);
      fb.frame(cxk, 8, chipW, 4, pal.accent[0], pal.accent[1], pal.accent[2], pulse * 0.8);
    }
  }

  /* bottom-strip readout for a well: its label + stack height (H##).
   * Y is clamped from live textHeight so manuscript glyphs stay on-screen. */
  function drawDuelStat(fb, L, machine, label, color, pal) {
    var h = machine.grid.stackHeight();
    var th = AL.textHeight(1);
    var ty = Math.min(L.floorY + 2, AL.H - 1 - th);
    textAtCenter(fb, label + " H" + String(h).padStart(2, "0"), L.wellX + L.wellW / 2, ty, color, { scale: 1 });
  }

  /* the chain/combo readout for a side, placed in the center gutter (the only
   * roomy strip); chain and combo keep DISTINCT vocabularies + colors. */
  function drawEventReadout(fb, cx, y, machine, t, pal) {
    var ev = machine.lastEvent;
    if (!ev || t - ev.t >= 1.1) return;
    var k = AL.clamp(1 - (t - ev.t) / 1.1, 0, 1);
    if (ev.chain >= 2) {
      AL.drawTextEngraved(fb, "CHAIN x" + ev.chain, Math.round(cx - AL.textWidth("CHAIN x" + ev.chain, 1, 1) / 2), y, pal.flame, pal.stoneDark, { scale: 1 });
      fb.rect(Math.round(cx) - 1, y - 3, 2, 2, pal.flameCore[0], pal.flameCore[1], pal.flameCore[2], k);
    } else if (ev.combo >= 4) {
      AL.drawTextEngraved(fb, "COMBO " + ev.combo, Math.round(cx - AL.textWidth("COMBO " + ev.combo, 1, 1) / 2), y, pal.glass, pal.stoneDark, { scale: 1 });
    }
  }

  /* ---- the duel: two lit wells in one composed picture (STUDY-duel §6) ---- */
  AL.drawDuel = function (fb, duel, opts) {
    opts = opts || {};
    var pal = AL.palette(opts.act || "nigredo");
    var t = opts.time || 0;
    var pW = 6 * CELL, wy = 14;
    var Lp = layoutAt(6, 52, wy);              // widened margins leave room for the
    var Lr = layoutAt(6, AL.W - 52 - pW, wy);  // athanor gauges + the active-brew bar

    drawBench(fb, pal, opts.act || "nigredo", t);
    var blooms = AL.chainBloomIndices ? AL.chainBloomIndices([duel.player, duel.rival], t) : [0, 1];
    drawWellPanel(fb, duel.player, Lp, pal, t, { cursor: opts.cursor, allowChainBloom: blooms.indexOf(0) >= 0, flashIntensity: opts.flashIntensity });
    drawWellPanel(fb, duel.rival, Lr, pal, t, { allowChainBloom: blooms.indexOf(1) >= 0, flashIntensity: opts.flashIntensity });

    drawDuelStat(fb, Lp, duel.player, "YOU", pal.brassLight, pal);
    drawDuelStat(fb, Lr, duel.rival, "RIVAL", pal.accent, pal);
    drawIncoming(fb, Lp, duel.player, pal, t);
    drawIncoming(fb, Lr, duel.rival, pal, t);

    // athanor gauges flank the center gutter (player left of it, rival right).
    // Offset clears the well brass pad so the ATH label serifs do not fuse with it.
    AL.drawAthanor(fb, Lp.wellX + Lp.wellW + 17, wy + 26, 6, Lp.wellH - 40, duel.player, pal, t);
    AL.drawAthanor(fb, Lr.wellX - 23, wy + 26, 6, Lr.wellH - 40, duel.rival, pal, t);
    var castHint = opts.run && opts.run.firstActiveDraft && !duel.player.lastCast;
    AL.drawActiveBar(fb, duel.player, 6, wy + 22, pal, t, castHint);
    if (opts.run) AL.drawRunBanner(fb, opts.run, pal, t);

    // center column: VS glyph, act name, and each side's chain/combo readout
    var cx = (Lp.wellX + Lp.wellW + Lr.wellX) / 2;
    R.glow(fb, cx, AL.H / 2, 30, pal.flame, 0.12);
    AL.drawTextEngraved(fb, "VS", Math.round(cx - AL.textWidth("VS", 2, 2) / 2), AL.H / 2 - 12, pal.flameCore, pal.stoneDark, { scale: 2, spacing: 2 });
    textAtCenter(fb, (opts.act || "NIGREDO").toUpperCase(), cx, AL.H / 2 + 6, pal.ink, { scale: 1 });
    drawEventReadout(fb, cx, AL.H / 2 + 22, duel.player, t, pal);   // your offense
    drawEventReadout(fb, cx, AL.H / 2 + 34, duel.rival, t, pal);    // rival offense

    // warm key light + seal (once, over the whole picture)
    R.glow(fb, cx, AL.H - 6, 200, [pal.flame[0], pal.flame[1] * 0.8, pal.flame[2] * 0.5], 0.12);
    R.vignette(fb, 0.5);

    if (duel.state !== "fight") drawBoutEnd(fb, duel, pal, t);
    return fb;
  };

  /* ---- the tutorialette: a single planted well + an instruction card ---- */
  AL.drawTutorial = function (fb, tut, opts) {
    opts = opts || {};
    var pal = AL.palette(opts.act || "nigredo");
    var t = opts.time || 0;
    var pW = 6 * CELL;
    var L = layoutAt(6, AL.W - pW - 22, 14); // well on the right

    drawBench(fb, pal, opts.act || "nigredo", t);
    drawWellPanel(fb, tut.m, L, pal, t, { cursor: opts.cursor, flashIntensity: opts.flashIntensity });

    // A completed tutorial has no active step. Keep every step read inside this
    // live-lesson branch so natural completion is a first-class render state.
    if (!tut.complete) {
      // instruction card on the left
      var s = tut.step();
      var px = 12, py = 40, pw = L.wellX - px - 12;
      fb.rect(px - 4, py - 14, pw + 8, 118, pal.stoneDark[0], pal.stoneDark[1], pal.stoneDark[2], 0.55);
      fb.frame(px - 4, py - 14, pw + 8, 118, pal.brass[0], pal.brass[1], pal.brass[2], 0.7);
      fb.hline(px - 4, py - 14, pw + 8, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 0.8);

      var prog = tut.progress();
      AL.drawText(fb, "LESSON " + (prog.index + 1) + " OF " + prog.total, px, py - 10, pal.ink, { scale: 1, alpha: 0.75 });
      AL.drawTextEngraved(fb, s.id, px, py, pal.flameCore, pal.stoneDark, { scale: 2, spacing: 1 });
      for (var i = 0; i < s.hint.length; i++)
        AL.drawText(fb, s.hint[i], px, py + 22 + i * 10, pal.glass, { scale: 1 });

      // progress pips
      for (var p = 0; p < prog.total; p++) {
        var on = p <= prog.index;
        var cxp = px + p * 10;
        fb.rect(cxp, py + 62, 6, 3, on ? pal.flame[0] : pal.stoneLight[0], on ? pal.flame[1] : pal.stoneLight[1], on ? pal.flame[2] : pal.stoneLight[2], on ? 0.95 : 0.4);
      }

      // step-complete tick + skip prompt
      if (tut.stepDone())
        AL.drawTextEngraved(fb, "WELL DONE", px, py + 74, [180, 230, 160], pal.stoneDark, { scale: 1, spacing: 1 });
      var blink = Math.floor(t * 1.5) % 2 === 0;
      if (blink) AL.drawText(fb, AL.controlLegend ? AL.controlLegend("ESC TO SKIP", "START TO SKIP") : "ESC TO SKIP", px, py + 90, pal.ink, { scale: 1, alpha: 0.7 });
    }

    R.glow(fb, L.wellX + L.wellW / 2, L.floorY + 6, 140, [pal.flame[0], pal.flame[1] * 0.8, pal.flame[2] * 0.5], 0.13);
    R.vignette(fb, 0.5);

    if (tut.complete) {
      fb.rect(0, 0, AL.W, AL.H, 8, 10, 14, 0.62);
      AL.drawTextEngravedCentered(fb, "THE WORK BEGINS", AL.H / 2 - 12, [240, 210, 150], [30, 24, 8], { scale: 2, spacing: 2 });
      var on2 = Math.floor(t * 1.5) % 2 === 0;
      if (on2) AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("PRESS ENTER TO FACE THE FIRST RIVAL", "PRESS PRIMARY TO FACE THE FIRST RIVAL") : "PRESS ENTER TO FACE THE FIRST RIVAL", AL.H / 2 + 8, [210, 190, 150], { scale: 1 });
    } else if (tut.lessonFailed) {
      drawRuined(fb, pal, t, "LESSON RUINED", AL.controlLegend ? AL.controlLegend("PRESS ENTER TO RETRY LESSON", "PRESS PRIMARY TO RETRY LESSON") : "PRESS ENTER TO RETRY LESSON");
    }
    return fb;
  };

  function drawBoutEnd(fb, duel, pal, t) {
    var won = duel.state === "won";
    fb.rect(0, 0, AL.W, AL.H, won ? 8 : 30, won ? 10 : 4, won ? 14 : 6, 0.6);
    if (won) {
      AL.drawTextEngravedCentered(fb, "THE WORK HOLDS", AL.H / 2 - 12, [240, 210, 150], [30, 24, 8], { scale: 2, spacing: 2 });
      AL.drawTextCentered(fb, "THE RIVAL ALEMBIC IS SPENT", AL.H / 2 + 6, [210, 190, 150], { scale: 1 });
    } else {
      AL.drawTextEngravedCentered(fb, "THE WORK IS RUINED", AL.H / 2 - 12, [230, 120, 90], [40, 4, 4], { scale: 2, spacing: 2 });
    }
    var on = Math.floor(t * 1.5) % 2 === 0;
    if (on) AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("PRESS ENTER TO BEGIN ANEW", "PRESS PRIMARY TO CONTINUE") : "PRESS ENTER TO BEGIN ANEW", AL.H / 2 + 22, [200, 170, 150], { scale: 1 });
  }
});

</script>
<script>
/* src/folioui.js */
/* ALKAHEST -- folioui: the run-layer surfaces (STUDY-run §3-§7), drawn to the
 * register. Every run mechanic gets a player-VISIBLE representation (rule 4): the
 * athanor gauge fills as chains charge it; active brews show as keyed chips lit
 * only when castable; the draft, the workshop, the act ladder, and the run-end
 * screens are composed brass-and-ink panels. Card iconography obeys the colorblind
 * law -- a per-class SHAPE plus a per-card GLYPH letter, never colour alone.
 *
 * Pure drawing over a FrameBuffer; reads Run/Machine/Folio, never mutates them.
 */
;(function (root, factory) {
  var AL = root.AL || (root.AL = {});
  factory(AL);
  if (typeof module !== "undefined" && module.exports) module.exports = AL;
})(typeof self !== "undefined" ? self : globalThis, function (AL) {
  var R = AL.render;
  var PAPER_N = AL.noise2(4404);

  function paperColor(pal) {
    if (pal.name === "Albedo") return [174, 169, 151];
    if (pal.name === "Citrinitas") return [162, 132, 76];
    if (pal.name === "Rubedo") return [138, 91, 70];
    return [138, 120, 86];
  }
  function folioInk() { return [31, 23, 16]; }
  function paperShade(pal, k) {
    var c = paperColor(pal);
    return [AL.clamp(c[0] * k, 0, 255), AL.clamp(c[1] * k, 0, 255), AL.clamp(c[2] * k, 0, 255)];
  }

  /* The folio is an object on the bench, not a generic menu panel: leather
   * cover, textured leaves, center binding, brass corners, practical light. */
  function drawFolioBackdrop(fb, pal, act, t) {
    if (AL.drawBenchRoom) AL.drawBenchRoom(fb, pal, { act: act, time: t });
    else fb.clear(pal.stoneDark[0], pal.stoneDark[1], pal.stoneDark[2]);
    R.textureFill(fb, 4, 4, AL.W - 8, AL.H - 8, [49, 29, 20], PAPER_N, { amp: 0.2, scale: 0.07 });
    fb.frame(4, 4, AL.W - 8, AL.H - 8, pal.brass[0], pal.brass[1], pal.brass[2], 0.78);
    R.textureFill(fb, 10, 7, AL.W - 20, AL.H - 14, paperColor(pal), PAPER_N, { amp: 0.12, scale: 0.055 });
    fb.vline(AL.W / 2, 10, AL.H - 20, 66, 42, 24, 0.34);
    fb.vline(AL.W / 2 + 1, 10, AL.H - 20, 220, 190, 132, 0.18);
    [[7, 7], [AL.W - 10, 7], [7, AL.H - 10], [AL.W - 10, AL.H - 10]].forEach(function (p) {
      fb.rect(p[0], p[1], 3, 3, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 0.78);
    });
    R.glow(fb, 56, AL.H - 24, 82, pal.flame, 0.06);
    return folioInk();
  }

  // class identity: shape (colorblind-safe) + a flavour colour
  var CLASS_UI = {
    passive: { shape: "triangle", label: "REACTION", col: [150, 210, 150] },
    active:  { shape: "diamond",  label: "BREW",     col: [120, 200, 214] },
    bargain: { shape: "hexagon",  label: "BARGAIN",  col: [226, 150, 90] }
  };

  /* draw a small filled shape centered at (cx,cy), radius r -- the class icon. */
  function drawShape(fb, kind, cx, cy, r, col, a) {
    a = a === undefined ? 1 : a;
    function span(y, x0, x1) { fb.hline(Math.round(x0), Math.round(y), Math.round(x1 - x0) + 1, col[0], col[1], col[2], a); }
    var dy, w;
    if (kind === "diamond") {
      for (dy = -r; dy <= r; dy++) { w = r - Math.abs(dy); span(cy + dy, cx - w, cx + w); }
    } else if (kind === "triangle") {
      for (dy = 0; dy <= r; dy++) { w = Math.round((dy / r) * r); span(cy - r + dy + Math.round(r * 0.3), cx - w, cx + w); }
    } else { // hexagon
      for (dy = -r; dy <= r; dy++) {
        var t = 1 - Math.abs(dy) / r; w = Math.round(r * (0.55 + 0.45 * t));
        span(cy + dy, cx - w, cx + w);
      }
    }
  }
  AL.drawShape = drawShape;

  /* word-wrap to a max pixel width (manuscript face), falling back to char count */
  function wrap(str, maxWidthPx) {
    var words = String(str).toUpperCase().split(" "), lines = [], cur = "";
    var maxPx = typeof maxWidthPx === "number" ? maxWidthPx : 60;
    for (var i = 0; i < words.length; i++) {
      var next = (cur ? cur + " " : "") + words[i];
      var tw = AL.textWidth(next, 1, 1);
      if (tw <= maxPx) cur = next; else { if (cur) lines.push(cur); cur = words[i]; }
    }
    if (cur) lines.push(cur);
    return lines;
  }
  AL.wrapText = wrap;

  /* One formula leaf: fibrous paper inside a brass-edged folio mount. */
  AL.drawFormulaCard = function (fb, card, x, y, w, h, pal, opts) {
    opts = opts || {};
    var ui = CLASS_UI[card.cls];
    var eff = AL.formulaResolve(card);
    var a = opts.dim ? 0.5 : 1;
    var ink = folioInk();
    // paper leaf with a darker deckled inner edge
    R.textureFill(fb, x, y, w, h, paperColor(pal), AL.noise2(31 + card.id.length), { amp: 0.16, scale: 0.08, alpha: a });
    fb.vline(x + 2, y + 3, h - 6, 70, 44, 24, 0.26 * a);
    fb.hline(x + 4, y + 28, w - 8, 72, 48, 28, 0.3 * a);
    // brass frame (brighter if selected)
    var fa = opts.selected ? 1 : 0.7;
    for (var i = 0; i < (opts.selected ? 3 : 2); i++)
      fb.frame(x - i, y - i, w + i * 2, h + i * 2, pal.brass[0], pal.brass[1], pal.brass[2], (fa - i * 0.2) * a);
    fb.hline(x, y, w, pal.brassLight[0], pal.brassLight[1], pal.brassLight[2], 0.85 * a);
    if (opts.selected) R.glow(fb, x + w / 2, y + h / 2, w, pal.flame, 0.08);

    // header: class shape + glyph letter + class label
    drawShape(fb, ui.shape, x + 9, y + 10, 5, opts.dim ? [ui.col[0] * 0.6, ui.col[1] * 0.6, ui.col[2] * 0.6] : ui.col, a);
    AL.drawTextEngraved(fb, card.glyph, x + 15, y + 6, paperShade(pal, 0.35), paperShade(pal, 1.3), { scale: 1 });
    AL.drawText(fb, ui.label, x + w - AL.textWidth(ui.label, 1, 1) - 3, y + 3, ink, { scale: 1, alpha: 0.85 * a });

    // name (engraved)
    AL.drawTextEngraved(fb, card.name.toUpperCase(), x + 4, y + 18, ink, paperShade(pal, 1.25), { scale: 1, spacing: 1 });
    if (opts.upgraded || card.upgraded) AL.drawText(fb, "+", x + w - 8, y + 17, [112, 46, 25], { scale: 1 });

    // cost badge for actives
    var ty = y + 30;
    if (eff.active) {
      AL.drawTextEngraved(fb, eff.active.cost + " CHARGE", x + 4, ty, [92, 44, 27], paperShade(pal, 1.22), { scale: 1 });
      ty += 11;
    }
    // body text, wrapped
    var lines = wrap(eff.text, w - 8);
    var lh = AL.textHeight(1);
    for (var l = 0; l < lines.length; l++) AL.drawText(fb, lines[l], x + 4, ty + l * lh, ink, { scale: 1, alpha: 0.92 * a });
  };

  /* the athanor gauge: a warm liquor column that fills as cascades charge it.
   * A cap tick marks the ceiling; a fresh charge or the first-charge pulse flares. */
  AL.drawAthanor = function (fb, x, y, w, h, machine, pal, t) {
    var frac = AL.clamp(machine.athanorFrac(), 0, 1);
    var flashScale = AL.flashScale ? AL.flashScale() : 0.65;
    // tube
    fb.rect(x, y, w, h, pal.stoneDark[0] * 0.6, pal.stoneDark[1] * 0.6, pal.stoneDark[2] * 0.7, 0.9);
    fb.frame(x - 1, y - 1, w + 2, h + 2, pal.brass[0], pal.brass[1], pal.brass[2], 0.9);
    // fill from the bottom
    var fh = Math.round((h - 2) * frac);
    if (fh > 0) {
      R.gradientV(fb, x + 1, y + h - 1 - fh, w - 2, fh, [pal.flame[0], pal.flame[1] * 0.7, pal.flame[2] * 0.4], pal.flameCore);
      fb.hline(x + 1, y + h - 1 - fh, w - 2, pal.flameCore[0], pal.flameCore[1], pal.flameCore[2], 0.9);
    }
    // cap tick; "ATH" = athanor. Place from live metrics, centered on the tube
    // so serifs do not fuse with the well's brass pad.
    fb.hline(x - 2, y, w + 4, pal.accent[0], pal.accent[1], pal.accent[2], 0.7);
    var athLab = "ATH";
    var athH = AL.textHeight(1);
    var athW = AL.textWidth(athLab, 1, 1);
    AL.drawText(fb, athLab, Math.round(x + w / 2 - athW / 2), y - athH - 1, pal.ink, { scale: 1, alpha: 0.8 });
    // charge flash + full glow
    if (machine.lastCharge && t - machine.lastCharge.t < 0.4) {
      var k = 1 - (t - machine.lastCharge.t) / 0.4;
      R.glow(fb, x + w / 2, y + h - 1 - fh, 18, pal.flameCore, 0.5 * k * flashScale);
    }
    if (frac >= 0.999) R.glow(fb, x + w / 2, y + h / 2, 16, pal.flame, 0.25 + 0.15 * Math.sin(t * 6));
    // first-charge discoverability callout (STUDY-run §3)
    if (machine.firstChargePulse && t - machine.firstChargePulse.t < 3.0) {
      var bl = Math.floor(t * 2) % 2 === 0;
      if (bl) AL.drawText(fb, "CHARGING", x - 2, y + h + 3, pal.flame, { scale: 1 });
    }
  };

  /* the active-brew bar: one keyed chip per bound active, lit only when castable
   * (athanor >= cost). Shows key number, glyph, and cost. */
  AL.drawActiveBar = function (fb, machine, x, y, pal, t, hint) {
    var actives = machine.actives || [], W = 34;
    for (var i = 0; i < actives.length; i++) {
      var av = actives[i], cy = y + i * 19;
      var ready = machine.athanor + 1e-9 >= av.cost;
      var a = ready ? 1 : 0.45;
      fb.rect(x, cy, W, 16, pal.stoneDark[0], pal.stoneDark[1], pal.stoneDark[2], 0.72 * a);
      fb.frame(x, cy, W, 16, pal.brass[0], pal.brass[1], pal.brass[2], (ready ? 0.95 : 0.5));
      if (ready) R.glow(fb, x + 7, cy + 8, 11, pal.flame, 0.18 + 0.08 * Math.sin(t * 5));
      var bindLabel = AL.actionLegend ? AL.actionLegend("opt" + (i + 1), String(i + 1)) : String(i + 1);
      AL.drawTextEngraved(fb, bindLabel, x + 2, cy + 5, pal.flameCore, pal.stoneDark, { scale: 1 });
      drawShape(fb, "diamond", x + 12, cy + 8, 3, CLASS_UI.active.col, a);
      AL.drawText(fb, av.glyph, x + 18, cy + 2, pal.brassLight, { scale: 1, alpha: a });
      AL.drawText(fb, av.cost + "c", x + 18, cy + 9, ready ? pal.flame : pal.ink, { scale: 1, alpha: a });
    }
    if (actives.length) AL.drawText(fb, "BREWS", x, y - AL.textHeight(1) - 1, pal.ink, { scale: 1, alpha: 0.7 });
    // first-active-draft callout: teach the cast key until the first brew is cast
    if (hint && actives.length) {
      var hy = y + actives.length * 19 + 2;
      R.glow(fb, x + W / 2, hy + 4, 24, pal.flame, 0.12);
      if (Math.floor(t * 2) % 2 === 0) {
        AL.drawTextEngraved(fb, "PRESS " + (AL.actionLegend ? AL.actionLegend("opt1", "1") : "1"), x, hy, pal.flameCore, pal.stoneDark, { scale: 1 });
        AL.drawText(fb, "TO CAST", x, hy + 8, pal.flame, { scale: 1 });
      }
    }
  };

  /* the act-ladder banner over a bout: 4 acts x 3 pips, current lit, plus the
   * rival's name and telegraphed formulae (STUDY-run §1). */
  AL.drawRunBanner = function (fb, run, pal, t) {
    var acts = AL.ACT_ORDER, per = AL.RUN.BOUTS_PER_ACT;
    var x0 = 6, y0 = 2;
    fb.rect(2, 0, AL.W - 4, 14, pal.stoneDark[0], pal.stoneDark[1], pal.stoneDark[2], 0.66);
    fb.hline(2, 13, AL.W - 4, pal.brass[0], pal.brass[1], pal.brass[2], 0.48);
    AL.drawText(fb, "OPUS", x0, y0, pal.ink, { scale: 1, alpha: 0.7, face: "pixel" });
    var px = x0 + 24;
    for (var a = 0; a < acts.length; a++) {
      var name = acts[a].slice(0, 3).toUpperCase();
      var isCur = a === run.actIndex();
      AL.drawText(fb, name, px, y0, isCur ? pal.brassLight : pal.ink, { scale: 1, alpha: isCur ? 1 : 0.55, face: "pixel" });
      for (var b = 0; b < per; b++) {
        var gi = a * per + b, done = gi < run.boutIndex, here = gi === run.boutIndex;
        var cx = px + b * 6;
        var col = done ? pal.flame : here ? pal.flameCore : pal.stoneLight;
        fb.rect(cx, y0 + 8, 4, 3, col[0], col[1], col[2], done || here ? 0.95 : 0.4);
      }
      px += 26;
    }
    // rival telegraph, right-aligned. Thin 14px chrome strip keeps the pixel
    // face so two lines fit without leaking (manuscript cellH is 11).
    if (run.rivalInfo) {
      var ri = run.rivalInfo;
      var pix = { scale: 1, face: "pixel" };
      var label = (ri.master ? "MASTER " : "RIVAL ") + ri.name.toUpperCase();
      AL.drawText(fb, label, AL.W - AL.textWidth(label, 1, 1, pix) - 6, 1, ri.master ? pal.accent : pal.ink, Object.assign({ alpha: 0.9 }, pix));
      if (ri.formulae.length) {
        var f = ri.formulae.join(" / ").toUpperCase();
        AL.drawText(fb, f, AL.W - AL.textWidth(f, 1, 1, pix) - 6, 6, pal.glass, Object.assign({ alpha: 0.8 }, pix));
      }
    }
  };

  /* the draft screen (STUDY-run §4): three cards, one of each class, a selection
   * cursor, skip prompt, and a discard sub-prompt when the folio is full. */
  AL.drawDraft = function (fb, run, opts) {
    opts = opts || {};
    var pal = AL.palette(run.actName || "nigredo");
    var t = opts.time || 0;
    var ink = drawFolioBackdrop(fb, pal, run.actName || "nigredo", t);
    AL.drawTextEngravedCentered(fb, "DRAFT A FORMULA", 14, ink, paperShade(pal, 1.25), { scale: 2, spacing: 2 });
    AL.drawTextCentered(fb, "IN FOLIO  " + run.folio.count() + " OF " + run.folio.cap, 34, ink, { scale: 1 });

    var offer = run.draftOffer || [];
    var cw = 96, ch = 116, gap = 12;
    var totalW = offer.length * cw + (offer.length - 1) * gap;
    var sx = Math.round((AL.W - totalW) / 2), cy = 52;
    for (var i = 0; i < offer.length; i++) {
      var x = sx + i * (cw + gap);
      AL.drawFormulaCard(fb, offer[i], x, cy, cw, ch, pal, { selected: i === opts.sel && !opts.discardMode });
      var offerLabel = AL.actionLegend ? AL.actionLegend("opt" + (i + 1), String(i + 1)) : String(i + 1);
      AL.drawTextCentered2(fb, "[" + offerLabel + "]", x + cw / 2, cy + ch + 3, ink);
    }

    if (opts.discardMode) {
      // overlay: pick a folio card to discard (folio is full)
      fb.rect(0, 0, AL.W, AL.H, 6, 6, 10, 0.72);
      AL.drawTextEngravedCentered(fb, "FOLIO FULL -- DISCARD ONE", 20, pal.accent, pal.stoneDark, { scale: 1, spacing: 1 });
      drawFolioGrid(fb, run.folio, pal, opts.discardSel, 34);
      var bl = Math.floor(t * 2) % 2 === 0;
      if (bl) AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("ENTER DISCARD -- ESC CANCEL", "PRIMARY DISCARD -- START CANCEL") : "ENTER DISCARD -- ESC CANCEL", AL.H - 12, paperColor(pal), { scale: 1 });
    } else {
      var blink = Math.floor(t * 1.5) % 2 === 0;
      AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("1-3 OR ARROWS + ENTER TO TAKE", "D-PAD + PRIMARY TO TAKE") : "1-3 OR ARROWS + ENTER TO TAKE", AL.H - 34, ink, { scale: 1 });
      if (blink) AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("ESC TO SKIP  (UNTIMED)", "START TO SKIP  (UNTIMED)") : "ESC TO SKIP  (UNTIMED)", AL.H - 20, ink, { scale: 1 });
    }
    R.vignette(fb, 0.45);
    return fb;
  };

  /* the workshop (STUDY-run §5): the folio laid out, remove or upgrade one. */
  AL.drawWorkshop = function (fb, run, opts) {
    opts = opts || {};
    var pal = AL.palette(run.actName || "nigredo");
    var t = opts.time || 0;
    var ink = drawFolioBackdrop(fb, pal, run.actName || "nigredo", t);
    AL.drawTextEngravedCentered(fb, "THE WORKSHOP", 12, ink, paperShade(pal, 1.25), { scale: 2, spacing: 2 });
    AL.drawTextCentered(fb, "REMOVE OR UPGRADE ONE FORMULA", 32, ink, { scale: 1 });

    if (run.folio.count() === 0) {
      AL.drawTextCentered(fb, "THE FOLIO IS EMPTY", AL.H / 2 - 4, ink, { scale: 1 });
    } else {
      drawFolioGrid(fb, run.folio, pal, opts.sel, 44);
    }
    var blink = Math.floor(t * 1.5) % 2 === 0;
    AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("U UPGRADE -- X REMOVE", "LEFT FACE UPGRADE -- TOP FACE REMOVE") : "U UPGRADE -- X REMOVE", AL.H - 34, ink, { scale: 1 });
    if (blink) AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("ESC / ENTER TO MOVE ON", "START / PRIMARY TO MOVE ON") : "ESC / ENTER TO MOVE ON", AL.H - 20, ink, { scale: 1 });
    R.vignette(fb, 0.45);
    return fb;
  };

  /* a compact grid of the folio's cards (used by workshop + discard overlay) */
  function drawFolioGrid(fb, folio, pal, sel, y0) {
    var cards = folio.cards, cw = 88, ch = 60, gap = 6, cols = 4;
    var rows = Math.ceil(cards.length / cols);
    var totalW = cols * cw + (cols - 1) * gap;
    var sx = Math.round((AL.W - totalW) / 2);
    for (var i = 0; i < cards.length; i++) {
      var cxi = i % cols, cyi = Math.floor(i / cols);
      var x = sx + cxi * (cw + gap), y = y0 + cyi * (ch + gap);
      drawMiniCard(fb, cards[i], x, y, cw, ch, pal, i === sel);
    }
    return { rows: rows };
  }

  function drawMiniCard(fb, card, x, y, w, h, pal, selected) {
    var ui = CLASS_UI[card.cls], eff = AL.formulaResolve(card), ink = folioInk();
    R.textureFill(fb, x, y, w, h, paperColor(pal), AL.noise2(77 + card.id.length), { amp: 0.14, scale: 0.09 });
    for (var i = 0; i < (selected ? 3 : 1); i++)
      fb.frame(x - i, y - i, w + i * 2, h + i * 2, pal.brass[0], pal.brass[1], pal.brass[2], selected ? 1 - i * 0.2 : 0.7);
    if (selected) R.glow(fb, x + w / 2, y + h / 2, w, pal.flame, 0.10);
    drawShape(fb, ui.shape, x + 8, y + 9, 4, ui.col, 1);
    AL.drawTextEngraved(fb, card.name.toUpperCase(), x + 15, y + 5, ink, paperShade(pal, 1.25), { scale: 1 });
    if (card.upgraded) AL.drawText(fb, "+", x + w - 7, y + 5, [112, 46, 25], { scale: 1 });
    var lines = wrap(eff.text, w - 8);
    var lh = AL.textHeight(1);
    for (var l = 0; l < lines.length && l < 4; l++) AL.drawText(fb, lines[l], x + 4, y + 18 + l * lh, ink, { scale: 1, alpha: 0.9 });
  }
  AL.drawFolioGrid = drawFolioGrid;

  /* run-end screens (STUDY-run §7): ruined or opus complete, with roll-up stats. */
  AL.drawRunEnd = function (fb, run, opts) {
    opts = opts || {};
    var pal = AL.palette(run.actName || "rubedo");
    var t = opts.time || 0;
    var won = run.state === "won";
    var ink = drawFolioBackdrop(fb, pal, run.actName || "rubedo", t);
    if (!won) fb.rect(10, 7, AL.W - 20, AL.H - 14, 70, 12, 12, 0.12);
    if (won) R.glow(fb, AL.W / 2, AL.H / 2, 160, pal.flame, 0.12 * (AL.flashScale ? AL.flashScale(opts) : 0.65));
    AL.drawTextEngravedCentered(fb, won ? "THE OPUS IS COMPLETE" : "THE WORK IS RUINED", 40,
      won ? ink : [96, 22, 18], paperShade(pal, 1.25), { scale: 2, spacing: 2 });
    AL.drawTextCentered(fb, won ? "THE MAGNUM OPUS HOLDS" : "A FRESH CRUCIBLE AWAITS", 62, ink, { scale: 1 });

    var H = run.history, seed = String(run.seed >>> 0).padStart(4, "0"), rows = [
      ["BOUTS WON", H.boutsWon + " OF 12"],
      ["ACTS CLEARED", String(H.actsCleared) + " OF 4"],
      ["BEST CHAIN", "x" + H.bestChain],
      ["REAGENTS DISSOLVED", String(H.panelsDissolved)],
      ["DROSS CAST", String(H.drossSent)],
      ["SEED", seed]
    ];
    var ry = 84;
    for (var i = 0; i < rows.length; i++) {
      AL.drawText(fb, rows[i][0], AL.W / 2 - 80, ry + i * 12, ink, { scale: 1, alpha: 0.85 });
      AL.drawText(fb, rows[i][1], AL.W / 2 + 40, ry + i * 12, [92, 44, 27], { scale: 1 });
    }
    var blink = Math.floor(t * 1.5) % 2 === 0;
    if (AL.VISUALS && AL.VISUALS.reducedMotion) blink = true;
    if (blink) AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("PRESS ENTER TO BEGIN A NEW OPUS", "PRESS PRIMARY TO BEGIN A NEW OPUS") : "PRESS ENTER TO BEGIN A NEW OPUS", AL.H - 16, ink, { scale: 1 });
    R.vignette(fb, 0.5);
    return fb;
  };

  /* Panel overlays compose pixels under the presentation text layer. Any strings
   * the scene-beneath already queued (title wordmark / key legend / bout HUD)
   * would flush ON TOP of the panel unless we start a fresh text pass first. */
  function dropBackdropText() {
    if (AL.textlayer && AL.textlayer.begin) AL.textlayer.begin();
  }

  AL.drawPauseMenu = function (fb, opts) {
    opts = opts || {};
    var pal = AL.palette(opts.act || "nigredo");
    var items = opts.items || ["RESUME", "SETTINGS", "ABANDON"];
    var sel = opts.sel || 0;
    dropBackdropText();
    fb.rect(0, 0, AL.W, AL.H, 6, 8, 14, 0.82);
    AL.drawTextEngravedCentered(fb, "PAUSED", AL.H / 2 - 28, [210, 200, 180], [20, 20, 30], { scale: 2, spacing: 2 });
    for (var i = 0; i < items.length; i++) {
      var col = i === sel ? pal.brassLight : pal.ink;
      AL.drawTextCentered(fb, (i === sel ? "> " : "  ") + items[i], AL.H / 2 - 4 + i * 12, col, { scale: 1 });
    }
    AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("ARROWS + ENTER SELECT -- ESC BACK", "D-PAD / STICK + PRIMARY -- START BACK") : "ARROWS + ENTER SELECT -- ESC BACK", AL.H / 2 + 42, pal.ink, { scale: 1, alpha: 0.7 });
  };

  AL.SETTINGS_OPTS = ["VOLUME", "MUTE", "FLASH", "MOTION", "SPEED", "KEYS", "BACK"];
  AL.REBIND_ACTIONS = [
    ["left", "LEFT"], ["right", "RIGHT"], ["up", "UP"], ["down", "DOWN"],
    ["swap", "SWAP"], ["raise", "RAISE"], ["confirm", "CONFIRM"], ["pause", "PAUSE"],
    ["opt1", "BREW 1"], ["opt2", "BREW 2"], ["opt3", "BREW 3"], ["opt4", "BREW 4"]
  ];

  AL.codesForAction = function (action, bindings) {
    bindings = bindings || (AL.settings && AL.settings.bindings) || AL.DEFAULT_BINDINGS || {};
    var out = [];
    for (var code in bindings) if (bindings[code] === action) out.push(code);
    return out;
  };

  AL.drawSettings = function (fb, opts) {
    opts = opts || {};
    var pal = AL.palette("nigredo");
    var s = AL.settings || AL.defaultSettings();
    var page = opts.page || "opts";
    var sel = opts.sel || 0;
    var t = opts.time || 0;
    AL.drawTitle(fb, { act: "nigredo", t: t, showPrompt: false, menu: { items: [], sel: 0 } });
    dropBackdropText();
    fb.rect(24, 18, AL.W - 48, AL.H - 36, pal.stoneDark[0], pal.stoneDark[1], pal.stoneDark[2], 0.82);
    fb.frame(24, 18, AL.W - 48, AL.H - 36, pal.brass[0], pal.brass[1], pal.brass[2], 0.85);
    AL.drawTextEngravedCentered(fb, page === "keys" ? "KEYS" : "SETTINGS", 28, pal.flameCore, pal.stoneDark, { scale: 2, spacing: 2 });
    if (page === "opts") {
      var vol = Math.round(s.volume * 100);
      var fl = Math.round(s.flashIntensity * 100);
      var rows = [
        "VOLUME  " + vol,
        "MUTE    " + (s.muted ? "ON" : "OFF"),
        "FLASH   " + fl,
        "MOTION  " + (s.reducedMotion ? "REDUCED" : "FULL"),
        "SPEED   " + (AL.SPEED[s.speedPreset] ? AL.SPEED[s.speedPreset].label : "STANDARD"),
        "KEYS",
        "BACK"
      ];
      for (var i = 0; i < rows.length; i++) {
        var col = i === sel ? pal.brassLight : pal.ink;
        AL.drawText(fb, (i === sel ? "> " : "  ") + rows[i], 40, 54 + i * 16, col, { scale: 1 });
      }
      AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("ARROWS ADJUST -- ENTER SELECT -- ESC BACK", "D-PAD / STICK ADJUST -- PRIMARY SELECT -- START BACK") : "ARROWS ADJUST -- ENTER SELECT -- ESC BACK", AL.H - 28, pal.ink, { scale: 1, alpha: 0.65 });
    } else {
      var binds = s.bindings || AL.DEFAULT_BINDINGS;
      var actions = AL.REBIND_ACTIONS;
      var wait = opts.wait;
      for (var a = 0; a < actions.length; a++) {
        var codes = AL.codesForAction(actions[a][0], binds).join(" ");
        var line = actions[a][1] + "  " + (wait === actions[a][0] ? "PRESS A KEY" : codes);
        var col2 = a === sel ? pal.brassLight : pal.ink;
        AL.drawText(fb, (a === sel ? "> " : "  ") + line, 36, 50 + a * 11, col2, { scale: 1 });
      }
      var backSel = sel === actions.length;
      AL.drawText(fb, (backSel ? "> " : "  ") + "BACK", 36, 50 + actions.length * 11, backSel ? pal.brassLight : pal.ink, { scale: 1 });
    }
  };

  /* text centered on an arbitrary x (small helper the draft column labels use) */
  AL.drawTextCentered2 = function (fb, str, cx, y, color, opts) {
    opts = opts || {};
    var w = AL.textWidth(String(str), opts.scale || 1, opts.spacing === undefined ? 1 : opts.spacing);
    AL.drawText(fb, str, Math.round(cx - w / 2), y, color, opts);
  };

  /* M10 records / achievements surface — bench register, title backdrop. */
  AL.drawRecords = function (fb, opts) {
    opts = opts || {};
    var pal = AL.palette("nigredo");
    var page = opts.page || "records";
    var t = opts.time || 0;
    var rec = AL.records || AL.defaultRecords();
    var L = rec.lifetime || {};
    AL.drawTitle(fb, { act: "nigredo", t: t, showPrompt: false, menu: { items: [], sel: 0 } });
    dropBackdropText();
    fb.rect(18, 14, AL.W - 36, AL.H - 28, pal.stoneDark[0], pal.stoneDark[1], pal.stoneDark[2], 0.84);
    fb.frame(18, 14, AL.W - 36, AL.H - 28, pal.brass[0], pal.brass[1], pal.brass[2], 0.85);
    AL.drawTextEngravedCentered(fb, page === "achievements" ? "ACHIEVED" : "RECORDS", 22, pal.flameCore, pal.stoneDark, { scale: 2, spacing: 2 });
    if (page === "records") {
      var rows = [
        ["WORKS COMPLETED", String(L.runsCompleted | 0)],
        ["WORKS RUINED", String(L.runsRuined | 0)],
        ["BEST CHAIN", "x" + (L.bestChain | 0)],
        ["MOST DISSOLVED", String(L.mostPanels | 0)],
        ["MOST BOUTS", String(L.mostBouts | 0)],
        ["MOST ACTS", String(L.mostActs | 0)],
        ["MOST DROSS CAST", String(L.mostDross | 0)]
      ];
      for (var i = 0; i < rows.length; i++) {
        AL.drawText(fb, rows[i][0], 32, 48 + i * 12, pal.ink, { scale: 1, alpha: 0.85 });
        AL.drawText(fb, rows[i][1], AL.W - 88, 48 + i * 12, [92, 44, 27], { scale: 1 });
      }
      if (rec.last) {
        AL.drawText(fb, "LAST  " + (rec.last.outcome === "won" ? "OPUS" : "RUIN") +
          "  CHAIN x" + (rec.last.bestChain | 0) +
          "  SEED " + String(rec.last.seed >>> 0).padStart(4, "0"),
          32, AL.H - 40, pal.brassLight, { scale: 1, alpha: 0.9 });
      } else {
        AL.drawText(fb, "NO SITTING RECORDED YET", 32, AL.H - 40, pal.ink, { scale: 1, alpha: 0.7 });
      }
      AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("LEFT RIGHT PAGE -- ESC BACK", "D-PAD PAGE -- PRIMARY / START BACK") : "LEFT RIGHT PAGE -- ESC BACK", AL.H - 22, pal.ink, { scale: 1, alpha: 0.65 });
    } else {
      var list = AL.ACHIEVEMENTS || [];
      for (var a = 0; a < list.length; a++) {
        var got = !!(rec.achievements && rec.achievements[list[a].id]);
        var col = got ? pal.brassLight : pal.ink;

      if (input.actionPressed("left")) cur.x = Math.max(0, cur.x - 1);
      if (input.actionPressed("right")) cur.x = Math.min(cols - 2, cur.x + 1);
      if (input.actionPressed("up")) cur.y = Math.min(top, cur.y + 1);
      if (input.actionPressed("down")) cur.y = Math.max(0, cur.y - 1);
      if (input.actionPressed("swap")) m.requestSwap(cur.x, cur.y);
      m.setRaise(input.actionDown("raise"));
      m.tick(dt);
      if (AL.observePlayStats) AL.observePlayStats(m.stats);
    },
    render: function (fb) {
      AL.drawWell(fb, this.m, { act: this.act, cursor: this.cursor, time: this.t });
      if (this.paused) {
        fb.rect(0, 0, AL.W, AL.H, 6, 8, 14, 0.55);
        AL.drawTextEngravedCentered(fb, "PAUSED", AL.H / 2 - 6, [210, 200, 180], [20, 20, 30], { scale: 2, spacing: 2 });
        AL.drawTextCentered(fb, AL.controlLegend ? AL.controlLegend("ENTER RESUME -- ESC TITLE", "PRIMARY RESUME -- START TITLE") : "ENTER RESUME -- ESC TITLE", AL.H / 2 + 14, [180, 170, 150], { scale: 1 });
      }
      if (AL.drawAchievementToast && AL.peekAchievementAck) AL.drawAchievementToast(fb, AL.peekAchievementAck());
    }
  };

  /* ---- the boot + loop; browser only ---- */
  AL.boot = function (win, doc) {
    win = win || (typeof window !== "undefined" ? window : null);
    doc = doc || (typeof document !== "undefined" ? document : null);
    if (!win || !doc) throw new Error("AL.boot requires a browser window");

    AL.debug.install(win);

    var canvas = doc.getElementById("screen");
    if (!canvas) { throw new Error("no #screen canvas in document"); }
    var ctx = canvas.getContext("2d", { alpha: false });
    ctx.imageSmoothingEnabled = false;

    var fb = new AL.FrameBuffer(AL.W, AL.H); // logical game + pixel HUD
    var presentFb = null;
    var img = null;
    var presentScale = 1;

    var input = new AL.Input();
    input.attach(win);
    if (AL.loadSettings) AL.loadSettings();
    if (AL.loadRecords) AL.loadRecords();
    if (AL.applyBindingsTo) AL.applyBindingsTo(input);
    AL._bootInput = input;
    if (AL.applySettings) AL.applySettings();
    // WebAudio may only start from a user gesture. The score remains a pure,
    // headless-safe parameter timeline until the first key/click/touch wakes it.
    if (AL.audio && AL.audio.attach) AL.audio.attach(win);

    // size the presentation canvas to the seed-law scale (preserve aspect,
    // maximize fill, nearest-neighbour; fractional allowed where screen-fill wins);
    // #stage flex-centers the letterbox in the window.
    function fit() {
      var ww = win.innerWidth, wh = win.innerHeight;
      presentScale = AL.presentScale ? AL.presentScale(ww, wh) : Math.max(0.25, Math.min(ww / AL.W, wh / AL.H));
      var gw = Math.round(AL.W * presentScale);
      var gh = Math.round(AL.H * presentScale);
      if (!presentFb || presentFb.w !== gw || presentFb.h !== gh) {
        presentFb = new AL.FrameBuffer(gw, gh);
        img = new ImageData(presentFb.data, gw, gh);
      }
      canvas.width = gw;
      canvas.height = gh;
      canvas.style.width = gw + "px";
      canvas.style.height = gh + "px";
      ctx.imageSmoothingEnabled = false;
    }
    win.addEventListener("resize", fit);
    fit();

    AL.go("title");
    var last = 0;

    function frame(ts) {
      var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; // clamp long stalls
      last = ts;
      if (AL.textlayer && AL.textlayer.begin) AL.textlayer.begin();
      try {
        // Gamepads expose sampled state rather than key-like DOM events. Poll at
        // the frame boundary so their edges share the keyboard's exact lifetime.
        if (input.pollGamepads) input.pollGamepads();
        // global keys handled here (export log) before scene update
        if (input.actionPressed("exportlog")) AL.debug.export(doc);
        AL._active.update(dt, input);
        if (AL.audio && AL.audio.update) AL.audio.update(dt, AL.sceneAudioSnapshot(AL._active));
        AL._active.render(fb);
      } catch (e) {
        AL.debug.error((e && e.message ? e.message : e) + (e && e.stack ? " | " + e.stack.split("\n")[1] : ""));
        fb.clear(20, 6, 6); // never a black void
      }
      AL.debug.overlay(fb);
      if (AL.present) {
        AL.present(fb, { scale: presentScale, out: presentFb, ox: 0, oy: 0 });
      } else {
        // fallback: direct logical blit (should not happen once textlayer loads)
        ctx.putImageData(new ImageData(fb.data, AL.W, AL.H), 0, 0);
        input.beginFrame();
        win.requestAnimationFrame(frame);
        return;
      }
      ctx.putImageData(img, 0, 0);
      input.beginFrame();
      win.requestAnimationFrame(frame);
    }

    AL.debug.log("ALKAHEST boot ok (" + AL.W + "x" + AL.H + " @ " + presentScale + "x)");
    win.requestAnimationFrame(frame);
    return { canvas: canvas, fb: fb, presentFb: presentFb, input: input, scale: function () { return presentScale; } };
  };

  // auto-boot when loaded in a browser document
  if (typeof document !== "undefined" && typeof window !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { AL.boot(window, document); });
    } else {
      AL.boot(window, document);
    }
  }
});

</script>
</body>
</html>
