# ATTRIBUTION — MATERIAL BREACH

**This file ships inside the built artifact**, not only in the repo (collection contract v0, item 9).
Every borrowed asset has a row here before it is used.

## Credit line (the short form, for a credits screen or a store page)

> Cast pixel art by **Willibab / Monsteretrope**, used under **CC BY 4.0**, recoloured.
> Type from the **Not Jam Font Pack** by **Not Jam**, CC0 1.0.

## Art

**Facility:** code-drawn (original work, no third-party source). The architectural cutaway, its
lighting, grain, dither and every ramp in the palette are original to this project.

**Cast:** licensed pixel-pack art, copied into `assets/cast/source/` unmodified and adapted for
rendering as described below.

| Asset | Source pack | Creator | Licence | Attribution required | Used for |
|---|---|---|---|---|---|
| `assets/cast/source/CIV_9_1.png` (char 3) | NPC Pack — Human Empires | Willibab / Monsteretrope | CC BY 4.0 | **Yes** | the drudge: the worker caste, at the excavation face |
| `assets/cast/source/CIV_12_1.png` (char 1) | NPC Pack — Human Empires | Willibab / Monsteretrope | CC BY 4.0 | **Yes** | the clerk: Records |
| `assets/cast/source/CIV_7_1.png` (char 1) | NPC Pack — Human Empires | Willibab / Monsteretrope | CC BY 4.0 | **Yes** | the artificer: Fabrication |
| `assets/cast/source/MIL_1_1.png` (char 0) | NPC Pack — Human Empires | Willibab / Monsteretrope | CC BY 4.0 | **Yes** | the warden: Holding |
| `assets/cast/source/MIL_3_1.png` (char 0) | NPC Pack — Human Empires | Willibab / Monsteretrope | CC BY 4.0 | **Yes** | a raiding party member |
| `assets/cast/source/MIL_2_1.png` (char 0) | NPC Pack — Human Empires | Willibab / Monsteretrope | CC BY 4.0 | **Yes** | a raiding party member |
| `assets/cast/source/MAG_1_1.png` (char 5) | NPC Pack — Human Empires | Willibab / Monsteretrope | CC BY 4.0 | **Yes** | an escalation officer, cowled |
| `assets/cast/source/CIV_6_1.png` (char 1) | NPC Pack — Human Empires | Willibab / Monsteretrope | CC BY 4.0 | **Yes** | an escalation officer, the inspector |

**Licence note.** The NPC Pack ships no readme of its own. It arrived in the Willibab /
Monsteretrope collection, whose licence is CC BY, verified in the readmes of sibling packs from the
same purchase (`WILLIBAB_OVERWORLD` and `Retro_8bit_Monster_Pack`, both: *"Created by Willibab /
Monsteretrope. License: CC BY"*). Credit is given here regardless of which reading applies, which
satisfies CC BY and costs nothing if the terms turn out to be looser.

**Adaptation.** CC BY permits remixing and adapting. Each figure is quantised at copy-in into
per-pixel ramp-step offsets (`scripts/prepare-cast.mjs` produces `src/cast-data.js`) so that it
selects its colours from this game's curated palette at the light level of the tile it stands on.
The originals are preserved unmodified in `assets/cast/source/` as the provenance record.

## Type

Two faces from the **Not Jam Font Pack** (Not Jam), **CC0 1.0**. Both are embedded in the built
artifact as base64 `@font-face` rules, because `dist/index.html` boots from a `file://`
double-click with no server and no network. The pack's own `Licence.txt` is copied to
`assets/fonts/LICENCE-NotJamFontPack-CC0.txt` **and its full text is appended to this file inside
the build**, so the licence travels with the artifact.

| Asset | Family | Creator | Licence | Attribution required | Used for |
|---|---|---|---|---|---|
| `assets/fonts/NotJamSlabSerif11.ttf` | Not Jam Slab Serif 11 | Not Jam | CC0 1.0 | No (given anyway) | display: panel titles, section headings, the drawing's title block |
| `assets/fonts/NotJamSerif11.ttf` | Not Jam Serif 11 | Not Jam | CC0 1.0 | No (given anyway) | body: every ledger row, every figure, every notice, every annotation |

**Why these two.** MATERIAL BREACH is a game made of documents, and the document is a pre-printed
institutional form: the slab is the part printed at the stationer's before anything happened, and
the serif is everything entered onto the form afterwards. Both are cut at 11px and nothing is drawn
off their design size, so every glyph lands on whole pixels at every integer window scale.

CC0 waives the attribution requirement. The rows are here anyway, because a build that ships a
creator's work without naming them is worse than a build that names them unnecessarily.

## Music and audio

Code-composed WebAudio via the House Band kit. **No audio files of any kind.** Built at M7b.

**Score and sound effects: Abel Aeolian**, per the standing credit convention for Claude-composed
music. Two tracks (the lobby bed and the closing cue) and five effects, all synthesised at runtime
from oscillators and a seeded noise buffer. Nothing is sampled, streamed, fetched or bundled as
audio data; the score is source code, and `dist/index.html` carries no audio asset of any kind.

**The band kit** (`src/band.js`, `src/prng.js`) is ported from Ray's own `house-band` repository,
the canonical register-neutral kit shared across the fleet. First-party, so no third-party licence
attaches. The port removed the kit's `setInterval` scheduler driver, so this game's pacing law
binds the audio layer with no exemption; nothing else in it was altered.

Provenance consequence: the music is code-generated, and therefore **paid-eligible** under
`art-provenance-gates-commercial-release`. No generative-audio service was used at any point.

## Banned

**LLM-image-generated art, in any quantity, for any purpose.** No asset in this project was
generated by an image model. The facility is code-drawn; the cast is licensed pack art.

const NEUTRAL_DEFAULTS = Object.freeze({
  band: Object.freeze({
    gain: 0.5,
    reverb: Object.freeze({ seconds: 0.7, decay: 1.4 }),
    reverbReturnGain: 0.18,
    lookahead: 0.22,
    tickMs: 25,
    fadeOut: 0.08,
    fadeIn: 0.08,
    retireTail: 0.75,
  }),
  voices: Object.freeze({
    pad: Object.freeze({ verb: 0.12, cut: 1600, sweep: 1.1, q: 0.7, det: 3, vol: 0.08, wave: 'triangle', a: 0.04, d: 0.12, s: 0.65, r: 0.25 }),
    drone: Object.freeze({ verb: 0.08, cut: 800, q: 0.7, vol: 0.08, beat: 0, wave: 'sine', a: 0.03, d: 0.15, s: 0.75, r: 0.3 }),
    bell: Object.freeze({ verb: 0.2, ratios: Object.freeze([1, 2, 3, 4]), levels: Object.freeze([1, 0.35, 0.18, 0.08]), vol: 0.06, a: 0.004, dScale: 0.5, s: 0.01, r: 0.35, holdScale: 0.25 }),
    pluck: Object.freeze({ verb: 0.12, cut: 2800, wave: 'triangle', a: 0.003, dScale: 0.45, s: 0.05, r: 0.15, vol: 0.06, holdScale: 0.4 }),
    bass: Object.freeze({ verb: 0.05, cut: 600, q: 1.2, vol: 0.1, wave: 'sawtooth', a: 0.01, dScale: 0.3, s: 0.45, r: 0.12, holdScale: 0.75 }),
    lead: Object.freeze({ verb: 0.1, cut: 2400, q: 1.2, wave: 'triangle', vibrato: 4.5, vibratoDepth: 0.003, a: 0.03, d: 0.15, s: 0.65, r: 0.2, vol: 0.07 }),
    air: Object.freeze({ verb: 0.1, type: 'bandpass', bp: 1200, sweep: 1.2, q: 0.8, attackScale: 0.08, decayScale: 0.15, s: 0.5, r: 0.25, vol: 0.025 }),
    kick: Object.freeze({ f0: 130, f1: 40, dur: 0.24, vol: 0.3 }),
    snare: Object.freeze({ bp: 1900, q: 0.8, dur: 0.15, vol: 0.11, verb: 0.12 }),
    hat: Object.freeze({ hp: 7000, dur: 0.05, vol: 0.04, verb: 0.08 }),
  }),
});

// Scheduler constants. LOOKAHEAD is how far ahead of currentTime we schedule;
// TICK_MS how often the driver wakes. MAX_STEPS_PER_TICK stops a pathological
// clock jump (tab wake, breakpoint) from scheduling thousands of notes at once.
const LOOKAHEAD = NEUTRAL_DEFAULTS.band.lookahead;
const TICK_MS = NEUTRAL_DEFAULTS.band.tickMs;
const MAX_STEPS_PER_TICK = 64;

// Register-neutral crossfade and retirement defaults.
const FADE_OUT = NEUTRAL_DEFAULTS.band.fadeOut;
const FADE_IN = NEUTRAL_DEFAULTS.band.fadeIn;
// How long a retired track bus lingers before disconnect — long enough for the
// longest voice release to finish under the fade.
const RETIRE_TAIL = NEUTRAL_DEFAULTS.band.retireTail;

class BandStepError extends Error {
  constructor({ track, index, absoluteStep, scheduledTime, cause }) {
    super(`track "${track}" step ${index} (absolute ${absoluteStep}, t=${scheduledTime.toFixed(6)}): ${cause?.message || cause}`);
    this.name = 'BandStepError';
    this.track = track;
    this.index = index;
    this.absoluteStep = absoluteStep;
    this.scheduledTime = scheduledTime;
    this.cause = cause;
  }
}

/**
 * Build a band on an existing AudioContext.
 * @param {object}   o
 * @param {AudioContext} o.ctx          required
 * @param {AudioNode} [o.destination]   where the band's output goes (default ctx.destination)
 * @param {number}   [o.seed]           seeds the reverb IR, the noise buffer, and s.rand
 * @param {number}   [o.gain]           the band's output level
 * @param {object}   [o.reverb]         { seconds, decay } of the generated IR
 * @param {Function} [o.nowFn]          scheduler clock (default ctx.currentTime)
 * @param {boolean}  [o.strict]         collect step failures for authoring renders
 * @param {boolean}  [o.disconnectRetired] disconnect expired buses (disable while pre-scheduling offline)
 * @param {object}   [o.performance]    deterministic humanize/release tools; omitted is neutral
 */
function createBand({
  ctx,
  destination = null,
  seed = 1,
  gain = NEUTRAL_DEFAULTS.band.gain,
  reverb = NEUTRAL_DEFAULTS.band.reverb,
  reverbReturnGain = NEUTRAL_DEFAULTS.band.reverbReturnGain,
  lookahead = LOOKAHEAD,
  tickMs = TICK_MS,
  fadeOut = FADE_OUT,
  fadeIn = FADE_IN,
  retireTail = RETIRE_TAIL,
  voiceDefaults = {},
  performance = undefined,
  nowFn = () => ctx.currentTime,
  strict = false,
  disconnectRetired = true,
} = {}) {
  if (!ctx) throw new Error('createBand: needs an AudioContext');
  if (typeof nowFn !== 'function') throw new Error('createBand: nowFn must be a function');
  const rngSeed = (seed >>> 0) || 1;
  const resolvedVoiceDefaults = Object.fromEntries(
    Object.entries(NEUTRAL_DEFAULTS.voices).map(([name, defaults]) => [
      name,
      { ...defaults, ...(voiceDefaults[name] || {}) },
    ]),
  );
  const resolvedPerformance = normalizePerformance(performance);

  function readNow(explicitNow) {
    const now = explicitNow === undefined ? nowFn() : explicitNow;
    if (typeof now !== 'number' || !Number.isFinite(now) || now < 0) {
      throw new Error('band clock: expected a finite non-negative time');
    }
    return now;
  }

  // -- bus architecture ------------------------------------------------------
  //   voices -> trackBus.out ---------------------\
  //          \-> sendGain -> trackBus.send -> verb -> verbReturn -> out -> destination
  //                                                       music bus  ^
  // The per-track bus is what makes a scene change clean: both its dry out and
  // its reverb send are ramped down together, so nothing from the outgoing
  // track can fade back in when the incoming one rises.
  const out = ctx.createGain();
  out.gain.value = gain;
  const comp = ctx.createDynamicsCompressor ? ctx.createDynamicsCompressor() : null;
  if (comp) {
    // Gentle glue so overlapping ambient pads never clip the sum.
    try {
      comp.threshold.value = -16; comp.knee.value = 24; comp.ratio.value = 3;
      comp.attack.value = 0.01; comp.release.value = 0.3;
    } catch (_) { /* a stub context without full params — harmless */ }
    out.connect(comp);
    comp.connect(destination || ctx.destination);
  } else {
    out.connect(destination || ctx.destination);
  }

  const verb = makeVerb(ctx, reverb, rngSeed);
  const verbReturn = ctx.createGain();
  verbReturn.gain.value = reverbReturnGain;
  if (verb) { verb.connect(verbReturn); verbReturn.connect(out); }

  const noiseBuf = makeNoise(ctx, rngSeed ^ 0x5bf03635);

  // -- track buses -----------------------------------------------------------
  let bus = null;        // the live track's { out, send, vol }
  const retiring = [];   // buses fading out, disposed on a later tick

  function makeBus(vol, now, fadeSeconds) {
    const o = ctx.createGain();
    o.gain.value = EPS;
    o.connect(out);
    const s = ctx.createGain();
    s.gain.value = EPS;
    if (verb) s.connect(verb);
    return { out: o, send: s, vol, fadeStart: now, fadeSeconds };
  }

  function retire(b, now) {
    if (!b) return;
    const progress = b.fadeSeconds === 0
      ? 1
      : clamp01((now - b.fadeStart) / b.fadeSeconds);
    const outLevel = EPS + (b.vol - EPS) * progress;
    const sendLevel = EPS + (1 - EPS) * progress;
    ramp(b.out.gain, outLevel, EPS, now, fadeOut);
    ramp(b.send.gain, sendLevel, EPS, now, fadeOut);
    retiring.push({ bus: b, disposeAt: now + fadeOut + retireTail });
  }

  function sweepRetired(now) {
    for (let i = retiring.length - 1; i >= 0; i--) {
      if (retiring[i].disposeAt <= now) {
        if (disconnectRetired) {
          try { retiring[i].bus.out.disconnect(); retiring[i].bus.send.disconnect(); } catch (_) { /* ignore */ }
        }
        retiring.splice(i, 1);
      }
    }
  }

  // A voice's dry destination, and its wet tap. With no live bus (silence) the
  // voices still build correctly but land on a bus at EPS, i.e. inaudible.
  function dry() { return bus ? bus.out : out; }
  function send(node, amount) {
    if (!amount || !bus) return;
    const g = ctx.createGain();
    g.gain.value = amount;
    node.connect(g);
    g.connect(bus.send);
  }

  // -- envelope --------------------------------------------------------------
  // Attack to peak, decay to a sustain fraction, hold to `dur`, release out.
  // Exponential throughout (musical), floored at EPS.
  function env(g, t, { a = 0.4, d = 0.5, s = 0.6, r = 1.0, peak = 0.1, dur = 1 }) {
    const p = Math.max(EPS * 2, peak);
    const hold = Math.max(a + d, dur);
    try {
      g.gain.setValueAtTime(EPS, t);
      g.gain.exponentialRampToValueAtTime(p, t + a);
      g.gain.exponentialRampToValueAtTime(Math.max(EPS * 2, p * s), t + a + d);
      g.gain.setValueAtTime(Math.max(EPS * 2, p * s), t + hold);
      g.gain.exponentialRampToValueAtTime(EPS, t + hold + r);
    } catch (_) { /* param without full automation */ }
    return hold + r;
  }

  function ramp(param, from, to, t, secs) {
    try {
      param.setValueAtTime(Math.max(EPS, from), t);
      param.linearRampToValueAtTime(Math.max(EPS, to), t + secs);
    } catch (_) { try { param.value = to; } catch (__) { /* ignore */ } }
  }

  // ==========================================================================
  // VOICES
  // ==========================================================================

  // The harmonic bed: three detuned oscillators (one an octave down) through a
  // lowpass that sweeps open across the note — the slow filter movement is what
  // keeps a long pad from reading as a held organ chord.
  function pad(t, freq, dur, o = {}) {
    o = { ...resolvedVoiceDefaults.pad, ...o };
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    const cut = o.cut;
    try {
      f.frequency.setValueAtTime(cut, t);
      f.frequency.linearRampToValueAtTime(cut * o.sweep, t + dur * 0.6);
      f.Q.value = o.q;
    } catch (_) { /* stub */ }
    f.connect(o1);
    const det = o.det;
    const vol = o.vol;
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      osc.type = o.wave;
      try { osc.frequency.value = freq * (i === 2 ? 0.5 : 1); osc.detune.value = (i - 1) * det; } catch (_) { /* stub */ }
      const g = ctx.createGain();
      const tail = env(g, t, { a: o.a, d: o.d, s: o.s, r: o.r, peak: vol * (i === 2 ? 0.7 : 1), dur });
      osc.connect(g); g.connect(f);
      osc.start(t); osc.stop(t + tail + 0.2);
    }
  }

  // A sine foundation with a sub octave, optional detuned partner, and glide.
  function drone(t, freq, dur, o = {}) {
    o = { ...resolvedVoiceDefaults.drone, ...o };
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    try { f.frequency.value = o.cut; f.Q.value = o.q; } catch (_) { /* stub */ }
    f.connect(o1);
    const vol = o.vol;
    const partners = o.beat ? [0, o.beat] : [0];
    for (const cents of partners) {
      for (const [mult, level] of [[1, 1], [0.5, 0.7]]) {
        const osc = ctx.createOscillator();
        osc.type = o.wave;
        try {
          osc.frequency.setValueAtTime(freq * mult, t);
          if (o.glide) osc.frequency.linearRampToValueAtTime(noteFreq(o.glide) * mult, t + dur);
          osc.detune.value = cents;
        } catch (_) { /* stub */ }
        const g = ctx.createGain();
        const tail = env(g, t, { a: o.a, d: o.d, s: o.s, r: o.r, peak: vol * level, dur });
        osc.connect(g); g.connect(f);
        osc.start(t); osc.stop(t + tail + 0.2);
      }
    }
  }

  // Sparse events: a configurable stack of sine partials.
  function bell(t, freq, dur, o = {}) {
    o = { ...resolvedVoiceDefaults.bell, ...o };
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb);
    const ratios = o.ratios;
    const levels = o.levels;
    const vol = o.vol;
    for (let i = 0; i < ratios.length; i++) {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      try { osc.frequency.value = freq * ratios[i]; } catch (_) { /* stub */ }
      const g = ctx.createGain();
      const tail = env(g, t, { a: o.a, d: dur * o.dScale, s: o.s, r: o.r, peak: vol * (levels[i] === undefined ? 0.1 : levels[i]), dur: dur * o.holdScale });
      osc.connect(g); g.connect(o1);
      osc.start(t); osc.stop(t + tail + 0.4);
    }
  }

  function pluck(t, freq, dur, o = {}) {
    o = { ...resolvedVoiceDefaults.pluck, ...o };
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    const cut = o.cut;
    try {
      f.frequency.setValueAtTime(cut, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(120, cut * 0.18), t + Math.max(0.05, dur));
    } catch (_) { /* stub */ }
    f.connect(o1);
    const osc = ctx.createOscillator();
    osc.type = o.wave;
    try { osc.frequency.value = freq; } catch (_) { /* stub */ }
    const g = ctx.createGain();
    const tail = env(g, t, { a: o.a, d: dur * o.dScale, s: o.s, r: o.r, peak: o.vol, dur: dur * o.holdScale });
    osc.connect(g); g.connect(f);
    osc.start(t); osc.stop(t + tail + 0.3);
  }

  function bass(t, freq, dur, o = {}) {
    o = { ...resolvedVoiceDefaults.bass, ...o };
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    try { f.frequency.value = o.cut; f.Q.value = o.q; } catch (_) { /* stub */ }
    f.connect(o1);
    const vol = o.vol;
    for (const [wave, mult, level] of [[o.wave, 1, 1], ['sine', 0.5, 0.6]]) {
      const osc = ctx.createOscillator();
      osc.type = wave;
      try { osc.frequency.value = freq * mult; } catch (_) { /* stub */ }
      const g = ctx.createGain();
      const tail = env(g, t, { a: o.a, d: dur * o.dScale, s: o.s, r: o.r, peak: vol * level, dur: dur * o.holdScale });
      osc.connect(g); g.connect(f);
      osc.start(t); osc.stop(t + tail + 0.3);
    }
  }

  function lead(t, freq, dur, o = {}) {
    o = { ...resolvedVoiceDefaults.lead, ...o };
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    try { f.frequency.value = o.cut; f.Q.value = o.q; } catch (_) { /* stub */ }
    f.connect(o1);
    const osc = ctx.createOscillator();
    osc.type = o.wave;
    try { osc.frequency.value = freq; } catch (_) { /* stub */ }
    // A touch of vibrato so a sustained lead is not a test tone.
    const lfo = ctx.createOscillator();
    const lg = ctx.createGain();
    try { lfo.frequency.value = o.vibrato; lg.gain.value = freq * o.vibratoDepth; } catch (_) { /* stub */ }
    lfo.connect(lg); lg.connect(osc.frequency);
    const g = ctx.createGain();
    const tail = env(g, t, { a: o.a, d: o.d, s: o.s, r: o.r, peak: o.vol, dur });
    osc.connect(g); g.connect(f);
    osc.start(t); osc.stop(t + tail + 0.4);
    lfo.start(t); lfo.stop(t + tail + 0.4);
  }

  // Texture: the shared seeded noise buffer through a swept band.
  function air(t, dur, o = {}) {
    o = { ...resolvedVoiceDefaults.air, ...o };
    if (!noiseBuf) return;
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb);
    const f = ctx.createBiquadFilter();
    f.type = o.type;
    const bp = o.bp;
    try {
      f.frequency.setValueAtTime(bp, t);
      f.frequency.linearRampToValueAtTime(bp * o.sweep, t + dur);
      f.Q.value = o.q;
    } catch (_) { /* stub */ }
    // src -> filter -> envelope gain -> bus
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const g = ctx.createGain();
    const tail = env(g, t, { a: o.a === undefined ? dur * o.attackScale : o.a, d: dur * o.decayScale, s: o.s, r: o.r, peak: o.vol, dur });
    src.connect(f); f.connect(g); g.connect(o1);
    src.start(t); src.stop(t + tail + 0.3);
  }

  // --- percussion -----------------------------------------------------------
  function kick(t, o = {}) {
    o = { ...resolvedVoiceDefaults.kick, ...o };
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    try {
      osc.frequency.setValueAtTime(o.f0, t);
      osc.frequency.exponentialRampToValueAtTime(o.f1, t + 0.11);
    } catch (_) { /* stub */ }
    const g = ctx.createGain();
    const dur = o.dur;
    try {
      g.gain.setValueAtTime(o.vol, t);
      g.gain.exponentialRampToValueAtTime(EPS, t + dur);
    } catch (_) { /* stub */ }
    osc.connect(g); g.connect(dry());
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  function snare(t, o = {}) {
    o = { ...resolvedVoiceDefaults.snare, ...o };
    if (!noiseBuf) return;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    try { f.frequency.value = o.bp; f.Q.value = o.q; } catch (_) { /* stub */ }
    const g = ctx.createGain();
    const dur = o.dur;
    try {
      g.gain.setValueAtTime(o.vol, t);
      g.gain.exponentialRampToValueAtTime(EPS, t + dur);
    } catch (_) { /* stub */ }
    src.connect(f); f.connect(g); g.connect(dry());
    send(g, o.verb);
    src.start(t); src.stop(t + dur + 0.05);
  }

  function hat(t, o = {}) {
    o = { ...resolvedVoiceDefaults.hat, ...o };
    if (!noiseBuf) return;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass';
    try { f.frequency.value = o.hp; } catch (_) { /* stub */ }
    const g = ctx.createGain();
    const dur = o.dur;
    try {
      g.gain.setValueAtTime(o.vol, t);
      g.gain.exponentialRampToValueAtTime(EPS, t + dur);
    } catch (_) { /* stub */ }
    src.connect(f); f.connect(g); g.connect(dry());
    send(g, o.verb);
    src.start(t); src.stop(t + dur + 0.05);
  }

  const voices = { pad, drone, bell, pluck, bass, lead, air, kick, snare, hat };

  function performanceVoices(absoluteStep, stepIndex, stepSeconds) {
    if (!resolvedPerformance) return voices;
    const calls = Object.create(null);
    return Object.fromEntries(Object.entries(voices).map(([name, voice]) => [name, (...given) => {
      const args = [...given];
      const call = calls[name] ?? 0;
      calls[name] = call + 1;
      const adjusted = performanceAdjustment(resolvedPerformance, {
        seed: rngSeed, absoluteStep, stepIndex, stepSeconds, voice: name, call,
      });
      args[0] = Math.max(0, Number(args[0]) + adjusted.timeSeconds);
      const optionIndex = VOICE_OPTION_INDEX[name];
      const authored = args[optionIndex] || {};
      if (adjusted.velocity !== 0 || adjusted.releaseTail !== 0) {
        const played = { ...authored };
        if (adjusted.velocity !== 0) {
          const baseVol = authored.vol === undefined ? resolvedVoiceDefaults[name].vol : authored.vol;
          played.vol = Math.max(0, baseVol * (1 + adjusted.velocity));
        }
        if (adjusted.releaseTail !== 0) {
          const baseRelease = authored.r === undefined ? resolvedVoiceDefaults[name].r : authored.r;
          played.r = baseRelease + adjusted.releaseTail;
        }
        args[optionIndex] = played;
      }
      return voice(...args);
    }]));
  }

  // ==========================================================================
  // SCHEDULER — lookahead step scheduling against ctx.currentTime
  // ==========================================================================
  const tracks = new Map();
  let cur = null, curName = null;
  let step = 0, nextTime = 0;
  let params = {};
  const stepErrors = [];

  function registerTrack(name, spec) {
    if (!name || !spec || typeof spec.step !== 'function') throw new Error('registerTrack: needs { bpm, len, step }');
    tracks.set(name, {
      bpm: spec.bpm || 60,
      len: Math.max(1, spec.len | 0 || 16),
      vol: spec.vol === undefined ? 0.8 : spec.vol,
      step: spec.step,
    });
    return name;
  }

  /**
   * Schedule every step falling inside the lookahead window. Callable by hand
   * (the tests do exactly this) or driven by start()'s timer. Returns how many
   * steps it scheduled.
   */
  function tick(now) {
    now = readNow(now);
    sweepRetired(now);
    if (!cur) return 0;
    const spb = 60 / cur.bpm / 4;
    let scheduled = 0;
    while (nextTime < now + lookahead && scheduled < MAX_STEPS_PER_TICK) {
      if (nextTime < now) nextTime = now + 0.03;
      const i = step % cur.len;
      const n = step;
      try {
        cur.step(i, nextTime, {
          v: performanceVoices(n, i, spb), i, n, bar: (i / 16) | 0, params,
          rand: (salt = 0) => hash2(n, salt | 0, rngSeed),
        });
      } catch (cause) {
        if (strict) {
          stepErrors.push(new BandStepError({
            track: curName,
            index: i,
            absoluteStep: n,
            scheduledTime: nextTime,
            cause,
          }));
        }
        // Tolerant live/game mode intentionally continues scheduling. Strict
        // authoring callers inspect stepErrors and fail the render as a unit.
      }
      step += 1;
      nextTime += spb;
      scheduled += 1;
    }
    return scheduled;
  }

  /**
   * Change track with a crossfade. Same name is a no-op (so a shell may call
   * this every frame). `null` fades to silence. Returns true if it switched.
   */
  function setTrack(name, o = {}) {
    if (name === curName) return false;
    // o.now lets a headless renderer drive the clock when ctx.currentTime is
    // frozen (OfflineAudioContext before startRendering). Live callers omit it.
    const now = readNow(o.now);
    retire(bus, now);
    bus = null;
    curName = name;
    cur = name ? tracks.get(name) || null : null;
    step = 0;
    if (!cur) return true;
    const incomingFade = o.fadeIn === undefined ? fadeIn : o.fadeIn;
    bus = makeBus(cur.vol, now, incomingFade);
    ramp(bus.out.gain, EPS, cur.vol, now, incomingFade);
    ramp(bus.send.gain, EPS, 1, now, incomingFade);
    nextTime = now + 0.03;
    tick(now); // begin at once — no gap waiting for the driver's first wake
    return true;
  }

  /** Live intensity params. Merged, no track restart — steps read s.params. */

    stripCache.set(key, image);
  }
  ctx.putImageData(image, rect.x, rect.y);
}

const SECTION = {
  x: CUTAWAY.x + 1,
  y: CUTAWAY.y + SECTION_INSET.top,
  w: CUTAWAY.w - 2,
  h: CUTAWAY.h - SECTION_INSET.top - SECTION_INSET.bottom,
};

// The sheet, and its margins. r1 ran text to within 8px of the paper's edge on every side, which is
// part of what made the log read as output rather than as a document. A form has a margin.
const PAPER = { x: LEDGER.x + 1, y: LEDGER.y + 1, w: LEDGER.w - 2, h: LEDGER.h - 2 };
const M = { left: PAPER.x + 13, right: PAPER.x + PAPER.w - 13, top: PAPER.y + 12 };
const COLUMN_W = M.right - M.left;

// The sheet is divided by a double rule into two zones: the STATEMENT of the facility above and the
// AFTER-ACTION REPORT below.
//
// The report is the game (DESIGN-SEED §3: "the report's contents ARE next cycle's paperwork"), so
// the report's space is RESERVED and the statement is what gets trimmed. The statement draws its
// core rows, then the standing officer if one is in attendance, then as many of the optional rows
// as still fit above the reserved line. A statement that ran long used to push the report heading
// to the foot of the sheet with nothing under it, which is the wrong thing to lose.
const REPORT_RESERVE = 116;
const STATEMENT_FLOOR = PAPER.y + PAPER.h - REPORT_RESERVE;
const ZONE_SPLIT = PAPER.y + 168;

const DEPT_LABEL = {
  treasury: 'Treasury',
  records: 'Records',
  fabrication: 'Fabrication',
  holding: 'Holding',
  quarters: 'Quarters',
  commissary: 'Commissary',
  excavation: 'Excavation',
};

// ---- per-pixel caches --------------------------------------------------------------------------

let sectionCache = { sig: null, image: null };
let paperCache = { key: null, image: null };
// M7b: the desk is a composed material, not a fill, so the whole frame is one lit picture rather
// than two lit panels on a painted rectangle. It depends on nothing but its own geometry.
let deskCache = { key: null, image: null };
// Composed button faces, one per size and state. There are a handful of each for a whole session.
const buttonCache = new Map();
// The dimmed backdrop behind a document overlay, cached against the frame it was taken from: the
// darkening walks every pixel on screen, which is far too much work to repeat sixty times a second
// for a picture that is not moving. A document is laid on a still desk.
let dimCache = { key: null, image: null };

function deskSurface(ctx) {
  const key = `${SCREEN.w}x${SCREEN.h}`;
  if (deskCache.key !== key || !deskCache.image) {
    // The header strip carries the drawing's title and, during an incident, the replay label in
    // rust. Those are light letterforms on the desk itself, so the desk is held quiet under them.
    const composed = composeDesk(
      { x: 0, y: 0, w: SCREEN.w, h: SCREEN.h },
      { quiet: [{ x: CUTAWAY.x, y: CUTAWAY.y, w: CUTAWAY.w, h: HEADER_H + 1, max: 1 }] },
    );
    const image = ctx.createImageData(composed.w, composed.h);
    image.data.set(composed.data);
    deskCache = { key, image };
  }
  return deskCache.image;
}

// ---- type helpers --------------------------------------------------------------------------------

function text(ctx, str, x, y, color = C.sectionText, size = SIZE.body, face = FACE.body) {
  if (_textQ) {
    enqueueText({ s: str, x, y, color, size, face });
    return;
  }
  ctx.fillStyle = color;
  ctx.font = font(size, face);
  ctx.textBaseline = 'top';
  ctx.fillText(str, x, y);
}

// Right-align a value on a column edge. This is how a ledger sets figures, and it is what makes a
// column of numbers scannable even where the faces have proportional digits.
function textRight(ctx, str, rightX, y, color, size = SIZE.body, face = FACE.body) {
  ctx.font = font(size, face);
  const w = ctx.measureText(str).width;
  text(ctx, str, rightX - w, y, color, size, face);
}

// Centre a string on a column. Letterhead is set on the sheet's axis, not on its left margin, so
// the masthead and its subtitle both come through here. The x is floored to a whole pixel: the
// buffer is integer-scaled, and a glyph run starting on a half pixel is a blurred glyph run.
// Returns the measured width, because the rules drawn around a masthead have to know how wide it is.
function textCenter(ctx, str, centerX, y, color, size = SIZE.body, face = FACE.body) {
  ctx.font = font(size, face);
  const w = ctx.measureText(str).width;
  text(ctx, str, Math.floor(centerX - w / 2), y, color, size, face);
  return w;
}

function band(ctx, r, fill) {
  ctx.fillStyle = fill;
  ctx.fillRect(r.x, r.y, r.w, r.h);
}

function rule(ctx, x, y, w, color = C.inkRule, thickness = 1) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, thickness);
}

// A section heading on the sheet: printed slab type with a rule under it. Returns the new y.
function heading(ctx, label, y, left = M.left, width = COLUMN_W) {
  text(ctx, label, left, y, C.inkSecondary, SIZE.title, FACE.display);
  rule(ctx, left, y + SIZE.title + 3, width);
  return y + SIZE.title + LEAD.rule + 3;
}

// One ruled row: a label on the left, a figure right-aligned on the column edge, and leader dots
// joining them. The dots are what make it read as a ledger rather than a readout, and they are also
// a legibility aid, carrying the eye from a label to its own number, which is the LEGIBILITY LAW's
// whole concern.
function row(ctx, label, value, y, valueColor = C.inkBody, left = M.left, right = M.right) {
  text(ctx, label, left, y, C.inkBody, SIZE.body);
  ctx.font = font(SIZE.body, FACE.body);
  const labelW = ctx.measureText(label).width;
  const valueW = ctx.measureText(value).width;
  const gapStart = left + labelW + 5;
  const gapEnd = right - valueW - 5;
  ctx.fillStyle = C.paperShade;
  for (let x = gapStart; x < gapEnd; x += 4) ctx.fillRect(x, y + SIZE.body - 3, 1, 1);
  textRight(ctx, value, right, y, valueColor);
  return y + LEAD.row;
}

// Word-wrap a string into the given width, returning the new y. `maxY` is a hard floor: a line that
// would be drawn below it is not drawn at all, because a half-line cut off by the edge of the sheet
// is a number the player cannot read.
function wrap(ctx, str, x, y, maxW, color, size = SIZE.body, maxY = Infinity, face = FACE.body) {
  ctx.font = font(size, face);
  const words = String(str).split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? `${line} ${w}` : w;
    if (ctx.measureText(test).width > maxW && line) {
      if (y + size > maxY) return y;
      text(ctx, line, x, y, color, size, face);
      y += LEAD.tight;
      line = w;
      ctx.font = font(size, face);
    } else {
      line = test;
    }
  }
  if (line) {
    if (y + size > maxY) return y;
    text(ctx, line, x, y, color, size, face);
    y += LEAD.tight;
  }
  return y;
}

// Measure how many lines `wrap()` would draw without drawing them, so a scrollable report knows
// how far it can scroll.
function measureWrap(ctx, str, maxW, size = SIZE.body, face = FACE.body) {
  ctx.font = font(size, face);
  const words = String(str).split(' ');
  let line = '';
  let lines = 0;
  for (const w of words) {
    const test = line ? `${line} ${w}` : w;
    if (ctx.measureText(test).width > maxW && line) {
      lines += 1;
      line = w;
      ctx.font = font(size, face);
    } else {
      line = test;
    }
  }
  if (line) lines += 1;
  return lines * LEAD.tight;
}

// ---- the section -----------------------------------------------------------------------------------

function drawCutaway(ctx, view) {
  const f = view.facility;
  const geo = cutawayGeometry(f.dims, view.pan || { x: 0, y: 0 }, sectionFocus(f, view));

  const sig = sceneSignature(f, view, geo);
  if (sectionCache.sig !== sig) {
    const composed = composeSection(f, geo, SECTION, view);
    const image = ctx.createImageData(composed.w, composed.h);
    image.data.set(composed.data);
    sectionCache = { sig, image };
  }
  ctx.putImageData(sectionCache.image, SECTION.x, SECTION.y);

  // The header strip: what this drawing is, and what a click does to it. Clipped to the panel, so
  // no caption can ever run under the sheet beside it whatever the numbers in it grow to.
  const hdr = { x: CUTAWAY.x, y: CUTAWAY.y, w: CUTAWAY.w, h: HEADER_H };
  pushTextClip(hdr.x, hdr.y, hdr.w, hdr.h);
  ctx.save();
  ctx.beginPath();
  ctx.rect(hdr.x, hdr.y, hdr.w, hdr.h);
  ctx.clip();
  ctx.font = font(SIZE.title, FACE.display);
  if (view.overlay === 'raid' && view.replay) {
    const raid = f.lastRaid;
    text(ctx, 'INCIDENT REPLAY', CUTAWAY.x + 6, CUTAWAY.y + 2, C.rustBright, SIZE.title, FACE.display);
    const w = ctx.measureText('INCIDENT REPLAY').width;
    text(
      ctx,
      `cycle ${raid ? raid.cycle : f.cycle.number}, party of ${raid ? raid.party.size : '?'}`,
      CUTAWAY.x + 14 + w,
      CUTAWAY.y + 3,
      C.sectionLabel,
    );
  } else {
    text(ctx, 'FACILITY SECTION', CUTAWAY.x + 6, CUTAWAY.y + 2, C.sectionLabel, SIZE.title, FACE.display);
    const w = ctx.measureText('FACILITY SECTION').width;
    text(ctx, 'click rock to carve', CUTAWAY.x + 14 + w, CUTAWAY.y + 3, C.sectionLabel);
  }
  ctx.restore();
  popTextClip();

  // Annotations that change every frame sit on top of the composed picture, as lines on a drawing.
  pushTextClip(SECTION.x, SECTION.y, SECTION.w, SECTION.h);
  ctx.save();
  ctx.beginPath();
  ctx.rect(SECTION.x, SECTION.y, SECTION.w, SECTION.h);
  ctx.clip();

  const cell = geo.cell;
  for (const order of f.orders) {
    if (order.kind !== 'excavate') continue;
    if (order.status === 'done' || order.status === 'cancelled') continue;
    const px = geo.ox + order.target.x * cell;
    const py = geo.oy + order.target.y * cell;
    ctx.strokeStyle = C.brassBright;
    ctx.setLineDash([2, 2]);
    ctx.strokeRect(px + 1.5, py + 1.5, cell - 4, cell - 4);
    ctx.setLineDash([]);
  }

  if (view.hoverCell) {
    const hc = f.grid[view.hoverCell.y] && f.grid[view.hoverCell.y][view.hoverCell.x];
    const tool = view.tool || 'excavate';
    let legal = false;
    if (tool === 'excavate') legal = canExcavate(f, view.hoverCell.x, view.hoverCell.y);
    else if (tool === 'clear') legal = !!(hc && hc.roomType);
    else legal = !!(hc && hc.excavated && hc.claimed && hc.kind === 'floor');
    if (legal) {
      const px = geo.ox + view.hoverCell.x * cell;
      const py = geo.oy + view.hoverCell.y * cell;
      ctx.strokeStyle = RAMPS.bone[6];
      ctx.strokeRect(px + 0.5, py + 0.5, cell - 1, cell - 1);
    }
  }

  // The Cornerstone, with a pulse that rises as its condition falls (fold 4: the proximity read).
  const co = f.lossObject.cell;
  const cxp = geo.ox + co.x * cell + (cell - 1) / 2;
  const cyp = geo.oy + co.y * cell + (cell - 1) / 2;
  const stress = 1 - f.lossObject.condition / 100;
  const pulse = 3 + stress * 8 + (Math.sin(view.frame * 0.15) + 1) * (1.5 + stress * 5);
  ctx.strokeStyle = stress > 0.5 ? C.rustBright : C.cornerstone;
  ctx.beginPath();
  ctx.arc(cxp, cyp, pulse, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = C.cornerstone;
  ctx.fillRect(cxp - 2, cyp - 2, 4, 4);

  if (view.overlay === 'raid' && view.replay) {
    const steps = view.replay.steps;
    const cursor = Math.min(view.replay.cursor, steps.length - 1);
    for (let i = 0; i < cursor; i++) {
      const p = steps[i].pos;
      const px = geo.ox + p.x * cell + (cell - 1) / 2;
      const py = geo.oy + p.y * cell + (cell - 1) / 2;
      ctx.fillStyle = C.rustMark;
      ctx.fillRect(px - 1, py - 1, 2, 2);
    }
    const head = steps[cursor] && steps[cursor].pos;
    if (head) {
      const px = geo.ox + head.x * cell + (cell - 1) / 2;
      const py = geo.oy + head.y * cell + (cell - 1) / 2;
      const label = `strength ${steps[cursor].strength}`;
      ctx.font = font(SIZE.body, FACE.body);
      const lw = ctx.measureText(label).width;
      let lx = px + 12;
      let ly = py - 18;
      if (lx + lw > SECTION.x + SECTION.w) lx = px - 12 - lw;
      if (lx < SECTION.x) lx = SECTION.x;
      if (ly < SECTION.y) ly = SECTION.y;
      text(ctx, label, lx, ly, C.rustBright);
    }
  }
  ctx.restore();
  popTextClip();

  // The title block: the drawing's legend, in plain language (LEGIBILITY LAW).
  const tb = { x: CUTAWAY.x, y: CUTAWAY.y + CUTAWAY.h - TITLEBLOCK_H, w: CUTAWAY.w, h: TITLEBLOCK_H };
  // The block is printed on manila, inset a little from the panel edge so it reads as a panel stuck
  // to the drawing rather than as the drawing's own bottom edge.
  const plate = { x: tb.x + 3, y: tb.y + 2, w: tb.w - 6, h: tb.h - 4 };
  paperStrip(ctx, plate, 'titleblock');
  pushTextClip(plate.x, plate.y, plate.w, plate.h);
  ctx.save();
  ctx.beginPath();
  ctx.rect(plate.x, plate.y, plate.w, plate.h);
  ctx.clip();
  rule(ctx, plate.x + 6, plate.y + 15, plate.w - 12, C.inkRule);
  // The legend names the drawing's grammar and nothing else. The census of who is standing on the
  // floors moved to the ledger at r2: it is a figure, and figures belong on the sheet, not written
  // across the bottom of the drawing. Middots rather than full stops: this is a key, not a
  // sentence, and the dots separate the terms without pretending to be punctuation.
  text(ctx, 'LEGEND', plate.x + 6, plate.y + 3, C.inkBody, SIZE.title, FACE.display);
  ctx.font = font(SIZE.title, FACE.display);
  const legendW = ctx.measureText('LEGEND').width;
  text(ctx, 'hatch = rock  ·  bright edge = floor', plate.x + 12 + legendW, plate.y + 3, C.inkBody);
  text(ctx, 'outline = a department  ·  ring = the Cornerstone', plate.x + 6, plate.y + 19, C.inkBody);
  ctx.restore();
  popTextClip();
}

// ---- the ledger, as a document ------------------------------------------------------------------

function drawLedger(ctx, view) {
  const f = view.facility;
  band(ctx, LEDGER, C.paperEdge);
  const key = `${PAPER.w}x${PAPER.h}:${f.seed}`;
  if (paperCache.key !== key || !paperCache.image) {
    const paper = composePaper(PAPER, f.seed);
    const image = ctx.createImageData(paper.w, paper.h);
    image.data.set(paper.data);
    paperCache = { key, image };
  }
  ctx.putImageData(paperCache.image, PAPER.x, PAPER.y);

  pushTextClip(PAPER.x, PAPER.y, PAPER.w, PAPER.h);
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAPER.x, PAPER.y, PAPER.w, PAPER.h);
  ctx.clip();

  // ---- the statement zone ----
  let y = M.top;
  text(ctx, 'LEDGER', M.left, y, C.inkBody, SIZE.title, FACE.display);
  textRight(ctx, `cycle ${f.cycle.number}, ${f.cycle.phase}`, M.right, y + 1, C.inkSecondary);
  y += SIZE.title + 5;
  rule(ctx, M.left, y, COLUMN_W, C.inkRule);
  rule(ctx, M.left, y + 2, COLUMN_W, C.inkRule);
  y += 10;

  const crew = activeStaff(f);
  const grieving = crew.filter((s) => s.status === 'grieving').length;
  const avgMorale = crew.length ? Math.round(crew.reduce((a, s) => a + s.morale, 0) / crew.length) : 0;
  const openTotal = Object.values(openPosts(f)).reduce((a, n) => a + n, 0);
  const fed = Math.min(crew.length, foodCapacity(f));
  const housed = Math.min(crew.length, housingCapacity(f));
  const overCap = crew.length > housingCapacity(f) || crew.length > foodCapacity(f);
  const backlog = countExcavated(f) - countClaimed(f);
  const held = f.captives ? f.captives.length : 0;
  const rooms = f.rooms || [];

  // The core of the statement: the figures a manager reads every single cycle.
  y = row(ctx, 'Treasury', `${f.treasury.gold} / ${f.treasury.capacity} g`, y, f.treasury.gold < 60 ? C.stampInk : C.inkBody);
  y = row(ctx, 'Defence', `${facilityDefense(f)}  (fortify ${f.fortify})`, y);
  y = row(ctx, 'Posts', `${crew.length} standing, ${grieving} grieving`, y, grieving > 0 ? C.stampInk : C.inkBody);
  y = row(ctx, 'Amenities', `housed ${housed}/${housingCapacity(f)}, fed ${fed}/${foodCapacity(f)}`, y, overCap ? C.stampInk : C.inkBody);
  y = row(ctx, 'Morale', `${avgMorale} / 100`, y, avgMorale < 30 ? C.stampInk : C.inkBody);
  y = row(ctx, 'Cornerstone', `${f.lossObject.condition} / 100`, y, f.lossObject.condition < 40 ? C.stampInk : C.inkBody);

  // The standing officer and his instrument, drawn BEFORE the optional rows because it is the
  // game's defining mechanic. A served notice is a thing attached to the sheet, so it gets its own
  // stamped block rather than a row.
  const served = f.notices.filter((n) => n.status === 'served');
  if (served.length || f.ladder.rung !== 'none') {
    y += 5;
    y = heading(ctx, 'STANDING', y);
    y = row(ctx, 'Officer', OFFICER[f.ladder.rung] || 'none in attendance', y, served.length ? C.stampInk : C.inkBody);
    for (const n of served) {
      y = row(ctx, INSTRUMENT_NAME[n.rung], `${n.cyclesRemaining} cycle(s) left`, y, C.stampInk);
      y = row(ctx, 'Answer administratively', `${CFG.ladder.answerCost[n.rung]} g  [A]`, y, C.stampInk);
    }
  }

  // The optional rows, drawn only while there is room above the reserved report zone. Each is a
  // figure the drawing already shows in some form, so losing one on a busy sheet costs the player
  // nothing they cannot read off the section or a hover.
  const placed = castPlacements(f, view);
  const onFloors = {
    staff: placed.filter((p) => p.role !== 'raider' && p.role !== 'officer').length,
    raiders: placed.filter((p) => p.role === 'raider').length,
    officers: placed.filter((p) => p.role === 'officer').length,
  };
  const optional = [];
  if (rooms.length) {
    const best = rooms.reduce((a, r) => (r.quality > a.quality ? r : a), rooms[0]);
    optional.push(['Departments', `${rooms.length}, best ${DEPT_LABEL[best.type] || best.type} ${best.quality.toFixed(2)}`, C.inkBody]);
  } else {
    optional.push(['Departments', 'none designated', C.inkSecondary]);
  }
  optional.push([
    'On the floors',
    `${onFloors.staff} staff, ${onFloors.raiders} raiders, ${onFloors.officers} officer`,
    onFloors.raiders > 0 ? C.stampInk : C.inkBody,
  ]);
  // KEEP #6 made legible: the manufactured works are their own row, because a door the facility
  // owns is a different fact from a fortification it bought, and the defence figure alone hides
  // both. The LEGIBILITY LAW asks that every number carry a plain-language label at the point of
  // reading; "Defence 39" does not say where 39 came from, and this row is half the answer.
  const works = f.works || [];
  if (works.length > 0) {
    optional.push(['Works installed', `${works.length}, defence +${worksDefense(f)}`, C.inkBody]);
  }
  if (openTotal > 0) optional.push(['Open posts', String(openTotal), C.inkBody]);
  if (backlog > 0) optional.push(['Claims backlog', `${backlog} cell(s)`, C.inkBody]);
  if (held > 0) optional.push(['Detention', `${held} / ${detentionCapacity(f)} held`, C.inkBody]);
  for (const [label, value, colour] of optional) {
    if (y + LEAD.row > STATEMENT_FLOOR) break;
    y = row(ctx, label, value, y, colour);
  }

  // ---- the report zone ----
  const reportTop = Math.min(Math.max(y + 8, ZONE_SPLIT), STATEMENT_FLOOR + 10);
  rule(ctx, M.left, reportTop - 9, COLUMN_W, C.inkRule);
  rule(ctx, M.left, reportTop - 7, COLUMN_W, C.inkRule);
  let ry = heading(ctx, 'AFTER-ACTION REPORT', reportTop);
  const floor = PAPER.y + PAPER.h - 10;
  const report = f.lastReport;
  if (!report) {
    text(ctx, 'No cycle has been signed over yet.', M.left, ry, C.inkSecondary);
  } else {
    // The report is scrollable: late-cycle reports can be long, and silently dropping their tail
    // lines is a defect (Release fix round B3). The heading stays fixed; only the lines scroll.
    const reportLinesTop = ry;
    const reportLinesH = floor - reportLinesTop;
    const contentH = report.lines.reduce((h, line) => {
      return (
        h +
        measureWrap(ctx, line.numeric, COLUMN_W) +
        measureWrap(ctx, line.text, COLUMN_W - 8) +
        (line.cause ? measureWrap(ctx, `cause: ${line.cause}`, COLUMN_W - 8) : 0) +
        5
      );
    }, 0);
    view.reportMaxScroll = Math.max(0, contentH - reportLinesH);
    view.reportScroll = Math.max(0, Math.min(view.reportScroll || 0, view.reportMaxScroll));

    pushTextClip(M.left - 2, reportLinesTop, COLUMN_W + 4, reportLinesH);
    ctx.save();
    ctx.beginPath();
    ctx.rect(M.left - 2, reportLinesTop, COLUMN_W + 4, reportLinesH);
    ctx.clip();
    ctx.translate(0, -view.reportScroll);

    for (const line of report.lines) {
      ry = wrap(ctx, line.numeric, M.left, ry, COLUMN_W, C.inkBody, SIZE.body, Infinity);
      ry = wrap(ctx, line.text, M.left + 8, ry, COLUMN_W - 8, C.inkSecondary, SIZE.body, Infinity);
      if (line.cause) ry = wrap(ctx, `cause: ${line.cause}`, M.left + 8, ry, COLUMN_W - 8, C.inkSecondary, SIZE.body, Infinity);
      ry += 5;
    }
    ctx.restore();
    popTextClip();
  }
  ctx.restore();
  popTextClip();
}

function drawButton(ctx, b) {
  // A pressed-fibre key, composed under the stack (grain, bevel, dither) rather than a filled rect
  // with a stroke around it. The field under the label stays on the step the palette names, so the
  // contrast figure Gate 5 measured for button text remains the contrast that is drawn.
  const key = `${b.w}x${b.h}:${b.enabled ? 1 : 0}`;
  let face = buttonCache.get(key);
  if (!face) {
    const composed = composeButton(b.w, b.h, { enabled: b.enabled });
    face = ctx.createImageData(composed.w, composed.h);
    face.data.set(composed.data);
    buttonCache.set(key, face);
  }
  ctx.putImageData(face, b.x, b.y);
  const label = b.key ? `${b.label}  [${b.key}]` : b.label;
  pushTextClip(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
  ctx.save();
  ctx.beginPath();
  ctx.rect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
  ctx.clip();
  text(ctx, label, b.x + 6, b.y + (b.h - SIZE.body) / 2 - 1, b.enabled ? C.buttonText : C.buttonTextOff);
  ctx.restore();
  popTextClip();
}

// describeCell(f, x, y) -> a plain-language label for a cell, at the point of reading (LEGIBILITY
// LAW): no sigil a first-session player would have to ask about goes unexplained, and that includes

function describeCell(f, x, y) {

// a bounds check at every call site and without ever selecting a colour outside the palette.
function step(rampName, i) {
  const ramp = RAMPS[rampName];
  if (!ramp) throw new Error(`palette: unknown ramp '${rampName}'`);
  const n = ramp.length;
  const k = i < 0 ? 0 : i > n - 1 ? n - 1 : Math.round(i);
  return ramp[k];
}

// rgb(hex) -> [r,g,b]. The software renderer writes bytes, not strings, so it resolves each ramp
// to bytes once at module load rather than parsing hex per pixel.
function rgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// RAMP_BYTES.<ramp> = Uint8Array of r,g,b triples, for the per-pixel renderer.
const RAMP_BYTES = Object.freeze(
  Object.fromEntries(
    Object.entries(RAMPS).map(([name, ramp]) => {
      const bytes = new Uint8Array(ramp.length * 3);
      ramp.forEach((hex, i) => {
        const [r, g, b] = rgb(hex);
        bytes[i * 3] = r;
        bytes[i * 3 + 1] = g;
        bytes[i * 3 + 2] = b;
      });
      return [name, bytes];
    }),
  ),
);

// The foreground/background pairs the renderer actually draws text in. Gate 5 measures contrast
// over THIS list, so the floor is asserted against real pairings rather than a guessed matrix.
//
// M7b: the desk stopped being a flat fill and became a composed material, which moved the ground
// under every caption drawn on it. A pairing list that still named `C.desk` would have been
// measuring a colour the renderer no longer draws behind text. The composed desk was measured
// (it reaches ink[2] over the frame, and is clamped to ink[1] under the header band precisely
// because the incident-replay label fell to 4.41:1 against ink[2]), and the pairings below name
// the LIGHTEST step each caption can actually land on, which is the worst case for light-on-dark.
const TEXT_PAIRS = Object.freeze([
  { name: 'section label on the cutaway', fg: C.sectionLabel, bg: C.sectionVoid },
  { name: 'section text on the cutaway', fg: C.sectionText, bg: C.sectionVoid },
  { name: 'ledger body ink on paper', fg: C.inkBody, bg: C.paperBase },
  { name: 'overlay running copy on paper', fg: C.inkCopy, bg: C.paperBase },
  { name: 'overlay running copy on the paper highlight', fg: C.inkCopy, bg: C.paperHigh },
  { name: 'overlay running copy on the paper shade', fg: C.inkCopy, bg: C.paperShade },
  { name: 'ledger secondary ink on paper', fg: C.inkSecondary, bg: C.paperBase },
  { name: 'ledger body ink on the paper highlight', fg: C.inkBody, bg: C.paperHigh },
  { name: 'ledger secondary ink on the paper highlight', fg: C.inkSecondary, bg: C.paperHigh },
  { name: 'ledger body ink on the paper shade', fg: C.inkBody, bg: C.paperShade },
  { name: 'stamp ink on paper', fg: C.stampInk, bg: C.paperBase },
  { name: 'stamp ink on the paper highlight', fg: C.stampInk, bg: C.paperHigh },
  { name: 'brass figures on paper', fg: RAMPS.brass[0], bg: C.paperBase },
  { name: 'button text on the button face', fg: C.buttonText, bg: C.buttonFace },
  // The composed button's bevel light is confined to its edges, so the field under the label stays
  // on the step the palette names. Measured: the enabled face reaches stone[1] in the label area
  // and no further, which is why this pairing is still the true one after the controls were
  // composed rather than filled.
  { name: 'button text on the lightest step of the composed button field', fg: C.buttonText, bg: RAMPS.stone[1] },
  { name: 'cornerstone label on the cutaway', fg: C.cornerstone, bg: C.sectionVoid },
  { name: 'damage label on the cutaway', fg: C.rustBright, bg: C.sectionVoid },
  { name: 'overlay text on the desk', fg: C.sectionText, bg: C.desk },
  // The composed desk, at the lightest step each caption can sit on.
  { name: 'section title on the composed desk header', fg: C.sectionLabel, bg: RAMPS.ink[1] },
  { name: 'incident-replay label on the composed desk header', fg: C.rustBright, bg: RAMPS.ink[1] },
  { name: 'light text on the lightest step of the composed desk', fg: C.sectionText, bg: RAMPS.ink[2] },
]);

exports.RAMPS = RAMPS;
exports.C = C;
exports.DEPT_RAMP = DEPT_RAMP;
exports.CAST_RAMP = CAST_RAMP;
exports.step = step;
exports.rgb = rgb;
exports.RAMP_BYTES = RAMP_BYTES;
exports.TEXT_PAIRS = TEXT_PAIRS;

};
require("boot");
})();
</script>
