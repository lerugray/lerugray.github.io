    tag: 'For the entering of findings at range. Nib is a consumable; replacements are billed.' },
  regulation_jerkin: { id: 'regulation_jerkin', name: 'Regulation Jerkin', slot: 'guard', mods: { def: 2, hp: 6 }, price: 22, minLeg: 0, tier: 1,
    tag: 'Padded to specification. Rated against ordinary deductions; not certified against jurisdictions.' },
  patrol_greaves: { id: 'patrol_greaves', name: 'Patrol Greaves', slot: 'guard', mods: { def: 1, spd: 2 }, price: 24, minLeg: 0, tier: 1,
    tag: 'Regulation leg-issue. Improves attendance; offers minimal cover.' },

  // ---- Tier 2 — requisitioned kit (mid-run) --------------------------------
  weighted_maul: { id: 'weighted_maul', name: 'Weighted Maul', slot: 'arm', mods: { atk: 6 }, price: 52, minLeg: 3, tier: 2,
    tag: 'Heavier issue for obstinate obstructions. The Office is not liable for over-application.' },
  sealed_seal: { id: 'sealed_seal', name: 'Sealed Signet', slot: 'arm', mods: { mag: 6 }, price: 52, minLeg: 3, tier: 2,
    tag: 'Impresses an injunction with force of instrument. To be returned on completion of the mandate.' },
  reinforced_tabard: { id: 'reinforced_tabard', name: 'Reinforced Tabard', slot: 'guard', mods: { def: 4, hp: 10 }, price: 58, minLeg: 3, tier: 2,
    tag: 'Reinforced to a higher schedule. Rated against contested crossings; inspect seams after each.' },

  // ---- Tier 3 — sealed stores (late-run, town-gated) -----------------------
  distraint_warhammer: { id: 'distraint_warhammer', name: 'Distraint Warhammer', slot: 'arm', mods: { atk: 10 }, price: 96, minLeg: 6, tier: 3,
    tag: 'Sealed stores. Seizes against the sturdiest party present. Handle bears a recall notice.' },
  notarial_scepter: { id: 'notarial_scepter', name: 'Notarial Scepter', slot: 'arm', mods: { mag: 10 }, price: 96, minLeg: 6, tier: 3,
    tag: 'Sealed stores. Binds at a distance. Warranty void if the instrument is described as magic.' },
  warden_plate: { id: 'warden_plate', name: 'Warden Plate', slot: 'guard', mods: { def: 7, hp: 16 }, price: 104, minLeg: 6, tier: 3,
    tag: 'Full standing protection. Heavy; attendance may suffer. Rated against jurisdictions, briefly.' },
};

// Stable id order (shops, inventory, and tests read from it).
const ITEM_IDS = Object.keys(ITEMS);

function getItem(id) {
  const it = ITEMS[id];
  if (!it) throw new Error('unknown item: ' + id);
  return it;
}

// itemsUnlockedBy: the ids a shop MAY stock at a given leg (minLeg gate — the
// no-early-power-spike curve). Stable order.
function itemsUnlockedBy(legIndex) {
  return ITEM_IDS.filter((id) => ITEMS[id].minLeg <= legIndex);
}

// applyMods: fold a set of equip-slot item ids into a base stat block, returning
// a NEW block. Missing slots contribute nothing. Used to derive a frame's live
// stats (job weighting + equipment overlay). Pure.
function applyMods(baseStats, equip) {
  const out = { ...baseStats };
  if (!equip) return out;
  for (const slot of SLOTS) {
    const id = equip[slot];
    if (!id) continue;
    const mods = getItem(id).mods;
    for (const k in mods) out[k] = (out[k] || 0) + mods[k];
  }
  return out;
}

// sellValue: what the quartermaster returns for a sold item (a fraction, floored).
function sellValue(id) {
  return Math.max(1, Math.floor(getItem(id).price * TUNING.shopSellFraction));
}

// modsLine: a compact, exact instrument string for an item's stat mods
// (e.g. "+6 atk"). Register law 6 — the numeric neighbour to the prose tag.
function modsLine(id) {
  const m = getItem(id).mods;
  return Object.keys(m).map((k) => `+${m[k]} ${k}`).join(' ');
}


// ===== src/party.js =====
// party.js — THE PARTY (DESIGN-SEED M2). Four frames the Office assigns to a
// road, each running a job (its fixed kit). Attrition is the core: HP and the
// expedition's supply reserve PERSIST across encounters and recover only at
// camps/towns, at cost. Pure + serializable (folds into the save envelope).
//
// A frame: { id, jobId, name, max (derived stat block), hp (current), alive }.
// A party: { frames: [...], supplies }.


// frameStats: a frame's LIVE stat block = the job's derived block (chassis ×
// weights × job-mastery overlay) with the equipment overlay folded in. Combat
// reads frame.max, so keeping max = frameStats(...) means both equipment (M4) and
// mastery (M5) flow into resolution with no change to the resolver. `masteryMult`
// defaults to 1 (a fresh ledger), preserving the M2 baseline. Pure.
function frameStats(jobId, equip, masteryMult = 1) {
  return applyMods(deriveStats(jobId, 1, masteryMult), equip);
}

// createFrame: a fresh frame at full HP for a job, no equipment issued. The
// mastery multiplier (from the certification ledger) is snapshotted onto the
// frame — fixed for the run — so mid-run swaps and restores read a stable value.
function createFrame(id, jobId, masteryMult = 1) {
  const job = getJob(jobId);
  const equip = { arm: null, guard: null };
  const max = frameStats(jobId, equip, masteryMult);
  return { id, jobId, name: job.name, masteryMult, equip, max, hp: max.hp, alive: true };
}

// createParty: the default (or a given) comp at full strength with full supplies.
// `gold` is the expedition ledger's cash: earned from combat + mandate discharge,
// spent at the quartermaster (M4). Starts empty — the road pays as it goes.
function createParty(jobIds = DEFAULT_PARTY, masteryByJob = {}) {
  const frames = jobIds.slice(0, TUNING.partySize).map((jid, i) => createFrame(i, jid, masteryByJob[jid] || 1));
  // The run holds the mastery snapshot fixed (fixed at swap time), so a mid-run
  // job change reads a stable multiplier for whatever job it swaps to.
  return { frames, supplies: TUNING.startSupplies, gold: 0, inventory: [], mastery: { ...masteryByJob } };
}

// earnGold / spendGold: the ledger's only two verbs. spendGold refuses (returns
// false, deducts nothing) if the reserve can't cover it — the caller surfaces it.
function earnGold(party, amount) {
  party.gold = (party.gold | 0) + Math.max(0, Math.round(amount));
  return party.gold;
}
function spendGold(party, amount) {
  const cost = Math.max(0, Math.round(amount));
  if ((party.gold | 0) < cost) return false;
  party.gold -= cost;
  return true;
}

// changeJob: swap a frame's job (camp verb — deck-neutral). Recomputes the max
// stat block; current HP carries over as a PROPORTION so a swap neither fully
// heals nor guts the frame. Returns the party (mutated).
function changeJob(party, frameIndex, newJobId) {
  const f = party.frames[frameIndex];
  if (!f) throw new Error('no frame at index ' + frameIndex);
  const frac = f.max.hp > 0 ? f.hp / f.max.hp : 1;
  f.jobId = newJobId;
  f.name = getJob(newJobId).name;
  f.masteryMult = (party.mastery && party.mastery[newJobId]) || 1; // the run's fixed snapshot
  f.max = frameStats(newJobId, f.equip, f.masteryMult); // keep the equipment overlay across a swap
  f.hp = f.alive ? Math.max(1, Math.round(f.max.hp * frac)) : 0;
  return party;
}

// equipItem: assign an inventory item to its slot on a frame (M4). Any item the
// frame already held in that slot returns to the loose inventory (a swap, never a
// loss). Recomputes max stats; current HP is kept absolute (equipping armour does
// not heal — a raised max must be earned by rest), clamped to the new max.
// Returns { ok, reason? }. Loud refusal, never silent.
function equipItem(party, frameIndex, itemId) {
  const f = party.frames[frameIndex];
  if (!f) return { ok: false, reason: 'no frame at index ' + frameIndex };
  const inv = party.inventory || (party.inventory = []);
  const invIdx = inv.indexOf(itemId);
  if (invIdx < 0) return { ok: false, reason: 'item not in inventory' };
  const slot = getItem(itemId).slot;
  const prev = f.equip[slot];
  inv.splice(invIdx, 1);
  if (prev) inv.push(prev); // the displaced item goes back to stores
  f.equip[slot] = itemId;
  f.max = frameStats(f.jobId, f.equip, f.masteryMult || 1);
  f.hp = f.alive ? Math.min(f.hp, f.max.hp) : 0;
  return { ok: true, slot, equipped: itemId, displaced: prev || null };
}

// unequipSlot: pull a frame's slot item back to the inventory (M4). No-op if the
// slot is empty. Recomputes max; HP is clamped down if the item carried max HP.
function unequipSlot(party, frameIndex, slot) {
  const f = party.frames[frameIndex];
  if (!f) return { ok: false, reason: 'no frame' };
  const id = f.equip[slot];
  if (!id) return { ok: false, reason: 'slot empty' };
  f.equip[slot] = null;
  (party.inventory || (party.inventory = [])).push(id);
  f.max = frameStats(f.jobId, f.equip, f.masteryMult || 1);
  f.hp = f.alive ? Math.min(f.hp, f.max.hp) : 0;
  return { ok: true, slot, removed: id };
}

// livingFrames / isWiped: party-status helpers (combat + the report use these).
function livingFrames(party) {
  return party.frames.filter((f) => f.alive && f.hp > 0);
}
function isWiped(party) {
  return livingFrames(party).length === 0;
}

// spendSupplies: deduct from the reserve, floored at zero. Returns amount spent.
function spendSupplies(party, amount) {
  const spent = Math.min(party.supplies, Math.max(0, amount));
  party.supplies -= spent;
  return spent;
}

// campRest: recover a fraction of each living frame's MISSING HP, paid for in
// supplies. No-op (returns false) if the reserve can't cover it — recovery is
// never free and never silent (the caller surfaces the result).
function campRest(party) {
  if (party.supplies < TUNING.campRecoverSupplyCost) return { rested: false, restored: 0, cost: 0 };
  const cost = spendSupplies(party, TUNING.campRecoverSupplyCost);
  let restored = 0;
  for (const f of party.frames) {
    if (!f.alive) continue;
    const missing = f.max.hp - f.hp;
    const heal = Math.round(missing * TUNING.campRecoverHpFrac);
    f.hp = Math.min(f.max.hp, f.hp + heal);
    restored += heal;
  }
  return { rested: true, restored, cost };
}

// applyDamage / applyHeal: HP mutation with death bookkeeping (combat uses these
// so death is recorded in exactly one place — action-legibility).
function applyDamage(frame, amount) {
  const dealt = Math.max(0, Math.round(amount));
  frame.hp = Math.max(0, frame.hp - dealt);
  if (frame.hp === 0) frame.alive = false;
  return dealt;
}
function applyHeal(frame, amount) {
  if (!frame.alive) return 0;
  const before = frame.hp;
  frame.hp = Math.min(frame.max.hp, frame.hp + Math.max(0, Math.round(amount)));
  return frame.hp - before;
}

// ---- Serialization (folds into the save envelope at M2 inc2/inc3) -----------
function serializeParty(party) {
  return {
    supplies: party.supplies,
    gold: party.gold | 0,
    inventory: (party.inventory || []).slice(),
    mastery: { ...(party.mastery || {}) },
    frames: party.frames.map((f) => ({
      id: f.id, jobId: f.jobId, hp: f.hp, alive: f.alive,
      equip: { arm: f.equip.arm || null, guard: f.equip.guard || null },
    })),
  };
}
function restoreParty(snap) {
  const mastery = snap.mastery || {};
  const frames = snap.frames.map((s) => {
    const mm = mastery[s.jobId] || 1;
    const f = createFrame(s.id, s.jobId, mm);
    if (s.equip) { for (const slot of SLOTS) f.equip[slot] = s.equip[slot] || null; }
    f.max = frameStats(f.jobId, f.equip, mm);
    f.hp = s.hp | 0;
    f.alive = !!s.alive && f.hp > 0;
    return f;
  });
  return { frames, supplies: snap.supplies | 0, gold: snap.gold | 0, inventory: (snap.inventory || []).slice(), mastery: { ...mastery } };
}


// ===== src/deck.js =====
// deck.js — THE TAROT DECK (DESIGN-SEED M3). The run-scoped build agency: a thin,
// drafted deck of major-arcana cards played into automated combat as interventions
// and read as omens on the road. Deck-neutral vs jobs (axis orthogonality). Cards
// are drawn/shuffled on the `shuffle` RNG stream so combat resolution (the
// `combat` stream) is never perturbed by a card play, and vice-versa.
//
// Cards keep their tarot NAMES (the omen fiction is diegetic); the EFFECT text is
// deadpan administrative per the register laws. Pure + serializable.
//
// A card: { id, name, arcana (art key), kind, power, target, text }
//   kind:   'strike' (damage a foe) | 'smite' (heavy, sturdiest foe) |
//           'execute' (finish the weakest foe) | 'mend' (heal an ally) |
//           'salve' (heal the whole party) | 'rally' (raise a frame's ATK, fight) |
//           'ordinance' (raise the party's ATK, fight) | 'ward' (raise party DEF) |
//           'stay' (suspend a foe's next action) | 'instrument' (draw more cards)
//   target: 'enemy' | 'weakest' | 'sturdiest' | 'ally' | 'allies' | 'self' | 'none'

const CARDS = {
  the_tower: { id: 'the_tower', name: 'The Tower', arcana: 'the_tower', kind: 'strike', power: 2.2, target: 'enemy', text: 'A structure is found noncompliant and reduced.' },
  strength: { id: 'strength', name: 'Strength', arcana: 'strength', kind: 'rally', power: 0.5, target: 'ally', text: 'An affidavit of vigour is entered for one frame.' },
  the_star: { id: 'the_star', name: 'The Star', arcana: 'the_star', kind: 'mend', power: 2.0, target: 'ally', text: 'Relief is granted to a frame, without explanation.' },
  temperance: { id: 'temperance', name: 'Temperance', arcana: 'temperance', kind: 'ward', power: 1.0, target: 'allies', text: 'Proportion is imposed on the proceedings.' },
  death: { id: 'death', name: 'Death', arcana: 'death', kind: 'execute', power: 0.35, target: 'weakest', text: 'The matter is closed with prejudice.' },
  the_sun: { id: 'the_sun', name: 'The Sun', arcana: 'the_sun', kind: 'salve', power: 1.1, target: 'allies', text: 'A general clemency is posted to the whole party.' },
  justice: { id: 'justice', name: 'Justice', arcana: 'justice', kind: 'smite', power: 2.0, target: 'sturdiest', text: 'Distribution is corrected against the sturdiest party.' },
  the_emperor: { id: 'the_emperor', name: 'The Emperor', arcana: 'emperor', kind: 'ordinance', power: 0.35, target: 'allies', text: 'An ordinance raises the whole party for the engagement.' },
  hanged_man: { id: 'hanged_man', name: 'The Hanged Man', arcana: 'hanged_man', kind: 'stay', power: 1, target: 'enemy', text: 'Proceedings against a party are suspended one turn.' },
  the_magician: { id: 'the_magician', name: 'The Magician', arcana: 'magician', kind: 'instrument', power: 2, target: 'none', text: 'An additional instrument is produced; draw two.' },
  the_moon: { id: 'the_moon', name: 'The Moon', arcana: 'the_moon', kind: 'strike', power: 1.6, target: 'weakest', text: 'An irregularity is noted and pressed.' },
  the_hermit: { id: 'the_hermit', name: 'The Hermit', arcana: 'the_hermit', kind: 'ward', power: 1.4, target: 'self', text: 'A frame withdraws to review the file, and is harder to reach.' },
};

// The card pool available to draft (all but the starter-only balance). Order is
// stable (draft offers + omens read from it).
const CARD_IDS = Object.keys(CARDS);

// The starting deck — thin and intentional (StS discipline). Routine fights are
// winnable with ZERO cards (M2 baseline); the deck bends elite/boss odds.
const STARTING_DECK = ['the_tower', 'the_star', 'strength', 'temperance', 'death'];

function getCard(id) {
  const c = CARDS[id];
  if (!c) throw new Error('unknown card: ' + id);
  return c;
}

// Fisher–Yates using a stream (deterministic). Returns a new array.
function shuffle(arr, stream) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = stream.int(i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// createDeck: a fresh run deck. `list` is the persistent card list; the draw pile
// starts as a shuffle of it, hand + discard empty.
function createDeck(list = STARTING_DECK, stream = null) {
  const full = list.slice();
  return {
    list: full,
    drawPile: stream ? shuffle(full, stream) : full.slice(),
    hand: [],
    discard: [],
  };
}

// drawOne: move one card draw->hand, reshuffling discard into draw if empty.
// Returns the drawn card id, or null if the deck is entirely empty.
function drawOne(deck, stream) {
  if (deck.drawPile.length === 0) {
    if (deck.discard.length === 0) return null;
    deck.drawPile = shuffle(deck.discard, stream);
    deck.discard = [];
  }
  const id = deck.drawPile.shift();
  deck.hand.push(id);
  return id;
}

// drawUp: draw up to n cards (or until the deck is dry). Returns drawn ids.
function drawUp(deck, n, stream) {
  const drawn = [];
  for (let i = 0; i < n; i++) { const id = drawOne(deck, stream); if (id == null) break; drawn.push(id); }
  return drawn;
}

// playFromHand: remove the card at handIndex, push to discard, return its id.
function playFromHand(deck, handIndex) {
  if (handIndex < 0 || handIndex >= deck.hand.length) return null;
  const id = deck.hand.splice(handIndex, 1)[0];
  deck.discard.push(id);
  return id;
}

// addCard / removeCard: run-persistent deck edits (draft adds; camp removes).
function addCard(deck, id) {
  getCard(id);
  deck.list.push(id);
  deck.discard.push(id); // enters the discard so it can be drawn next reshuffle
  return deck;
}
function removeCard(deck, id) {
  const drop = (arr) => { const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); };
  const i = deck.list.indexOf(id); if (i < 0) return false;
  deck.list.splice(i, 1); drop(deck.drawPile); drop(deck.hand); drop(deck.discard);
  return true;
}

// discardHand: sweep the hand into discard (between fights).
function discardHand(deck) {
  while (deck.hand.length) deck.discard.push(deck.hand.shift());
}

function serializeDeck(deck) {
  return { list: deck.list.slice(), drawPile: deck.drawPile.slice(), hand: deck.hand.slice(), discard: deck.discard.slice() };
}
function restoreDeck(snap) {
  if (!snap) return createDeck();
  return { list: snap.list.slice(), drawPile: snap.drawPile.slice(), hand: snap.hand.slice(), discard: snap.discard.slice() };
}


// ===== src/mandate.js =====
// mandate.js — THE MANDATE (DESIGN-SEED M4). The Office issues a mandate: a
// generated quest-chain with a terminus (a destination leg). The party marches
// the road toward it; completing the terminus leg DISCHARGES the mandate, pays
// its disbursement into the expedition ledger, and the Office issues the next.
// Runs therefore have a spine of mandates, not just an endless road.
//
// Side-clauses are optional conditions checked at discharge (frugality on
// encounters, provisioning on supplies) that disburse a small bonus. Every
// mandate carries a REWARD FLOOR (tuning) so discharging is never worse than
// standing still — the economy's forward-progress guarantee.
//
// Register (laws 1,2,4): a mandate reads as a decree/form. Objectives are
// clauses; completion is a discharge; the reward is a disbursement. Deadpan,
// numeric, never triumphant. Generated on the `mandate` RNG stream only, so it
// never perturbs terrain/encounter/combat determinism.
//
// Pure + serializable (folds into the save envelope). node-testable.


// In-register title fragments (bureaucratic, deadpan, original — clean-room).
// A title reads like a filed instrument: "Survey of the Toll Wood".
const MANDATE_SUBJECTS = [
  'Survey', 'Assessment', 'Conveyance', 'Inspection', 'Remittance',
  'Enclosure', 'Requisition', 'Adjustment', 'Perambulation', 'Distraint',
];
const MANDATE_OBJECTS = [
  'of the Toll Wood', 'of the Marker Stones', 'against the Fen',
  'of the Chalk Flat', 'of the Cutting', 'of Outstanding Tracts',
  'of the Lower Marches', 'of the Held Ground', 'of the Unassessed Verge',
];

// The two side-clause kinds. Each is a predicate over the discharge record
// (a snapshot of how the haul went), plus a plain instrument line.
const SIDE_KINDS = ['frugal', 'provisioned'];

// makeSideClauses: 1–2 distinct optional clauses for a mandate of the given span.
// Thresholds are derived from span + tuning so they scale with the haul.
function makeSideClauses(stream, span, startSupplies) {
  const n = stream.range(TUNING.mandateSideRange[0], TUNING.mandateSideRange[1]);
  const pool = SIDE_KINDS.slice();
  const out = [];
  for (let i = 0; i < n && pool.length; i++) {
    const kind = pool.splice(stream.int(pool.length), 1)[0];
    if (kind === 'frugal') {
      const threshold = Math.max(1, Math.round(span * TUNING.mandateFrugalPerLeg));
      out.push({
        id: 'frugal', kind, threshold, bonus: TUNING.mandateSideBonus,
        text: `Clause (frugality): the haul is to field no more than ${threshold} matters.`,
      });
    } else {
      const threshold = Math.round(startSupplies * TUNING.mandateProvisionFrac);
      out.push({
        id: 'provisioned', kind, threshold, bonus: TUNING.mandateSideBonus,
        text: `Clause (provisioning): the terminus is to be reached with supplies at or above ${threshold}.`,
      });
    }
  }
  return out;
}

// createMandate: issue one mandate from the mandate stream. `issuedAtLeg` is the
// leg the party stands on when the Office issues it; `issuedAtEncounters` is the
// cumulative encounter count at issue (used to measure a frugality clause over
// this haul only). `startSupplies` sizes the provisioning clause.
function createMandate(stream, index, issuedAtLeg, issuedAtEncounters, startSupplies = TUNING.startSupplies) {
  const [lo, hi] = TUNING.mandateLegSpan;
  const span = stream.range(lo, hi);
  const destinationLeg = issuedAtLeg + span;
  // Reference number: a deterministic file code, purely diegetic.
  const ref = String(stream.range(1000, 9999)) + '-' + String.fromCharCode(65 + stream.int(6));
  const subject = stream.pick(MANDATE_SUBJECTS);
  const object = stream.pick(MANDATE_OBJECTS);
  const rewardRaw = TUNING.mandateRewardBase + span * TUNING.mandateRewardPerLeg;
  const reward = Math.max(TUNING.mandateRewardFloor, rewardRaw);
  const side = makeSideClauses(stream, span, startSupplies);
  return {
    index: index | 0,
    ref,
    title: `${subject} ${object}`,
    subject, object,
    issuedAtLeg: issuedAtLeg | 0,
    issuedAtEncounters: issuedAtEncounters | 0,
    destinationLeg: destinationLeg | 0,
    span,
    reward,
    side,
    discharged: false,
  };
}

// legsRemaining: legs still to march before this mandate's terminus.
function legsRemaining(mandate, currentLeg) {
  return Math.max(0, mandate.destinationLeg - currentLeg);
}

// isTerminus: does completing `completedLeg` reach (or pass) the terminus?
function isTerminus(mandate, completedLeg) {
  return completedLeg >= mandate.destinationLeg;
}

// evaluateSideClause: is a clause satisfied by the discharge record? `record`:
//   { encounters (fielded on THIS haul), supplies (at arrival) }
function evaluateSideClause(clause, record) {
  if (clause.kind === 'frugal') return record.encounters <= clause.threshold;
  if (clause.kind === 'provisioned') return record.supplies >= clause.threshold;
  return false;
}

// dischargeReward: the disbursement for discharging `mandate` given the haul
// record. Base reward (floor-guaranteed) plus each met side-clause's bonus.
// Returns { gold, base, met: [ids], clauses: [{id, met, bonus}] }.
function dischargeReward(mandate, record) {
  let gold = mandate.reward;
  const met = [];
  const clauses = [];
  for (const c of mandate.side) {
    const ok = evaluateSideClause(c, record);
    clauses.push({ id: c.id, met: ok, bonus: c.bonus });
    if (ok) { gold += c.bonus; met.push(c.id); }
  }
  return { gold, base: mandate.reward, met, clauses };
}

// ---- Serialization (folds into the save envelope, v4) -----------------------
function serializeMandate(mandate) {
  if (!mandate) return null;
  return { ...mandate, side: mandate.side.map((c) => ({ ...c })) };
}
function restoreMandate(snap) {
  if (!snap) return null;
  return { ...snap, side: (snap.side || []).map((c) => ({ ...c })) };
}


// ===== src/save.js =====
// save.js — CONTINUOUS AUTOSAVE + resume (DESIGN-SEED M1: "the Office holds the
// file open"). The save envelope is plain JSON capturing the world seed, the
// player config, and exact mid-expedition engine state (RNG positions included),
// so a reload resumes byte-identically. Storage is abstracted so the core stays
// node-testable and file:// localStorage failures degrade LOUDLY, never silently.


const SAVE_KEY = 'office-of-the-road/save/v5';
const LEGACY_SAVE_KEYS = ['office-of-the-road/save/v4'];
const SAVE_VERSION = 5;
const RUN_OPEN = 'OPEN';
const RUN_CLOSED = 'CLOSED';
let runIdCounter = 0;

function jsonClone(value) {
  return value == null ? value : JSON.parse(JSON.stringify(value));
}

// A run id is created once when an expedition opens, then persisted in every
// snapshot. It is bookkeeping identity, not gameplay randomness.
function createRunId(seed = 0) {
  const cryptoApi = typeof globalThis !== 'undefined' && globalThis.crypto;
  if (cryptoApi && typeof cryptoApi.randomUUID === 'function') return cryptoApi.randomUUID();
  const time = Date.now().toString(36);
  const nonce = (++runIdCounter).toString(36);
  return `run-${(seed >>> 0).toString(16)}-${time}-${nonce}`;
}

// Combat contains a reference graph: resolver wrappers point at the canonical
// party/enemy entities and the initiative order points at those wrappers. JSON
// alone would duplicate those objects and silently break attrition after reload,
// so the graph is flattened to indices and explicitly rewired on restore.
function serializeCombat(combat) {
  if (!combat || !combat.st) return null;
  const out = {};
  for (const [key, value] of Object.entries(combat)) {
    if (key !== 'st' && key !== 'enemies' && key !== 'handRects' && key !== 'draftRects') out[key] = jsonClone(value);
  }
  const s = combat.st;
  const wrap = (w) => ({ temp: { ...(w.temp || {}) }, atkBuff: w.atkBuff | 0, defBuff: w.defBuff | 0, stunned: !!w.stunned });
  out.st = {
    enemies: jsonClone(s.enemies),
    partyW: s.partyW.map(wrap),
    enemyW: s.enemyW.map(wrap),
    order: s.order.map((w) => ({ side: w.side, idx: w.idx })),
    round: s.round | 0,
    ptr: s.ptr | 0,
    done: !!s.done,
    victory: !!s.victory,
    stalemate: !!s.stalemate,
    log: jsonClone(s.log || []),
  };
  return out;
}

function restoreCombat(snap, party) {
  if (!snap || !snap.st || !party) return null;
  const enemies = jsonClone(snap.st.enemies || []);
  const rebuild = (side, entities, wraps) => entities.map((e, idx) => {
    const w = (wraps && wraps[idx]) || {};
    return { side, e, idx, temp: { ...(w.temp || { def: 0 }) }, atkBuff: w.atkBuff | 0, defBuff: w.defBuff | 0, stunned: !!w.stunned };
  });
  const partyW = rebuild('party', party.frames, snap.st.partyW);
  const enemyW = rebuild('enemy', enemies, snap.st.enemyW);
  const byRef = (ref) => (ref.side === 'party' ? partyW : enemyW)[ref.idx];
  const st = {
    party,
    enemies,
    partyW,
    enemyW,
    order: (snap.st.order || []).map(byRef).filter(Boolean),
    round: snap.st.round | 0,
    ptr: snap.st.ptr | 0,
    done: !!snap.st.done,
    victory: !!snap.st.victory,
    stalemate: !!snap.st.stalemate,
    log: jsonClone(snap.st.log || []),
  };
  const out = {};
  for (const [key, value] of Object.entries(snap)) if (key !== 'st') out[key] = jsonClone(value);
  out.st = st;
  out.enemies = enemies;
  return out;
}

function serializeLiveUi(ui) {
  if (!ui) return null;
  const keys = ['screen', 'paused', 'focus', 'ticker', 'combat', 'camp', 'shop', 'route',
    'noProgress', 'omen', 'mandateNotice', 'report', 'muted', 'escLevel'];
  const out = {};
  for (const key of keys) {
    if (ui[key] === undefined) continue;
    out[key] = key === 'combat' ? serializeCombat(ui.combat) : jsonClone(ui[key]);
  }
  return out;
}

function restoreLiveUi(snap, party) {
  if (!snap) return null;
  const out = jsonClone(snap);
  out.combat = restoreCombat(snap.combat, party);
  out.holdPause = false;
  out.hover = -1;
  return out;
}

// makeSave: the full save envelope from live config + march + party + deck +
// mandate (plain JSON). Party/deck/mandate are optional; the caller supplies
// defaults when a field is absent (forward/backward tolerant within a version).
function makeSave(config, march, party, deck, mandate, runMastery, live = {}) {
  return {
    v: SAVE_VERSION,
    status: RUN_OPEN,
    runId: live.runId || `probe-${config.seed >>> 0}`,
    savedAtTick: march.tick,
    config: { seed: config.seed >>> 0, speedIndex: config.speedIndex | 0 },
    march: serializeMarch(march),
    party: party ? serializeParty(party) : null,
    deck: deck ? serializeDeck(deck) : null,
    mandate: mandate ? serializeMandate(mandate) : null,
    // unbanked job-mastery earned this run (M5) — kept so a mid-run quit/resume
    // doesn't lose certification progress before it's banked at run-end.
    runMastery: runMastery ? { ...runMastery } : null,
    ledger: live.ledger ? jsonClone(live.ledger) : null,
    progressTrk: live.progressTrk ? jsonClone(live.progressTrk) : null,
    ui: serializeLiveUi(live.ui),
  };
}

function makeClosedSave(runId, cause, closedAtTick) {
  return { v: SAVE_VERSION, status: RUN_CLOSED, runId, cause, closedAtTick: closedAtTick | 0 };
}

function parseSaveRecord(raw) {
  if (!raw) return null;
  let obj;
  try { obj = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { return null; }
  if (!obj || obj.v !== SAVE_VERSION || typeof obj.runId !== 'string' || !obj.runId) return null;
  if (obj.status === RUN_CLOSED) return obj;
  if (obj.status !== RUN_OPEN || !obj.march || !obj.config) return null;
  if (typeof obj.march.seed !== 'number' || !obj.march.streams) return null;
  return obj;
}

// parseSave: validate + parse a raw save string. Returns the envelope or null
// (never throws) so a corrupt save can be reported loudly and discarded.
function parseSave(raw) {
  const obj = parseSaveRecord(raw);
  return obj && obj.status === RUN_OPEN ? obj : null;
}

// applySave: reconstruct live { config, march, party } from a validated envelope.
// Party may be null on an early save; the caller supplies a default in that case.
function applySave(save) {
  const party = save.party ? restoreParty(save.party) : null;
  return {
    runId: save.runId,
    config: { seed: save.config.seed >>> 0, speedIndex: save.config.speedIndex | 0 },
    march: restoreMarch(save.march),
    party,
    deck: save.deck ? restoreDeck(save.deck) : null,
    mandate: save.mandate ? restoreMandate(save.mandate) : null,
    runMastery: save.runMastery ? { ...save.runMastery } : null,
    ledger: save.ledger ? jsonClone(save.ledger) : null,
    progressTrk: save.progressTrk ? jsonClone(save.progressTrk) : null,
    ui: restoreLiveUi(save.ui, party),
  };
}

// Development v4 saves lack the live state needed for an honest exact resume.
// Remove only the explicitly-known old keys; unrelated storage is untouched.
function invalidateLegacySaves(storage) {
  const invalidated = [];
  for (const key of LEGACY_SAVE_KEYS) {
    if (storage.read(key) != null) { storage.clear(key); invalidated.push(key); }
  }
  return invalidated;
}

// createStorage: a guarded localStorage wrapper. `available` is false (loudly)
// when the platform denies storage (some file:// contexts); callers fall back to
// in-memory so play never breaks — it just won't persist across reloads.
function createStorage(win) {
  let backend = null;
  try {
    if (win && win.localStorage) {
      const probe = '__oor_probe__';
      win.localStorage.setItem(probe, '1');
      win.localStorage.removeItem(probe);
      backend = win.localStorage;
    }
  } catch {
    backend = null;
  }
  const mem = new Map();
  const available = backend != null;
  return {
    available,
    read(key) {
      try {
        return available ? backend.getItem(key) : (mem.has(key) ? mem.get(key) : null);
      } catch {
        return mem.has(key) ? mem.get(key) : null;
      }
    },
    write(key, val) {
      try {
        if (available) backend.setItem(key, val); else mem.set(key, val);
        return true;
      } catch {
        mem.set(key, val); // last-ditch in-memory so the write never throws
        return false;
      }
    },
    clear(key) {
      try { if (available) backend.removeItem(key); } catch { /* ignore */ }
      mem.delete(key);
    },
  };
}

// determinismProbe: the save-round-trip guarantee (DESIGN-SEED M1). March
// `primeTicks`, snapshot through the FULL save envelope (stringify+parse+apply),
// then run `probeTicks` on both the live and the reloaded state and compare every
// event. Returns { ok, primeTicks, probeTicks, firstDiff }. Pure — no storage.
function determinismProbe(seed, primeTicks = 137, probeTicks = TUNING.determinismProbeTicks) {
  const march = createMarch(seed);
  for (let i = 0; i < primeTicks; i++) step(march);

  // Snapshot through the FULL save envelope: live state -> JSON string -> parse
  // -> apply. This exercises exactly what a real quit/reload does.
  const config = { seed, speedIndex: TUNING.defaultSpeedIndex };
  const envelope = parseSave(JSON.stringify(makeSave(config, march)));
  const reloaded = applySave(envelope).march;

  for (let i = 0; i < probeTicks; i++) {
    const a = step(march);
    const b = step(reloaded);
    if (JSON.stringify(a) !== JSON.stringify(b) ||
        march.tick !== reloaded.tick ||
        march.totalPaces !== reloaded.totalPaces) {
      return { ok: false, primeTicks, probeTicks, firstDiff: i };
    }
  }
  return { ok: true, primeTicks, probeTicks, firstDiff: -1 };
}


// ===== src/meta.js =====
// meta.js — THE CERTIFICATION LEDGER (DESIGN-SEED M5). The roguelite's persistent
// spine: what survives an expedition's death. Job MASTERY is the certification
// currency — jobs level ACROSS runs (fixed at swap time within a run), so a
// player's configuration compounds run-over-run even as expeditions end.
//
// This is stored SEPARATELY from the per-run save (a distinct key): the run save
// is the open file the Office holds; the certification ledger is the permanent
// record the Office keeps regardless of any one expedition's outcome.
//
// Mastery is earned by FIELDING a job in won fights (accrued per-run, banked when
// the expedition ends — death now, the abandon valve later), and each level adds
// a small multiplier to that job's whole stat block. Level 0 → ×1 exactly, so a
// fresh ledger leaves the M2 baseline untouched. Pure + serializable; node-testable.


const META_KEY = 'office-of-the-road/certifications/v1';
const META_VERSION = 1;

// createMeta: a fresh certification ledger (no mastery on file).
function createMeta() {
  return { v: META_VERSION, mastery: {}, runs: 0, deepestLeg: 0, history: [], closedRuns: {} };
}

// The rolling run-history the Office keeps (roguelite table-stakes, M8). Newest
// first, capped — a returned docket / notice shows the recent record.
const HISTORY_CAP = 8;
function recordHistory(meta, entry) {
  if (!meta.history) meta.history = [];
  meta.history.unshift({
    run: meta.runs | 0,
    leg: entry.leg | 0,
    cause: entry.cause || 'reduced',
    gold: entry.gold | 0,
  });
  if (meta.history.length > HISTORY_CAP) meta.history.length = HISTORY_CAP;
  return meta.history;
}

// masteryXp / masteryLevel / masteryMult: read the ledger for one job.
function masteryXp(meta, jobId) {
  return (meta && meta.mastery && meta.mastery[jobId]) | 0;
}
function masteryLevel(meta, jobId) {
  return Math.min(TUNING.masteryLevelCap, Math.floor(masteryXp(meta, jobId) / TUNING.masteryXpPerLevel));
}
function masteryMult(meta, jobId) {
  return 1 + masteryLevel(meta, jobId) * TUNING.masteryStatPerLevel;
}

// masteryMultByJob: the snapshot a run takes at creation — a multiplier for EVERY
// job (so mid-run job swaps read a fixed value). Pure; the run holds this fixed.
function masteryMultByJob(meta) {
  const out = {};
  for (const jid of JOB_IDS) out[jid] = masteryMult(meta, jid);
  return out;
}

// A fresh per-run mastery tally (jobId -> xp earned this expedition).
function createRunMastery() {
  return {};
}

// earnMastery: credit a job for surviving/winning a fight of the given tier.
function earnMastery(runMastery, jobId, tier) {
  runMastery[jobId] = (runMastery[jobId] | 0) + (TUNING.masteryXpPerWin[tier] || 0);
  return runMastery;
}

// bankRun: fold a completed run's mastery tally into the permanent ledger. `frac`
// (default 1) scales the credit — the abandon valve (M5 inc4) banks a reduced
// share. Returns a per-job gain report { xp, before, after, leveled } for the
// certification-gain surface. Also records the run count + deepest leg reached.
function bankRun(meta, runMastery, deepestLeg = 0, frac = 1) {
  const gains = {};
  for (const jid in runMastery) {
    const credit = Math.round((runMastery[jid] | 0) * frac);
    if (credit <= 0) continue;
    const before = masteryLevel(meta, jid);
    meta.mastery[jid] = masteryXp(meta, jid) + credit;
    const after = masteryLevel(meta, jid);
    gains[jid] = { xp: credit, before, after, leveled: after > before };
  }
  meta.runs = (meta.runs | 0) + 1;
  meta.deepestLeg = Math.max(meta.deepestLeg | 0, deepestLeg | 0);
  return gains;
}

// bankRunOnce: terminal-path integrity. The permanent ledger is authoritative
// about which run ids have already closed, so even a stale OPEN snapshot left by
// an interrupted pair of localStorage writes can never bank twice.
function bankRunOnce(meta, runId, runMastery, deepestLeg = 0, frac = 1, cause = 'closed') {
  if (!runId) throw new Error('cannot bank a run without an id');
  if (!meta.closedRuns) meta.closedRuns = {};
  if (meta.closedRuns[runId]) return { banked: false, gains: {}, receipt: { ...meta.closedRuns[runId] } };
  const gains = bankRun(meta, runMastery, deepestLeg, frac);
  const receipt = { cause, deepestLeg: deepestLeg | 0, fraction: frac, run: meta.runs | 0 };
  meta.closedRuns[runId] = receipt;
  return { banked: true, gains, receipt: { ...receipt } };
}

function isRunClosed(meta, runId) {
  return !!(meta && meta.closedRuns && runId && meta.closedRuns[runId]);
}

// ---- Serialization (a plain-JSON ledger; its own storage key) ---------------
function serializeMeta(meta) {
  const closedRuns = {};
  for (const [id, receipt] of Object.entries(meta.closedRuns || {})) closedRuns[id] = { ...receipt };
  return { v: META_VERSION, mastery: { ...meta.mastery }, runs: meta.runs | 0, deepestLeg: meta.deepestLeg | 0, history: (meta.history || []).slice(0, HISTORY_CAP).map((h) => ({ ...h })), closedRuns };
}
// parseMeta: validate a raw stored ledger; returns a fresh one on anything
// unreadable (a corrupt ledger is never fatal — the certifications simply reset,
// surfaced by the caller rather than crashing the boot).
function parseMeta(raw) {
  if (!raw) return createMeta();
  let obj;
  try { obj = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { return createMeta(); }
  if (!obj || obj.v !== META_VERSION || typeof obj.mastery !== 'object' || !obj.mastery) return createMeta();
  const closedRuns = {};
  if (obj.closedRuns && typeof obj.closedRuns === 'object') {
    for (const [id, receipt] of Object.entries(obj.closedRuns)) if (id && receipt && typeof receipt === 'object') closedRuns[id] = { ...receipt };
  }
  return { v: META_VERSION, mastery: { ...obj.mastery }, runs: obj.runs | 0, deepestLeg: obj.deepestLeg | 0, history: Array.isArray(obj.history) ? obj.history.slice(0, HISTORY_CAP).map((h) => ({ ...h })) : [], closedRuns };
}


// ===== src/run.js =====
// run.js — terminal expedition transaction. A close is identified by the open
// run's stable id, banked into the permanent ledger at most once, and replaced by
// a non-resumable CLOSED record. The meta receipt is written first: if execution
// is interrupted before the CLOSED marker write, boot rejects the stale OPEN save
// by consulting that same receipt.


function closeExpedition({ storage, meta, runId, runMastery, deepestLeg = 0, closedAtTick = 0, frac = 1, cause = 'closed', gold = 0 }) {
  const result = bankRunOnce(meta, runId, runMastery || {}, deepestLeg, frac, cause);
  if (result.banked) recordHistory(meta, { leg: deepestLeg, cause, gold });

  // localStorage has no cross-key transaction. Persisting the idempotency receipt
  // first gives the only crash-safe ordering: a stale open save is non-resumable,
  // and retrying closure observes the receipt rather than banking again.
  const metaOk = storage.write(META_KEY, JSON.stringify(serializeMeta(meta)));
  const closed = makeClosedSave(runId, cause, closedAtTick);
  const saveOk = storage.write(SAVE_KEY, JSON.stringify(closed));
  return { ...result, metaOk, saveOk, closed };
}


// ===== src/report.js =====
// report.js — THE FILED REPORT (DESIGN-SEED M5). Death files a report, and the
// report is CAUSAL, not a stat dump: an incident ledger that traces the chain
// leg-chosen → matter-fielded → coverage-gap → unplayed-decisive-window →
// deduction, each line tied to the decision that produced it, plus ONE line
// crediting what the desk did that worked.
//
// The engine/UI records raw incidents as they happen (recordRoute, recordMatter,
// recordMissedWindow, recordReduction, recordCredit); `composeReport` selects and
// phrases the causal spine at death. Register laws 4 & 5 are enforced here:
// PASSIVE voice for suffering ("the frame was reduced"), ACTIVE voice for the
// desk's own acts ("the desk mended the line"); nothing is narrated as triumph.
//
// Pure data + pure phrasing. No DOM. node-testable.

// createLedger: a fresh incident ledger for one expedition.
function createLedger() {
  return { incidents: [], routeByLeg: {}, matterByLeg: {}, credit: null };
}

// recordRoute: the leg-routing decision (the head of every causal chain).
function recordRoute(L, leg, branch) {
  L.routeByLeg[leg] = { id: branch.id, label: branch.label, safety: branch.safety, enc: branch.encounterMult };
  L.incidents.push({ leg, kind: 'route', label: branch.label, safety: branch.safety, enc: branch.encounterMult });
}

// recordMatter: an encounter fielded on a leg (tallied to its routing).
function recordMatter(L, leg, tier) {
  L.matterByLeg[leg] = (L.matterByLeg[leg] | 0) + 1;
  L.incidents.push({ leg, kind: 'matter', tier });
}

// recordMissedWindow: a decisive intervention sat unplayed in the hand as a frame
// was reduced — the coverage gap, traced to the unplayed card.
function recordMissedWindow(L, leg, tier, card, frame) {
  L.incidents.push({ leg, kind: 'window', tier, card, frame });
}

// recordReduction: a frame was reduced (passive-voice suffering).
function recordReduction(L, leg, tier, frame) {
  L.incidents.push({ leg, kind: 'reduction', tier, frame });
}

// recordCredit: the desk did something that worked; keep the single weightiest one
// (active-voice bureaucracy). `weight` ranks competing credits.
function recordCredit(L, text, weight) {
  if (!L.credit || weight > L.credit.weight) L.credit = { text, weight };
}

// composeReport: the causal incident ledger at death. `ctx` = { leg, cause, tier,
// supplies, gold }. Returns { lines: [{ text, tone }], hasCause }. `tone`:
// 'cause' (a decision), 'suffer' (passive deduction), 'credit' (the desk's win).
function composeReport(L, ctx) {
  const lines = [];
  const fatalLeg = ctx.leg | 0;

  // 1) The decision at the head of the fatal chain: how the fatal leg was routed.
  const route = L.routeByLeg[fatalLeg];
  const matters = L.matterByLeg[fatalLeg] | 0;
  if (route) {
    lines.push({ tone: 'cause', text: `Leg ${fatalLeg} was routed via ${route.label} [${route.safety}]. Matters ×${route.enc}; ${matters} fielded.` });
  } else {
    lines.push({ tone: 'cause', text: `Leg ${fatalLeg} was marched unrouted; ${matters} matters fielded.` });
  }

  // 2) The coverage gaps: decisive windows that went unplayed as frames fell.
  const windows = L.incidents.filter((e) => e.kind === 'window').slice(-3);
  for (const w of windows) {
    lines.push({ tone: 'suffer', text: `A decisive ${w.card} went unplayed; ${w.frame} was reduced on a ${w.tier} matter.` });
  }

  // 3) The close itself. A reduction is a deduction the chain produced (passive);
  // an abandonment is a filing the desk chose (active) — the register splits them.
  if (ctx.cause === 'abandoned') {
    lines.push({ tone: 'cause', text: `The desk filed for early return. Supplies stood at ${ctx.supplies | 0}; the ledger stood at ${ctx.gold | 0} in coin.` });
  } else {
    const lastRed = [...L.incidents].reverse().find((e) => e.kind === 'reduction');
    const tier = ctx.tier || (lastRed && lastRed.tier) || 'routine';
    lines.push({ tone: 'suffer', text: `The unit was reduced in full on a ${tier} matter. Supplies stood at ${ctx.supplies | 0}; the ledger stood at ${ctx.gold | 0} in coin.` });
  }

  // 4) One credit line — what the desk did that worked (active voice).
  if (L.credit) lines.push({ tone: 'credit', text: `To the desk's credit: ${L.credit.text}` });
  else lines.push({ tone: 'credit', text: `To the desk's credit: the expedition was routed to leg ${fatalLeg} before the file closed.` });

  return { lines, hasCause: !!route || windows.length > 0 };
}


// ===== src/certifications.js =====
// certifications.js — THE CERTIFICATION WALL (DESIGN-SEED M5). The meta-unlocks
// the roguelite fills over many expeditions, and the escalation curve that makes
// runs get deeper as it fills. Certifications are gated on the permanent ledger
// (total mastery); each grants a starting advantage (a requisition, a deck slot).
// Escalation is set by the deepest leg ever reached — the world only deepens once
// you have proven you can go there.
//
// Register: certifications read as CLEARANCES the Office grants; escalation as the
// jurisdiction the file has advanced into. Deadpan, numeric. A fresh ledger clears
// nothing and escalates to level 0 (×1), so the M2 baseline stays exact.
//
// Pure (reads a meta ledger); node-testable.


// totalMastery: the ledger's whole certification weight (sum of all job XP).
function totalMastery(meta) {
  let t = 0;
  for (const jid in (meta && meta.mastery) || {}) t += meta.mastery[jid] | 0;
  return t;
}

// The wall, in order. Each cert gates on total mastery and grants a `start`
// bonus applied when a new expedition opens: { gold?, supplies?, deck?:[cardIds] }.
const CERTIFICATIONS = [
  { id: 'provisional_credit', name: 'Provisional Credit', req: 10,
    desc: 'Expeditions depart with a credit advanced to the ledger.', start: { gold: 40 } },
  { id: 'expanded_file', name: 'Expanded File', req: 25,
    desc: 'A further instrument is added to the standing deck.', start: { deck: ['the_sun'] } },
  { id: 'standing_requisition', name: 'Standing Requisition', req: 55,
    desc: 'Departure is provisioned: additional supplies and credit.', start: { gold: 40, supplies: 16 } },
  { id: 'seasoned_file', name: 'Seasoned File', req: 100,
    desc: 'A seasoned file departs the better equipped.', start: { gold: 60, deck: ['temperance'] } },
];

// certificationState: the wall as { id, name, desc, req, earned } — for the UI and
// for detecting NEW clearances after a run banks mastery.
function certificationState(meta) {
  const t = totalMastery(meta);
  return CERTIFICATIONS.map((c) => ({ id: c.id, name: c.name, desc: c.desc, req: c.req, earned: t >= c.req }));
}

// earnedCertifications: just the unlocked cert ids at the ledger's current weight.
function earnedCertifications(meta) {
  const t = totalMastery(meta);
  return CERTIFICATIONS.filter((c) => t >= c.req).map((c) => c.id);
}

// newlyEarned: cert ids unlocked crossing from `beforeXp` to `afterXp` — the
// "NEW CLEARANCE" the defeat surface announces after banking a run.
function newlyEarned(beforeXp, afterXp) {
  return CERTIFICATIONS.filter((c) => beforeXp < c.req && afterXp >= c.req).map((c) => ({ id: c.id, name: c.name, desc: c.desc }));
}

// startingBonuses: aggregate every earned cert's start bonus into one bundle
// applied at expedition open. Deterministic from the ledger.
function startingBonuses(meta) {
  const out = { gold: 0, supplies: 0, deck: [] };
  const earned = new Set(earnedCertifications(meta));
  for (const c of CERTIFICATIONS) {
    if (!earned.has(c.id) || !c.start) continue;
    out.gold += c.start.gold || 0;
    out.supplies += c.start.supplies || 0;
    if (c.start.deck) out.deck.push(...c.start.deck);
  }
  return out;
}

// escalationLevel: how deep the world runs THIS expedition — set by the deepest
// leg ever reached, capped. Level 0 for a fresh ledger.
function escalationLevel(meta) {
  const deepest = (meta && meta.deepestLeg) | 0;
  return Math.min(TUNING.escalationCap, Math.floor(deepest / TUNING.escalationEveryLegs));
}

// escalationMult: the strength/pay multiplier for the current escalation level.
// ×1 at level 0 (fresh) — the exact identity, so the baseline is untouched.
function escalationMult(meta) {
  return 1 + escalationLevel(meta) * TUNING.escalationStep;
}


// ===== src/progress.js =====
// progress.js — THE NO-PROGRESS DETECTOR (DESIGN-SEED M5). The abandon valve is
// only useful if the game SURFACES when it is worth pulling. This is the loud
// signal: an expedition that has stalled — legs that end with net-negative gold
// and no equipment or certification gain — is going nowhere, and the valve (file
// for early return) should be offered plainly rather than left to be discovered.
//
// Pure state machine over per-leg deltas; node-testable. The UI holds a `streak`
// and asks these each leg boundary.


// legIsStale: did this leg fail to advance the expedition? Net-negative gold AND
// no new equipment AND no level/mastery gain (per the seed's exact condition).
function legIsStale(netGold, gearGained, gainedXp) {
  return netGold < 0 && !gearGained && !gainedXp;
}

// bumpStreak: extend the stalled-leg streak, or reset it on a leg that advanced.
function bumpStreak(streak, stale) {
  return stale ? (streak | 0) + 1 : 0;
}

// noProgress: has the streak reached the threshold that surfaces the valve?
function noProgress(streak) {
  return (streak | 0) >= TUNING.noProgressLegs;
}


// ===== src/shop.js =====
// shop.js — THE QUARTERMASTER (DESIGN-SEED M4). A town's shop: a stocked set of
// equipment lines (gold-priced, curved by leg so no early run-ending spike) plus
// an ALWAYS-OPEN resupply sink. The economy's closed loop lives here: combat +
// mandates pay gold IN; equipment and resupply take it OUT, and resupply can
// never sell out — there is always somewhere for gold to go.
//
// Stock is a PURE function of (seed, legIndex): re-entering the same town yields
// the same lines, and it never consumes a live RNG stream (so it can't perturb
// mandate/terrain/combat determinism). Buying/selling mutate the party ledger +
// inventory; the live town/shop surface is captured by the v5 run save and
// restored exactly after a reload.
//
// Register laws 1,2,6: the quartermaster deals in standardized issue, priced and
// numeric. Prose is deadpan; every line ships its exact figure.


// A distinct salt so shop generation is independent of every named stream.
const SHOP_SALT = 0x510c17e; // "stockit"-ish; fixed constant, part of nothing saved

// generateShop: the quartermaster's board at a town on `legIndex`, deterministic
// under `seed`. Stocks up to shopStockSize distinct equipment lines from those
// UNLOCKED at this leg (minLeg gate). Later legs unlock dearer tiers, so the
// spike is curved, not sudden. Returns { legIndex, lines:[{id, price, sold}] }.
function generateShop(seed, legIndex) {
  const pool = itemsUnlockedBy(legIndex).slice();
  const stream = new Stream(hashInt(SHOP_SALT, legIndex, seed >>> 0));
  const lines = [];
  const n = Math.min(TUNING.shopStockSize, pool.length);
  for (let i = 0; i < n; i++) {
    const k = stream.int(pool.length);
    const id = pool.splice(k, 1)[0];
    lines.push({ id, price: getItem(id).price, sold: false });
  }
  // Stable display order: cheapest first, then by id (deterministic).
  lines.sort((a, b) => a.price - b.price || (a.id < b.id ? -1 : 1));
  return { legIndex, lines };
}

// buyLine: purchase the shop line at index `li` into the party inventory. Refuses
// (returns a reason) if already sold or the ledger can't cover it. Loud, never
// silent — the caller surfaces the reason.
function buyLine(party, shop, li) {
  const line = shop.lines[li];
  if (!line) return { ok: false, reason: 'no such line' };
  if (line.sold) return { ok: false, reason: 'already requisitioned' };
  if ((party.gold | 0) < line.price) return { ok: false, reason: `insufficient — ${party.gold}¤ < ${line.price}¤` };
  spendGold(party, line.price);
  party.inventory = party.inventory || [];
  party.inventory.push(line.id);
  line.sold = true;
  return { ok: true, id: line.id, spent: line.price, gold: party.gold };
}

// sellItem: return an UNEQUIPPED inventory item to the quartermaster for a
// fraction of price. Refuses if the item isn't in the loose inventory.
function sellItem(party, invIndex) {
  const inv = party.inventory || [];
  const id = inv[invIndex];
  if (id == null) return { ok: false, reason: 'no such item' };
  const value = sellValue(id);
  inv.splice(invIndex, 1);
  earnGold(party, value);
  return { ok: true, id, value, gold: party.gold };
}

// resupply: the ALWAYS-OPEN sink — buy one block of supplies for gold. Never
// sold out; independent of stock. Refuses only if the ledger can't cover a block.
function resupply(party) {
  if ((party.gold | 0) < TUNING.resupplyCost) return { ok: false, reason: `insufficient — ${party.gold}¤ < ${TUNING.resupplyCost}¤` };
  spendGold(party, TUNING.resupplyCost);
  party.supplies += TUNING.resupplyBlock;
  return { ok: true, added: TUNING.resupplyBlock, spent: TUNING.resupplyCost, supplies: party.supplies, gold: party.gold };
}

// isTownLeg: is the pause point after completing `legIndex` a town? Deterministic
// cadence — every townEveryLegs-th leg carries a quartermaster.
function isTownLeg(legIndex) {
  return TUNING.townEveryLegs > 0 && ((legIndex + 1) % TUNING.townEveryLegs === 0);
}


// ===== src/route.js =====
// route.js — ROUTING THE NEXT LEG (DESIGN-SEED M4). At each pause point the party
// chooses how to march the next leg: a branch with a legible safety-vs-resource
// tradeoff. Three archetypes span the axis:
//   posted   — The Posted Road: fewest encounters, a SUPPLY TOLL (maintained),
//              slightly lower pay. Buy quiet with supplies.
//   ordinary — The Cut: neutral risk, neutral pay, little/no toll.
//   verge    — The Unassessed Verge: most encounters, best pay, no toll. Risk.
//
// The chosen branch's mods ride on the leg (march.legMods): encounterMult scales
// the per-pace encounter chance; goldMult scales combat disbursement on that leg.
// A supply toll is paid once, at selection. EVERY branch still advances toward the
// floored mandate reward — no branch is worse than standing still.
//
// Content is a PURE function of (seed, legIndex) — like the shop, it never
// consumes a live RNG stream, so it can't perturb combat/terrain/mandate
// determinism. The player's CHOICE is the only input; it's captured in the leg
// mods, which the save carries. Register: roads are described as instruments —
// exact multipliers and tolls, deadpan road-names. node-testable.


const ROUTE_SALT = 0x520a7e; // distinct constant; part of nothing saved

// The archetype spine (order = display order, safe→exposed). Labels are deadpan
// road-names; `safety` is the plain non-numeric channel beside the figures.
const ROUTE_ARCHETYPES = [
  { id: 'posted', label: 'The Posted Road', safety: 'guarded', note: 'Maintained; a toll applies.' },
  { id: 'ordinary', label: 'The Cut', safety: 'ordinary', note: 'Assessed. No surprises.' },
  { id: 'verge', label: 'The Unassessed Verge', safety: 'exposed', note: 'Untolled. Matters arise.' },
];
const ARCHETYPES = ROUTE_ARCHETYPES;

// jitter: a value in [lo,hi] from the stream, rounded to 2 decimals (stable JSON).
function jitter(stream, band) {
  const [lo, hi] = band;
  if (hi <= lo) return lo;
  return Math.round((lo + stream.next() * (hi - lo)) * 100) / 100;
}

// generateBranches: the branch board for the leg the party is about to march.
// Deterministic under (seed, legIndex). Returns { legIndex, branches:[...] }.
function generateBranches(seed, legIndex) {
  const stream = new Stream(hashInt(ROUTE_SALT, legIndex, seed >>> 0));
  const branches = ARCHETYPES.slice(0, TUNING.routeBranchCount).map((a) => {
    const encounterMult = jitter(stream, TUNING.routeEncounterMult[a.id]);
    const goldMult = jitter(stream, TUNING.routeGoldMult[a.id]);
    const [tlo, thi] = TUNING.routeSupplyToll[a.id];
    const supplyToll = stream.range(tlo, thi);
    return {
      id: a.id, label: a.label, safety: a.safety, note: a.note,
      encounterMult, goldMult, supplyToll,
      // mods that ride on the leg once chosen (the resolver + gold read these).
      mods: { encounterMult, goldMult },
    };
  });
  return { legIndex, branches };
}

// The neutral leg (no route chosen yet — the opening leg, and the default the
// determinism probe/baseline run under so they are unaffected by routing).
function neutralLegMods() {
  return { encounterMult: 1, goldMult: 1 };
}


// ===== src/combat.js =====
// combat.js — THE STEPPED AUTO-RESOLVER (DESIGN-SEED M2 + M3). Combat advances
// one action at a time (initCombat / stepCombat), so the tarot hand can intervene
// BETWEEN actions (applyCard) — the M3 intervention layer. With no cards played,
// stepping to completion reproduces the M2 batch fight byte-for-byte (same RNG
// order), so the committed baseline/degeneracy gates still hold. resolveCombat is
// now a thin wrapper that steps to the end — one code path for probes and play.
//
// Determinism: the resolver consumes the `combat` stream (attack variance, enemy
// target choice). Cards consume NO randomness, so a card play never shifts the
// resolver's stream — only the fight state it reads. Attrition mutates party HP in
// place. Every action + card emits a legible log entry.


const ENEMY_NAMES = ['Clerk', 'Warden', 'Server', 'Assessor', 'Sgt'];
const ENEMY_VERBS = [{ id: 'serve', name: 'Serve Writ', kind: 'attack', power: 1.0, target: 'enemy' }];

// `escMult` (M5) scales enemy strength with the escalation curve. Default 1 →
// exact identity, so the M2 baseline + economy gate (which pass no escalation)
// are untouched. It only scales stats — the jitter draw order is unchanged, so
// determinism holds.
function makeEnemies(tier, stream, escMult = 1) {
  const def = TUNING.encounterTiers[tier];
  if (!def) throw new Error('unknown tier: ' + tier);
  const b = TUNING.baseStats;
  const m = def.mult * escMult;
  const enemies = [];
  for (let i = 0; i < def.count; i++) {
    const jitter = 0.9 + 0.2 * stream.next();
    const max = {
      hp: Math.max(1, Math.round(b.hp * m * jitter)),
      atk: Math.round(b.atk * m), def: Math.round(b.def * m),
      mag: Math.round(b.mag * m), spd: Math.round(b.spd * m),
    };
    enemies.push({ id: i, name: ENEMY_NAMES[i % ENEMY_NAMES.length], max, hp: max.hp, alive: true });
  }
  return enemies;
}

// ---- Stepped resolver -------------------------------------------------------
function initCombat(party, enemies) {
  const wrap = (side) => (e, idx) => ({ side, e, idx, temp: { def: 0 }, atkBuff: 0, defBuff: 0, stunned: false });
  const partyW = party.frames.map(wrap('party'));
  const enemyW = enemies.map(wrap('enemy'));
  const order = [...partyW, ...enemyW].sort((a, b) => {
    if (b.e.max.spd !== a.e.max.spd) return b.e.max.spd - a.e.max.spd;
    if (a.side !== b.side) return a.side === 'party' ? -1 : 1;
    return a.idx - b.idx;
  });
  return { party, enemies, partyW, enemyW, order, round: 1, ptr: 0, done: false, victory: false, stalemate: false, log: [] };
}

const livingOf = (arr) => arr.filter((w) => w.e.alive && w.e.hp > 0);
function partyDown(s) { return livingOf(s.partyW).length === 0; }
function enemyDown(s) { return livingOf(s.enemyW).length === 0; }

// nextActor: advance ptr to the next living unit, rolling rounds. Returns the unit
// or null (fight over / round cap hit -> caller finalises).
function nextActor(s) {
  let scanned = 0;
  while (scanned <= s.order.length + 1) {
    if (s.ptr >= s.order.length) {
      if (s.round >= TUNING.combatMaxRounds) return null; // round cap -> stalemate
      s.round++; s.ptr = 0;
    }
    const w = s.order[s.ptr]; s.ptr++; scanned++;
    if (w.e.alive) return w;
  }
  return null;
}

// stepCombat: perform exactly one action (or a stun-skip). Returns the log entry,
// or null when the fight is already over / just ended with no action.
function stepCombat(s, stream) {
  if (s.done) return null;
  if (partyDown(s) || enemyDown(s)) { finalise(s); return null; }
  const w = nextActor(s);
  if (!w) { finalise(s); return null; }

  w.temp.def = 0; // guard/ward from a prior round expires at this unit's turn
  if (w.stunned) {
    w.stunned = false;
    const entry = { round: s.round, side: w.side, actorIdx: w.idx, actor: w.e.name, verb: 'Stayed', targets: [], deaths: [], stayed: true };
    s.log.push(entry);
    if (partyDown(s) || enemyDown(s)) finalise(s);
    return entry;
  }
  const foes = w.side === 'party' ? s.enemyW : s.partyW;
  const friends = w.side === 'party' ? s.partyW : s.enemyW;
  const act = chooseAction(w, friends, foes, stream);
  const entry = { round: s.round, side: w.side, actorIdx: w.idx, actor: w.e.name, verb: act.verb.name, targets: [], deaths: [] };
  applyAction(w, act, stream, entry);
  s.log.push(entry);
  if (partyDown(s) || enemyDown(s)) finalise(s);
  return entry;
}

function finalise(s) {
  if (s.done) return;
  s.done = true;
  s.victory = enemyDown(s) && !partyDown(s);
  if (!s.victory && !partyDown(s)) { s.stalemate = true; s.log.push({ round: s.round, side: 'system', actor: 'resolver', verb: 'STALEMATE', targets: [], deaths: [], warn: true }); }
}

// resolveCombat: batch wrapper — step to completion, no card interventions.
// (Probes + the M2 gates run through this, so the gate measures the live engine.)
function resolveCombat(party, enemies, stream, opts = {}) {
  const s = initCombat(party, enemies);
  const cap = TUNING.combatMaxRounds * (s.order.length + 1) + 8;
  let g = 0;
  while (!s.done && g++ < cap) stepCombat(s, stream);
  if (!s.done) finalise(s);
  return {
    victory: s.victory, rounds: s.round, log: opts.quiet ? [] : s.log,
    survivors: livingFrames(party).length, enemiesDown: enemies.filter((e) => !e.alive).length,
  };
}

// ---- Standing-order AI (unchanged logic; now buff-aware) --------------------
function effAtk(w) { return w.e.max.atk + w.atkBuff; }
function effMag(w) { return w.e.max.mag + w.atkBuff; }
function effDef(w) { return w.e.max.def + w.temp.def + w.defBuff; }

function chooseAction(w, friends, foes, stream) {
  const livingFoes = foes.filter((f) => f.e.alive);
  const livingFriends = friends.filter((f) => f.e.alive);
  const verbs = w.side === 'party' ? JOBS[w.e.jobId].verbs : ENEMY_VERBS;
  if (w.side === 'enemy') {
    const target = livingFoes[stream.int(Math.max(1, livingFoes.length))] || livingFoes[0];
    return { verb: verbs[0], targets: target ? [target] : [] };
  }
  const heal = verbs.find((v) => v.kind === 'heal');
  const ward = verbs.find((v) => v.kind === 'ward');
  const guard = verbs.find((v) => v.kind === 'guard');
  const attacks = verbs.filter((v) => v.kind === 'attack' || v.kind === 'spell');
  const hurt = livingFriends.filter((f) => f.e.hp < f.e.max.hp * 0.55);
  if (heal && hurt.length) {
    if (heal.target === 'allies' || hurt.length >= 2) {
      const allyVerb = verbs.find((v) => v.kind === 'heal' && v.target === 'allies') || heal;
      return { verb: allyVerb, targets: allyVerb.target === 'allies' ? livingFriends : [mostReduced(livingFriends)] };
    }
    const single = verbs.find((v) => v.kind === 'heal' && v.target === 'ally') || heal;
    return { verb: single, targets: [mostReduced(livingFriends)] };
  }
  if (attacks.length) {
    const best = attacks.slice().sort((a, b) => b.power - a.power)[0];
    if (best.target === 'enemies') return { verb: best, targets: livingFoes };
    let target;
    if (best.id === 'distrain') target = sturdiest(livingFoes);
    else if (best.id === 'mark_and_loose') target = weakestWarded(livingFoes);
    else target = lowestHp(livingFoes);
    return { verb: best, targets: target ? [target] : [] };
  }
  if (ward) return { verb: ward, targets: livingFriends };
  if (guard) return { verb: guard, targets: [w] };
  return { verb: { id: 'stand', name: 'Stand', kind: 'guard', power: 0, target: 'self' }, targets: [w] };
}

function applyAction(w, act, stream, entry) {
  const v = act.verb;
  for (const t of act.targets) {
    if (v.kind === 'attack' || v.kind === 'spell') {
      const atkStat = v.kind === 'spell' ? effMag(w) : effAtk(w);
      const variance = 0.85 + 0.3 * stream.next();
      const raw = v.power * atkStat * variance - effDef(t) * TUNING.defScale;
      const dealt = Math.max(TUNING.dmgFloor, Math.round(raw));
      const died = t.e.alive && t.e.hp - dealt <= 0;
      t.e.hp = Math.max(0, t.e.hp - dealt); if (t.e.hp === 0) t.e.alive = false;
      entry.targets.push({ side: t.side, idx: t.idx, name: t.e.name, dmg: dealt });
      if (died) entry.deaths.push(t.e.name);
    } else if (v.kind === 'heal') {
      if (!t.e.alive) continue;
      const amount = Math.round(v.power * effMag(w) * TUNING.healScale);
      const before = t.e.hp; t.e.hp = Math.min(t.e.max.hp, t.e.hp + amount);
      entry.targets.push({ side: t.side, idx: t.idx, name: t.e.name, heal: t.e.hp - before });
    } else if (v.kind === 'guard' || v.kind === 'ward') {
      t.temp.def += Math.round(t.e.max.def * TUNING.guardDefBonus);
      entry.targets.push({ side: t.side, idx: t.idx, name: t.e.name, ward: t.temp.def });
    }
  }
}

function mostReduced(list) { return list.slice().sort((a, b) => (a.e.hp / a.e.max.hp) - (b.e.hp / b.e.max.hp))[0]; }
function lowestHp(list) { return list.slice().sort((a, b) => a.e.hp - b.e.hp)[0]; }
function sturdiest(list) { return list.slice().sort((a, b) => (b.e.max.def + b.e.hp) - (a.e.max.def + a.e.hp))[0]; }
function weakestWarded(list) { return list.slice().sort((a, b) => a.e.max.def - b.e.max.def)[0]; }

// ---- M3: card intervention (no RNG — deterministic given state + card) -------
// peekThreat: the next enemy action that will occur, as {actor, target, dmg,
// willDown}. Read-only (does not mutate ptr) — used for window-state legibility
// and 'stay' targeting.
function peekThreat(s) {
  const n = s.order.length;
  for (let k = 0; k < n; k++) {
    const w = s.order[(s.ptr + k) % n];
    if (!w.e.alive) continue;
    if (w.side !== 'enemy' || w.stunned) continue;
    const foes = livingOf(s.partyW);
    if (!foes.length) return null;
    // enemy AI hits a party frame; estimate expected (mean-variance) damage.
    const target = foes[0]; // deterministic proxy for "a frame will be hit"
    const dmg = Math.max(TUNING.dmgFloor, Math.round(effAtk(w) * 1.0 - effDef(target) * TUNING.defScale));
    return { actor: w, target, dmg, willDown: dmg >= target.e.hp };
  }

}
function nextEnemyToAct(s) { const t = peekThreat(s); return t ? t.actor : null; }

// applyCard: apply a card's effect to the combat state. Returns the log entry
// (with an optional { draw } signal for 'instrument'). Never consumes the stream.
function applyCard(s, cardId) {
  const card = getCard(cardId);
  const entry = { round: s.round, side: 'card', actor: 'the desk', verb: card.name, card: cardId, text: card.text, targets: [], deaths: [] };
  const enemies = livingOf(s.enemyW);
  const allies = livingOf(s.partyW);
  const dmgOf = (p) => Math.max(TUNING.dmgFloor, Math.round(p * TUNING.cardDamageBase));

  if (card.kind === 'strike' || card.kind === 'smite') {
    const t = card.target === 'sturdiest' ? sturdiest(enemies) : card.target === 'weakest' ? lowestHp(enemies) : lowestHp(enemies);
    if (t) hitEnemy(t, dmgOf(card.power), entry);
  } else if (card.kind === 'execute') {
    const t = lowestHp(enemies);
    if (t) {
      if (t.e.hp <= card.power * t.e.max.hp) { const dealt = t.e.hp; t.e.hp = 0; t.e.alive = false; entry.targets.push({ side: 'enemy', idx: t.idx, name: t.e.name, dmg: dealt }); entry.deaths.push(t.e.name); }
      else hitEnemy(t, dmgOf(0.6), entry);
    }
  } else if (card.kind === 'mend') {
    const t = mostReduced(allies); if (t) healAlly(t, Math.round(card.power * TUNING.cardHealBase), entry);
  } else if (card.kind === 'salve') {
    for (const t of allies) healAlly(t, Math.round(card.power * TUNING.cardHealBase), entry);
  } else if (card.kind === 'rally') {
    const t = mostReduced(allies) || allies[0]; if (t) { t.atkBuff += Math.round(card.power * TUNING.cardBuffBase); entry.targets.push({ side: 'party', idx: t.idx, name: t.e.name, buff: t.atkBuff }); }
  } else if (card.kind === 'ordinance') {
    for (const t of allies) { t.atkBuff += Math.round(card.power * TUNING.cardBuffBase); entry.targets.push({ side: 'party', idx: t.idx, name: t.e.name, buff: t.atkBuff }); }
  } else if (card.kind === 'ward') {
    const targets = card.target === 'self' ? [mostReduced(allies) || allies[0]].filter(Boolean) : allies;
    for (const t of targets) { t.defBuff += Math.round(card.power * TUNING.cardWardBase); entry.targets.push({ side: 'party', idx: t.idx, name: t.e.name, ward: t.defBuff }); }
  } else if (card.kind === 'stay') {
    const t = nextEnemyToAct(s) || lowestHp(enemies); if (t) { t.stunned = true; entry.targets.push({ side: 'enemy', idx: t.idx, name: t.e.name, stay: true }); }
  } else if (card.kind === 'instrument') {
    entry.draw = card.power;
  }
  s.log.push(entry);
  if (enemyDown(s)) finalise(s);
  return entry;
}
function hitEnemy(t, dealt, entry) {
  const died = t.e.alive && t.e.hp - dealt <= 0;
  t.e.hp = Math.max(0, t.e.hp - dealt); if (t.e.hp === 0) t.e.alive = false;
  entry.targets.push({ side: 'enemy', idx: t.idx, name: t.e.name, dmg: dealt });
  if (died) entry.deaths.push(t.e.name);
}
function healAlly(t, amt, entry) {
  const before = t.e.hp; t.e.hp = Math.min(t.e.max.hp, t.e.hp + amt);
  entry.targets.push({ side: 'party', idx: t.idx, name: t.e.name, heal: t.e.hp - before });
}

// evaluateCard: the per-card live window state (DESIGN-SEED M3) — 'decisive' |
// 'playable' | 'wasted' vs the resolver's next action. Pure, read-only.
function evaluateCard(s, cardId) {
  const card = getCard(cardId);
  const enemies = livingOf(s.enemyW);
  const allies = livingOf(s.partyW);
  const threat = peekThreat(s);
  const someoneInDanger = threat && threat.willDown;
  const hurtExists = allies.some((a) => a.e.hp < a.e.max.hp);
  const lowExists = allies.some((a) => a.e.hp < a.e.max.hp * TUNING.cardDangerFrac);

  switch (card.kind) {
    case 'strike': case 'smite': {
      if (!enemies.length) return 'wasted';
      const dmg = Math.max(TUNING.dmgFloor, Math.round(card.power * TUNING.cardDamageBase));
      const kills = enemies.some((e) => e.e.hp <= dmg);
      return (kills && threat) ? 'decisive' : 'playable';
    }
    case 'execute': {
      if (!enemies.length) return 'wasted';
      const canExec = enemies.some((e) => e.e.hp <= card.power * e.e.max.hp);
      return canExec && threat ? 'decisive' : 'playable';
    }
    case 'mend': return !hurtExists ? 'wasted' : (someoneInDanger || lowExists) ? 'decisive' : 'playable';
    case 'salve': return !hurtExists ? 'wasted' : (someoneInDanger || lowExists) ? 'decisive' : 'playable';
    case 'ward': return !enemies.length ? 'wasted' : someoneInDanger ? 'decisive' : 'playable';
    case 'rally': case 'ordinance': return !enemies.length ? 'wasted' : 'playable';
    case 'stay': return !enemies.length ? 'wasted' : someoneInDanger ? 'decisive' : 'playable';
    case 'instrument': return 'playable';
    default: return 'playable';
  }
}
