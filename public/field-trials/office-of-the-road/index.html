// ===== src/legibility.js =====
// legibility.js — MEASURED LEGIBILITY (DESIGN-SEED M2 gate). WCAG contrast maths
// + the asserted colour pairs + the non-colour-channel inventory + colour-vision-
// deficiency simulation matrices. Pure; the gate is test/legibility.test.js.


// relativeLuminance / contrast: WCAG 2.1 definitions.
function channel(v) { const c = v / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function relativeLuminance(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
}
function contrast(a, b) {
  const la = relativeLuminance(a), lb = relativeLuminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}

// The pairs actually used in the UI, with their required minimum ratio. Body text
// (small) needs 4.5:1; interactive UI edges + meaningful bars need 3:1. Decorative
// container borders (PALETTE.rule) are exempt (WCAG 1.4.11) and not asserted.
const CONTRAST_CHECKS = {
  body: [ // small text -> 4.5:1
    ['paper', 'ink'], ['dim', 'ink'], ['dim', 'panel'], ['dim', 'panel2'],
    ['faint', 'ink'], ['faint', 'panel'], ['ok', 'ink'], ['stamp', 'ink'],
    ['filed', 'ink'], ['focus', 'ink'],
  ],
  edge: [ // interactive borders + state-bearing bars -> 3:1
    ['edge', 'ink'], ['focus', 'ink'], ['hp', 'hpback'], ['hplow', 'hpback'], ['paper', 'ink'],
  ],
};

function runContrastChecks(P = PALETTE) {
  const fails = [];
  for (const [fg, bg] of CONTRAST_CHECKS.body) {
    const r = contrast(P[fg], P[bg]); if (r < 4.5) fails.push({ pair: `${fg}/${bg}`, ratio: r, need: 4.5 });
  }
  for (const [fg, bg] of CONTRAST_CHECKS.edge) {
    const r = contrast(P[fg], P[bg]); if (r < 3) fails.push({ pair: `${fg}/${bg}`, ratio: r, need: 3 });
  }
  return { ok: fails.length === 0, fails };
}

// Every state distinction carries a NON-COLOUR channel too (colour is never the
// sole carrier). This inventory is asserted for completeness by the gate test.
const NONCOLOR_CHANNELS = {
  focus: 'an OUTLINE ring around the focused control (not colour-only)',
  status: 'bracketed word tokens — [ MARCHING ] / [ PAUSED ] / [ HELD ]',
  save: 'the word FILED ✓ with a checkmark glyph + the tick number',
  speedSelected: 'the active speed button is filled + bordered paper, not tint-only',
  hp: 'every HP bar ships its exact NUMERALS (e.g. 24/43) beside it',
  reduced: 'a downed frame is faded AND labelled "(reduced)"',
  combatDamage: 'floating signed NUMERALS (−12 / +8 / ward), not colour alone',
  terrain: 'route bands are LABELLED by name, not distinguished by fill alone',
};

// CVD simulation matrices (Machado, Oliveira & Fernandes 2009, severity 1.0),
// row-major 3×3 applied to linear-ish sRGB (good enough for a proof check).
const CVD_MATRICES = {
  deuteranopia: [0.367, 0.861, -0.228, 0.280, 0.673, 0.047, -0.012, 0.043, 0.969],
  protanopia: [0.152, 1.053, -0.205, 0.115, 0.786, 0.099, -0.004, -0.048, 1.052],
  tritanopia: [1.256, -0.077, -0.179, -0.078, 0.931, 0.148, 0.005, 0.691, 0.304],
};

// simulateCVD: transform an {r,g,b} (0..255) through a CVD matrix. Used by the
// in-build ?cvd= proof filter and any offline check.
function simulateCVD(type, r, g, b) {
  const m = CVD_MATRICES[type]; if (!m) return [r, g, b];
  const clamp = (v) => v < 0 ? 0 : v > 255 ? 255 : v;
  return [
    clamp(m[0] * r + m[1] * g + m[2] * b),
    clamp(m[3] * r + m[4] * g + m[5] * b),
    clamp(m[6] * r + m[7] * g + m[8] * b),
  ];
}


// ===== src/band.js =====
// band.js — THE BAND KIT. A portable procedural WebAudio band: synthesised
// instruments, a bus architecture with a send reverb, and a lookahead step
// scheduler. Zero assets, zero fetches, zero dependencies (hard rule 2: all
// assets code-generated). Nothing here is Chapel-Perilous-specific — CHP's own
// score lives in score.js and is the reference consumer.
//
// ============================================================================
// THE API (this header is the kit's documentation — other games adopt this file
// verbatim and write their own tracks module beside it)
// ============================================================================
//
// NOTE TO THE READER: these examples show only calls, never the ES module lines
// that would normally head them. scripts/build-singlefile.mjs discovers each
// module's dependencies with a plain regex that does not skip comments, so
// mentioning the ES keyword — or any quoted module path — in a comment above the
// real dependency list registers as a bogus extra dependency and breaks the
// single-file build. Pull createBand / noteFreq / chord out the usual way.
//
//   const band = createBand({ ctx, destination: someGainNode, seed: worldSeed });
//
//   band.registerTrack('cellar', {
//     bpm: 40,          // a STEP is a sixteenth: stepSeconds = 60 / bpm / 4
//     len: 64,          // steps in one loop (16 steps = one bar)
//     vol: 0.8,         // this track's level on the music bus
//     step(i, t, s) {   // i = step within the loop, t = ctx time to schedule AT
//       if (i === 0) s.v.drone(t, noteFreq('D1'), 16, { vol: 0.10 });
//       if (i === 23) s.v.bell(t, noteFreq('A5'), 4, { vol: 0.07 });
//     },
//   });
//
//   band.setTrack('cellar');   // crossfades: old track's bus down, new one up
//   band.start();              // drive the scheduler off a timer
//   band.setParams({ dread: 0.7 });  // live intensity, no track restart
//
// `step(i, t, s)` receives a step context `s`:
//   s.v        the instrument voices (see below) — call them with an absolute
//              ctx time `t`; they build and free their own nodes
//   s.i        step within the loop (0..len-1)
//   s.n        absolute step count since the track started (never wraps —
//              key long-form drift off this)
//   s.bar      bar within the loop, i.e. (i / 16 | 0)
//   s.params   the live params object from setParams (intensity layers)
//   s.rand(k)  DETERMINISTIC [0,1) for this step, salted by k. Seeded off the
//              band's seed + n via prng.hash2 — never Math.random, so a seeded
//              world always drifts the same way.
//
// VOICES (`band.voices`, or `s.v` inside a step). All take (t, freq, dur, opts)
// except air/kick/snare/hat. `dur` is seconds of sustain; the release tail runs
// past it. Every voice routes dry to the active track bus and wet to the shared
// send reverb, so a track change cannot bleed the old track's notes back in.
//   pad    (t, freq, dur, o)  detuned saw stack + swept lowpass — the harmonic bed
//   drone  (t, freq, dur, o)  sine + sub (+ optional detuned partner / glide) — the floor
//   bell   (t, freq, dur, o)  detuned sine partial stack — sparse events
//   pluck  (t, freq, dur, o)  triangle + fast filter decay — short figures
//   bass   (t, freq, dur, o)  saw + sub through a resonant lowpass — pulse/weight
//   lead   (t, freq, dur, o)  square/triangle + vibrato — melody
//   air    (t, dur, o)        filtered noise with a swept band — texture/breath
//   kick / snare / hat        (t, o) percussion; CHP's ambient score does not use
//                            these, they are here because the kit is portable
// Common opts: vol, wave, cut (filter Hz), sweep (cut multiplier by end), q,
// a/d/s/r (envelope, seconds), verb (send amount 0..1), det (detune cents),
// ratios (bell partials), glide (drone end freq), hp/bp (air band).
//
// DETERMINISM. The reverb impulse response and the noise buffer are filled from
// a seeded mulberry32, and s.rand is a seeded hash — so nothing in the audio
// path calls Math.random. Same seed, same score.
//
// HEADLESS SAFETY. Nothing at module-load time touches `window`. createBand needs a
// real AudioContext; callers that may not have one guard the call (see
// audio.js). tick(now) is callable by hand, which is how the tests drive the
// scheduler without timers or a browser.


// ---------------------------------------------------------------------------
// note names -> frequency. 'D1', 'Bb2', 'F#4'. A number passes straight through.
// ---------------------------------------------------------------------------
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function noteFreq(name) {
  if (typeof name === 'number') return name;
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(String(name));
  if (!m) return 440;
  const s = SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  const oct = parseInt(m[3], 10);
  return 440 * Math.pow(2, (s - 9) / 12 + (oct - 4));
}

/** Chord helper: note names -> frequencies. */
function chord(names) { return names.map(noteFreq); }

// A tiny positive floor — exponential ramps cannot reach or cross zero.
const EPS = 0.0001;
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

// Scheduler constants. LOOKAHEAD is how far ahead of currentTime we schedule;
// TICK_MS how often the driver wakes. MAX_STEPS_PER_TICK stops a pathological
// clock jump (tab wake, breakpoint) from scheduling thousands of notes at once.
const LOOKAHEAD = 0.22;
const TICK_MS = 25;
const MAX_STEPS_PER_TICK = 64;

// Crossfade defaults, tuned long for an ambient register (see score.js).
const FADE_OUT = 1.1;
const FADE_IN = 2.2;
// How long a retired track bus lingers before disconnect — long enough for the
// longest voice release to finish under the fade.
const RETIRE_TAIL = 4.0;

/**
 * Build a band on an existing AudioContext.
 * @param {object}   o
 * @param {AudioContext} o.ctx          required
 * @param {AudioNode} [o.destination]   where the band's output goes (default ctx.destination)
 * @param {number}   [o.seed]           seeds the reverb IR, the noise buffer, and s.rand
 * @param {number}   [o.gain]           the band's output level
 * @param {object}   [o.reverb]         { seconds, decay } of the generated IR
 */
function createBand({
  ctx,
  destination = null,
  seed = 1,
  gain = 0.5,
  reverb = { seconds: 3.4, decay: 2.6 },
  lookahead = LOOKAHEAD,
  tickMs = TICK_MS,
  fadeOut = FADE_OUT,
  fadeIn = FADE_IN,
} = {}) {
  if (!ctx) throw new Error('createBand: needs an AudioContext');
  const rngSeed = (seed >>> 0) || 1;

  // -- bus architecture ------------------------------------------------------
  //   voices -> trackBus.out ---------------------\
  //          \-> sendGain -> trackBus.send -> verb -> verbReturn -> out -> destination
  //                                                       music bus  ^
  // The per-track bus is what makes a scene change clean: both its dry out and
  // its reverb send are ramped down together, so nothing from the outgoing
  // track can fade back in when the incoming one rises.
  const out = ctx.createGain();
  out.gain.value = gain;
  const comp = ctx.createDynamicsCompressor ? ctx.createDynamicsCompressor() : null;
  if (comp) {
    // Gentle glue so overlapping ambient pads never clip the sum.
    try {
      comp.threshold.value = -16; comp.knee.value = 24; comp.ratio.value = 3;
      comp.attack.value = 0.01; comp.release.value = 0.3;
    } catch (_) { /* a stub context without full params — harmless */ }
    out.connect(comp);
    comp.connect(destination || ctx.destination);
  } else {
    out.connect(destination || ctx.destination);
  }

  const verb = makeVerb(ctx, reverb, rngSeed);
  const verbReturn = ctx.createGain();
  verbReturn.gain.value = 0.55;
  if (verb) { verb.connect(verbReturn); verbReturn.connect(out); }

  const noiseBuf = makeNoise(ctx, rngSeed ^ 0x5bf03635);

  // -- track buses -----------------------------------------------------------
  let bus = null;        // the live track's { out, send, vol }
  const retiring = [];   // buses fading out, disposed on a later tick

  function makeBus(vol) {
    const o = ctx.createGain();
    o.gain.value = EPS;
    o.connect(out);
    const s = ctx.createGain();
    s.gain.value = EPS;
    if (verb) s.connect(verb);
    return { out: o, send: s, vol };
  }

  function retire(b, now) {
    if (!b) return;
    ramp(b.out.gain, EPS, now, fadeOut);
    ramp(b.send.gain, EPS, now, fadeOut);
    retiring.push({ bus: b, disposeAt: now + fadeOut + RETIRE_TAIL });
  }

  function sweepRetired(now) {
    for (let i = retiring.length - 1; i >= 0; i--) {
      if (retiring[i].disposeAt <= now) {
        try { retiring[i].bus.out.disconnect(); retiring[i].bus.send.disconnect(); } catch (_) { /* ignore */ }
        retiring.splice(i, 1);
      }
    }
  }

  // A voice's dry destination, and its wet tap. With no live bus (silence) the
  // voices still build correctly but land on a bus at EPS, i.e. inaudible.
  function dry() { return bus ? bus.out : out; }
  function send(node, amount) {
    if (!amount || !bus) return;
    const g = ctx.createGain();
    g.gain.value = amount;
    node.connect(g);
    g.connect(bus.send);
  }

  // -- envelope --------------------------------------------------------------
  // Attack to peak, decay to a sustain fraction, hold to `dur`, release out.
  // Exponential throughout (musical), floored at EPS.
  function env(g, t, { a = 0.4, d = 0.5, s = 0.6, r = 1.0, peak = 0.1, dur = 1 }) {
    const p = Math.max(EPS * 2, peak);
    const hold = Math.max(a + d, dur);
    try {
      g.gain.setValueAtTime(EPS, t);
      g.gain.exponentialRampToValueAtTime(p, t + a);
      g.gain.exponentialRampToValueAtTime(Math.max(EPS * 2, p * s), t + a + d);
      g.gain.setValueAtTime(Math.max(EPS * 2, p * s), t + hold);
      g.gain.exponentialRampToValueAtTime(EPS, t + hold + r);
    } catch (_) { /* param without full automation */ }
    return hold + r;
  }

  function ramp(param, to, t, secs) {
    try {
      param.cancelScheduledValues(t);
      param.setValueAtTime(Math.max(EPS, param.value), t);
      param.linearRampToValueAtTime(Math.max(EPS, to), t + secs);
    } catch (_) { try { param.value = to; } catch (__) { /* ignore */ } }
  }

  // ==========================================================================
  // VOICES
  // ==========================================================================

  // The harmonic bed: three detuned oscillators (one an octave down) through a
  // lowpass that sweeps open across the note — the slow filter movement is what
  // keeps a long pad from reading as a held organ chord.
  function pad(t, freq, dur, o = {}) {
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb === undefined ? 0.5 : o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    const cut = o.cut || 700;
    try {
      f.frequency.setValueAtTime(cut, t);
      f.frequency.linearRampToValueAtTime(cut * (o.sweep === undefined ? 1.5 : o.sweep), t + dur * 0.6);
      f.Q.value = o.q === undefined ? 1.2 : o.q;
    } catch (_) { /* stub */ }
    f.connect(o1);
    const det = o.det === undefined ? 7 : o.det;
    const vol = o.vol === undefined ? 0.10 : o.vol;
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      osc.type = o.wave || 'sawtooth';
      try { osc.frequency.value = freq * (i === 2 ? 0.5 : 1); osc.detune.value = (i - 1) * det; } catch (_) { /* stub */ }
      const g = ctx.createGain();
      const tail = env(g, t, { a: o.a === undefined ? 1.2 : o.a, d: o.d === undefined ? 1.0 : o.d, s: 0.7, r: o.r === undefined ? 2.0 : o.r, peak: vol * (i === 2 ? 0.7 : 1), dur });
      osc.connect(g); g.connect(f);
      osc.start(t); osc.stop(t + tail + 0.2);
    }
  }

  // The floor: a sine with a sub octave, optionally a slightly-detuned partner
  // (which produces the slow beating that reads as "unquiet"), optionally
  // gliding to another frequency across the note.
  function drone(t, freq, dur, o = {}) {
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb === undefined ? 0.25 : o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    try { f.frequency.value = o.cut || 320; f.Q.value = o.q === undefined ? 0.8 : o.q; } catch (_) { /* stub */ }
    f.connect(o1);
    const vol = o.vol === undefined ? 0.11 : o.vol;
    const partners = o.beat ? [0, o.beat] : [0];
    for (const cents of partners) {
      for (const [mult, level] of [[1, 1], [0.5, 0.7]]) {
        const osc = ctx.createOscillator();
        osc.type = o.wave || 'sine';
        try {
          osc.frequency.setValueAtTime(freq * mult, t);
          if (o.glide) osc.frequency.linearRampToValueAtTime(noteFreq(o.glide) * mult, t + dur);
          osc.detune.value = cents;
        } catch (_) { /* stub */ }
        const g = ctx.createGain();
        const tail = env(g, t, { a: o.a === undefined ? 2.2 : o.a, d: 0.8, s: 0.85, r: o.r === undefined ? 3.0 : o.r, peak: vol * level, dur });
        osc.connect(g); g.connect(f);
        osc.start(t); osc.stop(t + tail + 0.2);
      }
    }
  }

  // Sparse events: a stack of slightly-inharmonic sine partials. The default
  // ratios are bell-like; pass your own for something stranger (score.js uses a
  // tritone partial underground).
  function bell(t, freq, dur, o = {}) {
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb === undefined ? 0.8 : o.verb);
    const ratios = o.ratios || [1, 2.01, 3.03, 4.78];
    const levels = o.levels || [1, 0.4, 0.22, 0.1];
    const vol = o.vol === undefined ? 0.07 : o.vol;
    for (let i = 0; i < ratios.length; i++) {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      try { osc.frequency.value = freq * ratios[i]; } catch (_) { /* stub */ }
      const g = ctx.createGain();
      const tail = env(g, t, { a: 0.006, d: dur * 0.85, s: 0.02, r: o.r === undefined ? 1.4 : o.r, peak: vol * (levels[i] === undefined ? 0.1 : levels[i]), dur: dur * 0.4 });
      osc.connect(g); g.connect(o1);
      osc.start(t); osc.stop(t + tail + 0.4);
    }
  }

  function pluck(t, freq, dur, o = {}) {
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb === undefined ? 0.4 : o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    const cut = o.cut || 2400;
    try {
      f.frequency.setValueAtTime(cut, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(120, cut * 0.18), t + Math.max(0.05, dur));
    } catch (_) { /* stub */ }
    f.connect(o1);
    const osc = ctx.createOscillator();
    osc.type = o.wave || 'triangle';
    try { osc.frequency.value = freq; } catch (_) { /* stub */ }
    const g = ctx.createGain();
    const tail = env(g, t, { a: 0.005, d: dur * 0.6, s: 0.06, r: o.r === undefined ? 0.3 : o.r, peak: o.vol === undefined ? 0.07 : o.vol, dur: dur * 0.5 });
    osc.connect(g); g.connect(f);
    osc.start(t); osc.stop(t + tail + 0.3);
  }

  function bass(t, freq, dur, o = {}) {
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb === undefined ? 0.1 : o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    try { f.frequency.value = o.cut || 400; f.Q.value = o.q === undefined ? 2.5 : o.q; } catch (_) { /* stub */ }
    f.connect(o1);
    const vol = o.vol === undefined ? 0.13 : o.vol;
    for (const [wave, mult, level] of [[o.wave || 'sawtooth', 1, 1], ['sine', 0.5, 0.6]]) {
      const osc = ctx.createOscillator();
      osc.type = wave;
      try { osc.frequency.value = freq * mult; } catch (_) { /* stub */ }
      const g = ctx.createGain();
      const tail = env(g, t, { a: o.a === undefined ? 0.02 : o.a, d: dur * 0.4, s: 0.5, r: o.r === undefined ? 0.25 : o.r, peak: vol * level, dur: dur * 0.85 });
      osc.connect(g); g.connect(f);
      osc.start(t); osc.stop(t + tail + 0.3);
    }
  }

  function lead(t, freq, dur, o = {}) {
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb === undefined ? 0.45 : o.verb);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    try { f.frequency.value = o.cut || 2000; f.Q.value = 1.8; } catch (_) { /* stub */ }
    f.connect(o1);
    const osc = ctx.createOscillator();
    osc.type = o.wave || 'square';
    try { osc.frequency.value = freq; } catch (_) { /* stub */ }
    // A touch of vibrato so a sustained lead is not a test tone.
    const lfo = ctx.createOscillator();
    const lg = ctx.createGain();
    try { lfo.frequency.value = o.vibrato === undefined ? 4.8 : o.vibrato; lg.gain.value = freq * 0.005; } catch (_) { /* stub */ }
    lfo.connect(lg); lg.connect(osc.frequency);
    const g = ctx.createGain();
    const tail = env(g, t, { a: o.a === undefined ? 0.06 : o.a, d: 0.2, s: 0.7, r: o.r === undefined ? 0.4 : o.r, peak: o.vol === undefined ? 0.08 : o.vol, dur });
    osc.connect(g); g.connect(f);
    osc.start(t); osc.stop(t + tail + 0.4);
    lfo.start(t); lfo.stop(t + tail + 0.4);
  }

  // Texture: the shared seeded noise buffer through a swept band. This is the
  // "breath" / room-tone voice — the dominant colour of CHP's dungeon bed.
  function air(t, dur, o = {}) {
    if (!noiseBuf) return;
    const o1 = ctx.createGain(); o1.gain.value = 1; o1.connect(dry());
    send(o1, o.verb === undefined ? 0.5 : o.verb);
    const f = ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    const bp = o.bp || 500;
    try {
      f.frequency.setValueAtTime(bp, t);
      f.frequency.linearRampToValueAtTime(bp * (o.sweep === undefined ? 2.2 : o.sweep), t + dur);
      f.Q.value = o.q === undefined ? 1.4 : o.q;
    } catch (_) { /* stub */ }
    // src -> filter -> envelope gain -> bus
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const g = ctx.createGain();
    const tail = env(g, t, { a: o.a === undefined ? dur * 0.4 : o.a, d: dur * 0.3, s: 0.7, r: o.r === undefined ? 1.6 : o.r, peak: o.vol === undefined ? 0.05 : o.vol, dur });
    src.connect(f); f.connect(g); g.connect(o1);
    src.start(t); src.stop(t + tail + 0.3);
  }

  // --- percussion. CHP's ambient score does not use these; the kit ships them
  // because other games will, and the tests instantiate them so they can't rot.
  function kick(t, o = {}) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    try {
      osc.frequency.setValueAtTime(o.f0 || 130, t);
      osc.frequency.exponentialRampToValueAtTime(o.f1 || 40, t + 0.11);
    } catch (_) { /* stub */ }
    const g = ctx.createGain();
    const dur = o.dur || 0.24;
    try {
      g.gain.setValueAtTime(o.vol === undefined ? 0.3 : o.vol, t);
      g.gain.exponentialRampToValueAtTime(EPS, t + dur);
    } catch (_) { /* stub */ }
    osc.connect(g); g.connect(dry());
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  function snare(t, o = {}) {
    if (!noiseBuf) return;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    try { f.frequency.value = o.bp || 1900; f.Q.value = 0.8; } catch (_) { /* stub */ }
    const g = ctx.createGain();
    const dur = o.dur || 0.15;
    try {
      g.gain.setValueAtTime(o.vol === undefined ? 0.11 : o.vol, t);
      g.gain.exponentialRampToValueAtTime(EPS, t + dur);
    } catch (_) { /* stub */ }
    src.connect(f); f.connect(g); g.connect(dry());
    send(g, 0.35);
    src.start(t); src.stop(t + dur + 0.05);
  }

  function hat(t, o = {}) {
    if (!noiseBuf) return;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass';
    try { f.frequency.value = o.hp || 7000; } catch (_) { /* stub */ }
    const g = ctx.createGain();
    const dur = o.dur || 0.05;
    try {
      g.gain.setValueAtTime(o.vol === undefined ? 0.04 : o.vol, t);
      g.gain.exponentialRampToValueAtTime(EPS, t + dur);
    } catch (_) { /* stub */ }
    src.connect(f); f.connect(g); g.connect(dry());
    send(g, 0.2);
    src.start(t); src.stop(t + dur + 0.05);
  }

  const voices = { pad, drone, bell, pluck, bass, lead, air, kick, snare, hat };

  // ==========================================================================
  // SCHEDULER — lookahead step scheduling against ctx.currentTime
  // ==========================================================================
  const tracks = new Map();
  let cur = null, curName = null;
  let step = 0, nextTime = 0;
  let params = {};
  let timer = null;

  function registerTrack(name, spec) {
    if (!name || !spec || typeof spec.step !== 'function') throw new Error('registerTrack: needs { bpm, len, step }');
    tracks.set(name, {
      bpm: spec.bpm || 60,
      len: Math.max(1, spec.len | 0 || 16),
      vol: spec.vol === undefined ? 0.8 : spec.vol,
      step: spec.step,
    });
    return name;
  }

  /**
   * Schedule every step falling inside the lookahead window. Callable by hand
   * (the tests do exactly this) or driven by start()'s timer. Returns how many
   * steps it scheduled.
   */
  function tick(now = ctx.currentTime) {
    sweepRetired(now);
    if (!cur) return 0;
    const spb = 60 / cur.bpm / 4;
    let scheduled = 0;
    while (nextTime < now + lookahead && scheduled < MAX_STEPS_PER_TICK) {
      if (nextTime < now) nextTime = now + 0.03;
      const i = step % cur.len;
      const n = step;
      try {
        cur.step(i, nextTime, {
          v: voices, i, n, bar: (i / 16) | 0, params,
          rand: (salt = 0) => hash2(n, salt | 0, rngSeed),
        });
      } catch (_) { /* one bad step must never stop the score */ }
      step += 1;
      nextTime += spb;
      scheduled += 1;
    }
    return scheduled;
  }

  /**
   * Change track with a crossfade. Same name is a no-op (so a shell may call
   * this every frame). `null` fades to silence. Returns true if it switched.
   */
  function setTrack(name, o = {}) {
    if (name === curName) return false;
    const now = ctx.currentTime;
    retire(bus, now);
    bus = null;
    curName = name;
    cur = name ? tracks.get(name) || null : null;
    step = 0;
    if (!cur) return true;
    bus = makeBus(cur.vol);
    ramp(bus.out.gain, cur.vol, now, o.fadeIn === undefined ? fadeIn : o.fadeIn);
    ramp(bus.send.gain, 1, now, o.fadeIn === undefined ? fadeIn : o.fadeIn);
    nextTime = now + 0.03;
    tick(now); // begin at once — no gap waiting for the driver's first wake
    return true;
  }

  /** Live intensity params. Merged, no track restart — steps read s.params. */
  function setParams(p) { params = { ...params, ...(p || {}) }; return params; }

  function start() {
    if (timer || typeof setInterval !== 'function') return false;
    timer = setInterval(() => { try { tick(); } catch (_) { /* ignore */ } }, tickMs);
    if (timer && typeof timer.unref === 'function') timer.unref(); // never hold a node loop open
    return true;
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    return true;
  }

  function dispose() {
    stop();
    const now = ctx.currentTime;
    retire(bus, now);
    bus = null; cur = null; curName = null;
    try { out.disconnect(); } catch (_) { /* ignore */ }
  }

  return {
    voices,
    registerTrack,
    setTrack,
    setParams,
    tick,
    start,
    stop,
    dispose,
    setGain: (v) => { try { out.gain.value = clamp01(v); } catch (_) { /* ignore */ } },
    get track() { return curName; },
    get step() { return step; },
    get params() { return { ...params }; },
    get trackNames() { return [...tracks.keys()]; },
    get retiringCount() { return retiring.length; },
    get buses() { return { out, verb, verbReturn }; },
  };
}

// ---------------------------------------------------------------------------
// Generated impulse response: seeded exponentially-decaying noise. A convolver
// on a code-made IR is how you get a real reverb tail with zero assets.
// ---------------------------------------------------------------------------
function makeVerb(ctx, { seconds = 3.4, decay = 2.6 } = {}, seed = 1) {
  if (!ctx.createConvolver || !ctx.createBuffer) return null;
  try {
    const rate = ctx.sampleRate || 44100;
    const len = Math.max(1, Math.floor(rate * seconds));
    const buf = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const rnd = mulberry32((seed ^ (c * 0x9e3779b9)) >>> 0);
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const x = i / len;
        d[i] = (rnd() * 2 - 1) * Math.pow(1 - x, decay) * (1 - Math.exp(-i / 200));
      }
    }
    const cv = ctx.createConvolver();
    cv.buffer = buf;
    return cv;
  } catch (_) { return null; }
}

/** Two seconds of seeded white noise, shared by every noise voice. */
function makeNoise(ctx, seed = 1) {
  if (!ctx.createBuffer) return null;
  try {
    const rate = ctx.sampleRate || 44100;
    const buf = ctx.createBuffer(1, rate * 2, rate);
    const rnd = mulberry32(seed >>> 0);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
    return buf;
  } catch (_) { return null; }
}


// ===== src/score.js =====
// score.js — THE SCORE (DESIGN-SEED M7). Code-composed tracks for the band kit
// (src/band.js) — zero audio files, the only audio path (hard rule #10). The
// MUSICAL register is chiptune/medieval: a Famicom consort — square-ish leads,
// plucked courtly figures, processional marches — earnest period music on crude
// synthesis, which is itself the register joke. One track per game state, wired
// to march / town / office / combat / report.
//
// Each track is a `{ bpm, len, vol, step(i,t,s) }` the band schedules: `i` is the
// 16th-note step within the loop, `t` the audio time to schedule at, `s.v` the
// voice set { pad, drone, bell, pluck, bass, lead, air, kick, snare, hat }. All
// pitches are D-modal (Dorian/Aeolian) — a plain church-mode palette.
//
// SONG-STRUCTURE LAW (Ray, 2026-08-12; sharpened 2026-08-13): A/B is the floor,
// not the target. Every full song needs 3+ distinct sections with real arrangement
// variation (voicing, density, register movement); per-pass variation so consecutive
// passes differ; section lengths long enough that the full cycle takes minutes, not
// seconds; tempo erring calm. The register stays medieval/chip; this file governs
// STRUCTURE + arrangement depth, not voice.
//
// V3 (2026-08-13): answers the operator's V2 ear — "repeats fairly quickly… not sure
// two parts is enough… might need some more going on and to be slowed down a little."
// Three sections (A/B/C) × 12 bars, slower BPMs, pad/air/countermelody layers beyond
// V2. V2 remains in git history.
//
// V3.1 (2026-08-13): tempo-only notch. Operator ear on V3: "still a little too fast
// and should be slowed down a little bit, otherwise much better." Arrangement,
// voices, and register unchanged; each context BPM dropped ~10%.
//
// Weiss authors final score DIRECTION at this milestone (per the seed); these are
// the builder's tracks, structurally sound and register-correct, for the operator
// to ratify or redirect. Pure data + pure helpers; node-testable via a counting
// voice stub (the density probe), no WebAudio needed.

const N = noteFreq;

// ---- Form constants (V3) ---------------------------------------------------
// 3 sections × 12 bars × 16 sixteenths = 576 steps. At the V3.1 BPMs below,
// a full A→B→C cycle is ~1.5–3.5 minutes depending on the track.
const SECTION_BARS = 12;
const SECTION_COUNT = 3;
const LOOP_LEN = 16 * SECTION_BARS * SECTION_COUNT; // 576

const passOf = (n) => (n / LOOP_LEN) | 0;
const sectionOf = (bar) => (bar / SECTION_BARS) | 0; // 0=A, 1=B, 2=C
const barInSec = (bar) => bar % SECTION_BARS;

// ---- The tracks ------------------------------------------------------------
const TRACKS = {
  // OFFICE — the docket / intake / orientation. A waiting room that opens onto
  // a second chamber and then a corridor. Almost nothing happens, on purpose —
  // but the stillness now has three rooms and a soft pad bed V2 lacked.
  //   A (bars 0-11): D/A drone + soft pad, high bell, very still.
  //   B (bars 12-23): Bb/G drone, lower bell, sparse triangle lead.
  //   C (bars 24-35): A2/F2 drone, air breath, desk pluck, darker pad.
  //   Pass: bell pairs, pad root, air density, and lead ornaments rotate.
  office: {
    bpm: 45, len: LOOP_LEN, vol: 0.5,
    step(i, t, s) {
      const v = s.v, bar = s.bar, beat = i % 16, pass = passOf(s.n);
      const sec = sectionOf(bar), bi = barInSec(bar);
      const rootsA = ['D2', 'A2', 'D2', 'F2', 'A2', 'D2', 'G2', 'A2', 'D2', 'A2', 'F2', 'A2'];
      const rootsB = ['Bb2', 'G2', 'Bb2', 'F2', 'G2', 'Bb2', 'D2', 'G2', 'Bb2', 'F2', 'G2', 'A2'];
      const rootsC = ['A2', 'F2', 'A2', 'D2', 'F2', 'A2', 'G2', 'F2', 'A2', 'D2', 'F2', 'G2'];
      const root = (sec === 0 ? rootsA : sec === 1 ? rootsB : rootsC)[bi];
      if (beat === 0) {
        v.drone(t, N(root), 5.2, { vol: sec === 0 ? 0.40 : sec === 1 ? 0.34 : 0.30 });
        // Soft pad bed — the new layer beyond V2's drone+bell waiting room.
        const padRoot = pass % 2 === 0
          ? (sec === 0 ? 'D3' : sec === 1 ? 'Bb2' : 'A2')
          : (sec === 0 ? 'A2' : sec === 1 ? 'G2' : 'F2');
        v.pad(t, N(padRoot), 5.0, { vol: sec === 2 ? 0.055 : 0.045, cut: 520 + sec * 40, verb: 0.55 });
      }
      if (sec === 0) {
        const bells = pass % 2 === 0 ? ['F4', 'D4', 'A4', 'D4'] : ['D4', 'F4', 'C4', 'F4'];
        if (beat === 8 && bi % 2 === 0) v.bell(t, N(bells[(bi / 2) % 4]), 2.4, { vol: 0.20 });
        if (beat === 12 && bi === 11 && s.rand(101) < 0.55) v.bell(t, N('A4'), 1.8, { vol: 0.14 });
      } else if (sec === 1) {
        if (beat === 8) v.bell(t, N(bi % 2 ? 'A4' : 'D4'), 2.2, { vol: 0.18 });
        if (beat === 12 && (bi % 3 === pass % 3) && s.rand(111 + bi) < 0.5) {
          v.lead(t, N(bi % 2 ? 'F4' : 'C4'), 1.8, { wave: 'triangle', vol: 0.11 });
        }
      } else {
        if (beat === 0 && bi % 4 === 0) v.air(t, 4.8, { vol: 0.028 + (pass % 2) * 0.008, bp: 380 + bi * 8, verb: 0.6 });
        if (beat === 8) v.bell(t, N(pass % 2 ? 'D4' : 'F3'), 2.6, { vol: 0.16 });
        if (beat === 10 && bi % 2 === (pass % 2) && s.rand(121 + bi) < 0.45) {
          v.pluck(t, N(bi % 3 ? 'A3' : 'D3'), 0.35, { vol: 0.12 });
        }
      }
    },
  },

  // MARCH — a processional. Plucked courtly bass under a square lead, in D
  // Dorian; steady, earnest, faintly absurd. Three rooms of the road, slowed.
  //   A: bass on 1, sparse pluck counter, square melody, soft pad under.
  //   B: denser pluck, longer melody, high harmony on even passes.
  //   C: thinned to bass + countermelody + occasional bell; rebuild cadence.
  //   Pass: harmony voice, cadence ornament, pad root, and C-section counter rotate.
  march: {
    bpm: 77, len: LOOP_LEN, vol: 0.66,
    step(i, t, s) {
      const v = s.v, bar = s.bar, beat = i % 16, pass = passOf(s.n);
      const sec = sectionOf(bar), bi = barInSec(bar);
      const roots = ['D2', 'G2', 'A2', 'D2', 'F2', 'G2', 'A2', 'D2', 'G2', 'A2', 'Bb2', 'D2'];
      const root = roots[bi % 12];

      if (beat === 0 && bi % 4 === 0) {
        v.pad(t, N(pass % 2 ? 'D3' : 'A2'), 7.5, { vol: 0.04, cut: 640, verb: 0.45 });
      }

      if (sec === 0) {
        if (beat % 4 === 0 && !(bi === 11 && beat === 12)) v.bass(t, N(root), 0.6, { vol: 0.52 });
        const courts = [
          ['A3', 'D4', 'F4', 'D4'], ['B3', 'D4', 'G4', 'D4'],
          ['A3', 'C4', 'F4', 'A3'], ['G3', 'D4', 'F4', 'D4'],
        ];
        if (beat % 4 === 2) v.pluck(t, N(courts[bi % 4][(beat / 4) | 0]), 0.44, { vol: 0.36 });
        const melA = [
          { 0: 'D4', 6: 'F4', 8: 'A4', 12: 'G4' },
          { 0: 'G4', 4: 'A4', 8: 'B4', 14: 'A4' },
          { 0: 'F4', 6: 'A4', 10: 'G4', 14: 'F4' },
          { 0: 'A4', 4: 'D5', 8: 'C5', 12: 'A4' },
        ];
        const note = melA[bi % 4][beat];
        if (note) v.lead(t, N(note), 0.55, { wave: 'square', vol: 0.30 });
      } else if (sec === 1) {
        if (beat % 4 === 0) v.bass(t, N(root), 0.55, { vol: 0.54 });
        const courtsB = [
          ['A3', 'E4', 'G4', 'E4'], ['A3', 'D4', 'F4', 'A4'],
          ['G3', 'B3', 'D4', 'G4'], ['A3', 'C4', 'F4', 'A4'],
        ];
        if (beat % 2 === 0) v.pluck(t, N(courtsB[bi % 4][(beat / 4) | 0]), 0.36, { vol: 0.30 });
        if (beat === 14 && pass % 2 === 0) v.pluck(t, N('C5'), 0.24, { vol: 0.22 });
        const melB = [
          { 0: 'A4', 4: 'C5', 8: 'D5' },
          { 0: 'F4', 4: 'A4', 8: 'D5', 10: 'C5', 12: 'A4', 14: 'F4' },
          { 0: 'G4', 4: 'B4', 8: 'D5', 12: 'B4' },
          { 0: 'D5', 4: 'C5', 8: 'A4', 12: 'F4', 14: 'D4' },
        ];
        const note = melB[bi % 4][beat];
        if (note) v.lead(t, N(note), 0.5, { wave: 'square', vol: 0.34 });
        const harm = { 4: pass % 2 ? 'F5' : 'A5', 12: pass % 2 ? 'E5' : 'F5' };
        if (harm[beat] && bi % 2 === 0) v.lead(t, N(harm[beat]), 0.35, { wave: 'square', vol: 0.14 });
      } else {
        // C — thinned processional: bass + triangle countermelody + cadence bell.
        if (beat % 8 === 0) v.bass(t, N(root), 0.7, { vol: 0.48 });
        if (beat % 4 === 2 && bi % 2 === 0) v.pluck(t, N(['A3', 'D4', 'F4', 'A3'][(beat / 4) | 0]), 0.4, { vol: 0.28 });
        const counter = pass % 2 === 0
          ? { 0: 'D5', 8: 'A4', 12: 'F4' }
          : { 0: 'F5', 4: 'D5', 12: 'A4' };
        if (counter[beat] && bi % 3 !== 2) v.lead(t, N(counter[beat]), 0.7, { wave: 'triangle', vol: 0.20 });
        if (beat === 0 && bi % 4 === 3) v.bell(t, N(pass % 2 ? 'A4' : 'D5'), 1.8, { vol: 0.14 });
        if (bi === 11 && beat === 14) {
          const turn = pass % 3 === 0 ? 'C5' : pass % 3 === 1 ? 'D5' : 'F4';

  // TOWN — lighter than the road. A skipping plucked figure, soft pad, and a
  // welcome that promises nothing. Three densities of the same courtesy.
  //   A: pluck melody, sparse bass, bell, soft pad.
  //   B: walking bass, lead counter-melody, denser feel.
  //   C: pad + air room-tone, thinned pluck, triangle reply.
  //   Pass: counter-melody, pad root, C-section air, and phrase endings rotate.
  town: {
    bpm: 68, len: LOOP_LEN, vol: 0.58,
    step(i, t, s) {
      const v = s.v, bar = s.bar, beat = i % 16, pass = passOf(s.n);
      const sec = sectionOf(bar), bi = barInSec(bar);
      const phraseA = ['D4', 'A4', 'F4', 'A4', 'G4', 'A4', 'F4', 'D4'];
      const phraseB = ['G4', 'B4', 'A4', 'F4', 'E4', 'A4', 'C5', 'A4'];
      const phraseC = ['A4', 'F4', 'D4', 'F4', 'G4', 'F4', 'A4', 'D4'];
      const fig = sec === 0 ? (bi % 2 ? phraseB : phraseA)
        : sec === 1 ? (bi % 2 ? phraseA : phraseB)
        : (bi % 2 ? phraseC : phraseA);

      if (beat === 0 && bi % 3 === 0) {
        v.pad(t, N(pass % 2 ? 'D3' : 'G2'), 6.5, { vol: 0.038, cut: 700, verb: 0.5 });
      }

      if (sec === 0) {
        if (beat % 2 === 0) v.pluck(t, N(fig[(beat / 2) | 0]), 0.32, { vol: 0.30 });
        if (beat % 8 === 0) v.bass(t, N(roots[bi]), 0.65, { vol: 0.46 });
        if (beat === 12) v.bell(t, N(bi % 2 ? 'A4' : 'D5'), 1.6, { vol: 0.18 });
      } else if (sec === 1) {
        if (beat % 2 === 0) v.pluck(t, N(fig[(beat / 2) | 0]), 0.28, { vol: 0.28 });
        if (beat % 4 === 0) v.bass(t, N(roots[bi]), 0.55, { vol: 0.50 });
        const counter = bi % 2 === 0
          ? { 0: 'D5', 4: 'F5', 8: 'A5', 12: 'F5' }
          : { 0: 'G5', 4: 'F5', 8: 'D5', 12: 'C5' };
        if (counter[beat] && pass % 2 === (bi % 2)) {
          v.lead(t, N(counter[beat]), 0.3, { wave: 'triangle', vol: 0.16 });
        }
        if (beat === 12) v.bell(t, N(bi % 2 ? 'D5' : 'A4'), 1.5, { vol: 0.16 });
      } else {
        if (beat % 4 === 0) v.pluck(t, N(fig[(beat / 4) | 0]), 0.4, { vol: 0.24 });
        if (beat % 8 === 0) v.bass(t, N(roots[bi]), 0.7, { vol: 0.42 });
        if (beat === 0 && bi % 4 === 0) v.air(t, 5.5, { vol: 0.022 + (pass % 2) * 0.006, bp: 420, verb: 0.55 });
        const reply = pass % 2 === 0
          ? { 4: 'A4', 12: 'F4' }
          : { 4: 'D5', 8: 'A4' };
        if (reply[beat] && bi % 2 === 0) v.lead(t, N(reply[beat]), 0.5, { wave: 'triangle', vol: 0.14 });
        if (beat === 14 && s.rand(307 + bi) < 0.5) v.pluck(t, N(pass % 2 ? 'C5' : 'F4'), 0.22, { vol: 0.18 });
      }
      if (beat === 15 && sec < 2 && s.rand(317 + bar) < 0.5) {
        v.pluck(t, N(bi % 2 ? 'C5' : 'F4'), 0.2, { vol: 0.18 });
      }
    },
  },

  // COMBAT — driving, but no longer frantic. A pulse bass, full kit, square
  // arp, and a soft pad bed V2 never carried. Three shapes of the same fight.
  //   A: full backbeat — kick, snare, hat, bass, arp, pad.
  //   B: breakdown — sparse kit, lower arp, high fill on alternate passes.
  //   C: rebuild — denser kit, rising arp, pad opens, cadence fill.
  //   Pass: fill pitches, pad cut, and B-section lead density rotate.
  combat: {
    bpm: 94, len: LOOP_LEN, vol: 0.72,
    step(i, t, s) {
      const v = s.v, bar = s.bar, beat = i % 16, pass = passOf(s.n);
      const sec = sectionOf(bar), bi = barInSec(bar);
      const live = Number.isFinite(s.params.intensity) ? s.params.intensity : 0.55;
      const sectionForce = [0.78, 0.58, 0.95][sec];
      const force = Math.max(0.45, Math.min(1.2, live * 0.65 + sectionForce));

      if (beat === 0 && bi % 4 === 0) {
        v.pad(t, N(pass % 2 ? 'D2' : 'A1'), 7.0, {
          vol: 0.035 * force, cut: 480 + sec * 80, verb: 0.35,
        });
      }

      const bassA = [['D2', 'D2', 'F2', 'A2'], ['G2', 'D2', 'F2', 'A2']];
      const bassB = [['Bb2', 'F2', 'C2', 'A2'], ['D2', 'F2', 'A2', 'C3']];
      const bassC = [['D2', 'A2', 'F2', 'D2'], ['G2', 'Bb2', 'A2', 'D3']];
      const bassBank = sec === 0 ? bassA : sec === 1 ? bassB : bassC;
      const bass = bassBank[bi % 2];
      if (beat % 2 === 0 && !(sec === 1 && beat === 14 && bi % 2 === 1)) {
        v.bass(t, N(bass[((beat / 2) | 0) % 4]), 0.26, { vol: 0.46 * force });
      }

      if (beat % 4 === 0) v.kick(t, { vol: 0.55 * force });
      if (sec === 0) {
        if (beat % 4 === 2) v.snare(t, { vol: 0.38 * force });
        if (beat % 2 === 1) v.hat(t, { vol: 0.16 * force });
      } else if (sec === 1) {
        if ((bi % 2 === 0 && beat === 2) || (bi % 2 === 1 && beat % 4 === 2)) {
          v.snare(t, { vol: 0.40 * force });
        }
        if (beat % 2 === 1 && (bi % 2 === 1 || beat % 4 === 3)) v.hat(t, { vol: 0.16 * force });
      } else {
        if (beat % 4 === 2) v.snare(t, { vol: 0.40 * force });
        if (beat % 2 === 1) v.hat(t, { vol: 0.17 * force });
        if (beat === 14 && bi % 3 === pass % 3) v.hat(t, { vol: 0.12 * force });
      }

      const arpsA = [
        ['D4', 'F4', 'A4', 'D5', 'A4', 'F4', 'C5', 'A4'],
        ['G4', 'Bb4', 'D5', 'G5', 'D5', 'Bb4', 'A4', 'F4'],
      ];
      const arpsB = [
        ['Bb3', 'D4', 'F4', 'A4', 'F4', 'D4', 'C4', 'A3'],
        ['D4', 'F4', 'A4', 'C5', 'D5', 'C5', 'A4', 'F4'],
      ];
      const arpsC = [
        ['D4', 'F4', 'A4', 'C5', 'D5', 'A4', 'F4', 'D4'],
        ['A4', 'D5', 'F5', 'A5', 'F5', 'D5', 'C5', 'A4'],
      ];
      const arp = (sec === 0 ? arpsA : sec === 1 ? arpsB : arpsC)[bi % 2];
      if (!(sec === 1 && beat % 4 === 3 && bi % 2 === 0)) {
        v.lead(t, N(arp[beat % 8]), 0.2, { wave: 'square', vol: 0.20 * force });
      }
      if (sec === 1 && beat % 4 === 0 && pass % 2 === (bi % 2)) {
        const fill = bi % 2 === 0
          ? ['D5', 'F5', 'A5', 'C5']
          : ['D5', 'F5', 'A5', 'D6'];
        v.lead(t, N(fill[(beat / 4) | 0]), 0.12, { wave: 'square', vol: 0.18 * force });
      }
      if (sec === 2 && bi >= 10 && beat >= 12 && s.rand(401 + beat) < 0.7) {
        const climb = pass % 2 ? ['D5', 'F5', 'A5', 'D6'] : ['A4', 'D5', 'F5', 'A5'];
        v.lead(t, N(climb[beat - 12]), 0.12, { wave: 'square', vol: 0.18 * force });
      }
    },
  },

  // REPORT — the filed report / a reduction. Slow, somber; shifting drone,
  // sparse descending lead, and a pad/air bed V2 never carried. Deadpan grief.
  //   A: mid-register lead over drone + soft pad.
  //   B: lead drops an octave, pluck echo, darker bell.
  //   C: air room, lowest lead, sparse pad breaths, final desk bell.
  //   Pass: pad root, pluck echo, C-section air, and bell pitch rotate.
  report: {
    bpm: 41, len: LOOP_LEN, vol: 0.58,
    step(i, t, s) {
      const v = s.v, bar = s.bar, beat = i % 16, pass = passOf(s.n);
      const sec = sectionOf(bar), bi = barInSec(bar);
      const roots = ['D2', 'Bb2', 'G2', 'A2', 'F2', 'Bb2', 'G2', 'D2', 'A2', 'F2', 'G2', 'A2'];
      if (beat === 0) {
        v.drone(t, N(roots[bi]), 5.5, { vol: 0.40 - sec * 0.03 });
        v.pad(t, N(pass % 2 ? roots[bi] : (sec === 2 ? 'D2' : 'A1')), 5.2, {
          vol: 0.04, cut: 420 + sec * 30, verb: 0.6,
        });
      }
      if (sec === 0) {
        const phrase = bi % 2
          ? { 0: 'Bb3', 8: 'A3', 12: 'D4' }
          : { 0: 'D4', 8: 'C4' };
        const note = phrase[beat];
        if (note) v.lead(t, N(note), 1.9, { wave: 'triangle', vol: 0.26 });
        if (beat === 12 && s.rand(509 + bi) < 0.45) v.bell(t, N('F4'), 2.4, { vol: 0.15 });
      } else if (sec === 1) {
        const phrase = bi % 2
          ? { 0: 'G3', 8: 'F3', 12: 'A3' }
          : { 0: 'D3', 6: 'F3', 10: 'A3' };
        const note = phrase[beat];
        if (note) v.lead(t, N(note), 2.1, { wave: 'triangle', vol: 0.24 });
        const echo = bi % 2 ? { 4: 'D4', 12: 'C4' } : { 4: 'A3', 12: 'F3' };
        if (echo[beat] && pass % 2 === (bi % 2)) v.pluck(t, N(echo[beat]), 0.4, { vol: 0.13 });
        if (beat === 12 && s.rand(519 + bi) < 0.5) v.bell(t, N('D4'), 2.2, { vol: 0.14 });
      } else {
        if (beat === 0 && bi % 4 === 0) {
          v.air(t, 6.0, { vol: 0.025 + (pass % 2) * 0.008, bp: 320 + bi * 6, verb: 0.65 });
        }
        const phrase = pass % 2 === 0
          ? { 0: 'A2', 8: 'G2', 12: 'D3' }
          : { 0: 'D2', 6: 'F2', 12: 'A2' };
        const note = phrase[beat];
        if (note && bi % 2 === 0) v.lead(t, N(note), 2.4, { wave: 'triangle', vol: 0.22 });
        if (beat === 12 && bi === 11) v.bell(t, N(pass % 2 ? 'D4' : 'A3'), 3.0, { vol: 0.16 });
        if (beat === 8 && bi % 3 === pass % 3 && s.rand(529 + bi) < 0.4) {
          v.pluck(t, N('F3'), 0.5, { vol: 0.10 });
        }
      }
    },
  },
};

// STATE_TRACK — which track backs each UI screen. The shell calls setTrack with
// this every frame; the band no-ops when the name is unchanged.
const STATE_TRACK = {
  march: 'march', combat: 'combat', route: 'march',
  camp: 'town', shop: 'town', deck: 'town',
  docket: 'office', intake: 'office', title: 'office', howto: 'office',
  defeat: 'report', credits: 'office',
};

// trackForScreen: resolve a screen to its track name (office as the quiet default).
function trackForScreen(screen) {
  return STATE_TRACK[screen] || 'office';
}

// registerScore: register every track on a band instance.
function registerScore(band) {
  for (const [name, spec] of Object.entries(TRACKS)) band.registerTrack(name, spec);
  return band;
}

// Cycle length in seconds for a track (one full A→B→C pass).
function cycleSeconds(spec) {
  return spec.len * (60 / spec.bpm / 4);
}

// ---- The audio probe (density metrics — DESIGN-SEED M7) --------------------
// Run a track for `loops` full cycles against a COUNTING voice stub and tally the
// note events per voice. No WebAudio — this measures the COMPOSITION (how busy a
// track is, which voices it uses), so the score is testable + the density gate is
// deterministic. Returns { name, len, steps, notes, perStep, byVoice }.
const VOICE_NAMES = ['pad', 'drone', 'bell', 'pluck', 'bass', 'lead', 'air', 'kick', 'snare', 'hat'];
function probeTrack(spec, loops = 1) {
  const byVoice = {};
  let notes = 0;
  const v = {};
  for (const name of VOICE_NAMES) v[name] = () => { notes++; byVoice[name] = (byVoice[name] | 0) + 1; };
  const steps = spec.len * loops;
  for (let n = 0; n < steps; n++) {
    const i = n % spec.len;
    spec.step(i, n * 0.1, { v, i, n, bar: (i / 16) | 0, params: {}, rand: (salt = 0) => hash2(n, salt | 0, 0x0ff1ce) });
  }
  return { len: spec.len, steps, notes, perStep: notes / steps, byVoice };
}

// Stable event bytes for the variation regression. Voice arguments are data,
// not audio nodes, so two sections/seeds can be compared byte-for-byte in Node.
function renderTrackEventBytes(spec, { start = 0, steps = spec.len, seed = 0x0ff1ce, params = {} } = {}) {
  const events = [];
  const v = {};
  for (const name of VOICE_NAMES) v[name] = (...args) => events.push([name, ...args]);
  for (let n = start; n < start + steps; n++) {
    const i = n % spec.len;
    spec.step(i, n * 0.1, { v, i, n, bar: (i / 16) | 0, params, rand: (salt = 0) => hash2(n, salt | 0, seed) });
  }
  return JSON.stringify(events);
}


// ===== src/soak.js =====
// soak.js — honest M9 player-path acceptance. Every required verb is accounted
// per expedition and is credited only after its relevant state mutation is
// observed. Player verbs travel through KeyboardEvents; automated combat travels
// through the same requestAnimationFrame -> tickCombat path as ordinary play.


const SOAK_VERBS = ['cardPlay', 'jobChange', 'shopTxn', 'routeBranch', 'saveRoundTrip', 'deathCycle'];
const SOAK_STATE_KEY = 'office-of-the-road/soak/v2';

function freshVerbLedger() {
  return Object.fromEntries(SOAK_VERBS.map((verb) => [verb, false]));
}

function acceptanceFindings(expeditions, metrics) {
  const findings = [];
  const add = (sev, text) => { if (!findings.some((f) => f.text === text)) findings.push({ sev, text }); };
  for (let i = 0; i < expeditions.length; i++) {
    for (const [verb, ok] of Object.entries(expeditions[i].verbs)) if (!ok) add('BLOCKER', `expedition ${i + 1}: player-path verb did not mutate state: ${verb}`);
  }
  if (!expeditions.length) add('BLOCKER', 'no expedition reached a terminal report');
  if (metrics.maxPassiveSec > 25) add('BLOCKER', `longest passive stretch ${metrics.maxPassiveSec.toFixed(1)}s exceeds 25s floor`);
  if (metrics.interventionsPerMin < 3) add('BLOCKER', `interventions/min ${metrics.interventionsPerMin.toFixed(1)} below 3`);
  return findings;
}

function changed(a, b) { return JSON.stringify(a) !== JSON.stringify(b); }
function partyView(o) {
  return {
    jobs: o.party.frames.map((f) => f.jobId),
    hp: o.party.frames.map((f) => f.hp),
    gold: o.party.gold,
    supplies: o.party.supplies,
    inventory: (o.party.inventory || []).slice(),
  };
}

// installSoak: begin or continue the soak against a live game document. The only
// state carried over a reload is this driver ledger; the game itself must rebuild
// by rereading its own storage and presenting the returned docket.
function installSoak(win) {
  const o = win.__office;
  if (!o) return null;

  let stateStore = null;
  try {
    stateStore = win.sessionStorage;
    stateStore.setItem('__oor_soak_probe__', '1');
    stateStore.removeItem('__oor_soak_probe__');
  } catch {
    try { stateStore = win.localStorage; } catch { stateStore = null; }
  }
  const params = new URLSearchParams(win.location.search || '');
  if (params.has('fresh') && stateStore) stateStore.removeItem(SOAK_STATE_KEY);

  let recovered = null;
  if (stateStore) {
    try { recovered = JSON.parse(stateStore.getItem(SOAK_STATE_KEY) || 'null'); } catch { recovered = null; }
  }
  const S = recovered || {
    current: { verbs: freshVerbLedger(), startedMetaRuns: o.meta.runs | 0 },
    runs: [], verbs: null,
    metrics: { elapsedMs: 0, passiveMs: 0, maxPassiveSec: 0, interventions: 0, interventionsPerMin: 0 },
    findings: [], done: false, phase: 'run', steps: 0, spedUp: false,
    seenScreens: {}, reloads: 0, awaitingReload: false, reloadExpected: null,
  };
  S.verbs = S.current.verbs; // renderer compatibility; always the current expedition
  S.reloads = (S.reloads | 0) + (S.awaitingReload ? 1 : 0);
  win.__soak = S;

  let lastClock = win.performance.now();
  function updateClock() {
    const now = win.performance.now();
    const dt = Math.max(0, now - lastClock);
    lastClock = now;
    S.metrics.elapsedMs += dt;
    S.metrics.passiveMs += dt;
    S.metrics.maxPassiveSec = Math.max(S.metrics.maxPassiveSec, S.metrics.passiveMs / 1000);
  }
  function persist() {
    if (!stateStore) return false;
    try { stateStore.setItem(SOAK_STATE_KEY, JSON.stringify(S)); return true; } catch { return false; }
  }
  function key(k) { win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true })); }
  function act(kind) {
    updateClock();
    S.metrics.passiveMs = 0;
    S.metrics.interventions += 1;
    if (kind) S.seenScreens[kind] = (S.seenScreens[kind] | 0) + 1;
  }
  function pickCombatCard(o, cb) {
    const minHp = Math.min(...o.party.frames.filter((f) => f.alive).map((f) => f.hp / f.max.hp), 1);
    const hurt = minHp < 0.85;
    for (let i = 0; i < o.deck.hand.length; i++) {
      const card = getCard(o.deck.hand[i]);
      const win = evaluateCard(cb.st, o.deck.hand[i]);
      const isHeal = card.kind === 'mend' || card.kind === 'salve' || card.kind === 'ward';
      if (win === 'decisive' && !isHeal) return i;
      if (isHeal && hurt && win !== 'wasted') return i;
    }
    return -1;
  }

  function shopActionOrder(o) {
    const ids = o.controlIds().filter((id) => /^buy\d+$/.test(id) || id === 'resupply');
    const gold = o.party.gold | 0;
    const buys = ids.filter((id) => /^buy\d+$/.test(id)).map((id) => {
      const line = o.ui.shop.lines[Number(id.slice(3))];
      return { id, price: line ? line.price : Infinity, sold: line ? line.sold : true };
    }).filter((x) => !x.sold).sort((a, b) => a.price - b.price || (a.id < b.id ? -1 : 1));
    const order = buys.filter((x) => gold >= x.price).map((x) => x.id);
    if (gold >= TUNING.resupplyCost && ids.includes('resupply')) order.push('resupply');
    for (const id of ids) if (!order.includes(id)) order.push(id);
    return order;
  }
  function find(sev, text) { if (!S.findings.some((f) => f.text === text)) S.findings.push({ sev, text }); }
  function mark(verb, ok, failure) {
    if (ok) { S.current.verbs[verb] = true; act(verb); return true; }
    if (failure) find('DEFECT', failure);
    return false;
  }

  function focusThenEnter(pred) {
    const fid = o.focusId();
    if (fid && pred(fid)) { key('Enter'); return true; }
    key('Tab');
    return false;
  }

  function beginRealReload() {
    if (S.awaitingReload) return;
    if (!stateStore) { find('BLOCKER', 'save/quit/reload could not persist the soak driver across documents'); return; }
    S.awaitingReload = true;
    S.reloadExpected = o.stateSnapshot();
    updateClock();
    if (!persist()) { find('BLOCKER', 'save/quit/reload could not persist its expected state'); return; }
    const url = new URL(win.location.href);
    url.searchParams.delete('fresh');
    win.history.replaceState(null, '', url.href);
    win.location.reload(); // beforeunload performs the ordinary quit save
  }

  function finish() {
    if (S.done) return;
    updateClock();
    const mins = Math.max(1 / 600, S.metrics.elapsedMs / 60000);
    S.metrics.interventionsPerMin = S.metrics.interventions / mins;
    S.findings.push(...acceptanceFindings(S.runs, S.metrics).filter((f) => !S.findings.some((old) => old.text === f.text)));
    S.pass = !S.findings.some((f) => f.sev === 'BLOCKER');
    S.done = true;
    persist();
    if (win.__soakTimer) { win.clearInterval(win.__soakTimer); win.__soakTimer = null; }
    try {
      const b = Object.values(S.verbs).filter(Boolean).length;
      win.document.title = `SOAK ${S.pass ? 'PASS' : 'FAIL'} verbs=${b}/6 blockers=${S.findings.filter((f) => f.sev === 'BLOCKER').length} defects=${S.findings.filter((f) => f.sev === 'DEFECT').length} friction=${S.findings.filter((f) => f.sev === 'FRICTION').length} reloads=${S.reloads | 0} passive=${S.metrics.maxPassiveSec.toFixed(1)}s ipm=${S.metrics.interventionsPerMin.toFixed(1)}`;
    } catch { /* headless title may be read-only */ }
  }

  function step() {
    if (S.done) return;
    updateClock();
    S.steps += 1;
    if (S.steps > 12000) { find('BLOCKER', 'soak did not complete the player path within the step budget'); return finish(); }
    const scr = o.ui.screen;
    S.seenScreens[scr] = (S.seenScreens[scr] | 0) + 1;
    if (scr !== 'camp') S.campRested = false;

    if (S.awaitingReload) {
      if (scr !== 'docket') { find('BLOCKER', `real reload did not return to the docket (opened ${scr})`); return finish(); }
      if (focusThenEnter((id) => id === 'resume')) {
        const exact = o.stateSnapshot() === S.reloadExpected;
        mark('saveRoundTrip', exact && o.ui.screen === 'combat', exact ? null : 'real reload did not resume the byte-exact live combat state');
        S.awaitingReload = false;
        S.reloadExpected = null;
        persist();
      }
      return;
    }

    switch (scr) {
      case 'title': {
        if (o.focusId() !== 'start') { key('Tab'); return; }
        key('Enter');
        if (o.ui.screen === 'march') act('titleStart');
        return;
      }
      case 'howto': {
        key('Escape');
        return;
      }
      case 'intake': {
        key('Enter');
        if (o.ui.screen === 'march') act('intake');
        return;
      }
      case 'combat': {
        const cb = o.ui.combat;
        if (!cb) return;
        const combatToken = `${cb.leg}:${o.march.encounterCount}`;
        if (S.combatToken !== combatToken) { S.combatToken = combatToken; S.cardsThisFight = 0; }
        if (cb.draft) {
          const before = o.deck.list.length;
          key('Enter');
          if (o.deck.list.length === before + 1) act('draft');
          else find('DEFECT', 'draft input did not add the selected card');
          return;
        }
        if (!cb.done) {
          const cardsPlayed = S.cardsThisFight | 0;
          const minHp = Math.min(...o.party.frames.filter((f) => f.alive).map((f) => f.hp / f.max.hp), 1);
          const hurt = minHp < 0.85;
          const cardBudget = hurt ? 4 : 3;
          const verbsDone = SOAK_VERBS.filter((v) => v !== 'deathCycle').every((v) => S.current.verbs[v]);
          const idx = verbsDone ? -1 : pickCombatCard(o, cb);
          if (cardsPlayed < cardBudget && idx >= 0) {
            const beforeHand = o.deck.hand.slice();
            const beforeCards = cb.st.log.filter((e) => e.side === 'card').length;
            key(String(idx + 1));
            const afterCards = cb.st.log.filter((e) => e.side === 'card').length;
            const mutated = changed(beforeHand, o.deck.hand) && afterCards === beforeCards + 1;
            if (!S.current.verbs.cardPlay) mark('cardPlay', mutated, 'card key did not mutate both the hand and combat log');
            else if (mutated) act('card');
            else find('DEFECT', 'card key did not mutate both the hand and combat log');
            if (mutated) S.cardsThisFight = (S.cardsThisFight | 0) + 1;
            return;
          }
          if (!S.current.verbs.saveRoundTrip) { beginRealReload(); return; }
          if (o.ui.paused) {
            const before = o.ui.paused;
            key(' ');
            if (o.ui.paused !== before) act('combatResume');
          }
          // Normal rAF is intentionally allowed to call tickCombat; no debug step.
          return;
        }
        return; // normal tickCombat delay surfaces the draft/end
      }
      case 'route': {
        const beforeRoutes = Object.keys(o.ledger.routeByLeg || {}).length;
        key('Enter');
        const afterRoutes = Object.keys(o.ledger.routeByLeg || {}).length;
        mark('routeBranch', o.ui.screen === 'march' && afterRoutes === beforeRoutes + 1, 'route input did not file a route mutation');
        return;
      }
      case 'camp': {
        if (!S.current.verbs.jobChange) {
          if (o.focusId() !== 'f3') { key('Tab'); return; }
          const before = partyView(o).jobs;
          key('ArrowRight');
          mark('jobChange', changed(before, partyView(o).jobs), 'camp reassignment input did not change a frame job');
          return;
        }
        if (!S.campRested) {
          if (focusThenEnter((id) => id === 'rest')) {
            S.campRested = true;
            act('restAttempt');
          }
          return;
        }
        const town = o.ui.camp && o.ui.camp.isTown;
        if (town && !S.current.verbs.shopTxn && !S.shopUnavailable) { focusThenEnter((id) => id === 'shop'); return; }
        focusThenEnter((id) => id === 'march');
        return;
      }
      case 'shop': {
        if (!S.current.verbs.shopTxn) {
          S.shopTried = S.shopTried || [];
          const order = shopActionOrder(o);
          const target = order.find((id) => !S.shopTried.includes(id));
          if (!target) {
            find('DEFECT', 'every shop action was refused; no transaction mutated state');
            S.shopUnavailable = true;
            key('Escape');
            return;
          }
          if (o.focusId() === target) {
            const before = partyView(o);
            key('Enter');
            const after = partyView(o);
            S.shopTried.push(target);
            mark('shopTxn', changed(before, after), null);
          } else key('Tab');
          return;
        }
        key('Escape');
        return;
      }
      case 'defeat': {
        const rep = o.ui.report;
        const mutated = !!(rep && rep.filed && rep.filed.lines.length && rep.gains && (o.meta.runs | 0) === (S.current.startedMetaRuns | 0) + 1 && !o.savedOk());
        mark('deathCycle', mutated, 'terminal report did not bank once and close the resumable save');
        if (rep && rep.filed && !rep.filed.lines.some((l) => l.tone === 'credit')) find('DEFECT', 'filed report has no credit line');
        S.runs.push({ verbs: { ...S.current.verbs }, cause: rep && rep.cause });
        return finish();
      }
      case 'march': {
        if (o.ui.paused) {
          key(' ');
          act('openingUnpause');
          return;
        }
        if (!S.spedUp) {
          const before = o.config.speedIndex;
          key('ArrowRight'); key('ArrowRight'); key('ArrowRight');
          S.spedUp = true;
          if (o.config.speedIndex !== before) act('speed');
        }
        return; // normal rAF advances the march
      }
      default: return;
    }
  }

  win.__soakTimer = win.setInterval(step, 24);
  return S;
}

const REPLACE = {
  '‘': "'", '’': "'", '“': '"', '”': '"', '–': '-', '—': '-', '−': '-',
  '·': '.', '•': '*', '×': 'x', '¤': '$', '→': '>', '←': '<', '►': '>',
  '◄': '<', '✓': 'V', '✗': 'X', '⚠': '!', '…': '...', '≥': '>', '≤': '<',
};

function expanded(text) {
  let out = '';
  for (const raw of String(text == null ? '' : text)) {
    const clean = REPLACE[raw] || raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    for (const ch of clean) out += G[ch] ? ch : '?';
  }
  return out;
}

function pixelScale(ctx) {
  const match = /([0-9.]+)px/.exec(String(ctx && ctx.font || '7px'));
  return match && Number(match[1]) >= 9 ? 2 : 1;
}

function bounds(ch) {
  if (ch === ' ') return { left: 0, width: 3, advance: 3 };
  const rows = G[ch] || G['?'];
  let left = 5, right = -1;
  for (const row of rows) for (let col = 0; col < 5; col++) if (row[col] === '1') {
    left = Math.min(left, col); right = Math.max(right, col);
  }
  const width = right >= left ? right - left + 1 : 3;
  return { left: right >= left ? left : 0, width, advance: width + 1 };
}

function logicalWidth(chars) {
  let width = 0;
  for (const ch of chars) width += bounds(ch).advance;
  return width ? width - 1 : 0;
}

function pixelTextWidth(ctx, text) {
  const chars = expanded(text);
  const scale = pixelScale(ctx);
  return logicalWidth(chars) * scale;
}

function pixelText(ctx, text, x, y) {
  const chars = expanded(text);
  if (!chars) return 0;
  const scale = pixelScale(ctx);
  const width = logicalWidth(chars) * scale;
  let left = Math.round(x);
  if (ctx.textAlign === 'right' || ctx.textAlign === 'end') left -= width;
  else if (ctx.textAlign === 'center') left -= Math.floor(width / 2);
  const top = Math.round(y);
  if (Array.isArray(ctx.__pixelTextEvents)) ctx.__pixelTextEvents.push({
    text: String(text == null ? '' : text), x: left, y: top, w: width, h: 7 * scale,
  });
  let cursor = 0;
  for (let ci = 0; ci < chars.length; ci++) {
    const rows = G[chars[ci]] || G['?'];
    const metric = bounds(chars[ci]);
    for (let row = 0; row < 7; row++) {
      let col = metric.left;
      const right = metric.left + metric.width;
      while (col < right) {
        while (col < right && rows[row][col] !== '1') col++;
        const start = col;
        while (col < right && rows[row][col] === '1') col++;
        if (start < col) ctx.fillRect(left + (cursor + start - metric.left) * scale, top + row * scale, (col - start) * scale, scale);
      }
    }
    cursor += metric.advance;
  }
  return width;
}

const PIXEL_FONT = Object.freeze({ cellWidth: 5, cellHeight: 7, proportional: true });

function glyphRows(ch) {
  return (G[ch] || G['?']).slice();
}


// ===== src/text-wrap.js =====
// Shared word-wrap used by the live renderer and the objective text gate.
// Measurement is always pixelTextWidth (shipped bitmap face), never canvas fonts.


function wrapLinesNoEllipsis(ctx, text, maxW, maxLines = Infinity) {
  const words = String(text == null ? '' : text).trim().split(/\s+/).filter(Boolean);
  if (!words.length || maxLines <= 0) return [];
  const lines = [];
  let lineStr = '';
  for (const word of words) {
    const test = lineStr ? lineStr + ' ' + word : word;
    if (pixelTextWidth(ctx, test) <= maxW) { lineStr = test; continue; }
    if (lineStr) { lines.push(lineStr); lineStr = ''; }
    if (pixelTextWidth(ctx, word) <= maxW) { lineStr = word; continue; }
    // Never split inside a word — emit the whole token (width gate catches overflow).
    if (lineStr) { lines.push(lineStr); lineStr = ''; }
    if (lines.length >= maxLines) { lineStr = word; break; }
    lineStr = word;
  }
  if (lineStr) lines.push(lineStr);
  return lines.length <= maxLines ? lines : lines.slice(0, maxLines);
}

function truncateText(ctx, text, maxW) {
  const source = String(text == null ? '' : text);
  if (maxW <= 0) return '';
  if (pixelTextWidth(ctx, source) <= maxW) return source;
  const ellipsis = '…';
  if (pixelTextWidth(ctx, ellipsis) > maxW) return '';
  let end = source.length;
  while (end > 0 && pixelTextWidth(ctx, source.slice(0, end).trimEnd() + ellipsis) > maxW) end--;
  return source.slice(0, end).trimEnd() + ellipsis;
}

function wrapLines(ctx, text, maxW, maxLines = Infinity) {
  const words = String(text == null ? '' : text).trim().split(/\s+/).filter(Boolean);
  if (!words.length || maxLines <= 0) return [];
  const lines = [];
  let lineStr = '';
  for (const word of words) {
    const test = lineStr ? lineStr + ' ' + word : word;
    if (pixelTextWidth(ctx, test) <= maxW) { lineStr = test; continue; }
    if (lineStr) { lines.push(lineStr); lineStr = ''; }
    if (pixelTextWidth(ctx, word) <= maxW) { lineStr = word; continue; }
    let rest = word;
    while (rest) {
      let end = 1;
      while (end < rest.length && pixelTextWidth(ctx, rest.slice(0, end + 1)) <= maxW) end++;
      const part = rest.slice(0, end);
      rest = rest.slice(end);
      if (rest) lines.push(part); else lineStr = part;
    }
  }
  if (lineStr) lines.push(lineStr);
  if (lines.length <= maxLines) return lines;
  const visible = lines.slice(0, maxLines);
  const last = visible.length - 1;
  visible[last] = truncateText(ctx, visible[last] + ' …', maxW);
  return visible;
}

// Shared bottom-band ownership. Content rows are clamped wholly above the live
// march/combat controls; control labels are rendered inside their own rectangles.
const CONTROL_BAND_Y = 182;
const CONTROL_BAND_BOTTOM = 196;
const CORE_TEXT_HEIGHT = 7;
/** Minimum line spacing: one pixel leading below the 7-row glyph cell. */
const TEXT_LEADING = CORE_TEXT_HEIGHT + 1;
const CONTENT_TEXT_MAX_Y = CONTROL_BAND_Y - CORE_TEXT_HEIGHT;

const NATIVE_W = 320;
const NATIVE_H = 200;

function contentTextY(y) {
  return Math.min(y, CONTENT_TEXT_MAX_Y);
}

function boxesIntersect(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/**
 * Largest integer multiple of the native buffer that fits the window, centered.
 * Always integer scale (crisp pixels). Letterbox offsets are inclusive of the
 * dark stage around the canvas.
 */
function computeDisplayFit(vpW, vpH, nw = NATIVE_W, nh = NATIVE_H) {
  const w = Math.max(1, vpW | 0), h = Math.max(1, vpH | 0);
  const scale = Math.max(1, Math.floor(Math.min(w / nw, h / nh)));
  const cssW = nw * scale, cssH = nh * scale;
  const offX = Math.floor((w - cssW) / 2);
  const offY = Math.floor((h - cssH) / 2);
  return {
    scale, cssW, cssH, offX, offY,
    fillW: cssW / w, fillH: cssH / h,
  };
}

/** Remap a client pointer into native buffer coordinates given a live fit. */
function pointerToNative(clientX, clientY, canvasLeft, canvasTop, scale) {
  const s = scale > 0 ? scale : 1;
  return { x: (clientX - canvasLeft) / s, y: (clientY - canvasTop) / s };
}

/** HOW TO PLAY control rectangles (page-aware). */

  rows.push({ id: 'back', label: 'TITLE', rect: { x: 214, y: 182, w: 94, h: 14 } });

}

/**
 * Draw-list rows for the title: brand + tag + menu labels.
 * Used by the overlap test (CHP pattern) — art regions are separate rects.
 */
function buildTitleDrawList() {
  const rows = [];
  rows.push({ region: 'brand', text: TITLE_NAME, x: 12, y: 8, w: FULL, h: 10 });
  rows.push({ region: 'brand', text: TITLE_TAG, x: 12, y: 24, w: FULL, h: CORE_TEXT_HEIGHT });
  rows.push({ region: 'brand', text: TITLE_SUB, x: 24, y: 36, w: FULL - 24, h: CORE_TEXT_HEIGHT });
  for (const c of titleMenuRects()) {
    rows.push({
      region: 'menu', text: c.label,
      x: c.rect.x + 4, y: c.rect.y + 4,
      w: c.rect.w - 8, h: CORE_TEXT_HEIGHT,
      control: c.rect,
    });
