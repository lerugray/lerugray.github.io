// ===== src/tuning.js =====
// tuning.js — EVERY gameplay constant and curve lives here (DESIGN-SEED M1).
// Each entry names its SHAPE (linear / geometric / step / flat) and its intended
// FEEL in a one-line comment. No magic numbers scattered through the engine —
// invisible tuning is the likeliest quiet failure (CLAUDE.md: failures are loud).
//
// Rule: if a number in game logic changes the FEEL of the game, it belongs here.
// Pure data + pure helpers only — no DOM, no RNG, importable by node --test.

const TUNING = {
  // ---- Time & pacing -------------------------------------------------------
  // A TICK is the engine's atomic step. The march advances one tick at a time;
  // combat, generation lookahead, and autosave cadence all count in ticks so the
  // whole engine is deterministic under seed (DESIGN-SEED stack).
  tickMs: 100, // flat — real milliseconds per tick at 1x speed. 10 ticks/sec.

  // Speed control (M1). A seeded config value with a UI control from the first
  // march loop. step — discrete multipliers, never a continuous slider.
  speedSteps: [0.5, 1, 2, 4], // step — allowed march/combat speed multipliers
  defaultSpeedIndex: 1, // flat — start at 1x (speedSteps[1])

  // ---- The road (M1 skeleton) ---------------------------------------------
  // A leg is one stretch of road between pause points. Distance is measured in
  // "paces"; the party covers pacesPerTick paces each tick at 1x.
  pacesPerTick: 1, // flat — one pace per tick; speed multiplies wall-clock, not paces
  legLengthPaces: 120, // flat — paces in one road leg before a pause point (~12s at 1x)

  // Encounter ticker (M1 skeleton — real combat is M2). How often the road
  // offers an encounter, expressed as a per-pace chance drawn from the encounter
  // stream. Kept low so a leg has a handful of encounters, not a wall of them.
  encounterChancePerPace: 0.04, // flat — ~1 in 25 paces rolls an encounter (~5/leg)
  encounterMinGapPaces: 8, // flat — no two encounters closer than this (breathing room)
  // Opening grace (release look): no encounter rolls until the party has covered
  // this many paces after START. ~5s at 1× — a stranger can read the desk first.
  firstEncounterMinPaces: 50, // flat — first-minutes pacing; does not invent new verbs
  // Road encounter tier mix (M4). The open road is ORDINARY work: routine
  // dominates (winnable card-free — the zero-card law), elites are occasional
  // contested crossings, bosses are rare jurisdictions the deck is meant for.
  // A weighted single draw off the encounter stream (replaces the M1 uniform
  // placeholder). Weights sum to 1; determinism preserved (same one draw/roll).
  roadTierWeights: { routine: 0.80, elite: 0.16, boss: 0.04 }, // step — routine-heavy road

  // ---- Save cadence (M1) ---------------------------------------------------
  // "The Office holds the file open" — autosave at every structural beat. This
  // is the tick interval for the safety heartbeat autosave between beats.
  autosaveHeartbeatTicks: 50, // flat — belt-and-suspenders autosave every 5s at 1x

  // ---- Determinism probe (M1) ---------------------------------------------
  determinismProbeTicks: 200, // flat — save/reload must match this many ticks byte-for-byte

  // ---- Party + jobs (M2) ---------------------------------------------------
  partySize: 4, // flat — active frames the Office assigns to a road
  // Base stat block for a level-1 frame BEFORE the job's weighting is applied.
  // A job multiplies these (see jobs.js weights); this is the shared chassis.
  baseStats: { hp: 32, atk: 10, def: 6, mag: 9, spd: 10 }, // flat — the neutral frame
  // Attrition (M2 core): HP and supplies persist across encounters; recovery only
  // at camps/towns, at cost. Supplies are the expedition's consumable reserve.
  startSupplies: 40, // flat — supplies a fresh expedition carries
  campRecoverHpFrac: 0.5, // step — a camp rest restores this fraction of missing HP...
  campRecoverSupplyCost: 6, // flat — ...and deducts this many supplies to do it
  supplyPerEncounter: 1, // linear — supplies consumed by fielding one encounter

  // ---- Combat resolver (M2) ------------------------------------------------
  // Damage = max(dmgFloor, round(power * ATK|MAG - target.DEF * defScale)).
  dmgFloor: 1, // flat — a landed blow always removes at least this much
  defScale: 0.6, // linear — how much a point of DEF mitigates incoming power
  healScale: 1.0, // linear — MAG-to-healing conversion
  guardDefBonus: 0.6, // step — fractional DEF raise a guard/ward grants for a round
  combatMaxRounds: 40, // flat — resolver hard stop (a stalled fight is a loud defect)
  // Enemy encounter tiers (skeleton scaling; real bestiary art wires at M2 inc3).
  // Each tier: enemy count + a stat multiplier vs the base frame chassis.
  // Tuned so the auto-resolver hits the committed win bands below (measured by
  // the M2 baseline probe over 2000 seeded fights with the default comp).
  encounterTiers: {
    routine: { count: 3, mult: 1.44 }, // step — the road's ordinary work (~94% auto-win)
    elite: { count: 3, mult: 1.62 }, // step — a contested crossing (~54%)
    boss: { count: 1, mult: 3.4 }, // step — a jurisdiction that will not yield (~11%)
  },

  // ---- M2 exit gates -------------------------------------------------------
  // Committed target auto-win bands (DESIGN-SEED M2). M3 tunes the tarot deck
  // against THIS baseline. Bands carry a small tolerance over the stated targets
  // (routine 90-95, elite 40-60, boss <15) to absorb sample noise.
  winRateBands: {
    routine: [0.88, 0.97], // target 90–95%
    elite: [0.38, 0.62], // target 40–60%
    boss: [0.0, 0.16], // target <15%
  },
  baselineProbeFights: 2000, // seeded fights per tier the baseline probe runs
  // Job-comp degeneracy sweep: a comp's ladder score may not exceed the median
  // comp's by more than this fraction; comps below the floor are flagged trap-tier.
  degeneracyMargin: 0.5, // step — max allowed (best/median − 1)
  degeneracyFloor: 0.6, // step — below floor×median = trap-tier
  degeneracyLadder: ['routine', 'routine', 'elite', 'routine', 'elite', 'boss'], // fixed seeded ladder

  // ---- The tarot deck (M3) -------------------------------------------------
  handSize: 3, // step — cards held in-hand during a fight
  cardDamageBase: 22, // flat — a strike card deals card.power × this
  cardHealBase: 14, // flat — a heal card restores card.power × this
  cardBuffBase: 10, // flat — a rally/ordinance raises ATK by card.power × this per frame
  cardWardBase: 8, // flat — a ward card raises DEF by card.power × this
  // A frame is "in danger" (heals/wards read decisive) below this HP fraction.
  cardDangerFrac: 0.4, // step — below 40% max HP, protection reads as decisive
  drawOnHandStep: true, // flat — draw to hand size when a fight begins / a card is played
  deckRemoveCost: 8, // flat — supplies to strike a card from the deck at camp (thin-deck)
  omenEveryLegs: 1, // step — a road omen is read at the start of each leg (flavour)

  // ---- Mandates + the ledger (M4) ------------------------------------------
  // The Office issues a mandate: a quest-chain with a terminus (a destination
  // leg). Reaching it DISCHARGES the mandate and pays its reward into the ledger;
  // the Office then issues the next. Generated on the `mandate` stream (never
  // perturbs combat/terrain), so mandate content is deterministic under seed.
  mandateLegSpan: [3, 5], // step — legs from issue to a mandate's terminus (a haul)
  mandateRewardBase: 26, // linear — base disbursement for discharging a mandate
  mandateRewardPerLeg: 9, // linear — added per leg of span (a longer haul pays more)
  // THE FLOOR (DESIGN-SEED M4): no discharge ever pays less than this. Combined
  // with per-leg encounter gold, forward progress is never worse than standing
  // still — a bad route/mandate can slow the ledger but never reverse it.
  mandateRewardFloor: 24, // flat — minimum mandate disbursement (progress ≥ standstill)
  mandateSideRange: [1, 2], // step — optional side-clauses attached to a mandate
  mandateSideBonus: 16, // flat — gold a met side-clause disburses
  mandateFrugalPerLeg: 2.4, // linear — a "frugal" clause allows this many encounters/leg of span
  mandateProvisionFrac: 0.5, // step — a "provisioned" clause wants supplies ≥ this frac of start

  // Combat victory disbursement (gold into the ledger), per encounter tier. The
  // road's pay scale — the always-on income the economy's sinks are curved against.
  goldPerWin: { routine: 7, elite: 19, boss: 52 }, // step — pay rises steeply with tier

  // ---- The quartermaster: towns, shops, equipment (M4) ---------------------
  // Some pause points are TOWNS (a quartermaster); the rest are plain camps.
  // A town stocks equipment gated by leg (no early run-ending power spike) and an
  // always-open RESUPPLY sink (the economy's guaranteed gold outlet).
  townEveryLegs: 2, // step — every Nth pause point is a town (a quartermaster present)
  shopStockSize: 4, // step — equipment lines a town's quartermaster stocks
  shopSellFraction: 0.5, // linear — fraction of price the quartermaster returns on a sell
  resupplyBlock: 8, // flat — supplies delivered per resupply purchase
  resupplyCost: 10, // linear — gold per resupply block (the always-open sink; never sold out)

  // ---- Route branches (M4) -------------------------------------------------
  // At each pause point the party ROUTES the next leg: a branch choice with a
  // legible safety-vs-resource tradeoff. A safe road is maintained (a supply
  // toll) but quiet; an exposed verge is free to travel but fights more (and so
  // pays more). Every branch still advances toward the floored mandate reward —
  // no branch makes forward progress worse than standing still. Content is a pure
  // function of (seed, leg); the chosen mods ride on the leg (march.legMods).
  routeBranchCount: 3, // step — branches offered at a pause point (safe/ordinary/exposed)
  // Archetype bands [lo,hi]; the exact figure is jittered per (seed,leg) inside.
  routeEncounterMult: { posted: [0.5, 0.7], ordinary: [0.9, 1.1], verge: [1.4, 1.7] }, // step
  routeGoldMult: { posted: [0.85, 0.95], ordinary: [1.0, 1.1], verge: [1.3, 1.5] }, // step
  routeSupplyToll: { posted: [2, 4], ordinary: [0, 1], verge: [0, 0] }, // step — supplies paid to take the road

  // ---- M4 economy exit gate (committed targets, MEASURED by the probe) ------
  // The intended net gold a surviving expedition banks per leg (income from the
  // road + amortized mandate discharge, minus the survival sinks). The economy
  // probe (economy.js) measures the actual figure over N seeded runs; the gate
  // asserts it lands in this band — the "intended gold balance per leg index".
  economyGoldPerLegBand: [30, 90], // step — target net gold/leg for a surviving run
  // A greedy (buy-everything) run must survive at least as deep as a hoarding
  // null run in at least this fraction of seeds — equipment must be WORTH buying.
  economyGreedyWorthFrac: 0.75, // step — greedy-survives-≥-null share (buying pays off)

  // ---- Certifications: job mastery (M5) ------------------------------------
  // Job mastery is the certification currency: jobs level ACROSS runs (fixed at
  // swap time within a run), and configuration compounds run-over-run. Mastery is
  // earned by fielding a job in won fights and banked when the expedition ends;
  // each level adds a small multiplier to that job's whole stat block. Default
  // (level 0 → ×1) leaves the M2 baseline exactly untouched.
  masteryXpPerWin: { routine: 1, elite: 3, boss: 8 }, // linear — mastery/job per won fight, by tier
  masteryXpPerLevel: 20, // linear — mastery XP to advance one certification level
  masteryStatPerLevel: 0.03, // linear — +3% to the job's stat block per level (compounds)
  masteryLevelCap: 10, // flat — certification levels per job (the wall's height, v1)

  // ---- Escalation curve (M5) -----------------------------------------------
  // Runs get DEEPER as the certification wall fills: a new expedition escalates
  // to a level set by the deepest leg ever reached, scaling BOTH enemy strength
  // and the road's pay (tougher, but richer). A fresh ledger (deepestLeg 0) →
  // level 0 → ×1, so the M2 baseline + economy gate are untouched.
  escalationEveryLegs: 3, // step — deepest-leg reached per escalation level
  escalationStep: 0.08, // linear — +8% enemy strength AND reward per escalation level
  escalationCap: 6, // flat — escalation ceiling (the world only deepens so far, v1)

  // ---- Abandon valve + no-progress detector (M5) ---------------------------
  // The player may FILE FOR EARLY RETURN at any camp/town — ends the run and
  // banks a reduced share of certification credit. A no-progress detector
  // surfaces the valve loudly when the expedition has stopped advancing.
  abandonCreditFrac: 0.5, // step — mastery share banked on a voluntary early return
  noProgressLegs: 2, // flat — consecutive stalled legs before the valve is surfaced loudly
};

// clampSpeedIndex: keep a speed index inside the speedSteps array (pure).
function clampSpeedIndex(i) {
  const n = TUNING.speedSteps.length;
  if (i < 0) return 0;
  if (i >= n) return n - 1;
  return i | 0;
}

// speedAt: the multiplier for a given speed index (pure).
function speedAt(i) {
  return TUNING.speedSteps[clampSpeedIndex(i)];
}


// ===== src/debuglog.js =====
// debuglog.js — LOUD FAILURES (CLAUDE.md hard rule #4; Ashen-Liturgy LoA pattern).
//
// Every runtime error surfaces visibly in-game AND lands in an exportable log.
// "Nothing happens" is a banned failure mode. This module is the log core:
//   - a bounded ring buffer of timestamped, tick-stamped entries
//   - levels: info / warn / error
//   - an onError subscriber so the UI can flash/surface the moment an error lands
//   - a plain-text export for the "exportable debug log" requirement
//
// DOM-free so it runs under node --test. main.js wires the visible surfacing
// (overlay + error banner) and installs the global browser handlers.

const LEVELS = { info: 0, warn: 1, error: 2 };

class DebugLog {
  constructor({ capacity = 500 } = {}) {
    this.capacity = capacity;
    this.entries = [];
    this.seq = 0;
    this.errorCount = 0;
    this._onError = null;
    this._onAny = null;
    this._tick = 0;
  }

  // setTick: stamp subsequent entries with the engine tick (called by the loop).
  setTick(t) {
    this._tick = t | 0;
  }

  // onError / onAny: UI subscribers. onError fires only for level 'error'.
  onError(fn) {
    this._onError = fn;
  }
  onAny(fn) {
    this._onAny = fn;
  }

  _push(level, msg, data) {
    const entry = {
      seq: this.seq++,
      level,
      tick: this._tick,
      msg: String(msg),
      data: data === undefined ? null : data,
    };
    this.entries.push(entry);
    if (this.entries.length > this.capacity) this.entries.shift();
    if (level === 'error') this.errorCount++;
    if (this._onAny) { try { this._onAny(entry); } catch { /* never let logging throw */ } }
    if (level === 'error' && this._onError) { try { this._onError(entry); } catch { /* ditto */ } }
    return entry;
  }

  info(msg, data) { return this._push('info', msg, data); }
  warn(msg, data) { return this._push('warn', msg, data); }
  error(msg, data) { return this._push('error', msg, data); }

  // guard: run fn; any throw is logged LOUDLY as an error (never swallowed) and
  // re-surfaced. Returns fn's result, or undefined if it threw. Use to wrap
  // per-tick / per-frame work so one bad frame becomes a visible logged error,
  // not a silent freeze.
  guard(label, fn) {
    try {
      return fn();
    } catch (e) {
      this.error(`${label}: ${e && e.message ? e.message : e}`, {
        stack: e && e.stack ? String(e.stack) : null,
      });
      return undefined;
    }
  }

  // recent: the last n entries (for the on-screen overlay).
  recent(n = 8) {
    return this.entries.slice(-n);
  }

  // exportText: the full log as a plain-text blob (the exportable debug log).
  exportText() {
    const head = `OFFICE OF THE ROAD — debug log (${this.entries.length} entries, ${this.errorCount} errors)`;
    const lines = this.entries.map((e) => {
      const lv = e.level.toUpperCase().padEnd(5);
      const d = e.data ? ' ' + safeJson(e.data) : '';
      return `[t${String(e.tick).padStart(6)}] ${lv} #${e.seq} ${e.msg}${d}`;
    });
    return [head, ...lines].join('\n');
  }

  compareLevel(a, b) {
    return LEVELS[a] - LEVELS[b];
  }
}

function safeJson(v) {
  try {
    return JSON.stringify(v);
  } catch {
    return '[unserializable]';
  }
}

// installGlobalHandlers: catch uncaught browser errors so they land in the log
// AND surface (loudness law). No-op under node (no window). Guarded so a missing
// global never throws.
function installGlobalHandlers(log, win) {
  if (!win || typeof win.addEventListener !== 'function') return;
  win.addEventListener('error', (ev) => {
    log.error(`uncaught: ${ev.message || 'error'}`, {
      src: ev.filename ? `${ev.filename}:${ev.lineno}:${ev.colno}` : null,
    });
  });
  win.addEventListener('unhandledrejection', (ev) => {
    const r = ev.reason;
    log.error(`unhandled rejection: ${r && r.message ? r.message : r}`, {
      stack: r && r.stack ? String(r.stack) : null,
    });
  });
}


// ===== src/prng.js =====
// Deterministic PRNG + coordinate hashing. No global state; everything seeded.
// The whole point of the Chapel Perilous stack is testability under seed.

// mulberry32: fast, seedable stream RNG. Returns a function -> float in [0,1).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// hash2: stateless spatial hash of an integer coordinate pair + seed -> [0,1).
// Same (x,y,seed) always yields the same value; independent of call order.
function hash2(x, y, seed) {
  let h = (seed >>> 0) ^ 0x9e3779b9;
  h = Math.imul(h ^ (x | 0), 0x27d4eb2d);
  h ^= h >>> 15;
  h = Math.imul(h ^ (y | 0), 0x85ebca6b);
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// hashInt: same as hash2 but returns a uint32 (handy for picking from tables).
function hashInt(x, y, seed) {
  return Math.floor(hash2(x, y, seed) * 4294967296) >>> 0;
}


// ===== src/rng.js =====
// rng.js — NAMED RNG STREAMS (DESIGN-SEED M1, baked into the spine).
//
// Law: an intervention that consumes randomness in one stream must NOT shift
// another. So each named stream is an independent mulberry32 sequence, seeded
// from the master seed via a per-stream salt. Drawing from `encounter` never
// perturbs `terrain`, `shuffle`, or `loot`.
//
// Every stream's state is a single uint32 — fully serializable, so a save can
// capture exact mid-expedition RNG position and a reload resumes byte-identically
// (the save-determinism probe depends on this).
//
// Pure logic — no DOM, no Math.random. Importable by node --test.


// The canonical stream names. Adding a stream = adding a salt here; existing
// streams keep their salts so old saves stay valid.
const STREAM_NAMES = ['terrain', 'encounter', 'shuffle', 'loot', 'combat', 'mandate'];

// Per-stream salts. Arbitrary distinct constants; NEVER reuse or reorder — a
// salt is part of the save format. (Values are just fixed 32-bit primes-ish.)
// `combat` is its own stream so that card plays (which draw from `shuffle` at
// M3) can never shift a fight's resolution, and vice-versa.
const STREAM_SALTS = {
  terrain: 0x7e1a11d,
  encounter: 0x3c0de5,
  shuffle: 0x5caff1e,
  loot: 0x1007ab1e,
  combat: 0xc0ba77, // distinct salt for combat resolution
  mandate: 0x3a9da7e, // M4: mandate/town/shop/route generation — never perturbs combat
};

// One independent, serializable mulberry32 stream.
class Stream {
  constructor(state) {
    this.a = state >>> 0;
  }
  // next: advance and return a float in [0,1). Same algorithm as prng.mulberry32,
  // but with the state held explicitly so it can be serialized/restored.
  next() {
    let a = this.a | 0;
    a = (a + 0x6d2b79f5) | 0;
    this.a = a >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // int: integer in [0, n) (pure-ish — advances the stream).
  int(n) {
    return Math.floor(this.next() * n);
  }
  // range: integer in [lo, hi] inclusive.
  range(lo, hi) {
    return lo + this.int(hi - lo + 1);
  }
  // chance: true with probability p in [0,1].
  chance(p) {
    return this.next() < p;
  }
  // pick: a uniform element of a non-empty array.
  pick(arr) {
    return arr[this.int(arr.length)];
  }
  getState() {
    return this.a >>> 0;
  }
  setState(s) {
    this.a = s >>> 0;
  }
}

// makeStreams: build the full named-stream set from a master seed.
function makeStreams(masterSeed) {
  const streams = {};
  for (const name of STREAM_NAMES) {
    const salt = STREAM_SALTS[name];
    // Derive each stream's initial state independently from (salt, masterSeed).
    streams[name] = new Stream(hashInt(salt, 0, masterSeed));
  }
  return streams;
}

// serializeStreams: capture every stream's exact position (save format).
function serializeStreams(streams) {
  const out = {};
  for (const name of STREAM_NAMES) out[name] = streams[name].getState();
  return out;
}

// restoreStreams: rebuild streams at saved positions. Unknown/missing names are
// re-seeded from the master seed so a forward-compatible save never crashes.
function restoreStreams(masterSeed, saved) {
  const streams = makeStreams(masterSeed);
  if (saved) {
    for (const name of STREAM_NAMES) {
      if (Object.prototype.hasOwnProperty.call(saved, name)) {
        streams[name].setState(saved[name]);
      }
    }
  }
  return streams;
}


// ===== src/engine.js =====
// engine.js — THE MARCH (DESIGN-SEED M1 skeleton). Pure, deterministic simulation
// of the party marching a generated road. No DOM, no wall-clock, no Math.random:
// a `step()` advances exactly one tick from the given state and returns the
// events that occurred, so replays and the save-determinism probe are exact.
//
// Real combat (M2) and mandates/towns (M4) replace the placeholder encounter
// ticker; this module owns the road, the pacing, and the deterministic spine.
//
// SPEED does NOT live here. Speed only changes how often main.js calls step();
// the simulation is identical at 0.5x and 4x. Pausing = main.js not calling step.


// Terrain the road passes through. Labels only (in-register jurisdictional
// terrain); the skeleton uses them for flavour + a future encounter-weight hook.
const TERRAINS = ['chalk-flat', 'fen', 'toll-wood', 'the-cutting', 'marker-stones'];

// generateLeg: build one leg's terrain profile from the terrain stream. Done once
// per leg (never interleaved with per-pace encounter rolls), so encounters and
// terrain stay independent. Returns an array of {from, terrain} segment starts.
function generateLeg(streams, legIndex) {
  // 3–5 segments per leg; each a terrain band. Uses the terrain stream only.
  const segCount = streams.terrain.range(3, 5);
  const segLen = Math.floor(TUNING.legLengthPaces / segCount);
  const segs = [];
  for (let i = 0; i < segCount; i++) {
    segs.push({ from: i * segLen, terrain: streams.terrain.pick(TERRAINS) });
  }
  return { legIndex, segCount, segs };
}

// rollRoadTier: a weighted single draw → encounter kind (1 routine / 2 elite /
// 3 boss). One next() off the encounter stream, so it advances the stream exactly
// like the old uniform roll (save-determinism unchanged). Pure w.r.t. the stream.
function rollRoadTier(stream) {
  const w = TUNING.roadTierWeights;
  const r = stream.next();
  if (r < w.routine) return 1;
  if (r < w.routine + w.elite) return 2;
  return 3;
}

// terrainAt: the terrain for a pace within a leg profile (positional, pure).
function terrainAt(profile, pace) {
  let t = profile.segs[0].terrain;
  for (const s of profile.segs) {
    if (pace >= s.from) t = s.terrain; else break;
  }
  return t;
}

// createMarch: fresh expedition state marching from pace 0 of leg 0.
function createMarch(seed) {
  const streams = makeStreams(seed);
  const state = {
    seed: seed >>> 0,
    streams,
    tick: 0,
    leg: 0,
    paces: 0, // paces into the current leg
    totalPaces: 0, // paces since the expedition began (never resets)
    terrain: null,
    lastEncounterPace: -TUNING.encounterMinGapPaces, // allow an early first encounter
    encounterCount: 0,
    legProfile: null,
    // Route mods riding on the current leg (M4). Neutral until the party routes a
    // leg at a pause point; the resolver + gold read these. The determinism probe
    // and the M2 baseline run under neutral mods, so both are unaffected.
    legMods: { encounterMult: 1, goldMult: 1 },
  };
  state.legProfile = generateLeg(streams, 0);
  state.terrain = terrainAt(state.legProfile, 0);
  return state;
}

// step: advance exactly one tick. Mutates `state`, returns an events array.
// Every event is a player-visible fact (action-legibility law): main.js renders
// them and the debug log records them. Pure w.r.t. (state) — no external inputs.
function step(state) {
  const events = [];
  state.tick += 1;

  const prevTerrain = state.terrain;
  state.paces += TUNING.pacesPerTick;
  state.totalPaces += TUNING.pacesPerTick;

  // Terrain under the party after moving.
  const terrainNow = terrainAt(state.legProfile, state.paces);
  if (terrainNow !== prevTerrain) {
    state.terrain = terrainNow;
    events.push({ type: 'terrain', terrain: terrainNow, pace: state.paces });
  }

  // Encounter roll for this pace (encounter stream only; min-gap enforced).
  // Opening grace: no rolls until firstEncounterMinPaces — first-minutes pacing.
  const sinceLast = state.paces - state.lastEncounterPace;
  const encMult = state.legMods ? state.legMods.encounterMult : 1;
  const pastGrace = state.totalPaces >= TUNING.firstEncounterMinPaces;
  if (pastGrace && sinceLast >= TUNING.encounterMinGapPaces && state.streams.encounter.chance(TUNING.encounterChancePerPace * encMult)) {
    state.lastEncounterPace = state.paces;
    state.encounterCount += 1;
    // Weighted road tier (M4): one draw off the encounter stream, routine-heavy
    // (the road's ordinary work), so a well-built party wins the common case
    // card-free. kind 1 routine / 2 elite / 3 boss.
    const kind = rollRoadTier(state.streams.encounter);
    events.push({
      type: 'encounter',
      n: state.encounterCount,
      kind,
      terrain: state.terrain,
      leg: state.leg,
      pace: state.paces,
    });
  }

  // Leg complete -> pause point (camp/town come in later milestones).
  if (state.paces >= TUNING.legLengthPaces) {
    events.push({ type: 'leg-complete', leg: state.leg, encounters: state.encounterCount });
    state.leg += 1;
    state.paces = 0;
    state.lastEncounterPace = -TUNING.encounterMinGapPaces;
    // The new leg starts neutral; the party's route choice at the pause point
    // sets its mods before marching resumes.
    state.legMods = { encounterMult: 1, goldMult: 1 };
    state.legProfile = generateLeg(state.streams, state.leg);
    state.terrain = terrainAt(state.legProfile, 0);
    events.push({ type: 'leg-begin', leg: state.leg, terrain: state.terrain });
  }

  return events;
}

// ---- Serialization (save-determinism spine; fully exercised at M1 inc3) ------

// serializeMarch: a plain-JSON snapshot capturing exact RNG position + progress.
function serializeMarch(state) {
  return {
    v: 1,
    seed: state.seed,
    tick: state.tick,
    leg: state.leg,
    paces: state.paces,
    totalPaces: state.totalPaces,
    terrain: state.terrain,
    lastEncounterPace: state.lastEncounterPace,
    encounterCount: state.encounterCount,
    legProfile: state.legProfile,
    legMods: state.legMods || { encounterMult: 1, goldMult: 1 },
    streams: serializeStreams(state.streams),
  };
}

// restoreMarch: rebuild live state from a snapshot, resuming byte-identically.
function restoreMarch(snap) {
  const streams = restoreStreams(snap.seed, snap.streams);
  return {
    seed: snap.seed >>> 0,
    streams,
    tick: snap.tick | 0,
    leg: snap.leg | 0,
    paces: snap.paces | 0,
    totalPaces: snap.totalPaces | 0,
    terrain: snap.terrain,
    lastEncounterPace: snap.lastEncounterPace | 0,
    encounterCount: snap.encounterCount | 0,
    legProfile: snap.legProfile,
    legMods: snap.legMods || { encounterMult: 1, goldMult: 1 },
  };
}

// runTicks: advance n ticks, returning a flat trace of events (test/probe helper).
function runTicks(state, n) {
  const trace = [];
  for (let i = 0; i < n; i++) {
    for (const ev of step(state)) trace.push({ tick: state.tick, ...ev });
  }
  return trace;
}

// The canonical roster order (stable — used by UI and the degeneracy sweep).
const JOB_IDS = ['bailiff', 'chirurgeon', 'surveyor', 'almoner', 'notary', 'sumpter'];

// The default expedition comp (a functional front/heal/dps/wall).
const DEFAULT_PARTY = ['bailiff', 'chirurgeon', 'surveyor', 'sumpter'];

function getJob(id) {
  const j = JOBS[id];
  if (!j) throw new Error('unknown job: ' + id);
  return j;
}

// deriveStats: the stat block a job produces from the shared base chassis. Pure
// and deterministic. `mult` scales the whole block (used for enemy tiers).
// `mult` scales the whole block (enemy tiers); `masteryMult` is the M5 job-mastery
// overlay (a job's certification level → +x% per level). Both default to 1, so
// callers that pass neither reproduce the exact M2 baseline block.
function deriveStats(jobId, mult = 1, masteryMult = 1) {
  const job = getJob(jobId);
  const b = TUNING.baseStats;
  const w = job.weights;
  const m = mult * masteryMult;
  return {
    hp: Math.round(b.hp * w.hp * m),
    atk: Math.round(b.atk * w.atk * m),
    def: Math.round(b.def * w.def * m),
    mag: Math.round(b.mag * w.mag * m),
    spd: Math.round(b.spd * w.spd * m),
  };
}

// verbSetKey: a stable signature of a job's verb list (for the distinctness law).
function verbSetKey(jobId) {
  return getJob(jobId).verbs.map((v) => v.id).sort().join('+');
}


// ===== src/items.js =====
// items.js — QUARTERMASTER ISSUE (DESIGN-SEED M4). Equipment is the gold-economy
// power axis: standardized kit the party buys at towns and assigns to frames.
// Orthogonal to jobs (a job is a fixed verb set; equipment is a stat overlay) and
// to the deck (run-scoped cards). Two slots per frame keep it legible:
//   arm   — the working instrument (offence: ATK or MAG)
//   guard — the standing protection (defence: DEF, sometimes HP/SPD)
//
// Register law 2: gear is STANDARDIZED ISSUE, never a relic or blessing. Names
// are quartermaster tags; text reads as a safety warning or a depreciating asset.
// Clean-room: original names, no reference's items. Pure data + pure helpers.
//
// An item: { id, name, slot, mods:{atk?,def?,mag?,hp?,spd?}, price, minLeg, tier, tag }
//   price  — gold to purchase at the quartermaster (sell returns a fraction)
//   minLeg — the earliest leg a shop may stock it (the no-early-power-spike curve)


const SLOTS = ['arm', 'guard'];

const ITEMS = {
  // ---- Tier 1 — issue kit (available from the first town) ------------------
  issue_billhook: { id: 'issue_billhook', name: 'Issue Billhook', slot: 'arm', mods: { atk: 3 }, price: 20, minLeg: 0, tier: 1,
