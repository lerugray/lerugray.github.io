__register("src/boot/browser.js", function(module, exports, __require) {
// THE JACQUARD INDEX — browser boot shim (the only DOM-touching module).
//
// Owns the requestAnimationFrame clock, the canvas, input wiring, error capture, and
// blitting the native framebuffer to screen with nearest-neighbor screen-fill scaling
// (hard-rule 3a: fractional-but-nearest where screen-fill wins — fillViewport). Everything above this line is pure and node-tested; this file is kept
// thin on purpose. Guarded so it is inert when imported without a DOM (bundle tests).

const {App} = __require("src/engine/app.js");
const {fillViewport, screenToNative} = __require("src/engine/viewport.js");
const {makeTitleScene} = __require("src/scenes/titleScene.js");
const {makeIndexScene, makeIndexSceneAt} = __require("src/scenes/indexScene.js");
const {makePlayScene} = __require("src/scenes/playScene.js");
const {makeTwoThreadScene} = __require("src/scenes/twoThreadScene.js");
const {makeCountingHouseScene} = __require("src/scenes/countingHouseScene.js");
const {allCatalogueCardsById, SHELVES, shelfCards} = __require("src/content/shelves.js");
const {loadSave, writeSave, clearSave} = __require("src/engine/save.js");
const {PALETTE} = __require("src/gfx/palette.js");

const BASE_W = 640;
const BASE_H = 360;

function boot(doc, win) {
  const app = new App(BASE_W, BASE_H);
  let storage = null;
  try {
    if (win.localStorage && typeof win.localStorage.getItem === 'function') storage = win.localStorage;
  } catch (_) { /* some privacy modes expose localStorage through a throwing getter */ }
  const cardsById = allCatalogueCardsById();
  const knownCardIds = new Set(Object.keys(cardsById));
  let loaded = storage ? loadSave(storage, knownCardIds) : { status: 'empty', data: null, notice: null };
  let resumeScene = null;
  const indexOptions = { onExitToTitle: (a) => showSavedTitle(a) };

  function indexReturnFor(cardId) {
    const shelfIndex = SHELVES.findIndex((shelf) => shelf.memberIds.includes(cardId));
    const cards = shelfIndex >= 0 ? shelfCards(SHELVES[shelfIndex]) : [];
    const cardIndex = cards.findIndex((card) => card.id === cardId);
    return { shelf: Math.max(0, shelfIndex), card: Math.max(0, cardIndex) };
  }

  function sceneFromLocation(location) {
    if (location.scene === 'index') return makeIndexSceneAt(location.view, location.shelf, location.card, indexOptions);
    const card = cardsById[location.cardId];
    if (!card) throw new Error('saved pattern card is no longer in the index');
    const expectedScene = card.twist === 'two-thread' ? 'two-thread'
      : (card.twist === 'counting-house' ? 'counting-house' : 'play');
    if (location.scene !== expectedScene) throw new Error('saved pattern uses the wrong loom');
    const ret = indexReturnFor(card.id);
    const back = (a) => a.setScene(makeIndexSceneAt('cards', ret.shelf, ret.card, indexOptions));
    if (location.scene === 'two-thread') return makeTwoThreadScene(card, { onExit: back, resume: location });
    if (location.scene === 'counting-house') return makeCountingHouseScene(card, { onExit: back, resume: location });
    return makePlayScene(card, { onExit: back, resume: location });
  }

  if (loaded.status === 'ok') {
    try {
      resumeScene = sceneFromLocation(loaded.data.location);
      if (resumeScene._board) {
        if (resumeScene._board.isSolved() !== loaded.data.location.solved) {
          throw new Error('saved completion state conflicts with its marks');
        }
        if (loaded.data.location.solvedLogged
          && !loaded.data.progress.includes(loaded.data.location.cardId)) {
          throw new Error('saved completion is missing from the master index');
        }
      }
    } catch (_) {
      try { clearSave(storage); } catch (_) { /* the visible recovery notice still wins */ }
      loaded = { status: 'corrupt', data: null, notice: 'SAVE COULD NOT BE READ - FRESH INDEX STARTED' };
    }
  }

  if (storage) {
    app.configureSaving((progress, location) => writeSave(storage, progress, location), {
      suspended: loaded.status === 'ok',
    });
  }

  // Loud-failure law: browser-level errors also land in the exportable log.
  win.addEventListener('error', (e) => {
    app.log.error(`window: ${e.message} @ ${e.filename || '?'}:${e.lineno || 0}`, Math.round(app.elapsed));
  });
  win.addEventListener('unhandledrejection', (e) => {
    app.log.error(`promise: ${e.reason && e.reason.message ? e.reason.message : e.reason}`, Math.round(app.elapsed));
  });

  let canvas = doc.getElementById('jacquard');
  if (!canvas) {
    canvas = doc.createElement('canvas');
    canvas.id = 'jacquard';
    doc.body.appendChild(canvas);
  }
  const ctx = canvas.getContext('2d', { alpha: false });

  // Offscreen native-res surface: the framebuffer is putImageData'd here at 1:1, then
  // drawImage'd to the visible canvas scaled with smoothing OFF (crisp pixels).
  const native = doc.createElement('canvas');
  native.width = BASE_W;
  native.height = BASE_H;
  const nctx = native.getContext('2d');

  let vp = fillViewport(1, 1, BASE_W, BASE_H);

  function resize() {
    canvas.width = win.innerWidth;
    canvas.height = win.innerHeight;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    vp = fillViewport(canvas.width, canvas.height, BASE_W, BASE_H);
  }
  win.addEventListener('resize', resize);
  resize();

  // ---- Input wiring (mapped to native coords) ----
  function pointerAt(e) {
    const rect = canvas.getBoundingClientRect();
    const p = screenToNative(vp, e.clientX - rect.left, e.clientY - rect.top);
    app.input.movePointer(p.x, p.y, p.inside && p.x < BASE_W && p.y < BASE_H);
  }
  canvas.addEventListener('mousemove', pointerAt);
  canvas.addEventListener('mousedown', (e) => { pointerAt(e); app.input.pressButton(e.button); });
  win.addEventListener('mouseup', (e) => app.input.releaseButton(e.button));
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  win.addEventListener('blur', () => app.input.releaseAll());

  win.addEventListener('keydown', (e) => {
    if (e.code === 'F2') { e.preventDefault(); exportLog(); return; }
    app.input.pressKey(e.code);
  });
  win.addEventListener('keyup', (e) => app.input.releaseKey(e.code));

  function exportLog() {
    try {
      const blob = new win.Blob([app.log.toText() || '(log empty)'], { type: 'text/plain' });
      const url = win.URL.createObjectURL(blob);
      const a = doc.createElement('a');
      a.href = url;
      a.download = 'jacquard-debug-log.txt';
      a.click();
      win.URL.revokeObjectURL(url);
      app.log.info('debug log exported', Math.round(app.elapsed));
    } catch (err) {
      app.log.error(`log export failed: ${err.message}`, Math.round(app.elapsed));
    }
  }

  function startFresh(a) {
    if (storage) {
      try { clearSave(storage); } catch (err) { a.log.error(`save clear: ${err.message}`, Math.round(a.elapsed)); }
    }
    a.progress = new Set();
    a.suspendSaving(false);
    a.setScene(makeIndexScene(indexOptions));
    a.checkpointSave(true);
  }

  function continueSaved(a, saved = loaded, scene = resumeScene) {
    a.progress = new Set(saved.data.progress);
    a.suspendSaving(false);
    a.setScene(scene);
    a.checkpointSave(true);
  }

  function showSavedTitle(a) {
    let saved = storage ? loadSave(storage, knownCardIds)
      : { status: 'empty', data: null, notice: null };
    let scene = null;
    if (saved.status === 'ok') {
      try {
        scene = sceneFromLocation(saved.data.location);
        if (scene._board && scene._board.isSolved() !== saved.data.location.solved) {
          throw new Error('saved completion state conflicts with its marks');
        }
        if (saved.data.location.solvedLogged
          && !saved.data.progress.includes(saved.data.location.cardId)) {
          throw new Error('saved completion is missing from the master index');
        }
      } catch (_) {
        try { clearSave(storage); } catch (_) { /* the visible recovery notice still wins */ }
        saved = { status: 'corrupt', data: null, notice: 'SAVE COULD NOT BE READ - FRESH INDEX STARTED' };
        scene = null;
      }
    }
    a.suspendSaving(true);
    a.setScene(makeTitleScene({
      resumeAvailable: saved.status === 'ok',
      notice: saved.notice,
      onContinue: (nextApp) => continueSaved(nextApp, saved, scene),
      onNew: startFresh,
    }));
  }

  if (loaded.notice) app.log.info(`save: ${loaded.notice}`, Math.round(app.elapsed));
  app.setScene(makeTitleScene({
    resumeAvailable: loaded.status === 'ok',
    notice: loaded.notice,
    onContinue: continueSaved,
    onNew: startFresh,
  }));

  // ---- Frame loop ----
  const [or, og, ob] = PALETTE.oilDeep;
  let last = 0;
  function frame(now) {
    const dt = last ? Math.min(100, now - last) : 16;
    last = now;
    try {
      app.step(dt);
      app.render();
      nctx.putImageData(new win.ImageData(app.fb.data, BASE_W, BASE_H), 0, 0);
      ctx.imageSmoothingEnabled = false;
      // Letterbox in deep oil, then blit the frame nearest-scaled.
      ctx.fillStyle = `rgb(${or},${og},${ob})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(native, vp.offX, vp.offY, vp.dispW, vp.dispH);
    } catch (err) {
      // Last-ditch loud failure: even if the loop itself throws, log it and keep going.
      app.log.error(`frame loop: ${err.message}`, Math.round(app.elapsed));
    }
    win.requestAnimationFrame(frame);
  }
  win.requestAnimationFrame(frame);

  return app;
}

if (typeof document !== 'undefined' && typeof window !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => boot(document, window));
  } else {
    boot(document, window);
  }
}


  Object.assign(exports, { BASE_W, BASE_H, boot });
});

__register("src/content/library.js", function(module, exports, __require) {
// THE JACQUARD INDEX — the playable card list (starter cards + the motif library).
//
// Assembles every proved motif into an ordered list of cards the play scene can walk. The
// full shelf/index UI + unlock flow is M3; this is the minimal spine that makes the whole
// proved library reachable in-game now. Each card carries its built Puzzle.

const {Puzzle} = __require("src/puzzle/puzzle.js");
const {STARTER_MOTIFS} = __require("src/content/starter.js");
const {MOTIFS} = __require("src/content/motifs.js");

// Starter teaching trio first (gentlest), then the library by ascending size.
function allCards() {
  const ordered = [...STARTER_MOTIFS, ...[...MOTIFS].sort((a, b) => (a.size || a.rows.length) - (b.size || b.rows.length))];
  // De-dupe by id (a starter motif might also appear in the library).
  const seen = new Set();
  const cards = [];
  for (const m of ordered) {
    if (seen.has(m.id)) continue;
    seen.add(m.id);
    cards.push({ ...m, puzzle: Puzzle.fromAscii(m.rows) });
  }
  return cards;
}


  Object.assign(exports, { allCards });
});

// THE JACQUARD INDEX — sets and panels (completed sets assemble the house's story).
//
// A PANEL is a set of member cards whose solved reveals tile into one larger cloth — a
// patchwork (the seed's assembly frame, not a deduction twist). When every member of a
// set is woven, the panel assembles. Members share a size and fill a cols x rows grid.
// Panels are code-defined; their composite is pixel-checked against the members in the
// suite.

const {Puzzle} = __require("src/puzzle/puzzle.js");
const {PATCHWORK_PANELS} = __require("src/content/patchworkMotifs.js");

const PANELS = [
  {
    id: 'sampler',
    name: 'THE SAMPLER',
    blurb: 'The apprentice piece: four motifs, one cloth.',
    cols: 2,
    rows: 2,
    gap: 1, // bare-warp seam between patches
    members: ['button', 'star', 'thistle', 'oak'],
  },
  // THE GRAND PATCHWORK finale: the house's story, panel by panel.
  ...PATCHWORK_PANELS,
];

// The panel a card belongs to that is NOW fully woven (all members in `progress`), or
// null. Used to trigger the assembled-panel story payoff when the last member is solved.
function completedPanelFor(cardId, progress) {
  for (const panel of PANELS) {
    if (panel.members.includes(cardId) && panel.members.every((id) => progress.has(id))) {
      return panel;
    }
  }
  return null;
}

// Tile the member solutions into one composite grid. Returns a Puzzle built from the
// assembled solution (used purely as a picture — patchwork is an assembly, not a puzzle).
function composePanel(panel, cardsById) {
  const members = panel.members.map((id) => {
    const c = cardsById[id];
    if (!c) throw new Error(`panel ${panel.id}: unknown member ${id}`);
    return c;
  });
  const cell = members[0].puzzle.width; // members share a size
  for (const m of members) {
    if (m.puzzle.width !== cell || m.puzzle.height !== cell) {
      throw new Error(`panel ${panel.id}: member ${m.id} is not ${cell}x${cell}`);
    }
  }
  const gap = panel.gap || 0;
  const width = panel.cols * cell + (panel.cols - 1) * gap;
  const height = panel.rows * cell + (panel.rows - 1) * gap;
  const solution = new Uint8Array(width * height);

  members.forEach((m, i) => {
    const gx = (i % panel.cols) * (cell + gap);
    const gy = Math.floor(i / panel.cols) * (cell + gap);
    for (let y = 0; y < cell; y++) {
      for (let x = 0; x < cell; x++) {
        solution[(gy + y) * width + (gx + x)] = m.puzzle.at(x, y);
      }
    }
  });

  return new Puzzle(width, height, solution);
}


  Object.assign(exports, { PANELS, completedPanelFor, composePanel });
});

// BASE native resolution; this computes how it maps onto the window.

// used until the M7 screen-fill gate decides a mode per resolution.

  const dispW = baseW * scale;

    scale,
    offX: Math.floor((winW - dispW) / 2),
    offY: Math.floor((winH - dispH) / 2),
    dispW,
    dispH,
    fractional: false,

// the base fills the window (screen-fill gate). Still nearest-sampled at blit time, so
// pixels stay hard-edged; some rows/cols are 1px fatter than others.
function fillViewport(winW, winH, baseW, baseH) {
  const scale = Math.min(winW / baseW, winH / baseH);
  const dispW = Math.round(baseW * scale);
  const dispH = Math.round(baseH * scale);

    scale,
    offX: Math.floor((winW - dispW) / 2),
    offY: Math.floor((winH - dispH) / 2),
    dispW,
    dispH,
    fractional: scale !== Math.floor(scale),

          board.beginStroke(hovered.x, hovered.y, b === LMB ? active : CB_CROSS);
          activeButton = b; lastCell = `${hovered.x},${hovered.y}`; clearHint();
        }
      }
      if (activeButton !== null && input.isButtonDown(activeButton) && hovered) {
        const key = `${hovered.x},${hovered.y}`;
        if (key !== lastCell) { board.extendStroke(hovered.x, hovered.y); lastCell = key; }
      }
      for (const b of frame.releasedButtons) {
        if (b === activeButton) { board.endStroke(); activeButton = null; lastCell = null; }
      }

      for (const code of frame.pressedKeys) {
        switch (code) {
          case 'ArrowLeft': cursor.x--; clampCursor(); break;
          case 'ArrowRight': cursor.x++; clampCursor(); break;
          case 'ArrowUp': cursor.y--; clampCursor(); break;
          case 'ArrowDown': cursor.y++; clampCursor(); break;
          case 'Digit1': active = CB_A; break;
          case 'Digit2': active = CB_B; break;
          case 'Space': case 'KeyF': board.place(cursor.x, cursor.y, active); clearHint(); break;
          case 'KeyX': board.place(cursor.x, cursor.y, CB_CROSS); clearHint(); break;
          case 'KeyZ': board.undo(); clearHint(); break;
          case 'KeyR': case 'KeyY': board.redo(); clearHint(); break;
          case 'KeyH': requestHint(app); break;
          case 'Escape': case 'KeyN': if (leave) { leave(app); return; } break;
          case 'Enter': if (solved && leave) { leave(app); return; } break;
          default: break;
        }
      }

      if (!solved && board.isSolved()) {
        solved = true;
        if (!solvedLogged) { app.progress.add(card.id); app.log.info(`two-thread: ${card.name} woven`, Math.round(app.elapsed)); solvedLogged = true; }
      } else if (solved && !board.isSolved()) solved = false;
    },

    render(app, fb) {
      const l = ensureLayout(fb);
      fb.data.set(ensureArt(fb).data);
      drawPatternRoomRulePlate(
        fb,
        solved ? `${card.name} - WOVEN` : 'TWO-THREAD - COUNT EACH THREAD ON ITS OWN',
      );

      if (!solved) {
        drawColoredBoard(fb, board, l, cursor, card);

        // Active-thread indicator (which thread the loom will lay), shape + label.
        const swX = patternRoomWorkLayout(fb).board.x + 6, swY = patternRoomWorkLayout(fb).board.y + 5, sw = 8;
        drawText(fb, swX, swY + 1, 'LAYING', PALETTE.inkSoft, 1, 1);
        const ax = swX + measureText('LAYING', 1, 1) + 5;
        if (active === CB_A) { fb.fillRect(ax, swY, sw, sw, PALETTE.indigo[0], PALETTE.indigo[1], PALETTE.indigo[2], 255); }
        else { fb.fillRect(ax, swY, sw, sw, PALETTE.madder[0], PALETTE.madder[1], PALETTE.madder[2], 255); const hh = 3, h0 = Math.floor((sw - hh) / 2); fb.fillRect(ax + h0, swY + h0, hh, hh, PALETTE.manila[0], PALETTE.manila[1], PALETTE.manila[2], 255); }
        // inkSoft, not linen: linen on the pattern paper measured 1.15:1 contrast, which is
        // functionally invisible - and this is the one label telling the player which
        // thread the loom will lay. inkSoft matches the LAYING label beside it, at 5.93:1.
        drawText(fb, ax + sw + 4, swY + 1, active === CB_A ? 'ONE' : 'TWO', PALETTE.inkSoft, 1, 1);

        if (hint) {
          if (hint.kind === 'mistake') { ringCell(fb, l, hint.cell.x, hint.cell.y, PALETTE.madder); hintStrip(fb, hint.message, [230, 150, 140]); }
          else if (hint.kind === 'deduction') {
            const cell = l.cell;
            const [br, bg, bb] = PALETTE.brassLit;
            if (hint.lineKind === 'row') fb.fillRect(l.gridX, l.gridY + hint.lineIndex * cell, l.width * cell, cell, br, bg, bb, 70);
            else fb.fillRect(l.gridX + hint.lineIndex * cell, l.gridY, cell, l.height * cell, br, bg, bb, 70);
            let text = hint.point;
            if (hintStage >= 2) text = `${hint.point}  ${hint.name}`;
            if (hintStage >= 3) { text = hint.message; ringCell(fb, l, hint.cells[0].x, hint.cells[0].y, PALETTE.brassLit); }
            hintStrip(fb, text, PALETTE.brassLit);
          }
        }
      } else {
        // Woven two-colour cloth payoff.
        const region = patternRoomWorkLayout(fb).board;
        const cell = Math.max(8, Math.floor(Math.min(region.w / card.width, region.h / card.height)));
        const ox = region.x + Math.floor((region.w - card.width * cell) / 2);
        const oy = region.y + Math.floor((region.h - card.height * cell) / 2);
        for (let y = 0; y < card.height; y++) for (let x = 0; x < card.width; x++) {
          const v = card.colored.grid[y * card.width + x];
          if (v === CB_A) drawStitchA(fb, ox + x * cell, oy + y * cell, cell);
          else if (v === CB_B) drawStitchB(fb, ox + x * cell, oy + y * cell, cell);
        }
      }

      const help = solved
        ? (leave ? 'PATTERN WOVEN  -  ENTER OR ESC RETURNS TO THE INDEX' : 'PATTERN COMPLETE - WOVEN')
        : '1 / 2 PICK THREAD  LMB LAY  RMB CROSS  Z UNDO  H HINT  ESC INDEX';
      if (solved) {
        const w = measureText(help, 2, 1), px = Math.round((fb.width - w) / 2) - 8, py = patternRoomWorkLayout(fb).footerY - 2;
        const ph = textHeight(2) + 8;
        fb.fillRect(px, py - 4, w + 16, ph, PALETTE.brassDark[0], PALETTE.brassDark[1], PALETTE.brassDark[2], 230);
        fb.strokeRect(px, py - 4, w + 16, ph, PALETTE.brassLit[0], PALETTE.brassLit[1], PALETTE.brassLit[2]);
        drawTextCentered(fb, 0, fb.width, py, help, PALETTE.brassLit, 2, 1);
      } else {
        const wl = patternRoomWorkLayout(fb);
        drawTextCentered(fb, wl.frame.x, wl.frame.w, wl.footerY, help, PALETTE.ink, 1, 1);
      }

      if (card.blurb && !solved && app.elapsed - enterElapsed < 3600) {
        const w = measureBodyText(card.blurb);
        const px = Math.round((fb.width - w) / 2) - 8;
        const py = fb.height - 50;
        fb.fillRect(px, py - 4, w + 16, 16, PALETTE.manila[0], PALETTE.manila[1], PALETTE.manila[2], 235);
        fb.strokeRect(px, py - 4, w + 16, 16, PALETTE.manilaShade[0], PALETTE.manilaShade[1], PALETTE.manilaShade[2]);
        drawBodyTextCentered(fb, 0, fb.width, py, card.blurb, PALETTE.ink);
      }
    },
  };
}


  Object.assign(exports, { makeTwoThreadScene });
